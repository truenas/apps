resources:
  limits:
    cpus: 2.0
    memory: 4096

vaultbridge:
  api_key: vb081-development-placeholder-not-a-secret
  api_key_previous: ""
  watch_enabled: false
  watch_debounce_seconds: 1
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/vaultbridge/data
  vault: /opt/tests/mnt/vaultbridge/vault

storage:
  vault:
    type: ix_volume
    ix_volume_config:
      dataset_name: vault
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
