images:
  image:
    repository: ghcr.io/sethforprivacy/simple-monero-wallet-rpc
    tag: "v0.18.5.1@sha256:09ff81f470d6d37811e3fde808c5cd1158a8cd2c42abbfb935b33f26f91e879d"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: "1.1.0@sha256:a83d6da5e963ffcc20dca98fdd713713065a7c4bab248db1d100406be78df9b8"

consts:
  perms_container_name: permissions
  monero_wallet_rpc_container_name: monero-wallet-rpc
