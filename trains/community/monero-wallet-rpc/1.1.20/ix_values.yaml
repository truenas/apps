images:
  image:
    repository: ghcr.io/sethforprivacy/simple-monero-wallet-rpc
    tag: "v0.18.5.4@sha256:d2236349e08b85db5d17b0def36c4fce4cbd6a82946e4a93621d9b7c38adc8a9"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
