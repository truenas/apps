{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.borgui_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number}) %}

{% if values.borgui.mount_docker_socket %}
  {% do c1.add_docker_socket() %}
{% endif %}

{% if values.borgui.enable_fuse %}
  {% do c1.add_caps(["SYS_ADMIN"]) %}
  {% do c1.devices.add_device("/dev/fuse", "/dev/fuse") %}
  {% do c1.add_security_opt("apparmor", "unconfined") %}
  {% do c1.environment.add_env("BORG_FUSE_IMPL", "pyfuse3") %}
{% endif %}

{% do c1.environment.add_env("ENVIRONMENT", "production") %}
{% do c1.environment.add_env("BASE_PATH", "/") %}
{% do c1.environment.add_env("REDIS_HOST", "disabled") %}
{% do c1.environment.add_env("DATA_DIR", values.consts.data_path) %}
{% do c1.environment.add_env("BORG_CACHE_DIR", values.consts.cache_path) %}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("INITIAL_ADMIN_PASSWORD", values.borgui.initial_admin_password) %}
{% do c1.environment.add_user_envs(values.borgui.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_storage(values.consts.cache_path, values.storage.cache) %}
{% do perm_container.add_or_skip_action("cache", values.storage.cache, perms_config) %}

{% set mount_points = namespace(x=[]) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
  {% if store.is_local_mount_point %}
    {% do mount_points.x.append(store.mount_path) %}
  {% endif %}
{% endfor %}

{% do c1.environment.add_env("LOCAL_MOUNT_POINTS", (mount_points.x | join(",") or values.consts.default_local_mount_path)) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.declare_risk("docker_access") %}
{% do tpl.notes.declare_risk("host_capabilities") %}
{% do tpl.notes.declare_risk("host_network") %}
{% do tpl.notes.declare_risk("security_profiles") %}

{{ tpl.render() | tojson }}
