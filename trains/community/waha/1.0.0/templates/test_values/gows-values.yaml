resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

waha:
  engine: GOWS
  api_key: a-test-api-key-long-enough
  dashboard_enabled: false
  base_url: http://waha.example.com/
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  sessions: /opt/tests/mnt/waha/sessions
  media: /opt/tests/mnt/waha/media

storage:
  sessions:
    type: ix_volume
    ix_volume_config:
      dataset_name: sessions
      create_host_path: true
  media:
    type: ix_volume
    ix_volume_config:
      dataset_name: media
      create_host_path: true
  additional_storage: []
