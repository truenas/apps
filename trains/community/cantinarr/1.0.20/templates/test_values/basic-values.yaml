resources:
  limits:
    cpus: 2.0
    memory: 4096

cantinarr:
  push_gateway_url: ""
  public_url: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/cantinarr/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
