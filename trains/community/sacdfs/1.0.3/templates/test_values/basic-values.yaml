resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

sacdfs:
  smb_user: music
  smb_password: change-me
  nfs_clients:
    - 10.0.0.0/8
  additional_envs: []

network:
  smb_port:
    bind_mode: published
    port_number: 10445
  nfs_port:
    bind_mode: published
    port_number: 12049
  networks: []

ix_volumes:
  images: /opt/tests/mnt/sacdfs/images
  cache: /opt/tests/mnt/sacdfs/cache

storage:
  images:
    type: ix_volume
    ix_volume_config:
      dataset_name: images
      create_host_path: true
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: cache
      create_host_path: true
  additional_storage: []
