resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
bindery:
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/bindery/config
  books: /opt/tests/mnt/bindery/books
  downloads: /opt/tests/mnt/bindery/downloads

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  books:
    type: ix_volume
    ix_volume_config:
      dataset_name: books
      create_host_path: true
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: downloads
      create_host_path: true
  additional_storage: []
