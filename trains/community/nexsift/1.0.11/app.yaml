description: The filter for your homelab's notifications. Services report to nexsift
  instead of to your phone, through doors that answer like Gotify, ntfy, a Discord
  webhook, SMTP or syslog. nexsift sorts everything into one inbox, bundles the routine
  and passes on only what matters, through ntfy, Gotify, Telegram, Apprise, a webhook
  or Web Push.
