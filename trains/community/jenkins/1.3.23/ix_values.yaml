images:
  image:
    repository: jenkins/jenkins
    tag: "2.580.2-jdk21@sha256:74401de6a6f92e1afe1b02d1c8e3d0c33f263bfb5275dd8813f9150355f2367b"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.2@sha256:6ddfdc314af9d18cfacb836ad266ef0ed91fecaa3686b20be72e464972860c08"

consts:
  jenkins_container_name: jenkins
  perms_container_name: permissions
  certs_container_name: certs
  run_as_user: 1000
  run_as_group: 1000
  keystore_path: /var/jenkins_home/ix-keystore
  keystore_name: keystore.jks
  temp_certs_path: /tmp/ix-safe/ix-certs
  key_name: ix.key
  crt_name: ix.crt
  restricted_opts:
    - httpPort
    - httpsPort
    - httpsKeyStorePassword
    - httpsKeyStore
  restricted_java_opts:
    - jenkins.model.Jenkins.slaveAgentPortEnforce
    - jenkins.model.Jenkins.slaveAgentPort
  notes_body: |
    The initial Admin password is generated on the
    first run of Jenkins. You can retrieve it by
    looking at the logs of Jenkins.

    The default username is `admin`.
