resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Europe/Budapest

kinora:
  public_url: https://kinora.example.com
  additional_envs: []
network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080
  jellyfin_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/kinora/config
  cache: /opt/tests/mnt/kinora/cache
  movies: /opt/tests/mnt/kinora/movies

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: cache
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /media/movies
      read_only: true
      ix_volume_config:
        dataset_name: movies
        create_host_path: true
