{% set tpl = ix_lib.base.render.Render(values) %}

{% set silo_net = tpl.networks.create_internal("silo-net") %}

{% set silo = tpl.add_container(values.consts.silo_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.silo.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.silo.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(silo_net) %}

{% set redis_config = {
  "password": values.silo.redis_password,
  "volume": {"type": "temporary", "volume_config": {"volume_name": "redis-data"}},
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(silo_net) %}

{% do silo.environment.add_env("SILO_SEARCH_PROVIDER", "meilisearch" if values.silo.enable_search else "postgres") %}
{% if values.silo.enable_search %}
  {% set meili_config = {"master_key": values.silo.meilisearch_master_key, "volume": values.storage.meili_data} %}
  {% set meilisearch = tpl.deps.meilisearch(values.consts.meilisearch_container_name, "meilisearch_image", meili_config, perm_container) %}
  {% do meilisearch.container.add_network(silo_net) %}
  {% do silo.depends.add_dependency(values.consts.meilisearch_container_name, "service_healthy") %}
  {% do silo.environment.add_env("SILO_MEILISEARCH_URL", meilisearch.get_url()) %}
  {% do silo.environment.add_env("SILO_MEILISEARCH_API_KEY", values.silo.meilisearch_master_key) %}
{% endif %}

{% do silo.add_network(silo_net) %}

{% do silo.set_user(values.run_as.user, values.run_as.group) %}
{% do silo.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do silo.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% do silo.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/api/v1/health"}) %}
{% do silo.healthcheck.set_start_period(1200) %}
{% do silo.set_grace_period(60) %}

{% do silo.environment.add_env("HOME", values.consts.data_path) %}
{% do silo.environment.add_env("MODE", "integrated") %}
{% do silo.environment.add_env("POSTGRES_TUNE", "") %}
{% do silo.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do silo.environment.add_env("JF_PORT", values.network.jellyfin_compat_port.port_number) %}
{% do silo.environment.add_env("ABS_PORT", values.network.audiobookshelf_compat_port.port_number) %}
{% do silo.environment.add_env("SECRET_KEY", values.silo.secret_key) %}
{% do silo.environment.add_env("DATABASE_URL", postgres.get_url("postgres")) %}
{% do silo.environment.add_env("REDIS_URL", redis.get_url("redis")) %}
{% do silo.environment.add_env("SILO_PLUGIN_CACHE_DIR", "%s/plugins"|format(values.consts.data_path)) %}
{% do silo.environment.add_user_envs(values.silo.additional_envs) %}

{% set static_transcodes_options = {
  "tmpfs_config": {"mode": "0777"},
  "volume_config": {"volume_name": "silo-transcodes"},
} %}
{% set transcodes_storage = dict(values.storage.transcodes, **static_transcodes_options) %}
{% do silo.add_storage("/tmp/silo-transcode", transcodes_storage) %}
{% do perm_container.add_or_skip_action("transcodes", transcodes_storage, perm_config) %}

{% do silo.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perm_config) %}

{% for store in values.storage.additional_storage %}
  {% do silo.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% do silo.add_port(values.network.web_port) %}
{% do silo.add_port(values.network.jellyfin_compat_port) %}
{% do silo.add_port(values.network.audiobookshelf_compat_port) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do silo.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% if values.silo.enable_search %}
    {% do meilisearch.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endif %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
