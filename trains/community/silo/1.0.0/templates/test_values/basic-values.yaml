resources:
  limits:
    cpus: 2.0
    memory: 6144

silo:
  postgres_image_selector: postgres_18_image
  secret_key: test-secret-key-for-ci-validation-0123456789abcdef
  db_password: test-db-password-for-ci-validation-0123456789abcdef
  redis_password: test-redis-password-for-ci-validation-0123456789abcdef
  enable_search: true
  meilisearch_master_key: test-meilisearch-master-key-for-ci-validation-0123456789abcdef
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080
  jellyfin_compat_port:
    bind_mode: published
    port_number: 8081
  audiobookshelf_compat_port:
    bind_mode: published
    port_number: 8082

ix_volumes:
  data: /opt/tests/mnt/silo/data
  postgres_data: /opt/tests/mnt/silo/postgres_data
  meili_data: /opt/tests/mnt/silo/meili_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  meili_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: meili_data
      create_host_path: true
  transcodes:
    type: temporary
  additional_storage: []
