{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.ktn_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.app_user_id, "gid": values.consts.app_group_id, "mode": "check"} %}

{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["SETUID", "SETGID"]) %}
{% do c1.healthcheck.set_custom_test(["CMD", "python", "-I", "-S", "/app/docker-healthcheck.py"]) %}

{# The 'w' exists solely for the one SES SEND DIAGNOSTIC that lights a bay LED. #}
{% for device in values.ktn.devices %}
  {% do c1.devices.add_device(device.host_device, device.container_device, "rw") %}
{% endfor %}

{% do c1.environment.add_env("KTN_DATA_DIR", values.consts.data_path) %}
{% do c1.environment.add_env("KTN_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("KTN_SYSFS_ROOT", "/sys") %}
{% do c1.environment.add_env("KTN_IDENT_HELPER_SOCKET", "%s/ident.sock"|format(values.consts.run_path)) %}
{% do c1.environment.add_env("KTN_ENCLOSURE_ALLOWLIST", values.ktn.allowlist|join(",")) %}
{% do c1.environment.add_env("KTN_AUTH_REQUIRED", values.ktn.auth_required) %}
{% do c1.environment.add_env("KTN_ALLOW_ANONYMOUS_IDENT", values.ktn.allow_anonymous_ident) %}
{% if values.ktn.truenas_api_key %}
  {% do c1.add_extra_host("host.docker.internal", "host-gateway") %}
  {% do c1.environment.add_env("KTN_TRUENAS_URL", "https://host.docker.internal:%d"|format(values.ktn.truenas_port)) %}
  {% do c1.environment.add_env("KTN_TRUENAS_API_KEY", values.ktn.truenas_api_key) %}
  {% do c1.environment.add_env("KTN_TRUENAS_VERIFY_TLS", false) %}
{% endif %}

{% do c1.environment.add_user_envs(values.ktn.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.run_path, {"type": "tmpfs", "tmpfs_config": {"mode": "0770", "uid": 0, "gid": values.consts.app_group_id}}) %}
{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.declare_risk("host_network") %}
{% do tpl.notes.declare_risk("truenas_api_access", values.ktn.truenas_api_key != "") %}

{{ tpl.render() | tojson }}
