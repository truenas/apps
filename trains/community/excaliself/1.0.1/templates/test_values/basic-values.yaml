resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

excaliself:
  postgres_image_selector: postgres_18_image
  db_password: password
  app_url: http://localhost:8080
  other_urls:
    - http://127.0.0.1:8080
  auth_secret: test-secret-that-is-at-least-32-characters
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  postgres_data: /opt/tests/mnt/excaliself/postgres-data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
