resources:
  limits:
    cpus: 1.0
    memory: 512

TZ: Etc/UTC

snapshot_visualizer:
  truenas_port: 4433
  api_key: "1-thisisnotarealapikeyjustfortestingrendering"
  cache_minutes: 10
  allow_import: false
  use_https: true
  password: "a-test-password"
  allow_delete: true
  additional_envs:
    - name: SNAPVIZ_LOG_LEVEL
      value: DEBUG

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/snapshot-visualizer/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
