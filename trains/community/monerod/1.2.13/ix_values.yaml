images:
  image:
    repository: ghcr.io/sethforprivacy/simple-monerod
    tag: "v0.18.5.3@sha256:233f3fa6b59e5b36b2fda105ac10bc91fa5a0f3dadcff8dc657a6ced42123bd7"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: "1.0.2@sha256:46eba20714c1cc6784f60e245c32c33a2d9f616e47d804694a9854248c89a992"

consts:
  perms_container_name: permissions
  monerod_container_name: monerod
  run_as_user: 1000
  run_as_group: 1000
  reserved_flags:
    - --anonymous-inbound
    - --non-interactive
    - --rpc-bind-port
    - --rpc-restricted-bind-ip
    - --rpc-restricted-bind-ipv6-address
    - --rpc-restricted-bind-port
    - --zmq-rpc-bind-ip
    - --zmq-rpc-bind-port
    - --confirm-zmq-rpc-external-bind
    - --zmq-pub
    - --confirm-external-bind
    - --no-igd
    - --no-zmq
    - --prune-blockchain
    - --public-node
    - --hide-my-port
    - --enable-dns-blocklist
    - --p2p-use-ipv6
    - --rpc-use-ipv6
    - --tx-proxy
    - --proxy
    - --pad-transactions
    - --p2p-bind-port
    - --p2p-bind-ip
    - --ban-list
