consts:
  nextcloud_container_name: nextcloud
  cron_container_name: cron
  perms_container_name: permissions
  redis_container_name: redis
  postgres_container_name: postgres
  nginx_container_name: nginx
  imaginary_container_name: imaginary
  notify_push_container_name: notify-push
  harp_container_name: harp
  talk_container_name: talk
  talk_recording_container_name: talk-recording
  db_user: nextcloud
  db_name: nextcloud
  db_max_connections: 200
  # Connections left for the cron container, notify-push
  # and postgres' own superuser reserved connections.
  # The rest are available to php-fpm children.
  db_reserved_connections: 20
  internal_nextcloud_port: 9000
  internal_imaginary_port: 9000
  internal_notify_push_port: 7867
  internal_harp_port: 8780
  internal_harp_frp_port: 8782
  internal_talk_signaling_port: 8081
  internal_talk_recording_port: 1234

  html_path: /var/www/html
  data_path: /nc-data

  ssl_key_path: /etc/nginx-certs/private.key
  ssl_cert_path: /etc/nginx-certs/public.crt

  notes: |
    To use `occ` commands, you just shell into the
    nextcloud container and run `occ` directly.
    No need to use neither `sudo` or `php`.

    For example `occ status`.
