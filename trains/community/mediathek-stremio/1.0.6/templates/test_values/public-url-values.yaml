resources:
  limits:
    cpus: 2.0
    memory: 4096

mediathek:
  channels:
    - ARD
    - 3Sat
  public_url: "https://mediathek.example.com"
  additional_envs:
    - name: CATALOG_DEPTH
      value: "1000"

network:
  host_network: false
  addon_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  extra: /opt/tests/mnt/extra

storage:
  additional_storage:
    - type: ix_volume
      mount_path: /extra
      ix_volume_config:
        dataset_name: extra
        create_host_path: true
