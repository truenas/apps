resources:
  limits:
    cpus: 2
    memory: 2048

TZ: Etc/UTC

dbrepairs:
  postgres_image_selector: postgres_18_image
  db_password: test-password
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  postgres_data: /opt/tests/mnt/dbrepairs/postgres_data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
