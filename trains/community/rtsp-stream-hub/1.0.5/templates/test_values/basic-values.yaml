resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

rtsp_stream_hub:
  jwt_secret: "12345678901234567890123456789012"
  disable_vaapi: false
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  data: /opt/tests/mnt/rtsp-stream-hub/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
