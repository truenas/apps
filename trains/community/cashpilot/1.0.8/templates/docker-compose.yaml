{% set tpl = ix_lib.base.render.Render(values) %}
{% set cashpilot_net = tpl.networks.create_internal("cashpilot-net") %}

{% set ui = tpl.add_container(values.consts.ui_container_name, "image") %}
{% set worker = tpl.add_container(values.consts.worker_container_name, "worker_image") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do ui.add_network(cashpilot_net) %}
{% do ui.set_init(true) %}
{% do ui.set_user(values.run_as.user, values.run_as.group) %}
{% do ui.healthcheck.set_test("wget", {"port": values.consts.ui_port, "path": "/api/health", "spider": false, "busybox": true}) %}

{% do ui.environment.add_env("CASHPILOT_DATA_DIR", values.consts.data_path) %}
{% do ui.environment.add_env("CASHPILOT_API_KEY", values.cashpilot.api_key) %}
{% do ui.environment.add_user_envs(values.cashpilot.additional_envs | selectattr("container", "equalto", "cashpilot") | list) %}

{% do worker.add_network(cashpilot_net) %}
{% do worker.set_init(true) %}
{% do worker.set_user(values.run_as.user, values.run_as.group) %}
{% do worker.healthcheck.set_test("wget", {"port": values.consts.worker_port, "path": "/api/health", "spider": false, "busybox": true}) %}
{% do worker.depends.add_dependency(values.consts.ui_container_name, "service_healthy") %}

{% do worker.environment.add_env("CASHPILOT_DATA_DIR", values.consts.data_path) %}
{% do worker.environment.add_env("CASHPILOT_API_KEY", values.cashpilot.api_key) %}
{% do worker.environment.add_env("CASHPILOT_UI_URL", "http://%s:%d"|format(values.consts.ui_container_name, values.consts.ui_port)) %}
{% do worker.environment.add_env("CASHPILOT_WORKER_NAME", "truenas") %}
{% do worker.environment.add_user_envs(values.cashpilot.additional_envs | selectattr("container", "equalto", "worker") | list) %}

{% do worker.add_docker_socket() %}
{# Github Actions Docker Group #}
{% if values.ci %}{% do worker.add_group(118) %}{% endif %}

{% do ui.add_port(values.network.web_port, {"container_port": values.consts.ui_port}) %}

{% do ui.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do worker.add_storage(values.consts.data_path, values.storage.worker_data) %}
{% do perm_container.add_or_skip_action("worker_data", values.storage.worker_data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do ui.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do ui.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do worker.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
