resources:
  limits:
    cpus: 2.0
    memory: 4096

ci: true

TZ: Etc/UTC

cashpilot:
  api_key: test-fleet-key-not-a-secret-0123456789
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  data: /opt/tests/mnt/cashpilot/data
  worker_data: /opt/tests/mnt/cashpilot/worker_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  worker_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: worker_data
      create_host_path: true
