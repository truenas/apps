{% set tpl = ix_lib.base.render.Render(values) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set c1 = tpl.add_container(values.consts.tracefinity_container_name, "image") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("http", {"port": values.consts.internal_web_port, "path": "/api/version"}) %}

{% do c1.environment.add_env("GOOGLE_API_KEY", values.tracefinity.google_api_key) %}
{% do c1.environment.add_env("FAL_KEY", values.tracefinity.fal_key) %}
{% do c1.environment.add_env("REPLICATE_API_TOKEN", values.tracefinity.replicate_api_token) %}
{% do c1.environment.add_env("AUTO_NAMING", values.tracefinity.auto_naming) %}
{% do c1.environment.add_env("AUTH_SECRET", values.tracefinity.auth_secret) %}
{% do c1.environment.add_user_envs(values.tracefinity.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c1.add_storage("/app/storage", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}

{{ tpl.render() | tojson }}
