description: Movies, shows and music in one app, in place of Radarr, Sonarr and Lidarr.
  A movie or a show can have several versions, such as Full HD and 4K, each with its
  own profile and folder. Profiles from everyday questions with the TRaSH Guides rules
  inside, search over Newznab and Torznab indexers, downloads through the usual Usenet
  and torrent clients, and a switch-over from an existing Radarr, Sonarr and Lidarr.
