{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.bananana_brain_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The dashboard listens on the container's loopback only; it is reached at <name>.bananana.dev through the relay #}
{# The dashboard rejects (403) a Host header without the port, which is what the http test sends #}
{% do c1.healthcheck.set_test("tcp", {"port": 18770}) %}

{% do c1.environment.add_env("HOME", values.consts.data_path) %}
{% do c1.environment.add_env("BANANANA_DATA", values.consts.data_path) %}
{% do c1.environment.add_env("BANANANA_BACKUP_DIR", values.consts.backups_path) %}
{% do c1.environment.add_env("BANANANA_SETUP_TOKEN", values.bananana_brain.setup_token) %}
{% do c1.environment.add_user_envs(values.bananana_brain.additional_envs) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_storage(values.consts.backups_path, values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{{ tpl.render() | tojson }}
