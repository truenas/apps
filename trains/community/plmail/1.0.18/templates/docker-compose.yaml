{% set tpl = ix_lib.base.render.Render(values) %}

{% set plmail_net = tpl.networks.create_internal("plmail-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The password goes into a URL, where the library writes a space as "+". #}
{% do tpl.funcs.disallow_chars(values.plmail.db_password, [" "], "Database Password") %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.plmail.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
  "additional_options": {
    "shared_preload_libraries": "pg_stat_statements",
  },
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.plmail.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(plmail_net) %}

{% set web = tpl.add_container(values.consts.plmail_container_name, "image") %}
{% set worker = tpl.add_container(values.consts.worker_container_name, "image") %}

{% set containers = [web, worker] %}
{% for c in containers %}
  {% do c.add_network(plmail_net) %}
  {% do c.set_user(values.run_as.user, values.run_as.group) %}
  {% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

  {% do c.environment.add_env("APP_ENV", "prod") %}
  {% do c.environment.add_env("APP_STORAGE_DIR", values.consts.data_path) %}
  {% do c.environment.add_env("APP_SECRETS_DIR", "%s/secrets"|format(values.consts.data_path)) %}
  {% do c.environment.add_env("APP_SECRETS_FILE", "%s/secrets/generated.env"|format(values.consts.data_path)) %}
  {% do c.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
  {% do c.environment.add_env("MERCURE_URL", "http://%s:%d/.well-known/mercure"|format(values.consts.worker_container_name, values.consts.internal_mercure_port)) %}
  {% do c.environment.add_user_envs(values.plmail.additional_envs) %}

  {% do c.add_storage(values.consts.data_path, values.storage.data) %}
  {% for store in values.storage.additional_storage %}
    {% do c.add_storage(store.mount_path, store) %}
  {% endfor %}
{% endfor %}

{% do web.environment.add_env("APP_CONTAINER_NAME", "web") %}
{% do web.environment.add_env("SERVER_NAME", ":%d"|format(values.network.web_port.port_number)) %}
{% do web.environment.add_env("MERCURE_UPSTREAM", "%s:%d"|format(values.consts.worker_container_name, values.consts.internal_mercure_port)) %}
{% do web.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/healthz"}) %}
{% do web.healthcheck.set_start_period(120) %}
{% do web.add_storage("/data", {"type": "volume", "volume_config": {"volume_name": "caddy-data"}}) %}
{% do web.add_storage("/config", {"type": "volume", "volume_config": {"volume_name": "caddy-config"}}) %}
{% do web.add_port(values.network.web_port) %}

{% do worker.environment.add_env("APP_CONTAINER_NAME", "worker") %}
{% do worker.set_command(["php", "bin/console", "app:work"]) %}
{% do worker.set_init(true) %}
{% do worker.set_grace_period(30) %}
{% do worker.healthcheck.set_test("curl", {"port": values.consts.internal_mercure_port, "path": "/robots.txt"}) %}
{% do worker.healthcheck.set_start_period(120) %}
{% do worker.add_storage("/data", {"type": "volume", "volume_config": {"volume_name": "mercure-data"}}) %}
{% do worker.add_storage("/config", {"type": "volume", "volume_config": {"volume_name": "mercure-config"}}) %}

{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% for c in containers %}
    {% do c.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endfor %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
