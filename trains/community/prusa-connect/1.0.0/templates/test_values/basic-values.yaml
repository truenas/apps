resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Europe/Brussels

prusa:
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  additional_ports: []
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/prusa-connect/config
  data: /opt/tests/mnt/prusa-connect/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
