resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

swiparr:
  auth_secret: exactly-32-characters-app-keyyyy
  admin_username: test-admin
  provider: tmdb
  provider_lock: false
  allow_private_provider_urls: true
  jellyfin_admin_username: ""
  jellyfin_url: ""
  jellyfin_public_url: ""
  jellyfin_use_watchlist: false
  emby_admin_username: ""
  emby_url: ""
  emby_public_url: ""
  plex_admin_username: ""
  plex_url: ""
  plex_public_url: ""
  plex_token: ""
  tmdb_access_token: test-token
  tmdb_default_region: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/swiparr/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
