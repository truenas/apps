{% set tpl = ix_lib.base.render.Render(values) %}

{% set app = tpl.add_container(values.consts.kometa_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do app.set_user(values.run_as.user, values.run_as.group) %}
{% do app.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/kometa-status"}) %}
{% do app.environment.add_env("QS_PORT", values.network.web_port.port_number) %}
{% do app.environment.add_user_envs(values.kometa.additional_envs) %}

{% do app.add_port(values.network.web_port) %}

{% do app.add_storage("/config", values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do app.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do app.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
