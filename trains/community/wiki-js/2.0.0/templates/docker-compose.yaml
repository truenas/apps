{% set tpl = ix_lib.base.render.Render(values) %}

{# {% if values.wiki_js.postgres_image_selector == "postgres_17_image" %}
  {% do tpl.notes.add_deprecation("Postgres 17 is deprecated and will be removed in the near future. Please upgrade.") %}
{% endif %} #}

{% set wiki_net = tpl.networks.create_internal("wiki-js-net") %}

{% set c1 = tpl.add_container(values.consts.wiki_js_container_name, "image") %}
{% do c1.add_network(wiki_net) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.wiki_js.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}

{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.wiki_js.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(wiki_net) %}

{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.http_port.port_number, "path": "/_live"}) %}

{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do c1.environment.add_env("WIKI_PORT", values.network.http_port.port_number) %}
{% do c1.environment.add_env("DB_HOST", values.consts.postgres_container_name) %}
{% do c1.environment.add_env("DB_PORT", postgres.get_port()) %}
{% do c1.environment.add_env("DB_USER", values.consts.db_user) %}
{% do c1.environment.add_env("DB_PASS", values.wiki_js.db_password) %}
{% do c1.environment.add_env("DB_NAME", values.consts.db_name) %}
{% do c1.environment.add_env("DB_SSL", false) %}
{% do c1.environment.add_user_envs(values.wiki_js.additional_envs) %}

{% do c1.add_port(values.network.http_port) %}

{% do c1.add_storage("/wiki/data/content", values.storage.content) %}
{% do perm_container.add_or_skip_action("content", values.storage.content, perms_config) %}

{% do c1.add_storage("/wiki/data/repo", values.storage.repo) %}
{% do perm_container.add_or_skip_action("repo", values.storage.repo, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.http_port, {"name": "HTTP"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
