    - http_interface
    - http_port
    - xmlrpc
    - xmlrpc_port
    - xmlrpc_interface
    - db_port
    - db_host
    - db_name
    - db_user
    - db_sslmode
    - db_password
  notes_body: |
    ## Default Username and Password

    The First time you log into the Odoo UI, use the following credentials.
    You should change them after the first login.

    Username: `admin`
    Password: `admin`
