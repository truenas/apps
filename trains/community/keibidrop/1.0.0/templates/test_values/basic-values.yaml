resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

keibidrop:
  peer_code: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  outbound_port: 26432
  additional_envs: []

network:
  host_network: false
  inbound_port:
    bind_mode: published
    port_number: 26500

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/keibidrop/config
  shares: /opt/tests/mnt/keibidrop/shares

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  shares:
    type: ix_volume
    read_only: true
    ix_volume_config:
      dataset_name: shares
      create_host_path: true
  additional_storage: []
