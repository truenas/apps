resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

ghostfolio:
  postgres_image_selector: postgres_18_image
  db_password: secret
  redis_password: secret
  jwt_secret_key: secret

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  postgres_data: /opt/tests/mnt/ghostfolio/postgres_data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
