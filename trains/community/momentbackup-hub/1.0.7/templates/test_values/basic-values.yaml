resources:
  limits:
    cpus: 2.0
    memory: 4096

momentbackup:
  public_url: https://truenas.example.test:38675
  scan_backups: true
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/momentbackup-hub/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /repos/data1
      host_path_config:
        path: /opt/tests/mnt/momentbackup-hub/repos/data1
        create_host_path: true
    - type: host_path
      mount_path: /repos/data2
      host_path_config:
        path: /opt/tests/mnt/momentbackup-hub/repos/data2
        create_host_path: true
