resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

spotify_to_plex:
  spotify_api_client_id: fake-spotify-client-id
  spotify_api_client_secret: fake-spotify-client-secret
  encryption_key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/spotify-to-plex/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage: []
