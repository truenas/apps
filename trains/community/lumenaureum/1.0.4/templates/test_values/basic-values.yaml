resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

lumenaureum:
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  certificate_id: null
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/lumenaureum/data
  vault: /opt/tests/mnt/lumenaureum/vault
  photos: /opt/tests/mnt/lumenaureum/photos

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  vault:
    type: ix_volume
    ix_volume_config:
      dataset_name: vault
      create_host_path: true
  photos:
    type: ix_volume
    ix_volume_config:
      dataset_name: photos
      create_host_path: true
  additional_storage: []
