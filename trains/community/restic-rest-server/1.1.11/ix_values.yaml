images:
  image:
    repository: restic/rest-server
    tag: "0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.1@sha256:d1bdb3a3ed7fc158eca53cd78486c388345c603fe2bf42fb24a1e03e1068ff38"

consts:
  restic_rest_container_name: restic-server
  perms_container_name: permissions
  data_path: /data
  ssl_key_path: /certs/key.pem
  ssl_cert_path: /certs/cert.pem
  htpasswd_path: /auth/htpasswd

  reserved_options:
    - --listen
    - --append-only
    - --group-accessible-repos
    - --private-repos
    - --tls
    - --tls-key
    - --tls-cert
    - --no-auth
    - --htpasswd
    - --proxy-auth-username
