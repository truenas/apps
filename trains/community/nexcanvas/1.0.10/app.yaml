description: A whiteboard for your own server, in the spirit of Apple Freeform. Sticky
  notes, shapes, text, lines, pen and highlighter, photos and PDFs on an endless board,
  edited live by several people at once. Frames and scenes to present from, a shape
  library with flowchart, BPMN, UML, floor plan and network packages, templates, export
  as PNG and PDF, and JSON Canvas to exchange boards with other apps.
