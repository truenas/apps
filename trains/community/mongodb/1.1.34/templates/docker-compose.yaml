{% set tpl = ix_lib.base.render.Render(values) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set mongodb_config = {
  "user": values.mongodb.user,
  "password": values.mongodb.password,
  "database": values.mongodb.database,
  "volume": values.storage.data,
} %}

{% set mongodb = tpl.deps.mongodb(values.consts.mongodb_container_name, values.mongodb.image_selector, mongodb_config, perm_container) %}

{% do mongodb.container.add_port(values.network.tcp_port, {"container_port": mongodb.get_port()}) %}
{% do mongodb.container.environment.add_user_envs(values.mongodb.additional_envs) %}

{% for store in values.storage.additional_storage %}
  {% do mongodb.container.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do mongodb.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.declare_risk("host_network") %}

{{ tpl.render() | tojson }}
