{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.yunkan_container_name, values.yunkan.image_selector) %}

{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETGID", "SETUID", "KILL"]) %}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/healthz"}) %}

{% for device in values.yunkan.devices %}
  {% do c1.devices.add_device(device.host_device, device.container_device) %}
{% endfor %}

{% set mdns_enabled = values.network.host_network and values.yunkan.enable_mdns %}
{% do c1.environment.add_env("SKYVIEW_DB_TYPE", "sqlite") %}
{% do c1.environment.add_env("SKYVIEW_MDNS_ENABLED", 1 if mdns_enabled else 0) %}

{% if values.yunkan.webrtc_extern_ips %}
  {% do c1.environment.add_env("SKYVIEW_WEBRTC_EXTERN_IPS", values.yunkan.webrtc_extern_ips | join(",")) %}
{% endif %}
{% do c1.environment.add_user_envs(values.yunkan.additional_envs) %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
  {% do c1.add_port(values.network.webrtc_port, {"container_port": values.consts.internal_webrtc_port}) %}
  {% do c1.add_port(values.network.webrtc_port, {"container_port": values.consts.internal_webrtc_port, "protocol": "udp"}) %}
{% endif %}

{# License binding reads stable host identifiers #}
{% do c1.add_storage(values.consts.machine_id_path, {"type": "host_path","read_only": true, "host_path_config": {"path": values.consts.machine_id_path}}) %}
{% if values.yunkan.mount_product_uuid %}
  {% do c1.add_storage(values.consts.product_uuid_path, {"type": "host_path", "read_only": true, "host_path_config": {"path": values.consts.product_uuid_path}}) %}
{% endif %}

{% do c1.add_storage("/app/data", values.storage.data) %}
{% do c1.add_storage("/app/data/recordings", values.storage.recordings) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}

{{ tpl.render() | tojson }}
