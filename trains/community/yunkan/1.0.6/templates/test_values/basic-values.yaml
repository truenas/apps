resources:
  limits:
    cpus: 2.0
    memory: 4096

yunkan:
  image_selector: image
  webrtc_extern_ips: []
  mount_product_uuid: true
  devices: []
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080
  webrtc_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  data: /opt/tests/mnt/yunkan/data
  recordings: /opt/tests/mnt/yunkan/recordings

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  recordings:
    type: ix_volume
    ix_volume_config:
      dataset_name: recordings
      create_host_path: true
  additional_storage: []
