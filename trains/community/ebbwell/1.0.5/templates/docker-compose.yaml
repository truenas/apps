{% set tpl = ix_lib.base.render.Render(values) %}

{% set oidc = values.ebbwell.additional_envs | selectattr("name", "equalto", "OIDC_ISSUER") | list | length > 0 %}
{% if not oidc and values.ebbwell.local_login == "disabled" %}
  {% do tpl.funcs.fail("Nobody could sign in: allow password sign-in for local accounts, or set up single sign-on (OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET in Additional Environment Variables).") %}
{% endif %}
{% if oidc and not values.ebbwell.app_url.startswith("https://") %}
  {% do tpl.funcs.fail("Single sign-on requires an https:// Public URL.") %}
{% endif %}

{% set c1 = tpl.add_container(values.consts.ebbwell_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_read_only(true) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 16}}) %}
{% do c1.healthcheck.set_test("node", {"port": values.network.web_port.port_number, "path": "/healthz"}) %}

{% do c1.environment.add_env("DATA_DIR", "/data") %}
{% do c1.environment.add_env("NODE_ENV", "production") %}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("APP_URL", values.ebbwell.app_url) %}
{% do c1.environment.add_env("DATA_ENCRYPTION_KEY", values.ebbwell.data_encryption_key) %}
{% do c1.environment.add_env("TRUST_PROXY", values.ebbwell.trust_proxy | join(",")) %}
{% do c1.environment.add_env("BACKUP_RETENTION_DAYS", values.ebbwell.backup_retention_days) %}
{% do c1.environment.add_env("LOCAL_LOGIN", values.ebbwell.local_login) %}

{% if values.ebbwell.local_login != "disabled" %}
  {% do c1.environment.add_env("LOCAL_2FA", values.ebbwell.local_2fa) %}
  {% do c1.environment.add_env("ADMIN_USERNAME", values.ebbwell.admin_username) %}
  {% do c1.environment.add_env("ADMIN_PASSWORD", values.ebbwell.admin_password) %}
{% endif %}

{% if values.ebbwell.local_login == "local-network" %}
  {% do c1.environment.add_env("LOCAL_NETWORKS", (["127.0.0.0/8", "::1/128"] + values.ebbwell.local_networks) | unique | join(",")) %}
{% endif %}

{% do c1.environment.add_user_envs(values.ebbwell.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% if values.ebbwell.app_url.startswith("https://") %}
  {% set url = tpl.funcs.url_to_dict(values.ebbwell.app_url) %}
  {% do tpl.portals.add(values.network.web_port, {"scheme": "https", "host": url.host, "port": url.port}) %}
  {% if values.ebbwell.local_login != "disabled" %}
    {% do tpl.portals.add(values.network.web_port, {"name": "Local Sign-in"}) %}
  {% endif %}
{% else %}
  {% do tpl.portals.add(values.network.web_port) %}
{% endif %}

{{ tpl.render() | tojson }}
