resources:
  limits:
    cpus: 2.0
    memory: 4096

cwa:
  hardcover_token: ""
  watch_mode: "poll"
  disable_library_automount: false
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/cwa/config
  library: /opt/tests/mnt/cwa/library
  book_ingest: /opt/tests/mnt/cwa/book-ingest

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true

  library:
    type: ix_volume
    ix_volume_config:
      dataset_name: library
      create_host_path: true

  book_ingest:
    type: ix_volume
    ix_volume_config:
      dataset_name: book_ingest
      create_host_path: true

  additional_storage: []
