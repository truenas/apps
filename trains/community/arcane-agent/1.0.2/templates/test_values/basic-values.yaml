resources:
  limits:
    cpus: 2.0
    memory: 4096

arcane_agent:
  manager_api_url: http://127.0.0.1:3552
  agent_token: some-agent-token
  additional_envs: []

network:
  host_network: false

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/arcane-agent/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
