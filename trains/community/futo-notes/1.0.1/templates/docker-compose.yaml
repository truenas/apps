{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.futo_notes_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# Override entrypoint, which just adds chown before starting the server #}
{% do c1.set_entrypoint(["/usr/local/bin/futo-notes-server"]) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.api_port.port_number, "path": "/health"}) %}

{% do c1.environment.add_env("PORT", values.network.api_port.port_number) %}
{% do c1.environment.add_env("BLOB_DIR", "%s/blobs"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("DATABASE_URL", "sqlite:%s/db/notes.db"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("FUTO_NOTES_PASSWORD", values.futo_notes.sync_password) %}
{% do c1.environment.add_user_envs(values.futo_notes.additional_envs) %}

{% do c1.add_port(values.network.api_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{{ tpl.render() | tojson }}
