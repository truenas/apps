{% set tpl = ix_lib.base.render.Render(values) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set c1 = tpl.add_container(values.consts.openclaw_container_name, "image") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_init(true) %}
{# Time for the gateway to drain and release its state lock on stop #}
{% do c1.set_grace_period(60) %}

{% do c1.environment.add_env("HOME", values.consts.home_dir) %}
{% do c1.environment.add_env("NODE_ENV", "production") %}

{% do c1.add_storage(values.consts.home_dir, values.storage.config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% set allowed_origins = namespace(x=[]) %}
{% for origin in values.openclaw.allowed_origins %}
  {% do allowed_origins.x.append(origin.rstrip("/")) %}
{% endfor %}

{% set gateway = {
  "auth": {"mode": values.openclaw.auth_mode},
  "controlUi": {
    "dangerouslyAllowHostHeaderOriginFallback": allowed_origins.x | length == 0,
    "allowedOrigins": allowed_origins.x,
  },
} %}

{% if values.openclaw.trusted_proxies %}
  {% do gateway.update({"trustedProxies": values.openclaw.trusted_proxies}) %}
{% endif %}

{% if values.openclaw.auth_mode == "trusted-proxy" %}
  {% if not values.openclaw.trusted_proxies %}
    {% do tpl.funcs.fail("Trusted proxy authentication mode requires at least one trusted proxy.") %}
  {% endif %}
  {% do gateway.auth.update({"trustedProxy": {
    "userHeader": values.openclaw.proxy_user_header,
    "requiredHeaders": values.openclaw.proxy_required_headers,
    "allowUsers": values.openclaw.proxy_allow_users,
  }}) %}
{% endif %}

{% if not allowed_origins.x %}
  {% do tpl.notes.add_warning("No allowed origins specified. Falling back to dangerouslyAllowHostHeaderOriginFallback=true.") %}
{% endif %}

{% do c1.configs.add("config_patch", {"gateway": gateway} | tojson, values.consts.config_patch_path, "0444") %}

{# No gateway runs before this, so any lock is from a dead one in a gone PID namespace (unverifiable upstream) #}
{% set entrypoint %}
#!/bin/sh
set -e
fp=$(node dist/index.js gateway recover-lock --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).confirmation')
node dist/index.js gateway recover-lock --confirm "$fp"
node dist/index.js config patch --file {{ values.consts.config_patch_path }}
exec node /app/docker-entrypoint.mjs "$@"
{%- endset %}
{% do c1.configs.add("entrypoint", entrypoint | trim, "/entrypoint.sh", "0755") %}
{% do c1.set_entrypoint(["/entrypoint.sh"]) %}

{% do c1.healthcheck.set_test("curl", {"port": values.network.gateway_port.port_number, "path": "/healthz"}) %}
{% do c1.set_command([
  "node", "openclaw.mjs",
  "gateway", "--allow-unconfigured",
  "--bind", "lan",
  "--port", values.network.gateway_port.port_number,
]) %}

{% if values.openclaw.auth_mode == "token" %}
  {% do c1.environment.add_env("OPENCLAW_GATEWAY_TOKEN", values.openclaw.gateway_token) %}
{% elif values.openclaw.auth_mode == "password" %}
  {% do c1.environment.add_env("OPENCLAW_GATEWAY_PASSWORD", values.openclaw.gateway_password) %}
{% endif %}

{% do c1.environment.add_user_envs(values.openclaw.additional_envs) %}

{% do c1.add_port(values.network.gateway_port) %}

{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.gateway_port) %}

{% do tpl.notes.declare_risk("host_network") %}

{{ tpl.render() | tojson }}
