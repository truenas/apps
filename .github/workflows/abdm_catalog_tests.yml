name: ABDM catalog validation

on:
  pull_request:
    paths:
      - "ix-dev/community/abdm/**"
      - ".github/workflows/abdm_catalog_tests.yml"
      - "library/2.3.17/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abdm-catalog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python -m pip install PyYAML Jinja2 docker bcrypt
      - name: Validate ABDM catalog and render template
        run: python ix-dev/community/abdm/validate.py
      - name: Test generated Compose settings
        run: python -m unittest discover -s ix-dev/community/abdm/tests -v
