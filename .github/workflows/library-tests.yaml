name: Unit Tests

on:
  pull_request:
    paths:
      - "library/**"

jobs:
  run-unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    container: python:3.15-slim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            python3-yaml \
            python3-bcrypt \
            python3-docker \
            python3-pytest \
            python3-pytest-mock

      # One pytest run per library version, each one registers itself as the "base" package,
      # so in a single run the later versions would import the modules of the first one
      - name: Run Tests
        run: |
          failed=0
          for tests in library/*/tests; do
            pytest "$tests" || failed=1
          done
          exit $failed
