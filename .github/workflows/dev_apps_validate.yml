name: dev_catalog_validation

on:
  pull_request:
  # To validate a branch without a PR
  workflow_dispatch:
  workflow_call:

# A new commit cancels the runs of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ix-dev-validate:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/truenas/apps_validation:slim
      env:
        FAKE_ENV: 1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Adding git directory to safe path
        run: git config --global --add safe.directory "$(pwd)"
      - name: Fetch base branch history
        run: git fetch -u origin master:master
      - name: Check no library copies are committed
        run: |
          copies=$(git ls-files 'ix-dev/*/*/templates/library/*')
          if [ -n "$copies" ]; then
            echo "Libraries are copied from library/ and lib/ by prepare_libs.py, remove the committed copies:"
            echo "$copies"
            exit 1
          fi
      - name: Copy the libraries into the apps
        run: python3 .github/scripts/prepare_libs.py
      - name: validate dev catalog
        run: /bin/bash -c "/usr/local/bin/apps_dev_charts_validate validate --path $(pwd)"
