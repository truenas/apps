name: Apps Test Suite

on:
  pull_request: {}

# A new commit cancels the runs of the previous one, per event so push and pull_request runs don't cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      changed-apps-1: ${{ steps.changed-apps.outputs.changed-apps-1 }}
      change-count-1: ${{ steps.changed-apps.outputs.change-count-1 }}
      changed-apps-2: ${{ steps.changed-apps.outputs.changed-apps-2 }}
      change-count-2: ${{ steps.changed-apps.outputs.change-count-2 }}
      changed-apps-3: ${{ steps.changed-apps.outputs.changed-apps-3 }}
      change-count-3: ${{ steps.changed-apps.outputs.change-count-3 }}
      changed-apps-4: ${{ steps.changed-apps.outputs.changed-apps-4 }}
      change-count-4: ${{ steps.changed-apps.outputs.change-count-4 }}
    steps:
      - name: Check Docker socket ownership
        run: |
          ls -la /var/run/docker.sock
          gid=$(stat -c '%g' /var/run/docker.sock)
          echo "Docker socket group is [$gid]"

          # Some apps that run rootless, we add this group to their compose file when in CI
          # So those apps can connect to the Docker socket, if that changes, we need to update
          # the app's compose file to use the correct group

          [ $gid -eq 118 ] && exit 0

          echo "Expected Docker socket group to be 118, but it's [$gid]"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get changed files
        id: changed-files-json
        uses: tj-actions/changed-files@v47
        with:
          json: true
          write_output_files: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Matrix Output
        id: changed-apps
        run: |
          out=$(python3 .github/scripts/changed_apps.py)
          for i in 1 2 3 4; do
            echo "changed-apps-$i=$(echo "${out}" | jq -cr ".matrix$i")" >> $GITHUB_OUTPUT
            echo "change-count-$i=$(echo "${out}" | jq -cr ".matrix$i.include | length")" >> $GITHUB_OUTPUT
          done

      - name: Message Generation
        id: message
        run: |
          python3 .github/scripts/message.py > pr-comment.txt
          if [ "$(cat pr-comment.txt)" != "" ]; then
            echo "message=true" >> $GITHUB_OUTPUT
          else
            echo "message=false" >> $GITHUB_OUTPUT
          fi
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        if: steps.message.outputs.message == 'true'
        continue-on-error: true
        with:
          comment-tag: notify-teams
          file-path: pr-comment.txt

  validate-ports:
    name: Validate Ports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Ports
        run: python3 ./.github/scripts/port_validation.py

  # GitHub caps a matrix at 256 jobs, so the test files are split over multiple matrix jobs
  # (see MATRIX_COUNT in changed_apps.py). All of them share the steps of the first one.
  run-apps-matrix-1:
    name: Run Docker Compose Render/Install (Matrix 1)
    needs: changed-files
    runs-on: ubuntu-latest
    if: needs.changed-files.outputs.change-count-1 > 0
    strategy:
      matrix: ${{ fromJson(needs.changed-files.outputs.changed-apps-1) }}
      fail-fast: false
    steps: &run-app-steps
      - name: Environment Information
        run: |
          echo "====== Docker Info ======"
          docker info
          echo "========================="

      - name: Checkout
        uses: actions/checkout@v7

      # Runs on the clean checkout, before the test changes anything
      - name: Check Metadata
        if: matrix.check_metadata
        shell: bash
        run: |
          echo "Checking [${{matrix.train}}/${{matrix.app}}/app.yaml]"
          python3 ./.github/scripts/check_metadata.py --train ${{matrix.train}} --app ${{matrix.app}}

      - name: Test
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "Testing [${{matrix.train}}/${{matrix.app}}/templates/test_values/${{matrix.test_file}}]"
          python3 ./.github/scripts/ci.py --train ${{matrix.train}} --app ${{matrix.app}} --test-file ${{matrix.test_file}} --skip-metadata

  run-apps-matrix-2:
    name: Run Docker Compose Render/Install (Matrix 2)
    needs: changed-files
    runs-on: ubuntu-latest
    if: needs.changed-files.outputs.change-count-2 > 0
    strategy:
      matrix: ${{ fromJson(needs.changed-files.outputs.changed-apps-2) }}
      fail-fast: false
    steps: *run-app-steps

  run-apps-matrix-3:
    name: Run Docker Compose Render/Install (Matrix 3)
    needs: changed-files
    runs-on: ubuntu-latest
    if: needs.changed-files.outputs.change-count-3 > 0
    strategy:
      matrix: ${{ fromJson(needs.changed-files.outputs.changed-apps-3) }}
      fail-fast: false
    steps: *run-app-steps

  run-apps-matrix-4:
    name: Run Docker Compose Render/Install (Matrix 4)
    needs: changed-files
    runs-on: ubuntu-latest
    if: needs.changed-files.outputs.change-count-4 > 0
    strategy:
      matrix: ${{ fromJson(needs.changed-files.outputs.changed-apps-4) }}
      fail-fast: false
    steps: *run-app-steps
