images:
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: "1.0.2@sha256:46eba20714c1cc6784f60e245c32c33a2d9f616e47d804694a9854248c89a992"

consts:
  perms_container_name: permissions
  elastic_container_name: elastic
  tls_key_path: /usr/share/elasticsearch/config/certs/tls.key
  tls_cert_path: /usr/share/elasticsearch/config/certs/tls.crt
