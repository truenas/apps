images:
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "9.5.6@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.2@sha256:6ddfdc314af9d18cfacb836ad266ef0ed91fecaa3686b20be72e464972860c08"

consts:
  perms_container_name: permissions
  elastic_container_name: elastic
  tls_key_path: /usr/share/elasticsearch/config/certs/tls.key
  tls_cert_path: /usr/share/elasticsearch/config/certs/tls.crt
  tls_ca_path: /usr/share/elasticsearch/config/certs/ca.crt
  user_id: 1000
  group_id: 1000
  notes_body: |
    ## Username

    The username for Elastic Search is `elastic`.
