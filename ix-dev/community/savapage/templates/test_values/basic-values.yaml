TZ: Etc/UTC
general:
  application_name: SavaPage
  locale: en_US.UTF-8
  currency: USD
  savapage_version: 1.6.0-final
  image_tag: 1.6.0
savapage:
  server_host: ""
  redirect_http_to_https: false
  default_paper_size: a4
  admin_hostname: savapage.local
  additional_properties: []
authentication:
  ldap_enabled: false
  ldap_url: ""
  ldap_base_dn: ""
  ldap_bind_dn: ""
  enable_pam_authentication: false
postgres:
  database: savapage
  user: savapage
  password: test-only-password
  image_selector: postgres_17_image
  pool_max: 20
printing:
  preserve_job_files: false
  cups_max_jobs: 500
  cups_admin_password: ""
  devices: []
  map_usb_bus: false
airprint:
  enable: false
  service_name: SavaPage on %h
  hostname: savapage.local
  use_host_network: true
  ipv4: true
  ipv6: true
network:
  enable_http: true
  http_port: {bind_mode: published, port_number: 18631, host_ips: [127.0.0.1]}
  https_port: {bind_mode: published, port_number: 18632, host_ips: [127.0.0.1]}
  local_https_port: {bind_mode: published, port_number: 18633, host_ips: [127.0.0.1]}
  enable_raw: false
  raw_port: {bind_mode: published, port_number: 19100, host_ips: [127.0.0.1]}
  enable_cups_admin: false
  cups_admin_port: {bind_mode: published, port_number: 18634, host_ips: [127.0.0.1]}
  trusted_lan_cidrs: []
  enable_xff: false
  allowed_proxy_cidrs: []
ix_volumes:
  test_savapage_data: /opt/tests/mnt/savapage/data
  test_savapage_logs: /opt/tests/mnt/savapage/logs
  test_cups_config: /opt/tests/mnt/savapage/cups-config
  test_cups_lib: /opt/tests/mnt/savapage/cups-lib
  test_cups_cache: /opt/tests/mnt/savapage/cups-cache
  test_cups_spool: /opt/tests/mnt/savapage/cups-spool
  test_postgres_data: /opt/tests/mnt/savapage/postgres
storage:
  savapage_data: {type: ix_volume, ix_volume_config: {dataset_name: test_savapage_data, create_host_path: true}}
  savapage_logs: {type: ix_volume, ix_volume_config: {dataset_name: test_savapage_logs, create_host_path: true}}
  cups_config: {type: ix_volume, ix_volume_config: {dataset_name: test_cups_config, create_host_path: true}}
  cups_lib: {type: ix_volume, ix_volume_config: {dataset_name: test_cups_lib, create_host_path: true}}
  cups_cache: {type: ix_volume, ix_volume_config: {dataset_name: test_cups_cache, create_host_path: true}}
  cups_spool: {type: ix_volume, ix_volume_config: {dataset_name: test_cups_spool, create_host_path: true}}
  postgres_data: {type: ix_volume, ix_volume_config: {dataset_name: test_postgres_data, create_host_path: true}}
labels: []
resources:
  limits: {cpus: 2, memory: 4096}

