resources:
  limits:
    cpus: 1.0
    memory: 512

TZ: Etc/UTC

snapshot_visualizer:
  source: truenas
  truenas_host: host.docker.internal
  api_key: "1-thisisnotarealapikeyjustfortestingrendering"
  verify_tls: false
  cache_minutes: 10
  allow_import: false
  https: true
  password: "a-test-password"
  allow_delete: true
  additional_envs:
    - name: SNAPVIZ_LOG_LEVEL
      value: DEBUG

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8528
