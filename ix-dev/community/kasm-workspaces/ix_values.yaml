images:
  image:
    repository: ghcr.io/linuxserver/kasm
    tag: "1.19.0@sha256:aeb3e104fcc2c65eafff198fe05d35f5226985f434048a7451918299e48cd9b9"

consts:
  kasm_container_name: kasm
  setup_internal_port: 3000
  notes_body: |
    Default users:
    - admin@kasm.local
    - user@kasm.local

    Setup: the Setup page requires a setup token, a new one is printed
    in the app logs each time the setup wizard starts.

    Update notice: Updating the app itself is not enough to update Kasm,
    please visit the Setup page with the new token from the app logs
    in order to finish the update process.
