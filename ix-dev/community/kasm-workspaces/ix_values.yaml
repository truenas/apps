images:
  image:
    repository: ghcr.io/linuxserver/kasm
    tag: "1.19.0@sha256:3a9714f9bb3240c419cc04476096c5ec2d933b8d2f6c8e94c84ef97d5f768902"

consts:
  kasm_container_name: kasm
  setup_internal_port: 3000
  notes_body: |
    Default users:
    - admin@kasm.local
    - user@kasm.local

    Setup: the Setup page requires a setup token, a new one is printed
    in the app logs each time the setup wizard starts. After the first
    install the Setup page is disabled.

    Update notice: Updating the app itself is not enough to update Kasm.
    Add the environment variable KASM_SETUP=true, visit the Setup page
    with the new token from the app logs to finish the update, then
    remove KASM_SETUP again.
