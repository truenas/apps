consts:
  paperless_container_name: paperless
  perms_container_name: permissions
  postgres_container_name: postgres
  redis_container_name: redis
  tika_container_name: tika
  gotenberg_container_name: gotenberg
  # Keep data/media/trash outside the paperless user's home (/usr/src/paperless),
  # otherwise `usermod --uid` (USERMAP_UID) walks the whole library on every start.
  data_path: /paperless/data
  media_path: /paperless/media
  trash_path: /paperless/trash
  # Consume intentionally stays under the home dir. Workflow triggers match `filter_path`
  # against the absolute in-container path of the consumed file, so moving it
  # would silently break existing triggers like `/usr/src/paperless/consume/scanner/*`.
  # It is normally near-empty, so the usermod walk over it is cheap.
  consume_path: /usr/src/paperless/consume
  db_user: paperless
  db_name: paperless
  tika_run_user: 35002
  tika_run_group: 35002
  gotenberg_run_user: 1001
  gotenberg_run_group: 1001
  tika_port: 9998
  gotenberg_port: 3000
