resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

opentodo:
  base_url: ""
  setup_token: ""
  allow_signup: false
  trusted_proxies: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/opentodo/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
