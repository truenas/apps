resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

opentodo:
  base_url: https://todo.example.com
  setup_token: test-setup-token-0123456789
  allow_signup: true
  trusted_proxies: private
  additional_envs:
    - name: OPENTODO_LOG_LEVEL
      value: debug

network:
  web_port:
    bind_mode: published
    port_number: 30081
  host_network: true
  networks: []

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/opentodo/hostnet-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []

labels: []
