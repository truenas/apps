resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Europe/Berlin

trek:
  encryption_key: ""
  admin_email: trek@example.test
  admin_password: test-password
  cookie_secure: true
  additional_envs:
    - env:
        name: APP_URL
        value: https://trek.example.test

network:
  host_network: false
  networks: []
  web_port:
    bind_mode: published
    port_number: 30382
    host_ips: []

storage:
  data:
    type: host_path
    host_path_config:
      acl_enable: false
      path: /opt/tests/mnt/trek-host/data
  uploads:
    type: host_path
    host_path_config:
      acl_enable: false
      path: /opt/tests/mnt/trek-host/uploads
  additional_storage: []

labels: []
