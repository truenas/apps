resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

nametag:
  postgres_image_selector: postgres_18_image
  db_password: password
  app_url: http://localhost:8080
  nextauth_secret: test-secret-that-is-at-least-32-characters
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/nametag/data
  postgres_data: /opt/tests/mnt/nametag/postgres-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
