{% set tpl = ix_lib.base.render.Render(values) %}

{% set nametag_net = tpl.networks.create_internal("nametag-net") %}

{% set app_url = values.nametag.app_url.rstrip("/") %}
{# Only the app and the cron container use it, so it can change on every render #}
{% set cron_secret = tpl.funcs.secure_string(32) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set c1 = tpl.add_container(values.consts.nametag_container_name, "image") %}
{% do c1.add_network(nametag_net) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.nametag.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.nametag.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(nametag_net) %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/api/health"}) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do c1.environment.add_env("NEXTAUTH_URL", app_url) %}
{% do c1.environment.add_env("NEXTAUTH_SECRET", values.nametag.nextauth_secret) %}
{% do c1.environment.add_env("CRON_SECRET", cron_secret) %}
{% do c1.environment.add_user_envs(values.nametag.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/app/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{# The image builds .next/cache owned by 1001. #}
{% set next_cache = {"type": "temporary", "volume_config": {"volume_name": "nametag-next-cache"}} %}
{% do c1.add_storage("/app/.next/cache", next_cache) %}
{% do perm_container.add_or_skip_action("next_cache", next_cache, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{# Reminders, cleanup, CardDAV sync and geocoding run when these endpoints are called #}
{% set cron_url = "http://%s:%d/api/cron"|format(values.consts.nametag_container_name, values.network.web_port.port_number) %}
{% set cron_cmd = "curl --silent --show-error --fail --header \"Authorization: Bearer $CRON_SECRET\" '%s/%s'" %}
{% set cron_config = {
  "tasks": [
    {"schedule": "0 8 * * *", "command": cron_cmd|format(cron_url, "send-reminders")},
    {"schedule": "0 3 * * *", "command": cron_cmd|format(cron_url, "purge-deleted")},
    {"schedule": "0 2,10,18 * * *", "command": cron_cmd|format(cron_url, "carddav-sync")},
    {"schedule": "*/5 * * * *", "command": cron_cmd|format(cron_url, "geocode")},
  ]
} %}
{% set cron = tpl.deps.cron(values.consts.cron_container_name, "cron_image", cron_config) %}
{% do cron.container.add_network(nametag_net) %}
{% do cron.container.depends.add_dependency(values.consts.nametag_container_name, "service_healthy") %}
{% do cron.container.environment.add_env("CRON_SECRET", cron_secret) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
