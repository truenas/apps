{% set tpl = ix_lib.base.render.Render(values) %}

{% set rmmzit_net = tpl.networks.create_internal("rmmzit-net") %}

{% set c1 =tpl.add_container(values.consts.rmmzit_container_name, "image") %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.rmmzit.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.rmmzit.postgres_image_selector, pg_config, perms) %}
{% do postgres.container.add_network(rmmzit_net) %}

{% do c1.add_network(rmmzit_net) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_command([
  "-mgmt-listen", ":%d" | format(values.network.web_port.port_number),
  "-agent-listen", ":%d" | format(values.network.agent_port.port_number),
]) %}
{% do c1.healthcheck.set_custom_test(["CMD", "/usr/bin/rmmzit-server", "-healthcheck"]) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do c1.environment.add_env("RMMZIT_DB", postgres.get_url("postgres")) %}
{% do c1.environment.add_user_envs(values.rmmzit.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_port(values.network.agent_port) %}

{% do c1.add_storage("/var/lib/rmmzit", values.storage.data) %}
{% do perms.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perms.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https"}) %}

{{ tpl.render() | tojson }}
