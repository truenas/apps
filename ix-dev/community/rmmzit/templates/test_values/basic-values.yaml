resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

rmmzit:
  postgres_image_selector: postgres_18_image
  db_password: some-secret-postgres-password
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080
  agent_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/rmmzit/data
  postgres_data: /opt/tests/mnt/rmmzit/postgres-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
