{% set tpl = ix_lib.base.render.Render(values) %}

{% set excaliself_net = tpl.networks.create_internal("excaliself-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set c1 = tpl.add_container(values.consts.excaliself_container_name, "image") %}
{% do c1.add_network(excaliself_net) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.excaliself.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.excaliself.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(excaliself_net) %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/api/health"}) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do c1.environment.add_env("BETTER_AUTH_SECRET", values.excaliself.auth_secret) %}
{# Sign-in and live collaboration refuse pages from any origin not listed here #}
{% do c1.environment.add_env("BASE_URL", values.excaliself.app_url.rstrip("/")) %}
{% do c1.environment.add_env("TRUSTED_ORIGINS", values.excaliself.other_urls|join(",")) %}
{% do c1.environment.add_user_envs(values.excaliself.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
