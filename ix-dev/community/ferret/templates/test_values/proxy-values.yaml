resources:
  limits:
    cpus: 2.0
    memory: 2048

ferret:
  public_url: https://ferret.example.com
  auth_secret: test-auth-secret-test-auth-secret-1234
  files_key: 8Hdz6j0k2Vwq9QmXcR1bT4uYpL7nS3eA5fG0hJ2kL4M=
  vapid_subject: mailto:admin@example.com
  allow_signup: false
  trusted_proxies:
    - 172.16.0.0/12
  additional_envs:
    - name: BACKUP_DIR
      value: /backups
    - name: BARCODE_LOOKUP
      value: upcitemdb

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data
  backups: /opt/tests/mnt/backups

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /backups
      ix_volume_config:
        dataset_name: backups
        create_host_path: true
