resources:
  limits:
    cpus: 2.0
    memory: 2048

ferret:
  public_url: http://localhost:8080
  auth_secret: basic-auth-secret-basic-auth-secret-1234
  files_key: N5nNiMISJms2vfbh4mvKNO6HK+Bs6btRVPRcCQcxOzU=
  vapid_subject: ""
  allow_signup: true
  trusted_proxies: []
