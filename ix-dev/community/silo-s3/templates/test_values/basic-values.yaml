resources:
  limits:
    cpus: 2.0
    memory: 4096

silo:
  root_user: silo-admin
  root_password: silo-test-password
  domain: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  api_port:
    bind_mode: published
    port_number: 8080
  console_port:
    bind_mode: published
    port_number: 8081
  certificate_id: null

ix_volumes:
  data: /opt/tests/mnt/silo-s3/data

storage:
  data:
    type: ix_volume
    mount_path: /data
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
