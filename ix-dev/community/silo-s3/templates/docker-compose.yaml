{% set tpl = ix_lib.base.render.Render(values) %}

{% if values.storage.data.type == "ix_volume" and "#" in values.storage.data.ix_volume_config.dataset_name %}
  {% do tpl.funcs.fail("Did you forget to replace '#' in the Dataset Name '%s' with a unique identifier?"|format(values.storage.data.ix_volume_config.dataset_name)) %}
{% endif %}

{% set c1 = tpl.add_container(values.consts.silo_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The image bundles the mc client as `mcli`. `mcli ready` reports healthy once the node can serve reads. #}
{% do c1.healthcheck.set_custom_test(["CMD", "mcli", "ready", "--insecure", "--cluster-read", "health"]) %}

{% set tmp_config = {"type": "temporary", "volume_config": {"volume_name": "tmp"}} %}
{% do c1.add_storage("/tmp", tmp_config) %}
{% do perm_container.add_or_skip_action("tmp", tmp_config, perms_config) %}

{% set proto = "https" if values.network.certificate_id else "http" %}
{% set envs = namespace(x={
  "HOME": "/tmp",
  "MC_CONFIG_DIR": "/tmp/.mcli",
  "MC_HOST_health": "%s://localhost:%d" | format(proto, values.network.api_port.port_number),
  "MINIO_ROOT_USER": values.silo.root_user,
  "MINIO_ROOT_PASSWORD": values.silo.root_password,
  "MINIO_VOLUMES": values.storage.data.mount_path,
}) %}

{% set cmd = namespace(x=[
  "server",
  "--address", ":%d" | format(values.network.api_port.port_number),
  "--console-address", ":%d" | format(values.network.console_port.port_number),
]) %}

{% do c1.add_storage(values.storage.data.mount_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, "%s/private.key" | format(values.consts.certs_dir)) %}
  {% do c1.configs.add("public", cert.certificate, "%s/public.crt" | format(values.consts.certs_dir)) %}
  {% do cmd.x.extend(["--certs-dir", values.consts.certs_dir]) %}
  {% if values.network.domain %}
    {% do envs.x.update({"MINIO_SERVER_URL": "https://%s:%d" | format(values.network.domain, values.network.api_port.port_number)}) %}
    {% do envs.x.update({"MINIO_BROWSER_REDIRECT_URL": "https://%s:%d" | format(values.network.domain, values.network.console_port.port_number)}) %}
  {% endif %}
{% endif %}

{% for arg in values.silo.extra_args %}
  {% do cmd.x.append(arg) %}
{% endfor %}

{% do c1.set_command(cmd.x) %}
{% for key, value in envs.x.items() %}
  {% do c1.environment.add_env(key, value) %}
{% endfor %}
{% do c1.environment.add_user_envs(values.silo.additional_envs) %}

{% do c1.add_port(values.network.api_port) %}
{% do c1.add_port(values.network.console_port) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.console_port, {"scheme": proto}) %}

{{ tpl.render() | tojson }}
