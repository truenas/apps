{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.silo_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% set scheme = "https" if values.network.certificate_id else "http" %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.api_port.port_number, "path": "/minio/health/cluster/read", "scheme": scheme}) %}
{% do c1.set_command(["server", "--certs-dir", values.consts.certs_dir]) %}

{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 100, "uid": values.run_as.user, "gid": values.run_as.group}}) %}

{% do c1.environment.add_env("HOME", "/tmp") %}
{% do c1.environment.add_env("MINIO_ROOT_USER", values.silo.root_user) %}
{% do c1.environment.add_env("MINIO_ROOT_PASSWORD", values.silo.root_password) %}
{% do c1.environment.add_env("MINIO_VOLUMES", values.consts.data_dir) %}
{% do c1.environment.add_env("MINIO_ADDRESS", ":%d"|format(values.network.api_port.port_number)) %}
{% do c1.environment.add_env("MINIO_CONSOLE_ADDRESS", ":%d"|format(values.network.console_port.port_number)) %}

{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, "%s/private.key"|format(values.consts.certs_dir)) %}
  {% do c1.configs.add("public", cert.certificate, "%s/public.crt"|format(values.consts.certs_dir)) %}
  {% if values.silo.domain %}
    {% do c1.environment.add_env("MINIO_SERVER_URL", "https://%s:%d"|format(values.silo.domain, values.network.api_port.port_number)) %}
    {% do c1.environment.add_env("MINIO_BROWSER_REDIRECT_URL", "https://%s:%d"|format(values.silo.domain, values.network.console_port.port_number)) %}
  {% endif %}
{% endif %}

{% do c1.environment.add_user_envs(values.silo.additional_envs) %}

{% do c1.add_storage(values.consts.data_dir, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_port(values.network.api_port) %}
{% do c1.add_port(values.network.console_port) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.console_port, {"scheme": scheme}) %}

{{ tpl.render() | tojson }}
