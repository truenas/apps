{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.languagetool_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}

{# Health check setup using the exposed HTTP port #}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_port, "path": "/v2/languages"}) %}

{# Configure Java memory limits & prewarming settings #}
{% do c1.environment.add_env("Java_Xms", values.languagetool.java_xms) %}
{% do c1.environment.add_env("Java_Xmx", values.languagetool.java_xmx) %}
{% do c1.environment.add_env("langtool_pipelinePrewarming", values.languagetool.pipeline_prewarming | string | lower) %}

{# Handle additional environment variables provided by the user #}
{% do c1.environment.add_user_envs(values.languagetool.additional_envs) %}

{# Setup Networking #}
{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_port}) %}

{# Setup Storage for N-Grams and Dictionary Data #}
{% do c1.add_storage("/ngrams", values.storage.ngrams) %}
{% do perm_container.add_or_skip_action("ngrams", values.storage.ngrams, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# Add web portal in TrueNAS UI #}
{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_port if values.network.host_network else None, "path": "/v2/languages"}) %}

{{ tpl.render() | tojson }}
