{% set tpl = ix_lib.base.render.Render(values) %}

{# {% if values.planka.postgres_image_selector == "postgres_17_image" %}
  {% do tpl.notes.add_deprecation("Postgres 17 is deprecated and will be removed in the near future. Please upgrade.") %}
{% endif %} #}

{% set planka_net = tpl.networks.create_internal("planka-net") %}

{% set c1 = tpl.add_container(values.consts.planka_container_name, "image") %}
{% do c1.add_network(planka_net) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.planka.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.planka.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(planka_net) %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do c1.environment.add_env("NODE_ENV", "production") %}
{% do c1.environment.add_env("BASE_URL", values.planka.base_url.rstrip("/")) %}
{% do c1.environment.add_env("TRUST_PROXY", values.planka.trust_proxy) %}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("SECRET_KEY", values.planka.secret_key) %}
{% do c1.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% if values.planka.default_admin_email %}
  {% do c1.environment.add_env("DEFAULT_ADMIN_EMAIL", values.planka.default_admin_email) %}
  {% do c1.environment.add_env("DEFAULT_ADMIN_NAME", values.planka.default_admin_name) %}
  {% do c1.environment.add_env("DEFAULT_ADMIN_USERNAME", values.planka.default_admin_username) %}
  {% do c1.environment.add_env("DEFAULT_ADMIN_PASSWORD", values.planka.default_admin_password) %}
{% endif %}
{% do c1.environment.add_user_envs(values.planka.additional_envs) %}

{% do c1.add_storage("/app/data", values.storage.data) %}
{% do c1.add_storage("/app/logs", values.storage.logs) %}
{% do c1.add_storage("/app/.tmp", tpl.funcs.deep_merge(values.storage.tmp, {"tmpfs_config": {"uid": values.run_as.user, "gid": values.run_as.group}})) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do perm_container.add_or_skip_action("logs", values.storage.logs, perms_config) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number}) %}
{% do c1.add_port(values.network.web_port) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
