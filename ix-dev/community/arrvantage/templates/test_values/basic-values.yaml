resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

arrvantage:
  force_https_cookies: false
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/arrvantage/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage: []
