resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

faster_whisper:
  image_selector: image
  model: tiny-int8
  language: en
  beam_size: 1
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  wyoming_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/faster-whisper/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage: []
