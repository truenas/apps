{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.ihasmail_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The image is built to run with no writable filesystem. The session file is the one exception, and it lives on the mounted dataset. #}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_read_only(true) %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/api/health"}) %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("STALWART_URL", values.ihasmail.stalwart_url.rstrip("/")) %}
{% do c1.environment.add_env("APP_SECRET", values.ihasmail.app_secret) %}
{% do c1.environment.add_env("APP_NAME", values.ihasmail.app_name) %}
{% do c1.environment.add_env("IMAGE_PROXY", "1" if values.ihasmail.image_proxy else "0") %}
{% do c1.environment.add_env("SECURE_COOKIES", values.ihasmail.secure_cookies) %}
{% do c1.environment.add_env("SESSION_FILE", "%s/sessions.json"|format(values.consts.data_path)) %}
{% do c1.environment.add_user_envs(values.ihasmail.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64, "uid": values.run_as.user, "gid": values.run_as.group}}) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.add_info("ihasmail is a mail client, not a mail server. It needs a Stalwart Mail Server 0.16 or newer that this container can reach, and it keeps no mail, accounts or database of its own.") %}
{% do tpl.notes.add_info("Put it behind a reverse proxy with HTTPS before exposing it beyond your LAN.") %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
