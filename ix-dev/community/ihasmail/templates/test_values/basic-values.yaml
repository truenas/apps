resources:
  limits:
    cpus: 2.0
    memory: 4096

ihasmail:
  stalwart_url: https://mail.example.com
  app_secret: test-secret-for-ci-only-not-a-real-one-0000
  app_name: ihasmail
  image_proxy: true
  secure_cookies: auto
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/ihasmail/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
