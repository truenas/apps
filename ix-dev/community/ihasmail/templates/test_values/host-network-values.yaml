resources:
  limits:
    cpus: 2.0
    memory: 4096

ihasmail:
  stalwart_url: https://mail.example.com/
  app_secret: test-secret-for-ci-only-not-a-real-one-0000
  app_name: Coffey Labs Mail
  image_proxy: false
  secure_cookies: "0"
  additional_envs:
    - name: LOGIN_RATE_LIMIT
      value: "20"

network:
  host_network: true
  web_port:
    bind_mode: published
    port_number: 30489

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/ihasmail/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
