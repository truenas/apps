{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.container_name, "image") %}

{% do c1.set_user(0, 0) %}
{% do c1.healthcheck.disable() %}

{% do c1.environment.add_user_envs(values.retroassembly.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": 8000}) %}

{% do c1.add_storage("/app/data", values.storage.data) %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "http", "path": "/"}) %}

{{ tpl.render() | tojson }}
