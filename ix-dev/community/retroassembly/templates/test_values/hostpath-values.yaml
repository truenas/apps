resources:
  limits:
    cpus: 2
    memory: 4096

retroassembly:
  additional_envs:
    - name: RETROASSEMBLY_TEST
      value: "true"

network:
  web_port:
    bind_mode: published
    port_number: 30550
    host_ips: []

storage:
  data:
    type: host_path
    host_path_config:
      acl_enable: false
      path: /opt/tests/mnt/retroassembly-hostpath/data

labels:
  - key: test.scenario
    value: hostpath
    containers:
      - retroassembly
