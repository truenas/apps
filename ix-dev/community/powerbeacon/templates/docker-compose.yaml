{% set tpl = ix_lib.base.render.Render(values) %}

{% set powerbeacon_network = tpl.networks.create_internal("powerbeacon_network") %}

{# Main PowerBeacon Container #}
{% set app = tpl.add_container(values.consts.powerbeacon_container_name, "image") %}

{# Permissions Container (used by postgres) #}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{# Postgres Container #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.powerbeacon.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.powerbeacon.postgres_image_selector, pg_config, perm_container) %}


{% do app.set_user(0, 0) %}
{% do app.add_caps(["CHOWN", "SETGID", "SETUID"]) %}
{% do app.healthcheck.set_test("http", {"port": values.consts.internal_web_port, "path": "/health"}) %}


{# Add containers to network #}
{% do postgres.container.add_network(powerbeacon_network) %}
{% do app.add_network(powerbeacon_network) %}
{% do app.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{# Configure environment variables #}
{% do app.environment.add_env("JWT_SECRET", values.powerbeacon.session_secret) %}
{% do app.environment.add_env("DB_URL", postgres.get_url("postgresql")) %}

{# Add port mappings #}
{% do app.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}


{% for store in values.storage.additional_storage %}
  {% do app.add_storage(store.mount_path, store) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# Add portal for UI access #}
{% do tpl.portals.add(values.network.web_port) %}

{# Render the final configuration #}
{{ tpl.render() | tojson }}