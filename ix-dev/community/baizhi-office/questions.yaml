- variable: labels
  label: 附加容器标签
  schema:
    type: list
    default: []
    items:
    - variable: label
      label: 标签
      schema:
        type: dict
        attrs:
        - variable: key
          label: 名称
          schema:
            type: string
            required: true
        - variable: value
          label: 值
          schema:
            type: string
            required: true
        - variable: containers
          label: 应用标签的容器
          schema:
            type: list
            items:
            - variable: container
              label: 容器
              schema:
                type: string
                required: true
                enum:
                - value: admin
                  description: admin
                - value: backend
                  description: backend
                - value: db
                  description: db
                - value: rustfs
                  description: rustfs
  group: 标签配置
- variable: resources
  label: 资源限制
  schema:
    type: dict
    attrs:
    - variable: limits
      label: 每个容器的资源上限
      schema:
        type: dict
        attrs:
        - variable: cpus
          label: CPU 核数
          schema:
            type: int
            default: 2
            min: 1
            required: true
        - variable: memory
          label: 内存（MiB）
          schema:
            type: int
            default: 4096
            min: 512
            required: true
  group: 资源配置
