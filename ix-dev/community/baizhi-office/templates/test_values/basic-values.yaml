TZ: Etc/UTC
resources:
  limits:
    cpus: 2
    memory: 4096
labels: []
baizhi:
  public_url: http://localhost:31083
  admin_email: admin@example.com
  admin_password: Test-only-admin-42!
  db_password: Test-only-db:$@:/#42
  s3_access_key: test-only-access
  s3_secret_key: Test-only-object-secret-42
  runtime_relay: true
  trusted_proxy_cidrs: ''
  additional_envs: []
network:
  web_port:
    bind_mode: published
    port_number: 31083
    host_ips:
    - 127.0.0.1
storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  object_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: object_data
      create_host_path: true
  object_logs:
    type: ix_volume
    ix_volume_config:
      dataset_name: object_logs
      create_host_path: true
  runtime_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: runtime_data
      create_host_path: true
  license_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: license_data
      create_host_path: true
ix_volumes:
  postgres_data: /opt/tests/mnt/baizhi-office/postgres_data
  object_data: /opt/tests/mnt/baizhi-office/object_data
  object_logs: /opt/tests/mnt/baizhi-office/object_logs
  runtime_data: /opt/tests/mnt/baizhi-office/runtime_data
  license_data: /opt/tests/mnt/baizhi-office/license_data
