TZ: Etc/UTC
resources:
  limits:
    cpus: 2
    memory: 4096
labels: []
baizhi:
  public_url: https://office.example.com
  admin_email: admin@example.com
  admin_password: Test-only-admin-42!
  db_password: Test-only-db:$@:/#42
  s3_access_key: test-only-access
  s3_secret_key: Test-only-object-secret-42
  runtime_relay: false
  trusted_proxy_cidrs: 192.0.2.10/32
  additional_envs:
  - name: MONKEYAI_LOG_LEVEL
    value: info
network:
  web_port:
    bind_mode: published
    port_number: 31084
    host_ips:
    - 127.0.0.1
storage:
  postgres_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/baizhi-office-host/postgres_data
      create_host_path: true
      auto_permissions: true
  object_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/baizhi-office-host/object_data
      create_host_path: true
      auto_permissions: true
  object_logs:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/baizhi-office-host/object_logs
      create_host_path: true
      auto_permissions: true
  runtime_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/baizhi-office-host/runtime_data
      create_host_path: true
      auto_permissions: true
  license_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/baizhi-office-host/license_data
      create_host_path: true
      auto_permissions: true
