TZ: Europe/Amsterdam

mediavault:
  admin_email: admin@mediavault.local
  admin_password: Test-Only-Catalog-Password-2026!
  cors_origins: http://127.0.0.1:3000
  truenas_ui_url: http://127.0.0.1
  tmdb_token: ""
  tmdb_language: nl-NL
  hardware_device: ""
  auto_scan_enabled: true
  auto_scan_debounce_seconds: 15
  auto_scan_poll_seconds: 60
  full_scan_interval_minutes: 360
  max_transcodes_per_user: 2
  max_concurrent_transcodes: 4
  max_2160p_transcodes: 1
  transcode_retention_minutes: 240
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 3000

run_as:
  user: 1234
  group: 2345

resources:
  limits:
    cpus: 256
    memory: 1048576
  gpus:
    use_all_gpus: true
    kfd_device_exists: true
    nvidia_gpu_selection:
      "0000:01:00.0":
        use_gpu: true
        uuid: GPU-mediavault-render-test

ix_volumes:
  mediavault-config: /opt/tests/mnt/mediavault-config
  mediavault-data: /opt/tests/mnt/mediavault-data
  mediavault-cache: /opt/tests/mnt/mediavault-cache
  mediavault-transcodes: /opt/tests/mnt/mediavault-transcodes
  mediavault-downloads: /opt/tests/mnt/mediavault-downloads
  mediavault-backups: /opt/tests/mnt/mediavault-backups
  mediavault-media: /opt/tests/mnt/mediavault-media

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: mediavault-config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mediavault-data
      create_host_path: true
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: mediavault-cache
      create_host_path: true
  transcodes:
    type: ix_volume
    ix_volume_config:
      dataset_name: mediavault-transcodes
      create_host_path: true
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: mediavault-downloads
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: mediavault-backups
      create_host_path: true
  media:
    type: ix_volume
    ix_volume_config:
      dataset_name: mediavault-media
      create_host_path: true
