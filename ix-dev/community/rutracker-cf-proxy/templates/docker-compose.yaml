{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.proxy_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/health"}) %}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("CLEARANCE_FILE", "%s/clearance.json" | format(values.consts.data_path)) %}
{% do c1.environment.add_env("BYPARR_URL", values.rutracker_cf_proxy.byparr_url) %}
{% do c1.environment.add_user_envs(values.rutracker_cf_proxy.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% set definition = values.rutracker_cf_proxy.prowlarr_definition %}
{% if definition.enabled %}
  {% set definitions_storage = {
    "type": "host_path",
    "host_path_config": {
      "path": definition.path,
      "auto_permissions": definition.fix_permissions,
      "create_host_path": definition.get("create_host_path", False),
    },
  } %}
  {% do perm_container.add_or_skip_action("definitions", definitions_storage, perms_config) %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% if definition.enabled %}
  {% set reload = definition.prowlarr_url and definition.prowlarr_api_key %}
  {% set c2 = tpl.add_container(values.consts.definition_container_name, "image") %}
  {% do c2.setup_as_helper(disable_network=not reload) %}
  {% do c2.set_user(values.run_as.user, values.run_as.group) %}
  {% do c2.set_command(["install-definition"]) %}
  {% do c2.environment.add_env("DEFINITION_DIR", values.consts.definitions_path) %}
  {% do c2.environment.add_env("PUBLIC_URL", definition.public_url) %}
  {% if reload %}
    {% do c2.environment.add_env("PROWLARR_URL", definition.prowlarr_url) %}
    {% do c2.environment.add_env("PROWLARR_API_KEY", definition.prowlarr_api_key) %}
  {% endif %}
  {% do c2.add_storage(values.consts.definitions_path, definitions_storage) %}
  {% if perm_container.has_actions() %}
    {% do c2.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endif %}
{% endif %}

{{ tpl.render() | tojson }}
