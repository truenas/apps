resources:
  limits:
    cpus: 2.0
    memory: 4096

rutracker_cf_proxy:
  byparr_url: http://byparr.invalid:8191/v1
  prowlarr_definition:
    enabled: false
    public_url: ""
    path: ""
    fix_permissions: false
    prowlarr_url: ""
    prowlarr_api_key: ""
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
