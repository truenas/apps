resources:
  limits:
    cpus: 2.0
    memory: 4096

dawarich:
  postgres_image_selector: postgis_18_image
  db_password: secret
  redis_password: secret
  secret_key_base: secret-longer-than-32-chars-a-zA-Z0-9symbols
  enable_metrics: true
  metrics_username: prometheus
  metrics_password: metrics-password
  application_hosts:
    - loc.example.com
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 30161

ix_volumes:
  postgres_data: /opt/tests/mnt/dawarich/postgres
  public: /opt/tests/mnt/dawarich/public
  watched: /opt/tests/mnt/dawarich/watched
  storage: /opt/tests/mnt/dawarich/storage

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  public:
    type: ix_volume
    ix_volume_config:
      dataset_name: public
      create_host_path: true
  watched:
    type: ix_volume
    ix_volume_config:
      dataset_name: watched
      create_host_path: true
  storage:
    type: ix_volume
    ix_volume_config:
      dataset_name: storage
      create_host_path: true
  additional_storage: []
