groups:
  - name: Application Configuration
    description: Configure application environment and network
  - name: Storage Configuration
    description: Choose an existing TrueNAS dataset
questions:
  - variable: app
    label: ""
    group: Application Configuration
    schema:
      type: dict
      attrs:
        - variable: host_port
          label: Host Port
          schema:
            type: int
            default: 8443
            min: 1
            max: 65535
            required: true
        - variable: http_port
          label: HTTP Host Port
          schema:
            type: int
            default: 8080
            min: 1
            max: 65535
            required: true
        - variable: db_engine
          label: Database Engine
          schema:
            type: string
            default: sqlite
        - variable: db_path
          label: Database File Path (inside container)
          schema:
            type: string
            default: /config/data/netprobe.sqlite
        - variable: autostart_configured
          label: Automatically start configured probes
          schema:
            type: boolean
            default: false
        - variable: app_timezone
          label: Application Timezone
          schema:
            type: string
            default: America/Chicago
        - variable: speedtest_backend
          label: Speedtest Backend
          schema:
            type: string
            default: python
        - variable: speedtest_enabled
          label: Enable Speedtest
          schema:
            type: boolean
            default: true
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data_path
          label: Application Host Dataset Path
          description: Existing absolute path under /mnt/<pool> to store application data
          schema:
            type: hostpath
            required: true
