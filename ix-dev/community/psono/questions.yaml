groups:
  - name: Psono Configuration
    description: Configure Psono
  - name: Network Configuration
    description: Configure Network for Psono
  - name: Storage Configuration
    description: Configure Storage for Psono
  - name: Labels Configuration
    description: Configure Labels for Psono
  - name: Resources Configuration
    description: Configure Resources for Psono

questions:
  - variable: TZ
    group: Psono Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone
  - variable: psono
    label: ""
    group: Psono Configuration
    schema:
      type: dict
      attrs:
        - variable: image_selector
          label: Psono Image
          description: |
            Community Edition is free and open source.</br>
            Enterprise Edition requires a valid Psono license.
          schema:
            type: string
            default: ce_image
            required: true
            enum:
              - value: ce_image
                description: Psono Community Edition
              - value: image
                description: Psono Enterprise Edition
        - variable: postgres_image_selector
          label: Postgres Image (CAUTION)
          description: |
            If you are changing this after the postgres directory has been initialized,</br>
            STOP! and make sure you have a backup of your data.</br>
            Changing this will trigger an one way database upgrade.</br>
            You can only select newer versions of postgres.</br>
            Selecting an older version will refuse to start.</br>
            If something goes wrong, you will have to restore from backup.
          schema:
            type: string
            default: postgres_18_image
            required: true
            enum:
              - value: postgres_17_image
                description: Postgres 17
              - value: postgres_18_image
                description: Postgres 18
        - variable: db_password
          label: Database Password
          schema:
            type: string
            default: ""
            required: true
            private: true
        - variable: base_url
          label: Base URL
          description: |
            The exact URL used to reach Psono from a browser, without a trailing slash.</br>
            The web client is a static bundle that is built with this value, so it has to
            match how users actually connect.</br>
            Examples:</br>
              - http://192.168.1.100:30475</br>
              - https://psono.example.com</br>
          schema:
            type: uri
            default: ""
            required: true
        - variable: service_name
          label: Service Name
          description: The name displayed in the web client and in emails.
          schema:
            type: string
            default: "Psono"
            required: true
        - variable: server_keys
          label: Server Keys
          description: |
            Generate all six values at once with:</br>
            <code>docker run --rm psono/psono-combo:latest python3 ./psono/generateserverkeys.py</code></br>
            </br>
            Back them up. They cannot be changed after the first user has registered
            without losing access to every stored secret.
          schema:
            type: dict
            attrs:
              - variable: secret_key
                label: Secret Key
                description: Random string of 32 characters or more.
                schema:
                  type: string
                  default: ""
                  required: true
                  private: true
              - variable: activation_link_secret
                label: Activation Link Secret
                description: Random string of 32 characters or more, used to sign activation links.
                schema:
                  type: string
                  default: ""
                  required: true
                  private: true
              - variable: db_secret
                label: Database Secret
                description: Random string of 32 characters or more, used to encrypt data at rest.
                schema:
                  type: string
                  default: ""
                  required: true
                  private: true
              - variable: email_secret_salt
                label: Email Secret Salt
                description: |
                  A bcrypt salt used to hash email addresses.</br>
                  Looks like <code>$2b$12$XUG.sKxC2jmkUvWQjg53.e</code>
                schema:
                  type: string
                  default: ""
                  required: true
                  private: true
              - variable: private_key
                label: Private Key
                description: Hex encoded NaCl private key. Must match the public key below.
                schema:
                  type: string
                  default: ""
                  required: true
                  private: true
                  valid_chars: "^[a-f0-9]{64}$"
                  valid_chars_error: Please provide a 64 character lowercase hex string.
              - variable: public_key
                label: Public Key
                description: Hex encoded NaCl public key. Must match the private key above.
                schema:
                  type: string
                  default: ""
                  required: true
                  valid_chars: "^[a-f0-9]{64}$"
                  valid_chars_error: Please provide a 64 character lowercase hex string.
        - variable: allowed_domains
          label: Allowed Domains
          description: |
            Domains that usernames are allowed to end with.</br>
            A user registering as <code>alice@example.com</code> requires
            <code>example.com</code> to be listed here.
          schema:
            type: list
            default:
              - "example.com"
            items:
              - variable: domain
                label: Domain
                schema:
                  type: string
                  required: true
        - variable: allowed_hosts
          label: Allowed Hosts
          description: |
            Host headers the server will answer to.</br>
            Leave the default <code>*</code> unless you know you need to restrict it.
          schema:
            type: list
            default:
              - "*"
            items:
              - variable: host
                label: Host
                schema:
                  type: string
                  required: true
        - variable: management_enabled
          label: Enable Admin Portal API
          description: |
            Required for the Admin Portal (served under <code>/portal</code>) to work.
          schema:
            type: boolean
            default: true
        - variable: num_proxies
          label: Number of Reverse Proxies
          description: |
            Number of reverse proxies in front of Psono, used to parse
            <code>X-Forwarded-For</code> correctly.</br>
            Leave empty when Psono is reached directly.
          schema:
            type: int
            "null": true
            default: null
            min: 0
        - variable: auth
          label: Authentication
          schema:
            type: dict
            attrs:
              - variable: authentication_methods
                label: Authentication Methods
                description: |
                  LDAP, SAML and OIDC require the Enterprise Edition and are configured
                  from the Admin Portal once enabled here.
                schema:
                  type: list
                  default:
                    - "AUTHKEY"
                  items:
                    - variable: method
                      label: Method
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: "AUTHKEY"
                            description: Username and password
                          - value: "LDAP"
                            description: LDAP (Enterprise Edition)
                          - value: "SAML"
                            description: SAML (Enterprise Edition)
                          - value: "OIDC"
                            description: OIDC (Enterprise Edition)
              - variable: allowed_second_factors
                label: Allowed Second Factors
                schema:
                  type: list
                  default:
                    - "google_authenticator"
                    - "webauthn"
                    - "yubikey_otp"
                    - "duo"
                  items:
                    - variable: second_factor
                      label: Second Factor
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: "google_authenticator"
                            description: TOTP (Google Authenticator)
                          - value: "webauthn"
                            description: WebAuthn / FIDO2
                          - value: "yubikey_otp"
                            description: YubiKey OTP
                          - value: "duo"
                            description: Duo
                          - value: "ivalt"
                            description: iVALT
              - variable: multifactor_enabled
                label: Require All Configured Second Factors
                description: |
                  When enabled, users must pass every second factor they configured,
                  instead of just one of them.
                schema:
                  type: boolean
                  default: false
              - variable: allow_registration
                label: Allow Registration
                schema:
                  type: boolean
                  default: true
              - variable: registration_email_filter
                label: Registration Email Filter
                description: |
                  Restrict registration to these email domains.</br>
                  Leave empty to accept any email domain.
                schema:
                  type: list
                  show_if: [["allow_registration", "=", true]]
                  default: []
                  items:
                    - variable: domain
                      label: Domain
                      schema:
                        type: string
                        required: true
              - variable: allow_lost_password
                label: Allow Password Recovery
                schema:
                  type: boolean
                  default: true
              - variable: allow_custom_server
                label: Allow Custom Server
                description: |
                  Let users point the web client at a different Psono server.
                schema:
                  type: boolean
                  default: false
              - variable: enforce_matching_username_and_email
                label: Enforce Matching Username And Email
                schema:
                  type: boolean
                  default: false
              - variable: allow_user_search_by_email
                label: Allow User Search By Email
                schema:
                  type: boolean
                  default: false
              - variable: allow_user_search_by_username_partial
                label: Allow Partial User Search By Username
                schema:
                  type: boolean
                  default: false
              - variable: disable_last_passwords
                label: Block Reuse Of Last Passwords
                description: |
                  Number of previous passwords that cannot be reused.</br>
                  Set to 0 to disable.
                schema:
                  type: int
                  default: 0
                  min: 0
                  required: true
              - variable: yubikey
                label: YubiKey OTP
                description: |
                  Credentials from <code>https://upgrade.yubico.com/getapikey/</code>.</br>
                  Only used when YubiKey OTP is an allowed second factor.
                schema:
                  type: dict
                  attrs:
                    - variable: client_id
                      label: Client ID
                      schema:
                        type: string
                        default: ""
                    - variable: secret_key
                      label: Secret Key
                      schema:
                        type: string
                        default: ""
                        private: true
                        show_if: [["client_id", "!=", ""]]
                        required: true
              - variable: duo
                label: Duo
                description: |
                  Only used when Duo is an allowed second factor.
                schema:
                  type: dict
                  attrs:
                    - variable: integration_key
                      label: Integration Key
                      schema:
                        type: string
                        default: ""
                    - variable: secret_key
                      label: Secret Key
                      schema:
                        type: string
                        default: ""
                        private: true
                        show_if: [["integration_key", "!=", ""]]
                        required: true
                    - variable: api_hostname
                      label: API Hostname
                      schema:
                        type: string
                        default: ""
                        show_if: [["integration_key", "!=", ""]]
                        required: true
        - variable: smtp
          label: Email
          description: |
            Psono sends account activation, password recovery and share
            notification emails.
          schema:
            type: dict
            attrs:
              - variable: email_from
                label: From Address
                schema:
                  type: string
                  default: ""
              - variable: enabled
                label: Enable SMTP
                description: |
                  When disabled, emails are not delivered and accounts have to be
                  activated manually from the shell.
                schema:
                  type: boolean
                  default: false
              - variable: host
                label: Host
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  default: ""
                  required: true
              - variable: port
                label: Port
                schema:
                  type: int
                  show_if: [["enabled", "=", true]]
                  default: 587
                  min: 1
                  max: 65535
                  required: true
              - variable: encryption
                label: Encryption
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  default: "starttls"
                  required: true
                  enum:
                    - value: "none"
                      description: None
                    - value: "starttls"
                      description: StartTLS
                    - value: "ssltls"
                      description: SSL/TLS
              - variable: username
                label: Username
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  default: ""
              - variable: password
                label: Password
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  default: ""
                  private: true
              - variable: subject_prefix
                label: Subject Prefix
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  default: ""
        - variable: cache
          label: Cache
          schema:
            type: dict
            attrs:
              - variable: type
                label: Cache Type
                description: |
                  Redis speeds up the server and is recommended for more than a
                  handful of users.
                schema:
                  type: string
                  default: "none"
                  required: true
                  enum:
                    - value: "none"
                      description: No cache
                    - value: "redis"
                      description: Redis
              - variable: redis_password
                label: Redis Password
                schema:
                  type: string
                  show_if: [["type", "=", "redis"]]
                  default: ""
                  required: true
                  private: true
              - variable: throttling
                label: Enable Throttling
                description: |
                  Rate limits login attempts and API calls.</br>
                  Only disable this for troubleshooting.
                schema:
                  type: boolean
                  default: true
        - variable: additional_envs
          label: Additional Environment Variables
          description: |
            Any Psono setting can be set here by prefixing it with
            <code>PSONO_</code>, for example <code>PSONO_TIME_SERVER</code>.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30475
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          description: The docker networks to join
          schema:
            type: list
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      description: |
                        The name of the network to join.</br>
                        The network must already exist.
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      description: The containers to add to this network.
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: psono
                                        description: psono
                                      - value: postgres
                                        description: postgres
                                      - value: redis
                                        description: redis
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases (Optional)
                                        description: The network aliases to use for this container on this network.
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string
                                      - variable: interface_name
                                        label: Interface Name (Optional)
                                        description: The network interface name to use for this network
                                        schema:
                                          type: string
                                      - variable: mac_address
                                        label: MAC Address (Optional)
                                        description: The MAC address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv4_address
                                        label: IPv4 Address (Optional)
                                        description: The IPv4 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv6_address
                                        label: IPv6 Address (Optional)
                                        description: The IPv6 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: gw_priority
                                        label: Gateway Priority (Optional)
                                        description: Indicates the priority of the gateway for this network interface.
                                        schema:
                                          type: int
                                          "null": true
                                      - variable: priority
                                        label: Priority (Optional)
                                        description: Indicates in which order Compose connects the service's containers to its networks.
                                        schema:
                                          type: int
                                          "null": true
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: postgres_data
          label: Postgres Data Storage
          description: The path to store Postgres Data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "pg_data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
                    - variable: auto_permissions
                      label: Automatic Permissions
                      description: |
                        Automatically set permissions for the host path.
                        Enabling this, will check the top level directory,</br>
                        If it finds incorrect permissions, it will `chown` the
                        host path to the user and group required for the
                        postgres container.
                      schema:
                        type: boolean
                        default: false
                        show_if: [["acl_enable", "=", false]]
        - variable: additional_storage
          label: Additional Storage
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      description: |
                        ixVolume: Is dataset created automatically by the system.</br>
                        Host Path: Is a path that already exists on the system.</br>
                        SMB Share: Is a SMB share that is mounted to as a volume.</br>
                        NFS Share: Is a NFS share that is mounted to as a volume.
                      schema:
                        type: string
                        required: true
                        default: "ix_volume"
                        enum:
                          - value: "host_path"
                            description: Host Path (Path that already exists on the system)
                          - value: "ix_volume"
                            description: ixVolume (Dataset created automatically by the system)
                          - value: "cifs"
                            description: SMB/CIFS Share (Mounts a volume to a SMB share)
                          - value: "nfs"
                            description: NFS Share (Mounts a volume to a NFS share)
                    - variable: read_only
                      label: Read Only
                      description: Mount the volume as read only.
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      description: The path inside the container to mount the storage.
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                          - variable: path
                            label: Host Path
                            description: The host path to use for storage.
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      description: The configuration for the ixVolume dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - "normalize/ix_volume"
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            description: The name of the dataset to use for storage.
                            schema:
                              type: string
                              required: true
                              default: "storage_entry"
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                    - variable: cifs_config
                      label: SMB Configuration
                      description: The configuration for the SMB dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "cifs"]]
                        attrs:
                          - variable: server
                            label: Server
                            description: The server to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: path
                            label: Path
                            description: The path to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: username
                            label: Username
                            description: The username to use for the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: password
                            label: Password
                            description: The password to use for the SMB share.
                            schema:
                              type: string
                              required: true
                              private: true
                          - variable: domain
                            label: Domain
                            description: The domain to use for the SMB share.
                            schema:
                              type: string
                    - variable: nfs_config
                      label: NFS Configuration
                      description: The configuration for the NFS dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "nfs"]]
                        attrs:
                          - variable: server
                            label: Server
                            description: The server to mount the NFS share.
                            schema:
                              type: string
                              required: true
                          - variable: path
                            label: Path
                            description: The path to mount the NFS share.
                            schema:
                              type: string
                              required: true
  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: psono
                            description: psono
                          - value: postgres
                            description: postgres
                          - value: redis
                            description: redis
  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for Psono.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for Psono.
                schema:
                  type: int
                  default: 4096
                  required: true
