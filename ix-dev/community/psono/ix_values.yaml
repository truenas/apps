images:
  image:
    repository: psono/psono-combo-enterprise
    tag: 7.3.6-4.8.0-1.9.0
  ce_image:
    repository: psono/psono-combo
    tag: 7.3.6-4.8.0-1.9.0
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2
  redis_image:
    repository: valkey/valkey
    tag: 9.1.1
  postgres_17_image:
    repository: postgres
    tag: 17.11-bookworm
  postgres_18_image:
    repository: postgres
    tag: 18.6-trixie
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: 1.2.15

consts:
  psono_container_name: psono
  postgres_container_name: postgres
  redis_container_name: redis
  perms_container_name: permissions
  db_user: psono
  db_name: psono
  # nginx inside the combo image defaults to port 80. We move it to an
  # unprivileged port so the container does not need NET_BIND_SERVICE.
  internal_web_port: 8080
  notes_body: |
    ## Getting started

    1. Open the Web UI and register the first account. The username must end with
       one of the domains configured in [Allowed Domains].
    2. Activation is sent by email. Without a working SMTP configuration, activate
       the account from the TrueNAS shell instead:

       ```
       docker exec ix-<app-name>-psono-1 \
         python3 /root/psono/manage.py verifyuseremail <username>
       ```

    3. Give that account access to the Admin Portal (available under `/portal`):

       ```
       docker exec ix-<app-name>-psono-1 \
         python3 /root/psono/manage.py promoteuser <username> superuser
       ```

    LDAP, SAML and OIDC providers are configured from the Admin Portal, after
    enabling the matching entries in [Authentication Methods].

    ## Important

    The [Base URL] must be the exact URL used to reach Psono from a browser.
    The web client is built with it, so changing how you reach the app (IP,
    port, reverse proxy hostname) requires updating [Base URL] as well.

    The six [Server Keys] must be kept safe. They cannot be changed after the
    first user has registered without losing access to all stored data.
