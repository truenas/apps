{% set tpl = ix_lib.base.render.Render(values) %}

{# The web client is a static bundle, it needs the exact public URL baked into its config #}
{% set base_url = values.psono.base_url.rstrip("/") %}
{% set host_url = "%s/server"|format(base_url) %}

{% set psono_net = tpl.networks.create_internal("psono-net") %}

{% set c1 = tpl.add_container(values.consts.psono_container_name, values.psono.image_selector) %}
{% do c1.add_network(psono_net) %}
{# nginx runs its master as root and drops its workers to the [nginx] user #}
{% do c1.add_caps(["CHOWN", "SETGID", "SETUID"]) %}

{# The combo image runs as root, only the postgres/redis volumes need a perms check #}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.psono.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(
  values.consts.postgres_container_name,
  values.psono.postgres_image_selector,
  pg_config, perm_container
) %}
{% do postgres.container.add_network(psono_net) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{# /server/healthcheck/ is deliberately not used, it performs an outbound NTP
   request and is throttled to 61 requests per hour. /server/info/ still proves
   that daphne is serving the API behind nginx. #}
{% do c1.healthcheck.set_test("curl", {
  "port": values.consts.internal_web_port,
  "path": "/server/info/",
}) %}

{# ---------- Server keys ---------- #}
{% do c1.environment.add_env("PSONO_SECRET_KEY", values.psono.server_keys.secret_key) %}
{% do c1.environment.add_env("PSONO_ACTIVATION_LINK_SECRET", values.psono.server_keys.activation_link_secret) %}
{% do c1.environment.add_env("PSONO_DB_SECRET", values.psono.server_keys.db_secret) %}
{% do c1.environment.add_env("PSONO_EMAIL_SECRET_SALT", values.psono.server_keys.email_secret_salt) %}
{% do c1.environment.add_env("PSONO_PRIVATE_KEY", values.psono.server_keys.private_key) %}
{% do c1.environment.add_env("PSONO_PUBLIC_KEY", values.psono.server_keys.public_key) %}

{# ---------- Core ---------- #}
{% do c1.environment.add_env("NGINX_IPV4_LISTEN_PORT", values.consts.internal_web_port) %}
{% do c1.environment.add_env("PSONO_DATABASE_URL", postgres.get_url("postgres")) %}
{% do c1.environment.add_env("PSONO_HOST_URL", host_url) %}
{% do c1.environment.add_env("PSONO_WEB_CLIENT_URL", base_url) %}
{% do c1.environment.add_env("PSONO_SERVICE_NAME", values.psono.service_name) %}
{% do c1.environment.add_env("PSONO_DEBUG", false) %}
{% do c1.environment.add_env("PSONO_MANAGEMENT_ENABLED", values.psono.management_enabled) %}
{% do c1.environment.add_env("PSONO_ALLOWED_HOSTS", values.psono.allowed_hosts | join(",") or "*") %}
{% if values.psono.allowed_domains %}
  {% do c1.environment.add_env("PSONO_ALLOWED_DOMAINS", values.psono.allowed_domains | join(",")) %}
{% endif %}
{% if values.psono.num_proxies is not none %}
  {% do c1.environment.add_env("PSONO_NUM_PROXIES", values.psono.num_proxies) %}
{% endif %}

{# ---------- Authentication ---------- #}
{% set auth = values.psono.auth %}
{% if not auth.authentication_methods %}
  {% do tpl.funcs.fail("Expected [Authentication Methods] to have at least one entry") %}
{% endif %}
{% do c1.environment.add_env("PSONO_AUTHENTICATION_METHODS", auth.authentication_methods | join(",")) %}
{% do c1.environment.add_env("PSONO_ALLOWED_SECOND_FACTORS", auth.allowed_second_factors | join(",")) %}
{% do c1.environment.add_env("PSONO_MULTIFACTOR_ENABLED", auth.multifactor_enabled) %}
{% do c1.environment.add_env("PSONO_ALLOW_REGISTRATION", auth.allow_registration) %}
{% do c1.environment.add_env("PSONO_ALLOW_LOST_PASSWORD", auth.allow_lost_password) %}
{% if auth.registration_email_filter %}
  {% do c1.environment.add_env("PSONO_REGISTRATION_EMAIL_FILTER", auth.registration_email_filter | join(",")) %}
{% endif %}
{% do c1.environment.add_env("PSONO_ENFORCE_MATCHING_USERNAME_AND_EMAIL", auth.enforce_matching_username_and_email) %}
{% do c1.environment.add_env("PSONO_ALLOW_USER_SEARCH_BY_EMAIL", auth.allow_user_search_by_email) %}
{% do c1.environment.add_env("PSONO_ALLOW_USER_SEARCH_BY_USERNAME_PARTIAL", auth.allow_user_search_by_username_partial) %}
{% do c1.environment.add_env("PSONO_DISABLE_LAST_PASSWORDS", auth.disable_last_passwords) %}

{% if "yubikey_otp" in auth.allowed_second_factors and auth.yubikey.client_id %}
  {% do c1.environment.add_env("PSONO_YUBIKEY_CLIENT_ID", auth.yubikey.client_id) %}
  {% do c1.environment.add_env("PSONO_YUBIKEY_SECRET_KEY", auth.yubikey.secret_key) %}
{% endif %}

{% if "duo" in auth.allowed_second_factors and auth.duo.integration_key %}
  {% do c1.environment.add_env("PSONO_DUO_INTEGRATION_KEY", auth.duo.integration_key) %}
  {% do c1.environment.add_env("PSONO_DUO_SECRET_KEY", auth.duo.secret_key) %}
  {% do c1.environment.add_env("PSONO_DUO_API_HOSTNAME", auth.duo.api_hostname) %}
{% endif %}

{# ---------- Email ---------- #}
{% set smtp = values.psono.smtp %}
{% do c1.environment.add_env("PSONO_EMAIL_FROM", smtp.email_from) %}
{% if smtp.enabled %}
  {% do c1.environment.add_env("PSONO_EMAIL_HOST", smtp.host) %}
  {% do c1.environment.add_env("PSONO_EMAIL_PORT", smtp.port) %}
  {% do c1.environment.add_env("PSONO_EMAIL_USE_TLS", smtp.encryption == "starttls") %}
  {% do c1.environment.add_env("PSONO_EMAIL_USE_SSL", smtp.encryption == "ssltls") %}
  {% do c1.environment.add_env("PSONO_EMAIL_SUBJECT_PREFIX", smtp.subject_prefix) %}
  {% if smtp.username %}
    {% do c1.environment.add_env("PSONO_EMAIL_HOST_USER", smtp.username) %}
    {% do c1.environment.add_env("PSONO_EMAIL_HOST_PASSWORD", smtp.password) %}
  {% endif %}
{% endif %}

{# ---------- Cache and throttling ---------- #}
{% do c1.environment.add_env("PSONO_THROTTLING", values.psono.cache.throttling) %}
{% if values.psono.cache.type == "redis" %}
  {% set redis_config = {
    "password": values.psono.cache.redis_password,
    "volume": tpl.funcs.temp_config("redis_data"),
  } %}
  {% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
  {% do redis.container.add_network(psono_net) %}
  {% do c1.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
  {% do c1.environment.add_env("PSONO_CACHE_ENABLE", true) %}
  {% do c1.environment.add_env("PSONO_CACHE_REDIS", true) %}
  {% do c1.environment.add_env("PSONO_CACHE_REDIS_LOCATION", "%s/0"|format(redis.get_url("redis"))) %}
{% endif %}

{# ---------- Web client and admin portal ---------- #}
{% set client_config = {
  "backend_servers": [{"title": values.psono.service_name, "url": host_url}],
  "base_url": "%s/"|format(base_url),
  "allow_custom_server": auth.allow_custom_server,
  "allow_registration": auth.allow_registration,
  "allow_lost_password": auth.allow_lost_password,
  "disable_download_bar": false,
  "remember_me_default": false,
  "trust_device_default": false,
  "authentication_methods": auth.authentication_methods,
  "saml_provider": [],
  "oidc_provider": [],
} %}
{% do c1.environment.add_env("PSONO_WEBCLIENT_CONFIG_JSON", client_config | tojson) %}

{% set portal_config = {
  "backend_servers": [{"title": values.psono.service_name, "url": host_url}],
  "base_url": "%s/"|format(base_url),
  "allow_custom_server": false,
  "authentication_methods": auth.authentication_methods,
  "saml_provider": [],
  "oidc_provider": [],
} %}
{% do c1.environment.add_env("PSONO_PORTAL_CONFIG_JSON", portal_config | tojson) %}

{% do c1.environment.add_user_envs(values.psono.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.portals.add(values.network.web_port, {"name": "Admin Portal", "path": "/portal/"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
