{% set tpl = ix_lib.base.render.Render(values) %}

{% set moviepilot_net = tpl.networks.create_internal("moviepilot-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.moviepilot.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, "postgres_image", pg_config, perm_container) %}
{% do postgres.container.add_network(moviepilot_net) %}

{% set redis_config = {
  "password": values.moviepilot.redis_password,
  "volume": {"type": "temporary", "volume_config": {"volume_name": "redis-data"}},
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(moviepilot_net) %}

{% do c1.add_docker_socket(read_only=true) %}

{% set moviepilot_container = tpl.add_container(values.consts.moviepilot_container_name, "image") %}
{% do moviepilot_container.add_network(moviepilot_net) %}
{% do moviepilot_container.set_user(0, 0) %}
{% do moviepilot_container.add_caps(["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE", "FOWNER"]) %}
{% do moviepilot_container.healthcheck.set_test("curl", {"port": values.network.web_port.port_number}) %}

{% do moviepilot_container.add_port(values.network.web_port) %}
{% do moviepilot_container.add_port(values.network.api_port) %}

{% do moviepilot_container.environment.add_env("NGINX_PORT", values.network.web_port.port_number) %}
{% do moviepilot_container.environment.add_env("PORT", values.network.api_port.port_number) %}
{% do moviepilot_container.environment.add_env("SUPERUSER", values.moviepilot.superuser) %}
{% do moviepilot_container.environment.add_env("SUPERUSER_PASSWORD", values.moviepilot.superuser_password) %}
{% do moviepilot_container.environment.add_env("DB_TYPE", "postgresql") %}
{% do moviepilot_container.environment.add_env("DB_POSTGRESQL_HOST", values.consts.postgres_container_name) %}
{% do moviepilot_container.environment.add_env("DB_POSTGRESQL_PORT", 5432) %}
{% do moviepilot_container.environment.add_env("DB_POSTGRESQL_DATABASE", values.consts.db_name) %}
{% do moviepilot_container.environment.add_env("DB_POSTGRESQL_USERNAME", values.consts.db_user) %}
{% do moviepilot_container.environment.add_env("DB_POSTGRESQL_PASSWORD", values.moviepilot.db_password) %}
{% do moviepilot_container.environment.add_env("CACHE_BACKEND_TYPE", "redis") %}
{% do moviepilot_container.environment.add_env("CACHE_BACKEND_URL", redis.get_url("redis")) %}

{% do moviepilot_container.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% do moviepilot_container.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do moviepilot_container.add_storage(values.consts.media_path, values.storage.media) %}
{% do perm_container.add_or_skip_action("media", values.storage.media, perms_config) %}

{% do moviepilot_container.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do moviepilot_container.add_storage(values.consts.core_path, values.storage.core_browser) %}
{% do perm_container.add_or_skip_action("core_browser", values.storage.core_browser, perms_config) %}

{% do moviepilot_container.add_storage(values.consts.torrents_path, values.storage.torrents) %}
{% do perm_container.add_or_skip_action("torrents", values.storage.torrents, perms_config) %}

{% do moviepilot_container.add_storage(values.consts.bt_backup_path, values.storage.bt_backup) %}
{% do perm_container.add_or_skip_action("bt_backup", values.storage.bt_backup, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do moviepilot_container.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do moviepilot_container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}