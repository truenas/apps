resources:
  limits:
    cpus: 2
    memory: 4096
run_as:
  user: 568
  group: 568
moviepilot:
  db_password: pg-moviepilot-password
  redis_password: redis-moviepilot-password
  superuser: admin
  superuser_password: my-secret-password
network:
  web_port:
    bind_mode: published
    port_number: 3000
  api_port:
    bind_mode: published
    port_number: 3001
storage:
  media:
    type: ix_volume
    ix_volume_config:
      dataset_name: media
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
  core_browser:
    type: ix_volume
    ix_volume_config:
      dataset_name: core_browser
  torrents:
    type: ix_volume
    ix_volume_config:
      dataset_name: torrents
  bt_backup:
    type: ix_volume
    ix_volume_config:
      dataset_name: bt_backup
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
labels: []
TZ: Asia/Shanghai