resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Asia/Shanghai

moviepilot:
  superuser: admin
  superuser_password: my-secret-password
  db_password: pg-moviepilot-password
  redis_password: redis-moviepilot-password
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 3000
  api_port:
    bind_mode: published
    port_number: 3001
  networks: []

run_as:
  user: 0
  group: 0

ix_volumes:
  media: /opt/tests/mnt/media
  config: /opt/tests/mnt/config
  core_browser: /opt/tests/mnt/core_browser
  postgres_data: /opt/tests/mnt/postgres_data
  redis_data: /opt/tests/mnt/redis_data
  tr_torrents: /opt/tests/mnt/tr_torrents
  qb_backup: /opt/tests/mnt/qb_backup

storage:
  media:
    type: ix_volume
    ix_volume_config:
      dataset_name: media
      create_host_path: true
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  core_browser:
    type: ix_volume
    ix_volume_config:
      dataset_name: core_browser
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  redis_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: redis_data
      create_host_path: true
  tr_torrents:
    type: ix_volume
    ix_volume_config:
      dataset_name: tr_torrents
      create_host_path: true
  qb_backup:
    type: ix_volume
    ix_volume_config:
      dataset_name: qb_backup
      create_host_path: true

labels: []