resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Etc/UTC
poznote:
  enable_mcp: true
  mcp_debug: false
  oidc_client_id: ""
  oidc_client_secret: ""
  oidc_disable_normal_login: false
  settings_password: ""
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080
  mcp_port:
    bind_mode: published
    port_number: 8045
  networks: []

ix_volumes:
  data: /opt/tests/mnt/poznote/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
