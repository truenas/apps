resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Etc/UTC
poznote:
  enable_mcp: false
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 38080
  mcp_port:
    bind_mode: ""
    port_number: 38045
  networks: []

ix_volumes:
  data: /opt/tests/mnt/poznote/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
