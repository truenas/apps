resources:
  limits:
    cpus: 2.0
    memory: 4096

speedketchup:
  interval: 10
  server: ""
  additional_envs:
    # keep ci from downloading and uploading for 10 seconds each
    - name: SPEEDKETCHUP_DOWNLOAD_DURATION
      value: "0"
    - name: SPEEDKETCHUP_UPLOAD_DURATION
      value: "0"

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080
  host_network: false

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
