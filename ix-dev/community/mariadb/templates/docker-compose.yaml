{% set tpl = ix_lib.base.render.Render(values) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{% set mariadb_config = {
  "user": values.mariadb.user,
  "password": values.mariadb.password,
  "root_password": values.mariadb.root_password,
  "database": values.mariadb.database,
  "port": values.network.tcp_port.port_number,
  "auto_upgrade": values.mariadb.auto_upgrade,
  "volume": values.storage.data,
} %}

{% set mariadb = tpl.deps.mariadb(values.consts.mariadb_container_name, values.mariadb.image_selector, mariadb_config, perm_container) %}

{% do mariadb.container.add_port(values.network.tcp_port) %}
{% do mariadb.container.environment.add_user_envs(values.mariadb.additional_envs) %}

{% for store in values.storage.additional_storage %}
  {% do mariadb.container.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do mariadb.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{{ tpl.render() | tojson }}
