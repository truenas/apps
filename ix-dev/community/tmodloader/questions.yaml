groups:
  - name: Network Configuration
    description: |
      Publish: Choose this for direct access using the TrueNAS IP address and port, such as opening the WebUI from your browser or connecting a game client.

      Expose: Choose this when another container, such as a reverse proxy, connects over a shared Docker network. This does not publish a port on the TrueNAS host or connect separate app networks automatically.

      For the WebUI, both Publish and Expose enable dashboard-managed game settings. Choosing None disables the WebUI and reveals required game configuration fields in this form. Review and set these fields before installing, since the WebUI will not be available.

      Publishing a port does not configure router port forwarding.
  - name: Storage Configuration
    description: |
      Data storage (/data) contains worlds, mods, mod configuration, downloaded server runtimes, dashboard settings, and logs.

      Backups storage (/backups) contains backup archives created by the container. Use dedicated datasets for both mounts.
  - name: tModLoader Configuration
    description: |
      Configure tModLoader game settings and additional environment variables.
      See the environment variables and defaults reference:
      https://github.com/Crosis47/tmodloader/wiki/Configuration#defaults-reference
  - name: Labels Configuration
    description: Configure Labels for tModLoader
  - name: Resources Configuration
    description: Configure Resources for tModLoader

questions:
  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          description: |
            Set Port Bind Mode to None to disable the WebUI and manage game settings through environment variables.</br>
            On first launch, open the WebUI and enter the one-time setup code from application logs.</br>
            HTTP access requires a private-network or loopback client; use an HTTPS reverse proxy for other clients.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish - WebUI via TrueNAS IP and port (direct browser access)
                    - value: "exposed"
                      description: Expose - WebUI via shared Docker network (container reverse proxy)
                    - value: ""
                      description: None - disable WebUI and configure game settings in this form
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30506
                  show_if: [["bind_mode", "!=", ""]]
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
              - variable: origin
                label: WebUI Origin (Optional)
                description: |
                  Leave empty when accessing the WebUI by IP address. For a hostname or reverse proxy,
                  enter the browser-facing origin, including http:// or https:// and any non-default port
                  (for example, https://terraria.example.com). Do not include a path, query, or credentials.
                  This does not change the listening port or enable HTTPS.
                schema:
                  type: string
                  default: ""
                  show_if: [["bind_mode", "!=", ""]]
              - variable: trusted_proxy
                label: Trusted Proxy (IP Address or Service Name)
                description: |
                  Optional. Leave empty for direct access without a reverse proxy.
                  Enter the proxy's IPv4/IPv6 address as seen by this container, or its service name/network alias
                  on a shared Docker network (for example, reverse-proxy). Do not enter your browser's IP,
                  a URL, port, subnet, wildcard, or list of addresses.
                  For service names, join the proxy's network using Networks below and use a name you control.
                  Only connections from the configured IP or currently resolved addresses may supply forwarded headers;
                  failed DNS lookups do not grant trust. The proxy must overwrite X-Forwarded-For with one client IP
                  and X-Forwarded-Proto with http or https, and preserve the browser Host header.
                schema:
                  type: string
                  default: ""
                  show_if: [["bind_mode", "!=", ""]]
              - variable: game_settings
                label: Game Settings (WebUI Disabled)
                description: These settings are used only when the WebUI is disabled.
                schema:
                  type: dict
                  show_if: [["bind_mode", "=", ""]]
                  attrs:
                    - variable: world_name
                      label: World Name
                      description: Selects an existing world by name or creates it if it does not exist.
                      schema:
                        type: string
                        default: Docker
                        required: true
                    - variable: world_size
                      label: World Size
                      description: Only applies to newly generated worlds.
                      schema:
                        type: string
                        default: "1"
                        required: true
                        enum:
                          - value: "1"
                            description: Small
                          - value: "2"
                            description: Medium
                          - value: "3"
                            description: Large
                    - variable: world_difficulty
                      label: World Difficulty
                      description: Only applies to newly generated worlds.
                      schema:
                        type: string
                        default: "0"
                        required: true
                        enum:
                          - value: "0"
                            description: Classic
                          - value: "1"
                            description: Expert
                          - value: "2"
                            description: Master
                          - value: "3"
                            description: Journey
                    - variable: max_players
                      label: Maximum Players
                      schema:
                        type: int
                        default: 8
                        min: 1
                        max: 255
                        required: true
                    - variable: password
                      label: Game Password
                      description: Empty disables the game password.
                      schema:
                        type: string
                        private: true
                        default: ""
                    - variable: mods
                      label: Workshop Mods
                      description: |
                        Comma-separated Steam Workshop mod IDs. Prefix collection IDs with collection:.</br>
                        Leave empty for no Workshop mods.
                      schema:
                        type: string
                        default: ""
                    - variable: log_level
                      label: Console Log Level
                      description: Controls console output verbosity. Complete raw output is retained in the persistent console log.
                      schema:
                        type: string
                        default: normal
                        required: true
                        enum:
                          - value: quiet
                            description: Quiet
                          - value: normal
                            description: Normal
                          - value: debug
                            description: Debug
                    - variable: journey
                      label: Journey Permissions
                      description: Controls who can use each power in Journey worlds. These permissions do not convert existing worlds to Journey.
                      schema:
                        type: dict
                        show_if: [["world_difficulty", "=", "3"]]
                        attrs:
                          - variable: setfrozen
                            label: Freeze Time
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: setdawn
                            label: Set Time to Dawn
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: setnoon
                            label: Set Time to Noon
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: setdusk
                            label: Set Time to Dusk
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: setmidnight
                            label: Set Time to Midnight
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: godmode
                            label: God Mode
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: wind_strength
                            label: Wind Strength
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: rain_strength
                            label: Rain Strength
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: time_speed
                            label: Time Speed
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: rain_frozen
                            label: Freeze Rain
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: wind_frozen
                            label: Freeze Wind
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: placement_range
                            label: Extended Placement Range
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: set_difficulty
                            label: Adjust Difficulty
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: biome_spread
                            label: Biome Spread
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone
                          - variable: spawn_rate
                            label: Enemy Spawn Rate
                            schema:
                              type: string
                              default: "0"
                              required: true
                              enum:
                                - value: "0"
                                  description: Locked
                                - value: "1"
                                  description: Host Only
                                - value: "2"
                                  description: Everyone

        - variable: server_port
          label: Game Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30505
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

        - variable: networks
          label: Networks
          description: Join existing Docker networks, for example a shared network with a reverse proxy when the WebUI port uses Expose.
          schema:
            type: list
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      description: |
                        The name of the network to join.</br>
                        The network must already exist.
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      description: The containers to add to this network.
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: tmodloader
                                        description: tmodloader
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases (Optional)
                                        description: The network aliases to use for this container on this network.
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string
                                      - variable: interface_name
                                        label: Interface Name (Optional)
                                        description: The network interface name to use for this network
                                        schema:
                                          type: string
                                      - variable: mac_address
                                        label: MAC Address (Optional)
                                        description: The MAC address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv4_address
                                        label: IPv4 Address (Optional)
                                        description: The IPv4 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv6_address
                                        label: IPv6 Address (Optional)
                                        description: The IPv6 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: gw_priority
                                        label: Gateway Priority (Optional)
                                        description: Indicates the priority of the gateway for this network interface.
                                        schema:
                                          type: int
                                          "null": true
                                      - variable: priority
                                        label: Priority (Optional)
                                        description: Indicates in which order Compose connects the service's containers to its networks.
                                        schema:
                                          type: int
                                          "null": true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: tModLoader Data Storage
          description: Stores worlds, mods, mod configuration, downloaded server runtimes, dashboard settings, and logs at /data. Use a dedicated dataset.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: backups
          label: tModLoader Backups Storage
          description: Stores backup archives created by the container at /backups. Use a dedicated dataset.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "backups"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

  - variable: tmodloader
    label: ""
    group: tModLoader Configuration
    schema:
      type: dict
      attrs:
        - variable: additional_envs
          label: Additional Environment Variables
          description: |
            Use these for deployment settings. With the WebUI enabled, manage game settings in the WebUI.</br>
            With the WebUI port disabled, game settings are managed through environment variables.</br>
            See https://github.com/Crosis47/tmodloader/wiki/Configuration#defaults-reference for supported variables.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: tmodloader
                            description: tmodloader

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for tModLoader.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for tModLoader.
                schema:
                  type: int
                  default: 4096
                  required: true
