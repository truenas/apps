groups:
  - name: tModLoader Configuration
    description: Configure tModLoader
  - name: Network Configuration
    description: Configure Network for tModLoader
  - name: Storage Configuration
    description: Configure Storage for tModLoader
  - name: Labels Configuration
    description: Configure Labels for tModLoader
  - name: Resources Configuration
    description: Configure Resources for tModLoader

questions:
  - variable: tmodloader
    label: ''
    group: tModLoader Configuration
    schema:
      type: dict
      attrs:
        - variable: web_enabled
          label: Enable WebUI
          description: |
            On first launch, open the WebUI and enter the one-time setup code from application logs.</br>
            The app remains Deploying until setup is complete and the game server starts.</br>
            HTTP access requires a private-network or loopback client; use an HTTPS reverse proxy for other clients.
          schema:
            type: boolean
            default: true
        - variable: config_source
          label: Settings Management
          description: |
            WebUI mode uses environment values for initial settings; saved WebUI settings take precedence.</br>
            Environment mode manages settings through this form and Additional Environment Variables.
          schema:
            type: string
            default: web
            required: true
            show_if: [[web_enabled, '=', true]]
            enum:
              - value: web
                description: WebUI
              - value: env
                description: Environment
        - variable: password
          label: Initial Game Password
          description: Separate from the admin token. Empty disables the game password. In WebUI mode, a saved game
            password overrides this value.
          schema:
            type: string
            default: ''
            private: true
        - variable: additional_envs
          label: Additional Environment Variables
          description: Additional environment variables for tModLoader. See the container documentation for supported
            variables.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: network
    label: ''
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: server_port
          label: Game Port
          description: Host port; the container port is fixed at 7777.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host for external access
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ''
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30505
                  required: true
                  max: 65535
                  min: 1
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  default: []
                  show_if: [[bind_mode, '=', published]]
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: web_port
          label: WebUI Port
          description: Host port; the container port is fixed at 8080. Only used when WebUI is enabled.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host for external access
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ''
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30504
                  required: true
                  max: 65535
                  min: 1
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  default: []
                  show_if: [[bind_mode, '=', published]]
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ''
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: tModLoader Data Storage
          description: Use a dedicated dataset. Startup repairs ownership to UID/GID 1000. Existing files in this
            directory may change ownership. Allow traversal and read/write access for UID/GID 1000; restrictive
            ACLs may prevent startup.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [[type, '=', ix_volume]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        default: data
                        required: true
                        hidden: true
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', host_path]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        $ref:
                          - normalize/acl
                        attrs: []
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        required: true
                        show_if: [[acl_enable, '=', false]]
        - variable: backups
          label: tModLoader Backups Storage
          description: Use a dedicated dataset. Startup repairs ownership to UID/GID 1000. Existing files in this
            directory may change ownership. Allow traversal and read/write access for UID/GID 1000; restrictive
            ACLs may prevent startup.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [[type, '=', ix_volume]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        default: backups
                        required: true
                        hidden: true
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', host_path]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        $ref:
                          - normalize/acl
                        attrs: []
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        required: true
                        show_if: [[acl_enable, '=', false]]

  - variable: labels
    label: ''
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: tmodloader
                            description: tmodloader

  - variable: resources
    label: ''
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for tModLoader.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for tModLoader.
                schema:
                  type: int
                  default: 4096
                  required: true
