resources:
  limits:
    cpus: 2
    memory: 4096
tmodloader:
  web_enabled: false
  config_source: env
  password: ''
  additional_envs:
  - name: TMOD_WORLDNAME
    value: TrueNASTest
  - name: TMOD_WORLDSIZE
    value: '1'
  - name: TMOD_AUTO_UPDATE
    value: '0'
network:
  server_port:
    bind_mode: published
    port_number: 31077
  web_port:
    bind_mode: published
    port_number: 31080
storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
ix_volumes:
  data: /opt/tests/mnt/tmodloader/data
  backups: /opt/tests/mnt/tmodloader/backups
