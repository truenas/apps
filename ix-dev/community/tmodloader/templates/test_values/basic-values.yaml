resources:
  limits:
    cpus: 2
    memory: 4096

tmodloader:
  additional_envs: []

network:
  server_port:
    bind_mode: published
    port_number: 8080

server_management: published
web_port:
  host_ips: []
  port_number: 8081

ix_volumes:
  data: /opt/tests/mnt/tmodloader/data
  backups: /opt/tests/mnt/tmodloader/backups

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
