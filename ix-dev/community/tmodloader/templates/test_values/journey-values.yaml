resources:
  limits:
    cpus: 2
    memory: 4096

tmodloader:
  additional_envs:
    - name: TMOD_AUTO_UPDATE
      value: "0"

network:
  server_port:
    bind_mode: published
    port_number: 8080
  web_port:
    bind_mode: ""
    port_number: 8081
    game_settings:
      world_name: TrueNASTest
      world_size: "1"
      world_difficulty: "3"
      max_players: 8
      password: ""
      mods: ""
      log_level: debug
      journey:
        setfrozen: "0"
        setdawn: "1"
        setnoon: "2"
        setdusk: "0"
        setmidnight: "1"
        godmode: "2"
        wind_strength: "0"
        rain_strength: "1"
        time_speed: "2"
        rain_frozen: "0"
        wind_frozen: "1"
        placement_range: "2"
        set_difficulty: "0"
        biome_spread: "1"
        spawn_rate: "2"

ix_volumes:
  data: /opt/tests/mnt/tmodloader/data
  backups: /opt/tests/mnt/tmodloader/backups

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
