resources:
  limits:
    cpus: 2
    memory: 4096

tmodloader:
  additional_envs:
    - name: TMOD_AUTO_UPDATE
      value: "0"

network:
  server_port:
    bind_mode: published
    port_number: 8080
  web_port:
    bind_mode: ""
    port_number: 8081
    game_settings:
      world_name: TrueNASTest
      world_size: "1"
      world_difficulty: "0"
      max_players: 8
      password: ""
      mods: ""
      log_level: normal

ix_volumes:
  data: /opt/tests/mnt/tmodloader/data
  backups: /opt/tests/mnt/tmodloader/backups

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
