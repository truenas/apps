TZ: Etc/UTC

enclosure:
  # CI has no SAS shelf attached, so no device is passed through. The app starts
  # and serves the UI with nothing to manage, which is what this scenario checks.
  devices: []
  allowlist: ""
  auth_required: true
  allow_anonymous_ident: false
  additional_envs: []

truenas:
  url: ""
  api_key: ""
  verify_tls: true

network:
  web_port:
    bind_mode: published
    port_number: 30842
    host_ips: []

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []

resources:
  limits:
    cpus: 2
    memory: 4096
