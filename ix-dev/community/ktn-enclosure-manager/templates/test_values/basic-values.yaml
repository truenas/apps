resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Etc/UTC

ktn:
  devices: []
  allowlist: []
  auth_required: true
  allow_anonymous_ident: false
  truenas_port: 443
  truenas_api_key: test-api-key
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 30842
    host_ips: []

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
