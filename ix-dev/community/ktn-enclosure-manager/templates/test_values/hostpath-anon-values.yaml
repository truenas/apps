TZ: Etc/UTC

enclosure:
  devices: []
  allowlist: ""
  # Open read-only dashboard, but the Identify LED write stays gated.
  auth_required: false
  allow_anonymous_ident: false
  additional_envs: []

truenas:
  url: ""
  api_key: ""
  verify_tls: false

network:
  web_port:
    bind_mode: published
    port_number: 30843
    host_ips: []

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/ktn-data
      acl_enable: false
      auto_permissions: true
      create_host_path: true
  additional_storage: []

resources:
  limits:
    cpus: 2
    memory: 4096
