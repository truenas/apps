{% set tpl = ix_lib.base.render.Render(values) %}

{% set c = tpl.add_container(values.consts.app_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.app_user_id, "gid": values.consts.app_group_id, "mode": "check"} %}

{# The container starts as root so the IDENT helper can bind its socket and open
   the enclosure; the entrypoint drops the web process to uid 1000 with setpriv. #}
{% do c.set_user(0, 0) %}
{% do c.restart.set_policy("unless-stopped") %}
{% do c.healthcheck.set_test("tcp", {"port": values.consts.internal_port}) %}

{# Only the two capabilities the setpriv drop needs; the library drops the rest. #}
{% do c.add_caps(["SETUID", "SETGID"]) %}

{# Telemetry reads work on a read-only open; the 'w' exists solely for the one
   SES SEND DIAGNOSTIC that lights a bay LED. #}
{% for device in values.enclosure.devices %}
  {% do c.devices.add_device(device.host_device, device.container_device, "rw") %}
{% endfor %}

{% do c.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{# The library validates tmpfs mode against ^0[0-7]{3}$. The helper binds its
   socket with egid 1000, so no setgid bit on the directory is needed. #}
{% do c.add_storage("/run/ktn", {"type": "tmpfs", "tmpfs_config": {"mode": "0770", "uid": 0, "gid": values.consts.app_group_id}}) %}

{% do c.environment.add_env("KTN_DATA_DIR", "/data") %}
{% do c.environment.add_env("KTN_PORT", values.consts.internal_port) %}
{% do c.environment.add_env("KTN_SYSFS_ROOT", "/sys") %}
{% do c.environment.add_env("KTN_IDENT_HELPER_SOCKET", values.consts.ident_socket) %}
{% do c.environment.add_env("KTN_ENCLOSURE_ALLOWLIST", values.enclosure.allowlist) %}
{% do c.environment.add_env("KTN_AUTH_REQUIRED", values.enclosure.auth_required) %}
{% do c.environment.add_env("KTN_ALLOW_ANONYMOUS_IDENT", values.enclosure.allow_anonymous_ident) %}
{% do c.environment.add_env("KTN_TRUENAS_URL", values.truenas.url) %}
{% do c.environment.add_env("KTN_TRUENAS_API_KEY", values.truenas.api_key) %}
{% do c.environment.add_env("KTN_TRUENAS_VERIFY_TLS", values.truenas.verify_tls) %}
{% do c.environment.add_user_envs(values.enclosure.additional_envs) %}

{% if values.network.web_port.bind_mode %}
  {% do c.add_port(values.network.web_port, {"container_port": values.consts.internal_port}) %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"name": "Web UI"}) %}

{% if values.enclosure.auth_required %}
  {% do tpl.notes.add_warning("There is no default password. Open the Web UI and create the administrator on first run.") %}
{% endif %}
{% if not values.enclosure.devices %}
  {% do tpl.notes.add_warning("No enclosure device was configured. Add one under Devices, or the app will start with nothing to manage.") %}
{% endif %}

{{ tpl.render() | tojson }}
