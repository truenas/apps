groups:
  - name: KTN Enclosure Manager Configuration
    description: Configure KTN Enclosure Manager
  - name: TrueNAS Integration Configuration
    description: Configure TrueNAS Integration for KTN Enclosure Manager
  - name: Network Configuration
    description: Configure Network for KTN Enclosure Manager
  - name: Storage Configuration
    description: Configure Storage for KTN Enclosure Manager
  - name: Labels Configuration
    description: Configure Labels for KTN Enclosure Manager
  - name: Resources Configuration
    description: Configure Resources for KTN Enclosure Manager

questions:
  - variable: TZ
    group: KTN Enclosure Manager Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: enclosure
    label: ""
    group: KTN Enclosure Manager Configuration
    schema:
      type: dict
      attrs:
        - variable: devices
          label: Devices
          description: |
            The SCSI generic device nodes for your enclosures.</br>
            Find them with: lsscsi -g | grep enclosu</br>
            Eg: Host Device: /dev/sg16, Container Device: /dev/sg16
          schema:
            type: list
            default: []
            items:
              - variable: device
                label: Device
                schema:
                  type: dict
                  attrs:
                    - variable: host_device
                      label: Host Device
                      description: The device node on the host.
                      schema:
                        type: string
                        required: true
                        valid_chars: '^/dev/(sg|bsg)[a-zA-Z0-9/:]+$'
                        valid_chars_error: Must be a /dev/sg* or /dev/bsg/* path
                    - variable: container_device
                      label: Container Device
                      description: The device node inside the container. Normally the same as the host device.
                      schema:
                        type: string
                        required: true
                        valid_chars: '^/dev/(sg|bsg)[a-zA-Z0-9/:]+$'
                        valid_chars_error: Must be a /dev/sg* or /dev/bsg/* path

        - variable: allowlist
          label: Restrict to enclosure ID
          description: |
            Comma-separated enclosure logical identifiers.</br>
            Leave empty to manage every enclosure found.</br>
            Find yours with: cat /sys/class/enclosure/*/id
          schema:
            type: string
            default: ""

        - variable: auth_required
          label: Require a login
          description: |
            Require an account to view the dashboard.</br>
            When enabled, you create an administrator on first run.</br>
            When disabled, anyone who can reach the port can read everything the
            app can read, including the audit log and raw sg_ses output.
          schema:
            type: boolean
            default: true

        - variable: allow_anonymous_ident
          label: Allow Identify without a login
          description: |
            Allow the Identify LED to be set without an account.</br>
            Only applies when Require a login is disabled.
          schema:
            type: boolean
            default: false
            show_if: [["auth_required", "=", false]]

        - variable: additional_envs
          label: Additional Environment Variables
          description: Configure additional environment variables for KTN Enclosure Manager.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: truenas
    label: ""
    group: TrueNAS Integration Configuration
    schema:
      type: dict
      attrs:
        - variable: url
          label: TrueNAS URL
          description: |
            The TrueNAS URL to use for pool, vdev, ZFS error and SMART data.</br>
            Leave empty to run without it. The drive map, chassis telemetry and
            Identify all work without it.
          schema:
            type: string
            default: ""

        - variable: api_key
          label: API Key
          description: The TrueNAS API key. Create one under Credentials, API Keys, Add.
          schema:
            type: string
            default: ""
            private: true

        - variable: verify_tls
          label: Verify TLS Certificate
          description: Verify the TrueNAS TLS certificate. Disable only for a self-signed certificate you cannot replace.
          schema:
            type: boolean
            default: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30842
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: KTN Enclosure Manager Data Storage
          description: The path to store KTN Enclosure Manager Data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
                    - variable: auto_permissions
                      label: Automatic Permissions
                      description: |
                        Automatically set permissions for the host path.
                        Enabling this will check the top level directory,</br>
                        and if it finds incorrect permissions, it will `chown`
                        the host path to the user and group the app runs as.
                      schema:
                        type: boolean
                        default: false
                        show_if: [["acl_enable", "=", false]]

        - variable: additional_storage
          label: Additional Storage
          description: Configure additional storage for KTN Enclosure Manager.
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      description: |
                        ixVolume: Is dataset created automatically by the system.</br>
                        Host Path: Is a path that already exists on the system.</br>
                        SMB Share: Is a SMB share that is mounted to as a volume.
                      schema:
                        type: string
                        required: true
                        default: "ix_volume"
                        enum:
                          - value: "host_path"
                            description: Host Path (Path that already exists on the system)
                          - value: "ix_volume"
                            description: ixVolume (Dataset created automatically by the system)
                          - value: "cifs"
                            description: SMB/CIFS Share (Mounts a volume to a SMB share)
                    - variable: read_only
                      label: Read Only
                      description: Mount the volume as read only.
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      description: The path inside the container to mount the storage.
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                          - variable: path
                            label: Host Path
                            description: The host path to use for storage.
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      description: The configuration for the ixVolume dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - "normalize/ix_volume"
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            description: The name of the dataset to use for storage.
                            schema:
                              type: string
                              required: true
                              default: "storage_entry"
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                    - variable: cifs_config
                      label: SMB Configuration
                      description: The configuration for the SMB dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "cifs"]]
                        attrs:
                          - variable: server
                            label: Server
                            description: The server to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: path
                            label: Path
                            description: The path to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: username
                            label: Username
                            description: The username to use for the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: password
                            label: Password
                            description: The password to use for the SMB share.
                            schema:
                              type: string
                              required: true
                              private: true
                          - variable: domain
                            label: Domain
                            description: The domain to use for the SMB share.
                            schema:
                              type: string

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: ktn-enclosure-manager
                            description: ktn-enclosure-manager

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for KTN Enclosure Manager.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for KTN Enclosure Manager.
                schema:
                  type: int
                  default: 4096
                  required: true
