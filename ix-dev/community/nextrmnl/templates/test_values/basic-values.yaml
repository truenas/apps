resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

nextrmnl:
  secret_key: a-test-secret-key-long-enough-for-this-scenario
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8466

ix_volumes:
  data: /opt/tests/mnt/nextrmnl/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
