images:
  image:
    repository: ghcr.io/versity/versitygw
    tag: "v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.1@sha256:d1bdb3a3ed7fc158eca53cd78486c388345c603fe2bf42fb24a1e03e1068ff38"

consts:
  versity_container_name: versity
  perms_container_name: permissions
  buckets_path: /var/lib/versitygw-buckets
  ssl_cert_path: /etc/certificates/tls.crt
  ssl_key_path: /etc/certificates/tls.key
  admin_ssl_cert_path: /etc/certificates/admin_tls.crt
  admin_ssl_key_path: /etc/certificates/admin_tls.key
  restricted_global_flags:
    - --port
    - --health
    - --cert
    - --key
    - --access
    - --secret
    - --webui
    - --webui-cert
    - --webui-key
    - --admin-port
    - --admin-cert
    - --admin-cert-key
