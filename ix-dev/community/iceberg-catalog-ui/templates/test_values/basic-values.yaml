resources:
  limits:
    cpus: 2.0
    memory: 1024

TZ: Etc/UTC

catalog_ui:
  public_url: https://localhost:8443
  extra_origins:
    - https://127.0.0.1:8443
  aistor_endpoint: http://aistor.example.internal:9000
  aistor_name: AIStor
  admin_users:
    - admin
  semantic_enabled: false
  semantic_bucket: aistor-semantics
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8443
  certificate_id: ""

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/iceberg-catalog-ui/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
