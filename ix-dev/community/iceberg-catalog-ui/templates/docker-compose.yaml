{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The image is distroless (no shell or curl); its own health check probes /healthz on the metrics port. #}
{% do c1.healthcheck.use_built_in() %}

{# HTTPS always: with a TrueNAS certificate when one is selected, otherwise a self-signed one kept in storage. #}
{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do c1.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
  {% set self_signed = false %}
  {% set cert_file = values.consts.ssl_cert_path %}
  {% set key_file = values.consts.ssl_key_path %}
{% else %}
  {% set self_signed = true %}
  {% set cert_file = "%s/tls/cert.pem"|format(values.consts.data_path) %}
  {% set key_file = "%s/tls/key.pem"|format(values.consts.data_path) %}
{% endif %}

{#
  Configuration is environment variables only, so users can tune anything the template does not own
  (OIDC, LDAP, timeouts, limits, ...) with Additional Environment Variables. The template sets what the
  rendered compose depends on (ports, TLS, storage paths) and the answers to the questions.
  The image's default config file does not exist, so these variables are the whole configuration.
#}
{% do c1.environment.add_env("AISTOR_UI_SERVER_LISTEN", ":%d"|format(values.network.web_port.port_number)) %}
{% do c1.environment.add_env("AISTOR_UI_SERVER_METRICS_LISTEN", ":%d"|format(values.consts.metrics_port)) %}
{% do c1.environment.add_env("AISTOR_UI_SERVER_PUBLIC_URL", values.catalog_ui.public_url) %}
{% if values.catalog_ui.extra_origins %}
  {% do c1.environment.add_env("AISTOR_UI_SERVER_EXTRA_ORIGINS", values.catalog_ui.extra_origins | join(",")) %}
{% endif %}
{% do c1.environment.add_env("AISTOR_UI_SERVER_TLS_SELF_SIGNED", self_signed) %}
{% do c1.environment.add_env("AISTOR_UI_SERVER_TLS_CERT_FILE", cert_file) %}
{% do c1.environment.add_env("AISTOR_UI_SERVER_TLS_KEY_FILE", key_file) %}
{% do c1.environment.add_env("AISTOR_UI_SESSION_KEY_FILE", "%s/session.key"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("AISTOR_UI_SESSION_KEY_GENERATE", true) %}
{% do c1.environment.add_env("AISTOR_UI_AUTH_BUILTIN_ENABLED", values.catalog_ui.access_key_sign_in) %}
{% if values.catalog_ui.admin_users %}
  {% do c1.environment.add_env("AISTOR_UI_AUTH_ADMIN_USERS", values.catalog_ui.admin_users | join(",")) %}
{% endif %}
{% do c1.environment.add_env("AISTOR_UI_CLUSTER_ID", "aistor") %}
{% do c1.environment.add_env("AISTOR_UI_CLUSTER_NAME", values.catalog_ui.aistor_name) %}
{% do c1.environment.add_env("AISTOR_UI_CLUSTER_ENDPOINT", values.catalog_ui.aistor_endpoint.rstrip("/")) %}
{% do c1.environment.add_env("AISTOR_UI_SEMANTIC_ENABLED", values.catalog_ui.semantic_enabled) %}
{% if values.catalog_ui.semantic_enabled %}
  {% do c1.environment.add_env("AISTOR_UI_SEMANTIC_BUCKET", values.catalog_ui.semantic_bucket) %}
{% endif %}

{% do c1.environment.add_user_envs(values.catalog_ui.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
