{% set tpl = ix_lib.base.render.Render(values) %}

{% if not values.mediathek.channels %}
  {% do tpl.funcs.fail("At least one channel is required.") %}
{% endif %}

{% set c1 = tpl.add_container(values.consts.mediathek_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("node", {"port": values.network.addon_port.port_number, "path": "/health"}) %}

{% do c1.environment.add_env("PORT", values.network.addon_port.port_number) %}
{% do c1.environment.add_env("CHANNELS", values.mediathek.channels | join(",")) %}
{% if values.mediathek.public_url %}
  {% do c1.environment.add_env("PUBLIC_URL", values.mediathek.public_url) %}
{% endif %}
{% do c1.environment.add_user_envs(values.mediathek.additional_envs) %}

{% do c1.add_port(values.network.addon_port) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% if values.mediathek.public_url %}
  {% do tpl.notes.set_body("Add `%s/manifest.json` as an add-on in your Stremio client."|format(values.mediathek.public_url.rstrip("/"))) %}
{% elif values.network.addon_port.bind_mode == "published" %}
  {% set note = "Add `http://<truenas-host>:%d/manifest.json` as an add-on in your Stremio client.\n"|format(values.network.addon_port.port_number) %}
  {% set note = note + "Use a host name or IP your clients can reach: artwork links point back to it." %}
  {% do tpl.notes.set_body(note) %}
{% else %}
  {% do tpl.notes.set_body("The Add-on Port is not published, so Stremio clients cannot reach the add-on. Publish the port or set a Public URL.") %}
{% endif %}

{{ tpl.render() | tojson }}
