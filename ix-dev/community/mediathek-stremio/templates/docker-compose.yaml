{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.mediathek_container_name, "image") %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("node", {"port": values.network.web_port.port_number, "path": "/health"}) %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("CHANNELS", values.mediathek.channels) %}
{% if values.mediathek.public_url %}
  {% do c1.environment.add_env("PUBLIC_URL", values.mediathek.public_url) %}
{% endif %}
{% do c1.environment.add_user_envs(values.mediathek.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.network.web_port.port_number}) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do tpl.portals.add(values.network.web_port, {"name": "Manifest", "path": "/manifest.json"}) %}

{{ tpl.render() | tojson }}
