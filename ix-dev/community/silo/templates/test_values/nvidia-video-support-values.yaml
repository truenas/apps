resources:
  limits:
    cpus: 2.0
    memory: 4096
  gpus:
    nvidia_gpu_selection:
      "00000000:01:00.0":
        uuid: GPU-00000000-0000-0000-0000-00000000001
        use_gpu: true

silo:
  secret_key: test-secret-key-for-ci-validation-0123456789abcdef
  postgres_password: test-password
  enable_search: false
  meili_master_key: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30504
  jellyfin_compat_port:
    bind_mode: published
    port_number: 30505
  audiobookshelf_compat_port:
    bind_mode: published
    port_number: 30506

ix_volumes:
  data: /opt/tests/mnt/silo/nvidia-video/data
  postgres_data: /opt/tests/mnt/silo/nvidia-video/postgres_data
  meili_data: /opt/tests/mnt/silo/nvidia-video/meili_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  transcodes:
    type: tmpfs
    tmpfs_config:
      size: 500
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  meili_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: meili_data
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /mnt/media
      host_path_config:
        path: /opt/tests/mnt/silo/media
        create_host_path: true
