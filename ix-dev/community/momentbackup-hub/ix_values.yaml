images:
  image:
    repository: ghcr.io/momentbackup/momentbackup-hub
    tag: 1.0.6
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  app_container_name: momentbackup-hub
  perms_container_name: permissions
  internal_web_port: 8675
  data_path: /data
  notes_body: |
    Open the HTTPS portal and create the owner now. Until that account
    exists, anyone who can reach this address can create it and control the Hub.
    Set MBHUB_SECURE_SETUP=on to require the one-time link the Hub writes to
    /data/setup-url instead. The private certificate is pinned by each
    MomentBackup app when it enrolls.
