resources:
  limits:
    cpus: 2
    memory: 2048

momentbackup:
  public_url: https://truenas.example.test:38675
  scan_backups: true

run_as:
  user: 10001
  group: 10001

network:
  web_port:
    bind_mode: published
    port_number: 38675

ix_volumes:
  data: /opt/tests/mnt/momentbackup-hub/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /repos
      host_path_config:
        acl_enable: false
        path: /opt/tests/mnt/momentbackup-hub/repos

labels: []
