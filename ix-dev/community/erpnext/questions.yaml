- variable: labels
  label: ''
  group: Labels Configuration
  schema:
    type: list
    default: []
    items:
    - variable: label
      label: Label
      schema:
        type: dict
        attrs:
        - variable: key
          label: Key
          schema:
            type: string
            required: true
        - variable: value
          label: Value
          schema:
            type: string
            required: true
        - variable: containers
          label: Containers
          description: Containers where the label should be applied
          schema:
            type: list
            items:
            - variable: container
              label: Container
              schema:
                type: string
                required: true
                enum:
                - value: bootstrap
                  description: bootstrap
                - value: initializer
                  description: initializer
                - value: backend
                  description: backend
                - value: frontend
                  description: frontend
                - value: websocket
                  description: websocket
                - value: queue-short
                  description: queue-short
                - value: queue-long
                  description: queue-long
                - value: scheduler
                  description: scheduler
                - value: db
                  description: db
                - value: redis-cache
                  description: redis-cache
                - value: redis-queue
                  description: redis-queue
                - value: permissions
                  description: permissions
- variable: resources
  label: ''
  group: Resources Configuration
  schema:
    type: dict
    attrs:
    - variable: limits
      label: Limits
      schema:
        type: dict
        attrs:
        - variable: cpus
          label: CPUs
          description: Per-container limit, not an aggregate limit for the entire
            app.
          schema:
            type: int
            default: 2
            required: true
        - variable: memory
          label: Memory (in MB)
          description: Per-container limit, not an aggregate limit for the entire
            app.
          schema:
            type: int
            default: 2048
            required: true
