groups:
- name: ERPNext Configuration
  description: ERPNext Configuration for ERPNext
- name: Network Configuration
  description: Network Configuration for ERPNext
- name: Storage Configuration
  description: Storage Configuration for ERPNext
- name: Labels Configuration
  description: Labels Configuration for ERPNext
- name: Resources Configuration
  description: Resources Configuration for ERPNext
questions:
- variable: erpnext
  label: ''
  group: ERPNext Configuration
  schema:
    type: dict
    attrs:
    - variable: site_name
      label: Site Name
      description: Choose once at installation. Direct IP access works without DNS.
      schema:
        type: string
        required: true
        default: erpnext.localhost
        valid_chars: ^[a-z0-9][a-z0-9.-]{0,120}$
    - variable: admin_password
      label: Initial Administrator Password
      description: Sets the password only on first installation. Changing this field
        does not reset an existing password.
      schema:
        type: string
        required: true
        default: ''
        private: true
        min_length: 12
    - variable: db_password
      label: Database Root Password
      description: Choose once. Changing this does not change an initialized database
        password.
      schema:
        type: string
        required: true
        default: ''
        private: true
        min_length: 12
- variable: network
  label: ''
  group: Network Configuration
  schema:
    type: dict
    attrs:
    - variable: web_port
      label: WebUI Port
      schema:
        type: dict
        attrs:
        - variable: bind_mode
          label: Port Bind Mode
          description: 'The port bind mode.</br>

            - Publish: The port will be published on the host for external access.</br>

            - Expose: The port will be exposed for inter-container communication.</br>

            - None: The port will not be exposed or published.</br>

            Note: If the Dockerfile defines an EXPOSE directive,

            the port will still be exposed for inter-container communication regardless
            of this setting.

            '
          schema:
            type: string
            default: published
            enum:
            - value: published
              description: Publish port on the host for external access
            - value: exposed
              description: Expose port for inter-container communication
            - value: ''
              description: None
        - variable: port_number
          label: Port Number
          schema:
            type: int
            default: 30530
            min: 1
            max: 65535
            required: true
        - variable: host_ips
          label: Host IPs
          description: IPs on the host to bind this port
          schema:
            type: list
            show_if:
            - - bind_mode
              - '='
              - published
            default: []
            items:
            - variable: host_ip
              label: Host IP
              schema:
                type: string
                required: true
                $ref:
                - definitions/node_bind_ip
- variable: storage
  label: ''
  group: Storage Configuration
  schema:
    type: dict
    attrs:
    - variable: sites
      label: Sites and Attachments Storage
      description: Dedicated ERPNext sites and attachments directory. Do not select
        live prototype storage.
      schema:
        type: dict
        attrs:
        - variable: type
          label: Type
          description: 'ixVolume: Is dataset created automatically by the system.</br>

            Host Path: Is a path that already exists on the system.

            '
          schema:
            type: string
            required: true
            default: ix_volume
            enum:
            - value: host_path
              description: Host Path (Path that already exists on the system)
            - value: ix_volume
              description: ixVolume (Dataset created automatically by the system)
        - variable: ix_volume_config
          label: ixVolume Configuration
          description: The configuration for the ixVolume dataset.
          schema:
            type: dict
            show_if:
            - - type
              - '='
              - ix_volume
            $ref:
            - normalize/ix_volume
            attrs:
            - variable: acl_enable
              label: Enable ACL
              description: Enable ACL for the storage.
              schema:
                type: boolean
                default: false
            - variable: dataset_name
              label: Dataset Name
              description: The name of the dataset to use for storage.
              schema:
                type: string
                required: true
                hidden: true
                default: sites
            - variable: acl_entries
              label: ACL Configuration
              schema:
                type: dict
                show_if:
                - - acl_enable
                  - '='
                  - true
                attrs: []
        - variable: host_path_config
          label: Host Path Configuration
          schema:
            type: dict
            show_if:
            - - type
              - '='
              - host_path
            attrs:
            - variable: acl_enable
              label: Enable ACL
              description: Enable ACL for the storage.
              schema:
                type: boolean
                default: false
            - variable: acl
              label: ACL Configuration
              schema:
                type: dict
                show_if:
                - - acl_enable
                  - '='
                  - true
                attrs: []
                $ref:
                - normalize/acl
            - variable: path
              label: Host Path
              description: The host path to use for storage.
              schema:
                type: hostpath
                show_if:
                - - acl_enable
                  - '='
                  - false
                required: true
            - variable: auto_permissions
              label: Automatic Permissions
              description: Check and set ownership on the selected dedicated directory.
              schema:
                type: boolean
                default: false
                show_if:
                - - acl_enable
                  - '='
                  - false
