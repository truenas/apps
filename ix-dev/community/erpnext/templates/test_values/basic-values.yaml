erpnext:
  site_name: erpnext.localhost
  admin_password: test-only-admin-password
  db_password: test-only-database-password
network:
  web_port:
    bind_mode: published
    port_number: 18084
    host_ips: []
resources:
  limits:
    cpus: 2
    memory: 2048
labels: []
ix_volumes:
  sites: /opt/tests/mnt/erpnext/sites
  logs: /opt/tests/mnt/erpnext/logs
  db_data: /opt/tests/mnt/erpnext/db_data
  queue_data: /opt/tests/mnt/erpnext/queue_data
storage:
  sites:
    type: ix_volume
    ix_volume_config:
      dataset_name: sites
      create_host_path: true
  logs:
    type: ix_volume
    ix_volume_config:
      dataset_name: logs
      create_host_path: true
  db_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: db_data
      create_host_path: true
  queue_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: queue_data
      create_host_path: true
