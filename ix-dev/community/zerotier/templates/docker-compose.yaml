{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.zerotier_container_name, "image") %}
{% do c1.add_caps(["NET_ADMIN", "NET_RAW", "AUDIT_WRITE", "CHOWN", "DAC_OVERRIDE", "FOWNER", "NET_BIND_SERVICE", "SETGID", "SETUID", "SETPCAP", "SYS_ADMIN"]) %}

{% set cmd = namespace(x=[]) %}
{% for net in values.zerotier.networks %}
  {% do cmd.x.append(net|lower) %}
{% else %}
  {% do tpl.funcs.fail("Zerotier requires at least one network to be configured") %}
{% endfor %}
{% do c1.set_command(cmd.x) %}

{#
  Workaround: the 1.14.2 image entrypoint writes authtoken.secret with a trailing
  newline (plain `echo`). zerotier-one trims it but zerotier-cli does not, so the
  image's /healthcheck.sh gets 401 whenever ZEROTIER_API_SECRET is set.
  Passing the token with -T bypasses the file. -T is only added when the var is
  set (also via additional envs), as an empty -T makes the cli exit with help.
  Fixed upstream in f2521c8536 (`echo -n`), but no image with it was published.
  Remove this and go back to ["CMD", "/healthcheck.sh"] once the image is updated.
#}
{% if not values.images.image.tag.startswith("1.14.2@") %}
  {% do tpl.funcs.fail("Image updated: remove the zerotier authtoken healthcheck workaround and verify the upstream entrypoint uses `echo -n`") %}
{% endif %}
{% set hc = namespace(x=[]) %}
{% for net in cmd.x %}
  {% do hc.x.append('[ "$(zerotier-cli ${ZEROTIER_API_SECRET:+-T"$ZEROTIER_API_SECRET"} get %s status)" = "OK" ]' | format(net)) %}
{% endfor %}
{% do c1.healthcheck.set_custom_test(hc.x | join(" && ")) %}

{% if not values.network.host_network %}
  {% do c1.sysctls.add("net.ipv4.ip_forward", 1) %}
  {% do c1.sysctls.add("net.ipv6.conf.all.forwarding", 1) %}
{% endif %}

{% if values.zerotier.auth_token %}
  {% do c1.environment.add_env("ZEROTIER_API_SECRET", values.zerotier.auth_token) %}
{% endif %}
{% if values.zerotier.identity_public %}
  {% do c1.environment.add_env("ZEROTIER_IDENTITY_PUBLIC", values.zerotier.identity_public) %}
{% endif %}
{% if values.zerotier.identity_secret %}
  {% do c1.environment.add_env("ZEROTIER_IDENTITY_SECRET", values.zerotier.identity_secret) %}
{% endif %}

{% do c1.environment.add_user_envs(values.zerotier.additional_envs) %}

{% do c1.add_tun_device() %}
{% do c1.add_storage("/var/lib/zerotier-one", values.storage.config) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{{ tpl.render() | tojson }}
