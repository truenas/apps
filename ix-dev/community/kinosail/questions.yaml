groups:
  - name: Kinosail Configuration
    description: Choose which services to install
  - name: Network Configuration
    description: Set the HTTPS ports
  - name: Storage Configuration
    description: Select your existing media dataset
questions:
  - variable: mode
    group: Kinosail Configuration
    label: Install
    schema:
      type: string
      required: true
      default: both
      enum:
        - value: player
          description: Player
        - value: subtitles
          description: Subtitles
        - value: both
          description: Both
  - variable: network
    group: Network Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: player_port
          label: Player HTTPS Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish on the host
              - variable: port_number
                label: Host Port
                schema:
                  type: int
                  required: true
                  default: 38127
                  min: 1024
                  max: 65535
        - variable: subtitles_port
          label: Subtitles HTTPS Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish on the host
              - variable: port_number
                label: Host Port
                schema:
                  type: int
                  required: true
                  default: 38128
                  min: 1024
                  max: 65535
  - variable: storage
    group: Storage Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: media
          label: Existing Media Dataset
          description: Player reads this path. Subtitles writes subtitle files here. Grant UID 10001 the required access.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  required: true
                  hidden: true
                  default: host_path
              - variable: host_path_config
                label: Media Path
                schema:
                  type: dict
                  attrs:
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true
        - variable: player_config
          label: Player Config Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: ix_volume
                  hidden: true
              - variable: ix_volume_config
                label: Volume
                schema:
                  type: dict
                  hidden: true
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: player-config
        - variable: player_cache
          label: Player Cache Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: ix_volume
                  hidden: true
              - variable: ix_volume_config
                label: Volume
                schema:
                  type: dict
                  hidden: true
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: player-cache
        - variable: player_backups
          label: Player Backups Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: ix_volume
                  hidden: true
              - variable: ix_volume_config
                label: Volume
                schema:
                  type: dict
                  hidden: true
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: player-backups
        - variable: subtitles_config
          label: Subtitles Config Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: ix_volume
                  hidden: true
              - variable: ix_volume_config
                label: Volume
                schema:
                  type: dict
                  hidden: true
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: subtitles-config
        - variable: subtitles_cache
          label: Subtitles Cache Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: ix_volume
                  hidden: true
              - variable: ix_volume_config
                label: Volume
                schema:
                  type: dict
                  hidden: true
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: subtitles-cache
        - variable: subtitles_backups
          label: Subtitles Backups Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: ix_volume
                  hidden: true
              - variable: ix_volume_config
                label: Volume
                schema:
                  type: dict
                  hidden: true
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: subtitles-backups
