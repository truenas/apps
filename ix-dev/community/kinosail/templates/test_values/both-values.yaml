mode: both
network:
  player_port: {bind_mode: published, port_number: 38127}
  subtitles_port: {bind_mode: published, port_number: 38128}
storage:
  media:
    type: host_path
    host_path_config: {path: /mnt/tank/Media, create_host_path: false}
  player_config:
    type: ix_volume
    ix_volume_config: {dataset_name: player-config, create_host_path: true}
  player_cache:
    type: ix_volume
    ix_volume_config: {dataset_name: player-cache, create_host_path: true}
  player_backups:
    type: ix_volume
    ix_volume_config: {dataset_name: player-backups, create_host_path: true}
  subtitles_config:
    type: ix_volume
    ix_volume_config: {dataset_name: subtitles-config, create_host_path: true}
  subtitles_cache:
    type: ix_volume
    ix_volume_config: {dataset_name: subtitles-cache, create_host_path: true}
  subtitles_backups:
    type: ix_volume
    ix_volume_config: {dataset_name: subtitles-backups, create_host_path: true}
ix_volumes:
  player-config: /opt/tests/mnt/player-config
  player-cache: /opt/tests/mnt/player-cache
  player-backups: /opt/tests/mnt/player-backups
  subtitles-config: /opt/tests/mnt/subtitles-config
  subtitles-cache: /opt/tests/mnt/subtitles-cache
  subtitles-backups: /opt/tests/mnt/subtitles-backups
