groups:
  - name: Inbox Zero Configuration
    description: Configure Inbox Zero
  - name: Network Configuration
    description: Configure Network for Inbox Zero
  - name: Storage Configuration
    description: Configure Storage for Inbox Zero
  - name: Labels Configuration
    description: Configure Labels for Inbox Zero
  - name: Resources Configuration
    description: Configure Resources for Inbox Zero

questions:
  - variable: TZ
    group: Inbox Zero Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: inbox_zero
    label: ""
    group: Inbox Zero Configuration
    schema:
      type: dict
      attrs:
        - variable: app_url
          label: App URL
          description: |
            The public URL where Inbox Zero will be reachable (used to build sign-in
            redirects and links in emails/notifications).</br>
            Examples:</br>
            https://mail.example.com </br>
            http://192.168.1.100:30489
          schema:
            type: uri
            default: ""
            required: true

        - variable: ai_model_settings_disabled
          label: Hide User AI Model Settings
          description: Hides per-user AI model settings and enforces the deployment-managed model settings below.
          schema:
            type: boolean
            default: false

        - variable: auth_secret
          label: Auth Secret
          description: |
            Secret used by better-auth to sign sessions.</br>
            Generate once with `openssl rand -hex 32` and keep it the same across restarts/updates.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: internal_api_key
          label: Internal API Key
          description: |
            Secret key used for internal API calls between the web, worker and cron containers.</br>
            Generate once with `openssl rand -hex 32`. Internal only - you will never need to use this value yourself.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: email_encrypt_secret
          label: Email Encrypt Secret
          description: |
            Secret used to encrypt stored OAuth tokens.</br>
            Generate once with `openssl rand -hex 32` and keep it the same across restarts/updates.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: email_encrypt_salt
          label: Email Encrypt Salt
          description: |
            Salt used to encrypt stored OAuth tokens.</br>
            Generate once with `openssl rand -hex 16` and keep it the same across restarts/updates.
          schema:
            type: string
            default: ""
            min_length: 32
            max_length: 32
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Salt must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: cron_secret
          label: Cron Secret
          description: |
            Shared secret used to authenticate the bundled cron container's calls to the
            scheduled task endpoints. Generate once with `openssl rand -hex 32`. Internal
            only - you will never need to use this value yourself.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: db_password
          label: Database Password
          description: Password for the bundled Postgres database. Set once when first installing.
          schema:
            type: string
            default: ""
            required: true
            private: true

        - variable: external_api_enabled
          label: Enable External API
          description: |
            Enables Inbox Zero's own external REST API (v1 endpoints, API keys, API key UI)
            for scripting/integrating with your deployment. Off by default; only enable if
            you plan to use it.
          schema:
            type: boolean
            default: false

        - variable: api_key_salt
          label: API Key Salt
          description: |
            Salt used to hash external API keys. Required when External API is enabled.</br>
            Generate with `openssl rand -hex 32`.
          schema:
            type: string
            default: ""
            show_if: [["external_api_enabled", "=", true]]
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: auth_provider
          label: Sign-in Provider
          description: Which email provider users will sign in with.
          schema:
            type: string
            default: "google"
            enum:
              - value: "google"
                description: Google (Gmail)
              - value: "microsoft"
                description: Microsoft (Outlook)

        - variable: google_client_id
          label: Google Client ID
          description: OAuth client ID from Google Cloud Console.
          schema:
            type: string
            default: ""
            show_if: [["auth_provider", "=", "google"]]
            required: true

        - variable: google_client_secret
          label: Google Client Secret
          description: OAuth client secret from Google Cloud Console.
          schema:
            type: string
            default: ""
            show_if: [["auth_provider", "=", "google"]]
            required: true
            private: true

        - variable: google_pubsub_topic_name
          label: Google PubSub Topic Name
          description: |
            Full Google Cloud Pub/Sub topic name used for Gmail push notifications.</br>
            Example: projects/my-project/topics/gmail
          schema:
            type: string
            default: ""
            show_if: [["auth_provider", "=", "google"]]
            required: true

        - variable: google_pubsub_verification_token
          label: Google PubSub Verification Token
          description: |
            Token used to verify Gmail Pub/Sub webhook calls. Generate with `openssl rand -hex 32`.</br>
            Leave empty only if `/api/google/webhook` is authenticated upstream by another mechanism.
          schema:
            type: string
            default: ""
            show_if: [["auth_provider", "=", "google"]]
            private: true

        - variable: microsoft_client_id
          label: Microsoft Client ID
          description: OAuth client ID from the Azure Portal.
          schema:
            type: string
            default: ""
            show_if: [["auth_provider", "=", "microsoft"]]
            required: true

        - variable: microsoft_client_secret
          label: Microsoft Client Secret
          description: OAuth client secret from the Azure Portal.
          schema:
            type: string
            default: ""
            show_if: [["auth_provider", "=", "microsoft"]]
            required: true
            private: true

        - variable: microsoft_tenant_id
          label: Microsoft Tenant ID
          description: Leave as `common` for multi-tenant/personal-account support, or set your tenant ID for single tenant.
          schema:
            type: string
            default: "common"
            show_if: [["auth_provider", "=", "microsoft"]]

        - variable: microsoft_webhook_client_state
          label: Microsoft Webhook Client State
          description: Secret for Microsoft webhook verification. Generate with `openssl rand -hex 32`.
          schema:
            type: string
            default: ""
            show_if: [["auth_provider", "=", "microsoft"]]
            required: true
            private: true

        - variable: llm_provider
          label: AI Provider
          description: Which AI provider Inbox Zero uses for classifying/drafting emails.
          schema:
            type: string
            default: "openai"
            enum:
              - value: "openai"
                description: OpenAI
              - value: "anthropic"
                description: Anthropic (Claude)
              - value: "google"
                description: Google (Gemini)
              - value: "openrouter"
                description: OpenRouter
              - value: "groq"
                description: Groq
              - value: "ollama"
                description: Ollama (self-hosted, no API key needed)

        - variable: openai_model
          label: Model
          description: 'Example: gpt-5-mini'
          schema:
            type: string
            default: "gpt-5-mini"
            show_if: [["llm_provider", "=", "openai"]]
            required: true
        - variable: anthropic_model
          label: Model
          description: 'Example: claude-sonnet-4.6'
          schema:
            type: string
            default: "claude-sonnet-4.6"
            show_if: [["llm_provider", "=", "anthropic"]]
            required: true
        - variable: google_model
          label: Model
          description: 'Example: gemini-2.5-flash'
          schema:
            type: string
            default: "gemini-2.5-flash"
            show_if: [["llm_provider", "=", "google"]]
            required: true
        - variable: openrouter_model
          label: Model
          description: 'Example: anthropic/claude-sonnet-4.6'
          schema:
            type: string
            default: "anthropic/claude-sonnet-4.6"
            show_if: [["llm_provider", "=", "openrouter"]]
            required: true
        - variable: groq_model
          label: Model
          description: 'Example: llama-3.3-70b-versatile'
          schema:
            type: string
            default: "llama-3.3-70b-versatile"
            show_if: [["llm_provider", "=", "groq"]]
            required: true
        - variable: ollama_model
          label: Model
          description: The name of a model already pulled on your Ollama server (e.g. llama3.1).
          schema:
            type: string
            default: ""
            show_if: [["llm_provider", "=", "ollama"]]
            required: true

        - variable: llm_api_key
          label: API Key
          description: API key for the selected AI provider.
          schema:
            type: string
            default: ""
            show_if: [["llm_provider", "!=", "ollama"]]
            required: true
            private: true

        - variable: ollama_base_url
          label: Ollama Server URL
          description: |
            The API URL of your Ollama server.</br>
            Example: http://192.168.1.50:11434/api
          schema:
            type: string
            default: "http://localhost:11434/api"
            show_if: [["llm_provider", "=", "ollama"]]
            required: true

        - variable: queue_redis_password
          label: Redis Password
          description: Password for the bundled Redis instance. Set once when first installing.
          schema:
            type: string
            default: ""
            required: true
            private: true

        - variable: queue_upstash_redis_token
          label: Redis HTTP Token
          description: |
            Shared token securing the bundled Redis HTTP proxy used for background job
            processing. Internal only - generate once with `openssl rand -hex 32`, you
            will never need to use this value yourself.
          schema:
            type: string
            default: ""
            required: true
            private: true

        - variable: digest_enabled
          label: Enable Email Digest
          description: Sends periodic summaries of emails.
          schema:
            type: boolean
            default: true
        - variable: follow_up_reminders_enabled
          label: Enable Follow-Up Reminders
          description: Allows labeling emails for automatic follow-up tracking.
          schema:
            type: boolean
            default: true
        - variable: meeting_briefs_enabled
          label: Enable Meeting Briefs
          description: Sends pre-meeting briefings to users.
          schema:
            type: boolean
            default: true
        - variable: contacts_enabled
          label: Enable Contact Suggestions
          description: Gmail and Outlook contact suggestions while composing.
          schema:
            type: boolean
            default: true
        - variable: webhook_action_enabled
          label: Enable Outgoing Webhook Actions
          description: Allow automation rules to call external webhooks.
          schema:
            type: boolean
            default: true
        - variable: delete_email_action_enabled
          label: Enable Delete/Trash Actions
          description: Allow automation rules to delete/trash emails.
          schema:
            type: boolean
            default: true
        - variable: auto_draft_disabled
          label: Disable Auto-Drafting
          description: Disables automatically drafting replies based on assistant rules.
          schema:
            type: boolean
            default: false

        - variable: meeting_recorder_enabled
          label: Enable Meeting Recorder
          description: |
            Optional AI meeting notetaker. Requires a separate account at
            https://recall.ai (own pricing). Leave off if you don't have one -
            the feature stays fully hidden and no calls are made to Recall.ai.
          schema:
            type: boolean
            default: false
        - variable: recall_api_key
          label: Recall.ai API Key
          schema:
            type: string
            show_if: [["meeting_recorder_enabled", "=", true]]
            required: true
            private: true
        - variable: recall_webhook_secret
          label: Recall.ai Webhook Signing Secret
          description: Signing secret for the Recall webhook at `/api/recall/webhook`.
          schema:
            type: string
            show_if: [["meeting_recorder_enabled", "=", true]]
            required: true
            private: true
        - variable: recall_region
          label: Recall.ai Workspace Region
          schema:
            type: string
            default: "us-west-2"
            show_if: [["meeting_recorder_enabled", "=", true]]

        - variable: resend_enabled
          label: Enable Transactional Email
          description: |
            Optional. Sends the app's own system emails (digests, notifications) via a
            separate service called https://resend.com (own account/pricing). This is
            unrelated to sending replies through your own Gmail/Outlook account. Leave
            off to skip these system emails entirely.
          schema:
            type: boolean
            default: false
        - variable: resend_api_key
          label: Resend API Key
          schema:
            type: string
            show_if: [["resend_enabled", "=", true]]
            required: true
            private: true
        - variable: resend_from_email
          label: From Email
          schema:
            type: string
            show_if: [["resend_enabled", "=", true]]
            required: true

        - variable: admins
          label: Admin Emails
          description: Comma-separated list of emails that get admin privileges inside the app.
          schema:
            type: string
            default: ""
        - variable: auth_allowed_emails
          label: Allowed Sign-up Emails
          description: Comma-separated exact email addresses allowed to create new accounts. Leave empty for open sign-up.
          schema:
            type: string
            default: ""
        - variable: auth_allowed_email_domains
          label: Allowed Sign-up Email Domains
          description: Comma-separated email domains allowed to create new accounts (e.g. company.com,subsidiary.org). Leave empty for open sign-up.
          schema:
            type: string
            default: ""
        - variable: auto_join_organization_enabled
          label: Auto-Join Organization
          description: |
            Automatically add new users to the single organization on sign-up.</br>
            Requires exactly one organization to already exist.
          schema:
            type: boolean
            default: false

        - variable: additional_envs
          label: Additional Environment Variables
          description: |
            Add any other environment variable documented at
            https://docs.getinboxzero.com/hosting/environment-variables
            (Slack, Teams, Telegram, Sentry, Axiom, PostHog, white-labeling, image proxy,
            per-task model overrides, etc). These are applied to the [web] and [worker] containers.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30489
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          description: The docker networks to join
          schema:
            type: list
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      description: |
                        The name of the network to join.</br>
                        The network must already exist.
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      description: The containers to add to this network.
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: web
                                        description: web
                                      - value: worker
                                        description: worker
                                      - value: cron
                                        description: cron
                                      - value: redis
                                        description: redis
                                      - value: redis-http
                                        description: redis-http
                                      - value: postgres
                                        description: postgres
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases (Optional)
                                        description: The network aliases to use for this container on this network.
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string
                                      - variable: interface_name
                                        label: Interface Name (Optional)
                                        description: The network interface name to use for this network
                                        schema:
                                          type: string
                                      - variable: mac_address
                                        label: MAC Address (Optional)
                                        description: The MAC address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv4_address
                                        label: IPv4 Address (Optional)
                                        description: The IPv4 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv6_address
                                        label: IPv6 Address (Optional)
                                        description: The IPv6 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: gw_priority
                                        label: Gateway Priority (Optional)
                                        description: Indicates the priority of the gateway for this network interface.
                                        schema:
                                          type: int
                                          "null": true
                                      - variable: priority
                                        label: Priority (Optional)
                                        description: Indicates in which order Compose connects the service's containers to its networks.
                                        schema:
                                          type: int
                                          "null": true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: postgres_data
          label: Postgres Data Storage
          description: The path to store Postgres data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "pg_data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
                    - variable: auto_permissions
                      label: Automatic Permissions
                      description: |
                        Automatically set permissions for the host path.
                        Enabling this, will check the top level directory,</br>
                        If it finds incorrect permissions, it will `chown` the
                        host path to the user and group required for the
                        postgres container.
                      schema:
                        type: boolean
                        default: false
                        show_if: [["acl_enable", "=", false]]
        - variable: redis_data
          label: Redis Data Storage
          description: The path to store Redis data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "redis_data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: additional_storage
          label: Additional Storage
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      description: |
                        ixVolume: Is dataset created automatically by the system.</br>
                        Host Path: Is a path that already exists on the system.</br>
                        SMB Share: Is a SMB share that is mounted to as a volume.</br>
                        NFS Share: Is a NFS share that is mounted to as a volume.
                      schema:
                        type: string
                        required: true
                        default: "ix_volume"
                        enum:
                          - value: "host_path"
                            description: Host Path (Path that already exists on the system)
                          - value: "ix_volume"
                            description: ixVolume (Dataset created automatically by the system)
                          - value: "cifs"
                            description: SMB/CIFS Share (Mounts a volume to a SMB share)
                          - value: "nfs"
                            description: NFS Share (Mounts a volume to a NFS share)
                    - variable: read_only
                      label: Read Only
                      description: Mount the volume as read only.
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      description: The path inside the [web] container to mount the storage.
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                          - variable: path
                            label: Host Path
                            description: The host path to use for storage.
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      description: The configuration for the ixVolume dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - "normalize/ix_volume"
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            description: The name of the dataset to use for storage.
                            schema:
                              type: string
                              required: true
                              default: "storage_entry"
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                    - variable: cifs_config
                      label: SMB Configuration
                      description: The configuration for the SMB dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "cifs"]]
                        attrs:
                          - variable: server
                            label: Server
                            description: The server to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: path
                            label: Path
                            description: The path to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: username
                            label: Username
                            description: The username to use for the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: password
                            label: Password
                            description: The password to use for the SMB share.
                            schema:
                              type: string
                              required: true
                              private: true
                          - variable: domain
                            label: Domain
                            description: The domain to use for the SMB share.
                            schema:
                              type: string
                    - variable: nfs_config
                      label: NFS Configuration
                      description: The configuration for the NFS dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "nfs"]]
                        attrs:
                          - variable: server
                            label: Server
                            description: The server to mount the NFS share.
                            schema:
                              type: string
                              required: true
                          - variable: path
                            label: Path
                            description: The path to mount the NFS share.
                            schema:
                              type: string
                              required: true

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: web
                            description: web
                          - value: worker
                            description: worker
                          - value: cron
                            description: cron
                          - value: redis
                            description: redis
                          - value: redis-http
                            description: redis-http
                          - value: postgres
                            description: postgres

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for Inbox Zero.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for Inbox Zero.
                schema:
                  type: int
                  default: 4096
                  required: true
