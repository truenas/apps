groups:
  - name: Inbox Zero Configuration
    description: Configure Inbox Zero
  - name: Network Configuration
    description: Configure Network for Inbox Zero
  - name: Storage Configuration
    description: Configure Storage for Inbox Zero
  - name: Labels Configuration
    description: Configure Labels for Inbox Zero
  - name: Resources Configuration
    description: Configure Resources for Inbox Zero

questions:
  - variable: TZ
    group: Inbox Zero Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: inbox_zero
    label: ""
    group: Inbox Zero Configuration
    schema:
      type: dict
      attrs:
        - variable: app_url
          label: App URL
          description: |
            The public base URL where Inbox Zero will be reachable.</br>
            Examples:</br>
            https://inbox.example.com </br>
            http://192.168.1.100:30489
          schema:
            type: uri
            default: ""
            required: true

        - variable: bypass_premium_checks
          label: Bypass Premium Checks
          description: Bypasses premium/billing checks. Recommended for self-hosting.
          schema:
            type: boolean
            default: true

        - variable: email_send_enabled
          label: Enable Email Sending
          description: Allow Inbox Zero to send emails on your behalf (replies, drafts, digests).
          schema:
            type: boolean
            default: true

        - variable: ai_model_settings_disabled
          label: Hide User AI Model Settings
          description: Hides per-user AI model settings and enforces the deployment-managed model settings below.
          schema:
            type: boolean
            default: false

        - variable: auth_secret
          label: Auth Secret
          description: Secret used by better-auth to sign sessions. Generate with `openssl rand -hex 32`.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: internal_api_key
          label: Internal API Key
          description: Secret key used for internal API calls between the web, worker and cron containers. Generate with `openssl rand -hex 32`.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: email_encrypt_secret
          label: Email Encrypt Secret
          description: Secret used to encrypt stored OAuth tokens. Generate with `openssl rand -hex 32`.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: email_encrypt_salt
          label: Email Encrypt Salt
          description: Salt used to encrypt stored OAuth tokens. Generate with `openssl rand -hex 16`.
          schema:
            type: string
            default: ""
            min_length: 32
            max_length: 32
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Salt must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: cron_secret
          label: Cron Secret
          description: |
            Shared secret used to authenticate the bundled cron container's calls to the
            scheduled task endpoints (`/api/cron/*`, `/api/watch/all`, etc). Generate with `openssl rand -hex 32`.
          schema:
            type: string
            default: ""
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: db_password
          label: Database Password
          description: Password for the bundled Postgres database.
          schema:
            type: string
            default: ""
            required: true
            private: true

        - variable: external_api_enabled
          label: Enable External API
          description: Enables the external API (v1 endpoints, API keys, API key UI).
          schema:
            type: boolean
            default: false

        - variable: api_key_salt
          label: API Key Salt
          description: |
            Salt used to hash external API keys. Required when External API is enabled.</br>
            Generate with `openssl rand -hex 32`.
          schema:
            type: string
            default: ""
            show_if: [["external_api_enabled", "=", true]]
            min_length: 64
            max_length: 64
            valid_chars: "^[a-f0-9]+$"
            valid_chars_error: |
              Secret must be a hexadecimal string.</br>
              Allowed characters are [a-f] and [0-9].
            required: true
            private: true

        - variable: google_client_id
          label: Google Client ID
          description: |
            OAuth client ID from Google Cloud Console.</br>
            If you only use Microsoft OAuth, set this to `skipped`.
          schema:
            type: string
            default: ""
            required: true

        - variable: google_client_secret
          label: Google Client Secret
          description: |
            OAuth client secret from Google Cloud Console.</br>
            If you only use Microsoft OAuth, set this to `skipped`.
          schema:
            type: string
            default: ""
            required: true
            private: true

        - variable: google_pubsub_topic_name
          label: Google PubSub Topic Name
          description: |
            Full Google Cloud Pub/Sub topic name used for Gmail push notifications.</br>
            Example: projects/my-project/topics/gmail
          schema:
            type: string
            default: ""
            required: true

        - variable: google_pubsub_verification_token
          label: Google PubSub Verification Token
          description: |
            Token used to verify Gmail Pub/Sub webhook calls. Generate with `openssl rand -hex 32`.</br>
            Leave empty only if `/api/google/webhook` is authenticated upstream by another mechanism.
          schema:
            type: string
            default: ""
            private: true

        - variable: microsoft_auth
          label: Microsoft Authentication
          description: Microsoft (Outlook) OAuth for Inbox Zero.
          schema:
            type: dict
            attrs:
              - variable: enabled
                label: Enabled
                description: Enable Microsoft OAuth login and Outlook account connections.
                schema:
                  type: boolean
                  default: false
              - variable: client_id
                label: Client ID
                description: OAuth client ID from the Azure Portal.
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  required: true
              - variable: client_secret
                label: Client Secret
                description: OAuth client secret from the Azure Portal.
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  required: true
                  private: true
              - variable: tenant_id
                label: Tenant ID
                description: Leave as `common` for multi-tenant/personal-account support, or set your tenant ID for single tenant.
                schema:
                  type: string
                  default: "common"
                  show_if: [["enabled", "=", true]]
              - variable: webhook_client_state
                label: Webhook Client State
                description: Secret for Microsoft webhook verification. Generate with `openssl rand -hex 32`.
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  required: true
                  private: true

        - variable: llm
          label: LLM Configuration
          description: |
            Configure the AI provider(s) Inbox Zero uses. Format for each model list is
            `provider:model` (comma-separate multiple entries for ordered fallbacks).</br>
            See https://docs.getinboxzero.com/hosting/llm-setup for supported providers
            (Azure, Bedrock, Vertex, Ollama, OpenAI-compatible, etc.) not listed below -
            add those credentials via Additional Environment Variables.
          schema:
            type: dict
            attrs:
              - variable: default_llms
                label: Default Models
                description: 'Example: openrouter:anthropic/claude-sonnet-4.6'
                schema:
                  type: string
                  default: ""
                  required: true
              - variable: economy_llms
                label: Economy Models
                description: Ordered model list for cheaper operations. Falls back to Default Models.
                schema:
                  type: string
                  default: ""
              - variable: chat_llms
                label: Chat Models
                description: Ordered model list for chat operations. Falls back to Default Models.
                schema:
                  type: string
                  default: ""
              - variable: nano_llms
                label: Nano Models
                description: Ordered model list for lightweight classification/extraction tasks.
                schema:
                  type: string
                  default: ""
              - variable: draft_llms
                label: Draft Models
                description: Ordered model list for drafting replies. Falls back to Default Models.
                schema:
                  type: string
                  default: ""
              - variable: llm_api_key
                label: Shared LLM API Key
                description: Shared fallback API key for simple single-provider setups.
                schema:
                  type: string
                  default: ""
                  private: true
              - variable: anthropic_api_key
                label: Anthropic API Key
                schema:
                  type: string
                  default: ""
                  private: true
              - variable: openai_api_key
                label: OpenAI API Key
                schema:
                  type: string
                  default: ""
                  private: true
              - variable: google_api_key
                label: Google Gemini API Key
                schema:
                  type: string
                  default: ""
                  private: true
              - variable: openrouter_api_key
                label: OpenRouter API Key
                schema:
                  type: string
                  default: ""
                  private: true
              - variable: groq_api_key
                label: Groq API Key
                schema:
                  type: string
                  default: ""
                  private: true

        - variable: queue
          label: Redis & Background Jobs
          description: Configure the bundled Redis instance and background job backend.
          schema:
            type: dict
            attrs:
              - variable: redis_password
                label: Redis Password
                schema:
                  type: string
                  default: ""
                  required: true
                  private: true
              - variable: upstash_redis_token
                label: Redis HTTP Token
                description: |
                  Shared bearer token for the bundled Upstash-compatible Redis HTTP proxy
                  (used for BullMQ/serverless Redis access). Generate with `openssl rand -hex 32`.
                schema:
                  type: string
                  default: ""
                  required: true
                  private: true
              - variable: queue_backend
                label: Background Job Backend
                description: |
                  bullmq: runs the bundled worker container against the bundled Redis (recommended for self-hosting).</br>
                  qstash: use a managed Upstash QStash queue instead of the bundled worker.</br>
                  internal: no extra worker, limited durability and throttling.
                schema:
                  type: string
                  default: "bullmq"
                  enum:
                    - value: "bullmq"
                      description: BullMQ (bundled worker + Redis)
                    - value: "qstash"
                      description: QStash (managed, external)
                    - value: "internal"
                      description: Internal fallback (no extra worker)
              - variable: qstash_token
                label: QStash Token
                schema:
                  type: string
                  default: ""
                  show_if: [["queue_backend", "=", "qstash"]]
                  required: true
                  private: true
              - variable: qstash_current_signing_key
                label: QStash Current Signing Key
                schema:
                  type: string
                  default: ""
                  show_if: [["queue_backend", "=", "qstash"]]
                  required: true
                  private: true
              - variable: qstash_next_signing_key
                label: QStash Next Signing Key
                schema:
                  type: string
                  default: ""
                  show_if: [["queue_backend", "=", "qstash"]]
                  required: true
                  private: true

        - variable: features
          label: Feature Flags
          description: Toggle optional Inbox Zero features.
          schema:
            type: dict
            attrs:
              - variable: digest_enabled
                label: Enable Email Digest
                description: Sends periodic summaries of emails. Requires the bundled cron container.
                schema:
                  type: boolean
                  default: false
              - variable: follow_up_reminders_enabled
                label: Enable Follow-Up Reminders
                description: Allows labeling emails for automatic follow-up tracking. Requires the bundled cron container.
                schema:
                  type: boolean
                  default: false
              - variable: meeting_briefs_enabled
                label: Enable Meeting Briefs
                description: Sends pre-meeting briefings to users. Requires the bundled cron container.
                schema:
                  type: boolean
                  default: false
              - variable: contacts_enabled
                label: Enable Contact Suggestions
                description: Opt in to Gmail and Outlook contact suggestions while composing.
                schema:
                  type: boolean
                  default: false
              - variable: webhook_action_enabled
                label: Enable Outgoing Webhook Actions
                description: Enable outgoing webhook rule actions and the webhook-secret UI.
                schema:
                  type: boolean
                  default: true
              - variable: delete_email_action_enabled
                label: Enable Delete/Trash Actions
                description: Enable delete/trash actions for automation rules.
                schema:
                  type: boolean
                  default: false
              - variable: auto_draft_disabled
                label: Disable Auto-Drafting
                description: Disables the auto-drafting feature that automatically drafts replies based on assistant rules.
                schema:
                  type: boolean
                  default: false

        - variable: meeting_recorder
          label: Meeting Recorder (Recall.ai)
          description: |
            Optional AI meeting notetaker powered by Recall.ai (third-party, own pricing).
            The bundled cron container always calls the scheduling endpoint; it is a no-op unless configured here.
          schema:
            type: dict
            attrs:
              - variable: enabled
                label: Enabled
                description: Show the Meeting Recorder feature in the app.
                schema:
                  type: boolean
                  default: false
              - variable: recall_api_key
                label: Recall.ai API Key
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  required: true
                  private: true
              - variable: recall_webhook_secret
                label: Recall.ai Webhook Signing Secret
                description: Signing secret for the Recall webhook at `/api/recall/webhook`.
                schema:
                  type: string
                  show_if: [["enabled", "=", true]]
                  required: true
                  private: true
              - variable: recall_region
                label: Recall.ai Workspace Region
                schema:
                  type: string
                  default: "us-west-2"
                  show_if: [["enabled", "=", true]]

        - variable: resend
          label: Transactional Email (Resend)
          description: Optional. Used to send transactional emails (e.g. digests) via Resend.
          schema:
            type: dict
            attrs:
              - variable: api_key
                label: Resend API Key
                schema:
                  type: string
                  default: ""
                  private: true
              - variable: from_email
                label: From Email
                schema:
                  type: string
                  default: ""

        - variable: access
          label: Admin & Access Control
          schema:
            type: dict
            attrs:
              - variable: admins
                label: Admin Emails
                description: Comma-separated list of admin emails.
                schema:
                  type: string
                  default: ""
              - variable: auth_allowed_emails
                label: Allowed Sign-up Emails
                description: Comma-separated list of exact email addresses allowed to create new accounts. Leave empty for open sign-up.
                schema:
                  type: string
                  default: ""
              - variable: auth_allowed_email_domains
                label: Allowed Sign-up Email Domains
                description: Comma-separated list of email domains allowed to create new accounts (e.g. company.com,subsidiary.org).
                schema:
                  type: string
                  default: ""
              - variable: auto_join_organization_enabled
                label: Auto-Join Organization
                description: |
                  Automatically add new users to the single organization on sign-up.</br>
                  Requires exactly one organization to already exist.
                schema:
                  type: boolean
                  default: false

        - variable: additional_envs
          label: Additional Environment Variables
          description: |
            Add any other environment variable documented at
            https://docs.getinboxzero.com/hosting/environment-variables
            (Slack, Teams, Telegram, Sentry, Axiom, PostHog, white-labeling, image proxy, etc).
            These are applied to the [web] and [worker] containers.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30489
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          description: The docker networks to join
          schema:
            type: list
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      description: |
                        The name of the network to join.</br>
                        The network must already exist.
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      description: The containers to add to this network.
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: web
                                        description: web
                                      - value: worker
                                        description: worker
                                      - value: cron
                                        description: cron
                                      - value: redis
                                        description: redis
                                      - value: redis-http
                                        description: redis-http
                                      - value: postgres
                                        description: postgres
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases (Optional)
                                        description: The network aliases to use for this container on this network.
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string
                                      - variable: interface_name
                                        label: Interface Name (Optional)
                                        description: The network interface name to use for this network
                                        schema:
                                          type: string
                                      - variable: mac_address
                                        label: MAC Address (Optional)
                                        description: The MAC address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv4_address
                                        label: IPv4 Address (Optional)
                                        description: The IPv4 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv6_address
                                        label: IPv6 Address (Optional)
                                        description: The IPv6 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: gw_priority
                                        label: Gateway Priority (Optional)
                                        description: Indicates the priority of the gateway for this network interface.
                                        schema:
                                          type: int
                                          "null": true
                                      - variable: priority
                                        label: Priority (Optional)
                                        description: Indicates in which order Compose connects the service's containers to its networks.
                                        schema:
                                          type: int
                                          "null": true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: postgres_data
          label: Postgres Data Storage
          description: The path to store Postgres data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "pg_data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
                    - variable: auto_permissions
                      label: Automatic Permissions
                      description: |
                        Automatically set permissions for the host path.
                        Enabling this, will check the top level directory,</br>
                        If it finds incorrect permissions, it will `chown` the
                        host path to the user and group required for the
                        postgres container.
                      schema:
                        type: boolean
                        default: false
                        show_if: [["acl_enable", "=", false]]
        - variable: redis_data
          label: Redis Data Storage
          description: The path to store Redis data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "redis_data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: additional_storage
          label: Additional Storage
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      description: |
                        ixVolume: Is dataset created automatically by the system.</br>
                        Host Path: Is a path that already exists on the system.</br>
                        SMB Share: Is a SMB share that is mounted to as a volume.</br>
                        NFS Share: Is a NFS share that is mounted to as a volume.
                      schema:
                        type: string
                        required: true
                        default: "ix_volume"
                        enum:
                          - value: "host_path"
                            description: Host Path (Path that already exists on the system)
                          - value: "ix_volume"
                            description: ixVolume (Dataset created automatically by the system)
                          - value: "cifs"
                            description: SMB/CIFS Share (Mounts a volume to a SMB share)
                          - value: "nfs"
                            description: NFS Share (Mounts a volume to a NFS share)
                    - variable: read_only
                      label: Read Only
                      description: Mount the volume as read only.
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      description: The path inside the [web] container to mount the storage.
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                          - variable: path
                            label: Host Path
                            description: The host path to use for storage.
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      description: The configuration for the ixVolume dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - "normalize/ix_volume"
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            description: The name of the dataset to use for storage.
                            schema:
                              type: string
                              required: true
                              default: "storage_entry"
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                    - variable: cifs_config
                      label: SMB Configuration
                      description: The configuration for the SMB dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "cifs"]]
                        attrs:
                          - variable: server
                            label: Server
                            description: The server to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: path
                            label: Path
                            description: The path to mount the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: username
                            label: Username
                            description: The username to use for the SMB share.
                            schema:
                              type: string
                              required: true
                          - variable: password
                            label: Password
                            description: The password to use for the SMB share.
                            schema:
                              type: string
                              required: true
                              private: true
                          - variable: domain
                            label: Domain
                            description: The domain to use for the SMB share.
                            schema:
                              type: string
                    - variable: nfs_config
                      label: NFS Configuration
                      description: The configuration for the NFS dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "nfs"]]
                        attrs:
                          - variable: server
                            label: Server
                            description: The server to mount the NFS share.
                            schema:
                              type: string
                              required: true
                          - variable: path
                            label: Path
                            description: The path to mount the NFS share.
                            schema:
                              type: string
                              required: true

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: web
                            description: web
                          - value: worker
                            description: worker
                          - value: cron
                            description: cron
                          - value: redis
                            description: redis
                          - value: redis-http
                            description: redis-http
                          - value: postgres
                            description: postgres

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for Inbox Zero.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for Inbox Zero.
                schema:
                  type: int
                  default: 4096
                  required: true
