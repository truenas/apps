resources:
  limits:
    cpus: 2.0
    memory: 4096

ci: true

TZ: Etc/UTC

inbox_zero:
  app_url: http://localhost:8080
  bypass_premium_checks: true
  email_send_enabled: true
  ai_model_settings_disabled: false

  auth_secret: aaaaaabbbbbbbcccccccdfdddddeeeeefffffaaaaabbbbbcccddddffffffffff
  internal_api_key: bbbbbbccccccddddddeeeeeeffffffaaaaaabbbbbbccccccddddddeeeeeeff
  email_encrypt_secret: ccccccddddddeeeeeeffffffaaaaaabbbbbbccccccddddddeeeeeeffffffaa
  email_encrypt_salt: ddddddeeeeeeffffffaaaaaabbbbbbcc
  cron_secret: eeeeeeffffffaaaaaabbbbbbccccccddddddeeeeeeffffffaaaaaabbbbbbcccc
  db_password: secret

  external_api_enabled: false
  api_key_salt: ""

  google_client_id: skipped
  google_client_secret: skipped
  google_pubsub_topic_name: projects/test/topics/test
  google_pubsub_verification_token: ""

  microsoft_auth:
    enabled: false
    client_id: ""
    client_secret: ""
    tenant_id: "common"
    webhook_client_state: ""

  llm:
    default_llms: "openrouter:anthropic/claude-sonnet-4.6"
    economy_llms: ""
    chat_llms: ""
    nano_llms: ""
    draft_llms: ""
    llm_api_key: "test-llm-key"
    anthropic_api_key: ""
    openai_api_key: ""
    google_api_key: ""
    openrouter_api_key: ""
    groq_api_key: ""

  queue:
    redis_password: secret
    upstash_redis_token: aaaaaabbbbbbbcccccccdfdddddeeeeefffffaaaaabbbbbcccddddffffffffff
    queue_backend: bullmq
    qstash_token: ""
    qstash_current_signing_key: ""
    qstash_next_signing_key: ""

  features:
    digest_enabled: false
    follow_up_reminders_enabled: false
    meeting_briefs_enabled: false
    contacts_enabled: false
    webhook_action_enabled: true
    delete_email_action_enabled: false
    auto_draft_disabled: false

  meeting_recorder:
    enabled: false
    recall_api_key: ""
    recall_webhook_secret: ""
    recall_region: "us-west-2"

  resend:
    api_key: ""
    from_email: ""

  access:
    admins: ""
    auth_allowed_emails: ""
    auth_allowed_email_domains: ""
    auto_join_organization_enabled: false

  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080
  networks: []

ix_volumes:
  postgres_data: /opt/tests/mnt/inbox-zero/postgres_data
  redis_data: /opt/tests/mnt/inbox-zero/redis_data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  redis_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: redis_data
      create_host_path: true
  additional_storage: []
