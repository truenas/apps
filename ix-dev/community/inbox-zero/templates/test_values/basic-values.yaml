resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

inbox_zero:
  postgres_image_selector: postgres_18_image
  db_password: secret
  redis_password: secret
  base_url: http://localhost:8080
  auth_secret: 0123456789abcdef0123456789abcdef
  email_encrypt_secret: 0123456789abcdef0123456789abcdef
  email_encrypt_salt: 0123456789abcdef
  auth_provider: google
  google:
    client_id: test-client-id
    client_secret: test-client-secret
    pubsub_topic_name: projects/test/topics/inbox-zero
  microsoft:
    client_id: ""
    client_secret: ""
  llm:
    provider: anthropic
    model: ""
    api_key: test-api-key
    base_url: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  postgres_data: /opt/tests/mnt/inbox-zero/postgres_data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
