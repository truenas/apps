images:
  image:
    repository: ghcr.io/sethforprivacy/simple-monerod
    tag: "v0.18.5.4@sha256:465a9458f148d31748731cfb6bc1ab38289313dcb858a699838ab8d1b828578d"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.1@sha256:d1bdb3a3ed7fc158eca53cd78486c388345c603fe2bf42fb24a1e03e1068ff38"

consts:
  perms_container_name: permissions
  monerod_container_name: monerod
  run_as_user: 1000
  run_as_group: 1000
  reserved_flags:
    - --anonymous-inbound
    - --non-interactive
    - --rpc-bind-port
    - --rpc-restricted-bind-ip
    - --rpc-restricted-bind-ipv6-address
    - --rpc-restricted-bind-port
    - --zmq-rpc-bind-ip
    - --zmq-rpc-bind-port
    - --confirm-zmq-rpc-external-bind
    - --zmq-pub
    - --confirm-external-bind
    - --no-igd
    - --no-zmq
    - --prune-blockchain
    - --public-node
    - --hide-my-port
    - --enable-dns-blocklist
    - --p2p-use-ipv6
    - --rpc-use-ipv6
    - --tx-proxy
    - --proxy
    - --pad-transactions
    - --p2p-bind-port
    - --p2p-bind-ip
    - --ban-list
