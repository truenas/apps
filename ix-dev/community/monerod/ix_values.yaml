images:
  image:
    repository: ghcr.io/sethforprivacy/simple-monerod
    tag: "v0.18.5.4@sha256:e3daef3c78669a1421f06ee43fbeaf263b67794528aba7a70db1007a13721b33"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: "1.1.0@sha256:a83d6da5e963ffcc20dca98fdd713713065a7c4bab248db1d100406be78df9b8"

consts:
  perms_container_name: permissions
  monerod_container_name: monerod
  run_as_user: 1000
  run_as_group: 1000
  reserved_flags:
    - --anonymous-inbound
    - --non-interactive
    - --rpc-bind-port
    - --rpc-restricted-bind-ip
    - --rpc-restricted-bind-ipv6-address
    - --rpc-restricted-bind-port
    - --zmq-rpc-bind-ip
    - --zmq-rpc-bind-port
    - --confirm-zmq-rpc-external-bind
    - --zmq-pub
    - --confirm-external-bind
    - --no-igd
    - --no-zmq
    - --prune-blockchain
    - --public-node
    - --hide-my-port
    - --enable-dns-blocklist
    - --p2p-use-ipv6
    - --rpc-use-ipv6
    - --tx-proxy
    - --proxy
    - --pad-transactions
    - --p2p-bind-port
    - --p2p-bind-ip
    - --ban-list
