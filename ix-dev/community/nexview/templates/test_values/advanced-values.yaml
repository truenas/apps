resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Europe/Berlin

nexview:
  secret_key: "a-test-secret-key-long-enough-for-this-scenario"
  log_level: "detailed"
  access_token_minutes: 60
  refresh_token_days: 90
  additional_envs:
    - name: NEXVIEW_EXTRA_TEST
      value: "1"

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  data: /opt/tests/mnt/nexview-advanced/data
  extra: /opt/tests/mnt/nexview-advanced/extra

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /mnt/extra
      read_only: true
      ix_volume_config:
        dataset_name: extra
        create_host_path: true
