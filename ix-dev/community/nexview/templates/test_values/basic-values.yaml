resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

nexview:
  secret_key: ""
  log_level: ""
  access_token_minutes: 30
  refresh_token_days: 30
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/nexview/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
