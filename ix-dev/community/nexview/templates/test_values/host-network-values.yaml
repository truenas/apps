resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Europe/Berlin

nexview:
  secret_key: a-test-secret-key-long-enough-for-this-scenario
  access_token_minutes: 30
  refresh_token_days: 30
  port_number: 8123
  client_ip: proxy
  additional_envs:
    - name: EXTRA_ONE
      value: first

run_as:
  user: 568
  group: 568

network:
  host_network: true
  web_port:
    bind_mode: ""
    port_number: 8123

ix_volumes:
  data: /opt/tests/mnt/nexview/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
