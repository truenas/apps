resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

piper:
  voice: en_GB-alan-low
  speaker: ""
  length_scale: "1.2"
  noise_scale: "0.5"
  noise_w_scale: ""
  additional_envs:
    - name: WYOMING_PIPER_ARGS
      value: "--debug"

run_as:
  user: 568
  group: 568

network:
  wyoming_port:
    bind_mode: published
    port_number: 8081

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/piper/data
  additional_storage: []
