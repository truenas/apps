resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

piper:
  voice: en_US-lessac-medium
  length_scale: "1.0"
  noise_scale: "0.667"
  noise_w: "0.333"
  speaker: 0
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  wyoming_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/piper/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage: []
