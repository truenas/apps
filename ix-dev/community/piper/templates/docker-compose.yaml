{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.piper_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("tcp", {"port": values.consts.internal_wyoming_port}) %}
{# Voice downloads on first start can take a while #}
{% do c1.healthcheck.set_start_period(300) %}

{# The image entrypoint already sets --uri and --data-dir, these args are appended #}
{% set cmd = ["--voice", values.piper.voice] %}
{% if values.piper.speaker %}
  {% do cmd.extend(["--speaker", values.piper.speaker]) %}
{% endif %}
{% if values.piper.length_scale %}
  {% do cmd.extend(["--length-scale", values.piper.length_scale]) %}
{% endif %}
{% if values.piper.noise_scale %}
  {% do cmd.extend(["--noise-scale", values.piper.noise_scale]) %}
{% endif %}
{% if values.piper.noise_w_scale %}
  {% do cmd.extend(["--noise-w-scale", values.piper.noise_w_scale]) %}
{% endif %}
{% do c1.set_command(cmd) %}

{% do c1.environment.add_user_envs(values.piper.additional_envs) %}
{% do c1.add_port(values.network.wyoming_port, {"container_port": values.consts.internal_wyoming_port}) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{{ tpl.render() | tojson }}
