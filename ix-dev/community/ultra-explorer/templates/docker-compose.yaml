{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.ultra_container_name, "image") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_read_only(true) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/api/health"}) %}

{% do c1.environment.add_env("ULTRA_BIND", "0.0.0.0:%d"|format(values.network.web_port.port_number)) %}
{% do c1.environment.add_env("ULTRA_DATA_DIR", values.consts.data_dir_path) %}
{% do c1.environment.add_env("ULTRA_ADMIN_PASSWORD", values.ultra_explorer.admin_password) %}
{% do c1.environment.add_env("ULTRA_SECURE_COOKIES", values.ultra_explorer.secure_cookies) %}

{% set mount_paths = values.storage.additional_storage | map(attribute="mount_path") | list %}
{% for root in values.ultra_explorer.local_roots %}
  {% if root not in mount_paths %}
    {% do tpl.funcs.fail("Expected [ultra_explorer.local_roots] [%s] to be the mount path of an [storage.additional_storage] entry"|format(root)) %}
  {% endif %}
  {% if root == values.consts.data_dir_path or root.startswith(values.consts.data_dir_path ~ "/") %}
    {% do tpl.funcs.fail("Expected [ultra_explorer.local_roots] [%s] to be outside [%s]"|format(root, values.consts.data_dir_path)) %}
  {% endif %}
{% endfor %}
{# Ultra Explorer only browses local folders inside these roots; the image ships an empty default. #}
{% do c1.environment.add_env("ULTRA_LOCAL_ROOTS", values.ultra_explorer.local_roots|join(":") if values.ultra_explorer.local_roots else values.consts.default_local_root) %}

{% do c1.environment.add_user_envs(values.ultra_explorer.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_dir_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64, "uid": values.run_as.user, "gid": values.run_as.group}}) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
