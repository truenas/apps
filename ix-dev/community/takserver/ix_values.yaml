consts:
  app_container_name: takserver
  db_container_name: takserver-db
  certs_container_name: takserver-certs
  perms_container_name: takserver-perms

  config_path: /tak/config
  tak_config_path: /opt/tak/config
  logs_path: /opt/tak/logs

  notes_body: |
    # TAK Server

    First start takes several minutes while the certificate authority, database schema and JVMs initialize.

    ## Retrieving certificates

    The CA and all client certificates are in the `certs` storage volume:

    ```bash
    docker cp ix-takserver-1:/opt/tak/certs/files/admin.p12 /tmp/
    docker cp ix-takserver-1:/opt/tak/certs/files/root-ca.pem /tmp/
    docker exec ix-takserver-1 grep '^ADMIN_CERT_PASS=' /opt/tak/config/secrets.env
    ```

    Import `admin.p12` into your browser as a client certificate, and trust `root-ca.pem` as a CA, to access the admin console at `https://<host>:8443`.

    ## Client connections

    - CoT streaming: port 8089
    - Web/admin console: port 8443
    - Certificate enrollment: port 8446

    PostgreSQL port 5432 is never published.

    ## EULA

    TAK Server is subject to the TAK Product Center terms of use. Deploying this app confirms you have the right to use the upstream images.
