resources:
  limits:
    cpus: 2
    memory: 8192

takserver:
  ca_name: TAK-CA
  country: US
  state: State
  city: City
  organization: TAK
  organizational_unit: TAK
  db_password: Tak-Db-Pass-123
  server_addresses: tak.example.com 192.168.1.50
  admin_cert_name: admin
  users:
    - user1
    - user2
  client_certs: []
  user_groups: ""
  additional_envs: []

network:
  cot_port:
    bind_mode: published
    port_number: 30089
  web_port:
    bind_mode: published
    port_number: 30443
  enrollment_port:
    bind_mode: published
    port_number: 30446

ix_volumes:
  takserver_config: /opt/tests/mnt/takserver/config
  takserver_certs: /opt/tests/mnt/takserver/certs
  takserver_db: /opt/tests/mnt/takserver/db
  takserver_logs: /opt/tests/mnt/takserver/logs

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: takserver_config
      create_host_path: true
  certs:
    type: ix_volume
    ix_volume_config:
      dataset_name: takserver_certs
      create_host_path: true
  db:
    type: ix_volume
    ix_volume_config:
      dataset_name: takserver_db
      create_host_path: true
  logs:
    type: ix_volume
    ix_volume_config:
      dataset_name: takserver_logs
      create_host_path: true
