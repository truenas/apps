{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.bombvault_container_name, "image") %}
{% set host_data_path = tpl.funcs.get_host_path(values.storage.host_data) %}

{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"]) %}
{% do c1.healthcheck.set_custom_test(["CMD", "/usr/local/bin/bombvault", "healthcheck"]) %}

{% do c1.environment.add_env("APP_KEY", values.bombvault.app_key) %}
{% do c1.environment.add_env("PLATFORM", "truenas") %}
{% do c1.environment.add_env("DATA_DIR", values.consts.config_path) %}
{% do c1.environment.add_env("HOST_SOURCE_ROOT", host_data_path) %}
{% do c1.environment.add_env("HOST_MOUNT_ROOT", host_data_path) %}
{% do c1.environment.add_env("HTTP_ONLY", values.bombvault.http_only) %}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("HTTPS_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_user_envs(values.bombvault.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_docker_socket() %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% set host_data = values.storage.host_data %}
{% if host_data.type == "host_path" %}
  {% set host_data = dict(host_data, host_path_config=dict(host_data.host_path_config, propagation="rslave")) %}
{% endif %}
{% do c1.add_storage(host_data_path, host_data) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "http" if values.bombvault.http_only else "https"}) %}

{{ tpl.render() | tojson }}
