resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

bombvault:
  app_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  http_only: false
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 38080

ix_volumes:
  config: /opt/tests/mnt/bombvault/config
  host_data: /opt/tests/mnt/bombvault/host_data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  host_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: host_data
      create_host_path: true
  additional_storage: []
