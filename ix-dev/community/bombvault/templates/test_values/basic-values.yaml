resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Etc/UTC

bombvault:
  # Not a real secret: 64 hex characters, the length the schema requires.
  app_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  http_only: false
  backup_max_hours: null
  self_container_name: ""
  additional_envs: []

vm_backup:
  libvirt_uri: ""
  libvirt_host: host.docker.internal
  libvirt_ssh_user: root
  libvirt_ssh_port: 22

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30443
    host_ips: []
  http_port:
    bind_mode: published
    port_number: 30300
    host_ips: []

ix_volumes:
  config: /opt/tests/mnt/bombvault/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  host_data: /opt/tests/mnt/bombvault/hostdata
  # The deploy test runs against a path that does not exist yet, so it has to
  # be created here. A real install leaves this off and points at an existing
  # pool or dataset.
  host_data_create: true
  additional_storage: []

labels: []
