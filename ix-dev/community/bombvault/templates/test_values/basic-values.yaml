resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

bombvault:
  app_key: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  config: /opt/tests/mnt/bombvault/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  host_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/bombvault/host_data
      create_host_path: true
  additional_storage: []
