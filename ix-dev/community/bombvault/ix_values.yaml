# Static values, not exposed to the user.
#
# `tag` is the published container image tag, which has no "v" prefix, unlike
# the git release tag. Keep it in step with app.yaml's app_version.
images:
  image:
    repository: ghcr.io/junkerderprovinz/bombvault
    tag: 8.3.1

consts:
  bombvault_container_name: bombvault
  config_path: /config
  host_data_path: /host/user
  # Container-internal ports, matching the image's own defaults. Only the
  # host-side published port is user-configurable.
  internal_https_port: 3443
  internal_http_port: 3000
