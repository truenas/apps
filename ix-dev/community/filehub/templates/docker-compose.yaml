{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.filehub_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": 1000, "gid": 1000, "mode": "check"} %}

{# Image runs as user filehub (uid/gid 1000). It does not honor PUID/PGID. #}
{% do c1.set_user(1000, 1000) %}
{% do c1.environment.remove_auto_env("PUID") %}
{% do c1.environment.remove_auto_env("PGID") %}
{% do c1.environment.remove_auto_env("UID") %}
{% do c1.environment.remove_auto_env("GID") %}
{% do c1.environment.remove_auto_env("USER_ID") %}
{% do c1.environment.remove_auto_env("GROUP_ID") %}

{# Debian slim has bash and grep; /api/health returns 200. The image does not ship curl or wget. #}
{% do c1.healthcheck.set_test("http", {"port": values.consts.internal_web_port, "path": "/api/health"}) %}

{% do c1.environment.add_env("LISTEN_ADDR", ":" ~ values.consts.internal_web_port) %}
{% do c1.environment.add_env("DATA_ROOT", "/data/files") %}
{% do c1.environment.add_env("DB_PATH", "/data/filehub.db") %}
{% do c1.environment.add_env("THUMB_CACHE_DIR", "/data/thumbs") %}
{% do c1.environment.add_env("THUMB_ENABLE", "true") %}
{% do c1.environment.add_env("THUMB_VAAPI", "false") %}
{% do c1.environment.add_env("SECURE_COOKIES", "true" if values.filehub.secure_cookies else "false") %}
{% do c1.environment.add_env("CREDENTIALS_FILE", "/data/admin-credentials.txt") %}
{% do c1.environment.add_env("DOTENV_FILE", "/data/.env") %}
{% do c1.environment.add_user_envs(values.filehub.additional_envs) %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
{% endif %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}

{% do tpl.notes.add_info("On first start, if ADMIN_PASSWORD is unset, Filehub writes a generated admin password once to /data/admin-credentials.txt (and /data/.env). Sign in as admin, then change the password under Settings → Change password.") %}
{% do tpl.notes.add_info("The image runs as uid 1000 (user filehub) and does not support PUID/PGID. The published image is linux/amd64 only.") %}
{% do tpl.notes.add_info("Leave Secure Cookies off for the default http://IP:port portal. Turn it on when the Web UI is served over HTTPS (reverse proxy).") %}

{{ tpl.render() | tojson }}
