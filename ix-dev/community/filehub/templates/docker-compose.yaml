{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.filehub_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/api/health"}) %}

{% do c1.environment.add_env("LISTEN_ADDR", ":%d"|format(values.network.web_port.port_number)) %}
{% do c1.environment.add_env("DATA_ROOT", "%s/files"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("DB_PATH", "%s/filehub.db"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("THUMB_CACHE_DIR", "%s/thumbs"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("THUMB_ENABLE", true) %}
{% do c1.environment.add_env("THUMB_VAAPI", tpl.funcs.has_any_gpu()) %}
{% do c1.environment.add_env("SECURE_COOKIES", values.filehub.secure_cookies) %}
{% do c1.environment.add_env("ADMIN_USER", values.filehub.admin_username) %}
{% do c1.environment.add_env("ADMIN_PASSWORD", values.filehub.admin_password) %}
{% do c1.environment.add_env("CREDENTIALS_FILE", "%s/admin-credentials.txt"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("DOTENV_FILE", "%s/.env"|format(values.consts.data_path)) %}
{% do c1.environment.add_user_envs(values.filehub.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
