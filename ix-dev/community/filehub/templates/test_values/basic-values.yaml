resources:
  limits:
    cpus: 2.0
    memory: 4096

filehub:
  admin_username: admin
  admin_password: password
  secure_cookies: false
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  data: /opt/tests/mnt/filehub/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
