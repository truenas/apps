consts:
  corvus_container_name: corvus
  perms_container_name: permissions
  notes_body: |
    ## First Login

    Corvus has no default username or password.

    1. Open `https://<host>:<Admin Console Port>` and accept the self-signed certificate warning.
    2. Enter the one-time setup token. Corvus writes it to the app logs on start
       (Apps > corvus > Logs, line with `setup_token`).
    3. Create the administrator account.

    ## Ports

    The HTTP and HTTPS ports serve the proxied sites.
    For Let's Encrypt HTTP-01 certificates, port 80 of your public address
    must reach the HTTP port of this app (or use DNS-01 instead).
