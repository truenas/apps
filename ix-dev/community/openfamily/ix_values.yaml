images:
  image:
    repository: ghcr.io/nexaflowfrance/openfamily-server
    tag: "1.6.0"
  client_image:
    repository: ghcr.io/nexaflowfrance/openfamily-client
    tag: "1.6.0"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2
  postgres_17_image:
    repository: postgres
    tag: 17.10-bookworm
  postgres_18_image:
    repository: postgres
    tag: 18.4-trixie
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: 1.2.11

consts:
  # The web client's bundled nginx config proxies /api, /ws and /health to a
  # fixed upstream hostname of "server" baked into the published image, so this
  # container's name cannot be changed.
  server_container_name: server
  client_container_name: openfamily
  postgres_container_name: postgres
  perms_container_name: permissions
  db_user: openfamily
  db_name: openfamily
  server_port: 3001
  client_port: 80
  uploads_path: /app/uploads
