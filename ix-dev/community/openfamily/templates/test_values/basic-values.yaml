resources:
  limits:
    cpus: 2.0
    memory: 4096

openfamily:
  jwt_secret: "test-jwt-secret-please-change-me-0123456789"
  registration_enabled: true
  db_password: secret
  cors_origins: []
  app_public_url: ""
  smtp:
    host: ""
    port: 587
    secure: false
    username: ""
    password: ""
    mail_from: ""
    support_email: ""
  vapid:
    public_key: ""
    private_key: ""
    subject: ""
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 31600

ix_volumes:
  uploads: /opt/tests/mnt/openfamily/uploads
  postgres_data: /opt/tests/mnt/openfamily/postgres_data

storage:
  uploads:
    type: ix_volume
    ix_volume_config:
      dataset_name: uploads
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
