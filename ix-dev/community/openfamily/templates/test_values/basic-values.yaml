resources:
  limits:
    cpus: 2.0
    memory: 4096

openfamily:
  postgres_image_selector: postgres_18_image
  db_password: secret
  jwt_secret: "test-jwt-secret-please-change-me-0123456789"
  registration_enabled: true
  cors_origins: []
  app_public_url: ""
  enable_web_push: false
  vapid:
    public_key: ""
    private_key: ""
    subject: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  uploads: /opt/tests/mnt/openfamily/uploads
  postgres_data: /opt/tests/mnt/openfamily/postgres_data

storage:
  uploads:
    type: ix_volume
    ix_volume_config:
      dataset_name: uploads
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
