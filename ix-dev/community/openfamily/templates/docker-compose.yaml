{% set tpl = ix_lib.base.render.Render(values) %}

{% set openfamily_net = tpl.networks.create_internal("openfamily-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.openfamily.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.openfamily.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(openfamily_net) %}

{% set server = tpl.add_container(values.consts.server_container_name, "image") %}
{% do server.add_network(openfamily_net) %}

{% set client = tpl.add_container(values.consts.client_container_name, "client_image") %}
{% do client.add_network(openfamily_net) %}

{% do client.set_user(values.run_as.user, values.run_as.group) %}
{% do client.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]) %}
{% do client.healthcheck.set_test("wget", {"port": values.consts.client_port, "path": "/health"}) %}
{% do client.depends.add_dependency(values.consts.server_container_name, "service_healthy") %}
{% do client.add_port(values.network.web_port, {"container_port": values.consts.client_port}) %}

{% set tmpfs_config = {"type": "tmpfs", "tmpfs_config": {"size": 25, "uid": values.run_as.user, "gid": values.run_as.group}} %}
{% do client.add_storage("/tmp", tmpfs_config) %}
{% do client.add_storage("/var/run", tmpfs_config) %}
{% do client.add_storage("/var/cache/nginx", tmpfs_config) %}

{% do server.set_user(values.run_as.user, values.run_as.group) %}
{% do server.healthcheck.set_test("wget", {"port": values.consts.server_port, "path": "/health"}) %}
{% do server.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do server.environment.add_env("NODE_ENV", "production") %}
{% do server.environment.add_env("POSTGRES_HOST", values.consts.postgres_container_name) %}
{% do server.environment.add_env("POSTGRES_PORT", postgres.get_port()) %}
{% do server.environment.add_env("POSTGRES_DB", values.consts.db_name) %}
{% do server.environment.add_env("POSTGRES_USER", values.consts.db_user) %}
{% do server.environment.add_env("POSTGRES_PASSWORD", values.openfamily.db_password) %}
{% do server.environment.add_env("SERVER_PORT", values.consts.server_port) %}
{% do server.environment.add_env("JWT_SECRET", values.openfamily.jwt_secret) %}
{% do server.environment.add_env("REGISTRATION_ENABLED", values.openfamily.registration_enabled) %}
{% do server.environment.add_env("APP_PUBLIC_URL", values.openfamily.app_public_url) %}
{% do server.environment.add_env("CORS_ORIGINS", values.openfamily.cors_origins|join(",")) %}

{% if values.openfamily.vapid.enable_web_push %}
  {% do server.environment.add_env("VAPID_PUBLIC_KEY", values.openfamily.vapid.public_key) %}
  {% do server.environment.add_env("VAPID_PRIVATE_KEY", values.openfamily.vapid.private_key) %}
  {% do server.environment.add_env("VAPID_SUBJECT", values.openfamily.vapid.subject) %}
{% endif %}

{% do server.environment.add_user_envs(values.openfamily.additional_envs) %}

{% do server.add_storage("/app/uploads", values.storage.uploads) %}
{% do perm_container.add_or_skip_action("uploads", values.storage.uploads, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do server.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do server.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
