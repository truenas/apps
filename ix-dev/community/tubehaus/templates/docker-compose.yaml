{% set tpl = ix_lib.base.render.Render(values) %}

{% set net = tpl.networks.create_internal("tubehaus-net") %}

{% set web = tpl.add_container(values.consts.web_container_name, "web_image") %}
{% do web.add_network(net) %}
{% set server = tpl.add_container(values.consts.server_container_name, "image") %}
{% do server.add_network(net) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group} %}

{# the TubeHaus server: its own YouTube engine, the shared library, live captions, offline saves.
   HT_WARP=0: no VPN inside, no extra capabilities #}
{% do server.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do server.healthcheck.set_test("curl", {"port": values.consts.server_port, "path": "/api/p/health"}) %}
{% do server.environment.add_env("HT_WARP", "0") %}
{% do server.environment.add_env("HT_PORT", values.consts.server_port) %}
{% do server.environment.add_env("HT_STATE", values.consts.data_path) %}
{% do server.environment.add_env("HT_DOWNLOAD_DIR", "%s/dl"|format(values.consts.data_path)) %}
{% do server.environment.add_env("HOME", values.consts.data_path) %}
{% do server.environment.add_env("TUBEHAUS_AUTH", values.tubehaus.auth) %}
{% do server.environment.add_user_envs(values.tubehaus.additional_envs) %}
{% do server.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do server.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do server.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# the web app and its router (Caddy), the only published port #}
{% do web.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do web.healthcheck.set_test("wget", {"port": values.consts.web_port, "path": "/y/manifest.webmanifest", "busybox": true}) %}
{% do web.environment.add_env("TUBEHAUS_SITE", ":%s"|format(values.consts.web_port)) %}
{% do web.environment.add_env("TUBEHAUS_AUTH", values.tubehaus.auth) %}
{% do web.environment.add_env("TUBEHAUS_SERVER", "%s:%s"|format(values.consts.server_container_name, values.consts.server_port)) %}
{% do web.environment.add_env("XDG_CONFIG_HOME", "/tmp/caddy-config") %}
{% do web.environment.add_env("XDG_DATA_HOME", "/tmp/caddy-data") %}
{% do web.add_port(values.network.web_port, {"container_port": values.consts.web_port}) %}
{% do web.depends.add_dependency(values.consts.server_container_name, "service_healthy") %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
