resources:
  limits:
    cpus: 2.0
    memory: 4096

ci: true

tubehaus:
  auth: none
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/tubehaus/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
