{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.certkeeper_container_name, "image") %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# A stop waits for a running deployment to finish. #}
{% do c1.set_grace_period(180) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/healthz", "scheme": "https"}) %}
{% do c1.environment.add_env("CERTKEEPER_PORT", values.network.web_port.port_number) %}

{% if values.certkeeper.secret_key %}
  {% do c1.environment.add_env("CERTKEEPER_SECRET_KEY", values.certkeeper.secret_key) %}
{% endif %}

{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do c1.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
  {% do c1.environment.add_env("CERTKEEPER_TLS_CERT", values.consts.ssl_cert_path) %}
  {% do c1.environment.add_env("CERTKEEPER_TLS_KEY", values.consts.ssl_key_path) %}
{% endif %}

{% do c1.environment.add_user_envs(values.certkeeper.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/config", values.storage.config) %}
{% do perms.add_or_skip_action("config", values.storage.config, perms_config) %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https"}) %}

{{ tpl.render() | tojson }}
