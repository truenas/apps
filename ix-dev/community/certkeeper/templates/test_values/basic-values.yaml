resources:
  limits:
    cpus: 2.0
    memory: 1024

TZ: Etc/UTC

certkeeper:
  secret_key: ""
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8443
  certificate_id: null

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/certkeeper/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true

