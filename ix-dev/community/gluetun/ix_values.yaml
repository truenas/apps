images:
  image:
    repository: ghcr.io/qdm12/gluetun
    tag: v3.41.3
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  gluetun_container_name: gluetun
  data_path: /gluetun
  control_port: 8000
  http_proxy_port: 8888
  shadowsocks_port: 8388

resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

gluetun:
  vpn_service_provider: custom
  vpn_type: wireguard
  openvpn_user: ""
  openvpn_password: ""
  wireguard_private_key: ""
  wireguard_addresses: []
  wireguard_endpoint_ip: ""
  wireguard_endpoint_port: 51820
  wireguard_public_key: ""
  wireguard_preshared_key: ""
  updater_period: ""
  additional_envs: []

network:
  host_network: false
  control_port:
    bind_mode: published
    port_number: 30471
    container_port: 8000
  http_proxy_port:
    bind_mode: published
    port_number: 30472
    container_port: 8888
  shadowsocks_tcp_port:
    bind_mode: published
    port_number: 30473
    container_port: 8388
  shadowsocks_udp_port:
    bind_mode: published
    port_number: 30474
    container_port: 8388
  networks: []

ix_volumes:
  data: /opt/tests/mnt/gluetun/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
