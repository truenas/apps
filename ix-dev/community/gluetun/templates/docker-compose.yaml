{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.gluetun_container_name, "image") %}

{% do c1.add_caps(["NET_ADMIN"]) %}
{% do c1.add_tun_device() %}
{% do c1.healthcheck.set_custom_test(["CMD-SHELL", "/gluetun-entrypoint healthcheck"]) %}

{% do c1.environment.add_env("VPN_SERVICE_PROVIDER", values.gluetun.vpn_service_provider) %}
{% do c1.environment.add_env("VPN_TYPE", values.gluetun.vpn_type) %}

{% if values.gluetun.vpn_type == "openvpn" %}
  {% do c1.environment.add_env("OPENVPN_USER", values.gluetun.openvpn_user) %}
  {% do c1.environment.add_env("OPENVPN_PASSWORD", values.gluetun.openvpn_password) %}
{% elif values.gluetun.vpn_type == "wireguard" %}
  {% do c1.environment.add_env("WIREGUARD_PRIVATE_KEY", values.gluetun.wireguard_private_key) %}
  {% do c1.environment.add_env("WIREGUARD_ADDRESSES", values.gluetun.wireguard_addresses | map(attribute="address") | join(",")) %}
  {% do c1.environment.add_env("WIREGUARD_ENDPOINT_IP", values.gluetun.wireguard_endpoint_ip) %}
  {% do c1.environment.add_env("WIREGUARD_ENDPOINT_PORT", values.gluetun.wireguard_endpoint_port) %}
  {% do c1.environment.add_env("WIREGUARD_PUBLIC_KEY", values.gluetun.wireguard_public_key) %}
  {% do c1.environment.add_env("WIREGUARD_PRESHARED_KEY", values.gluetun.wireguard_preshared_key) %}
{% endif %}

{% if values.gluetun.updater_period %}
  {% do c1.environment.add_env("UPDATER_PERIOD", values.gluetun.updater_period) %}
{% endif %}

{% do c1.environment.add_user_envs(values.gluetun.additional_envs) %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.control_port, {"container_port": values.consts.control_port}) %}
  {% do c1.add_port(values.network.http_proxy_port, {"container_port": values.consts.http_proxy_port}) %}
  {% do c1.add_port(values.network.shadowsocks_tcp_port, {"container_port": values.consts.shadowsocks_port}) %}
  {% do c1.add_port(values.network.shadowsocks_udp_port, {"container_port": values.consts.shadowsocks_port, "protocol": "udp"}) %}
{% endif %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{{ tpl.render() | tojson }}
