resources:
  limits:
    cpus: 2.0
    memory: 4096

frameleaf:
  postgres_image_selector: pgvector_19_image
  enable_ml: true
  ml_image_selector: ml_image
  shm_size_mb: 2048
  hugging_face_endpoint: ""
  db_password: test-password
  additional_envs: []
  ml_additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  postgres-data: /opt/tests/mnt/frameleaf/postgres-data
  data: /opt/tests/mnt/frameleaf/data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres-data
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  ml_cache:
    type: temporary
  additional_storage: []
