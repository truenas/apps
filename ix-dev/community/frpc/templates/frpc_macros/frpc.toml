{%- macro frpc_toml(values) %}
serverAddr = {{ values.frpc.server_addr | tojson }}
serverPort = {{ values.frpc.server_port }}
{%- if values.frpc.login_user %}
user = {{ values.frpc.login_user | tojson }}
{%- endif %}
{%- if values.frpc.auth_token %}
auth.token = {{ values.frpc.auth_token | tojson }}
{%- endif %}
{%- if values.network.web_server %}

webServer.addr = "0.0.0.0"
webServer.port = {{ values.network.web_port.port_number }}
{%- if values.network.web_server_user %}
webServer.user = {{ values.network.web_server_user | tojson }}
{%- endif %}
{%- if values.network.web_server_password %}
webServer.password = {{ values.network.web_server_password | tojson }}
{%- endif %}
{%- endif %}
{%- endmacro %}
