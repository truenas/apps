frpc:
  server_addr: frps.example.com
  server_port: 7000
  login_user: frpuser
  auth_token: testtoken1234567890
  additional_settings:
    - param: transport.heartbeatTimeout
      value: "60"
  proxies:
    - name: web-tcp
      type: tcp
      local_ip: 127.0.0.1
      local_port: 8080
      remote_port: 18080
      secret_key: ""
      additional_settings:
        - param: transport.useEncryption
          value: "true"
    - name: srv-stcp
      type: stcp
      local_ip: 127.0.0.1
      local_port: 22
      remote_port: 0
      secret_key: testsecretkey123
      additional_settings: []
  visitors:
    - name: visit-stcp
      type: stcp
      proxy_name: remote-srv
      secret_key: testsecretkey456
      bind_addr: 127.0.0.1
      bind_port: 34567
  additional_envs: []
run_as:
  user: 568
  group: 568
network:
  web_port:
    bind_mode: ""
    port_number: 7400
    host_ips: []
  web_server_user: ""
  web_server_password: ""
storage:
  additional_storage: []
labels: []
resources:
  limits:
    cpus: 2
    memory: 4096
