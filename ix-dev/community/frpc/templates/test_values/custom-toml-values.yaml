frpc:
  custom_toml: true
  custom_toml_text: |
    serverAddr = "frps.example.com"
    serverPort = 7000

    auth.method = "token"
    auth.token = "testtoken1234567890"

    [[proxies]]
    name = "ssh-stcp"
    type = "stcp"
    secretKey = "testsecretkey123"

    [[proxies]]
    name = "web-tcp"
    type = "tcp"
    localIP = "127.0.0.1"
    localPort = 8080
    remotePort = 8080
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: true
  web_server: false

storage:
  additional_storage: []

labels: []

resources:
  limits:
    cpus: 1
    memory: 256
