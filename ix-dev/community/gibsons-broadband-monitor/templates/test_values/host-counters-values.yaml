TZ: Etc/UTC
monitor:
  dashboard_password: validation-password-only
  secret_key: validation-session-secret-32-characters
  host_counters: true
  additional_envs: []
network:
  web_port:
    bind_mode: published
    port_number: 18765
ix_volumes:
  data: /opt/tests/mnt/data
storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/data
      create_host_path: true
resources:
  limits:
    cpus: 2
    memory: 1024
