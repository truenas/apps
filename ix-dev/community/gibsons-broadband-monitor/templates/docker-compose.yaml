{% set tpl = ix_lib.base.render.Render(values) %}
{% set c1 = tpl.add_container(values.consts.container_name, "image") %}
{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "SETUID", "SETGID"]) %}
{% do c1.healthcheck.set_custom_test(["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3).read()"] ) %}
{% do c1.environment.add_env("DASHBOARD_PASSWORD", values.monitor.dashboard_password) %}
{% do c1.environment.add_env("SECRET_KEY", values.monitor.secret_key) %}
{% do c1.environment.add_user_envs(values.monitor.additional_envs) %}
{% do c1.add_storage("/data", values.storage.data) %}
{% if values.monitor.host_counters %}
  {% do c1.add_storage("/host/proc/net", {"type": "host_path", "read_only": true, "host_path_config": {"path": "/proc/1/net", "create_host_path": false}}) %}
{% endif %}
{% do c1.add_port(values.network.web_port, {"container_port": 8765}) %}
{% do tpl.portals.add(values.network.web_port) %}
{{ tpl.render() | tojson }}
