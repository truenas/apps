images:
  image:
    repository: ghcr.io/prusa3d/prusa-connect
    tag: "0.1.0-beta.1@sha256:5dbb69a3d1bb3ebad9c933e9aaec6bb59cf2e2e531b93be4919b9e13ccb7370a"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.2@sha256:6ddfdc314af9d18cfacb836ad266ef0ed91fecaa3686b20be72e464972860c08"

consts:
  prusa_container_name: prusa-connect
  config_container_name: config
  perms_container_name: permissions
  run_as_user: 10001
  run_as_group: 10001
  config_path: /config
  storage_path: /storage

  notes_body: |
    On the first start, open the app logs and copy the setup code printed under
    "This server is not set up yet". Each restart prints a new code until setup is done.

    This is a beta release of Prusa Connect. Take a snapshot of both datasets before updating the app.

    Point printers at this TrueNAS address and the web port in `prusa_printer_settings.ini`,
    or download that file from the Add a printer page.

    The app owns `core.api.addr`, `core.log.level` and `resources.storage.local` in
    `/config/config.yaml` and resets them on every start. With host networking it also
    owns `core.discovery.host_records`. Other keys you add there are kept,
    but add only keys that Prusa Connect documents. A key this build does not read in
    `/config/config.yaml` stops the server from starting until you remove it.

    If you turn on encryption in the setup wizard, publish the printer listener port it chooses
    under Additional Ports. The time server (UDP 123) and the printer logs extension
    (UDP 13514 and 8514) also need Additional Ports, and the time server does not work
    with host networking.
