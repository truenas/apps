TZ: Europe/Brussels

resources:
  limits:
    cpus: 2.0
    memory: 4096

prusa:
  log_level: info
  additional_envs: []

network:
  host_network: true
  additional_ports: []
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  config: /opt/tests/mnt/prusa-connect/config
  data: /opt/tests/mnt/prusa-connect/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
