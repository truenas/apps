{% import "macros/config.sh" as config_macro %}

{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.prusa_container_name, "image") %}
{% set config = tpl.add_container(values.consts.config_container_name, "container_utils_image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{% set cfg = [
  {"core.api.addr": ":%d"|format(values.network.web_port.port_number)},
  {"core.log.level": values.prusa.log_level},
  {"resources.storage.local.type": "filesystem"},
  {"resources.storage.local.required": true},
  {"resources.storage.local.config.root": values.consts.storage_path},
] %}

{% do config.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do config.setup_as_helper() %}
{% do config.configs.add("config.sh", config_macro.config(values=values, cfg=cfg), "/setup/config.sh", "0755") %}
{% do config.set_entrypoint(["/bin/sh", "/setup/config.sh"]) %}
{% do config.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perm_config) %}

{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do c1.set_read_only(true) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs"}) %}
{% do c1.healthcheck.set_custom_test(["CMD", "/prusa_connect", "core", "healthcheck"]) %}
{% do c1.healthcheck.set_start_period(30) %}
{% do c1.healthcheck.set_retries(3) %}

{% do c1.add_port(values.network.web_port) %}
{% for port in values.network.additional_ports %}
  {% do c1.add_port(port) %}
{% endfor %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do c1.add_storage(values.consts.storage_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perm_config) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% do c1.depends.add_dependency(values.consts.config_container_name, "service_completed_successfully") %}
{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do config.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
