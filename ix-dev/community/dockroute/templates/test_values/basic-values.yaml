resources:
  limits:
    cpus: 2.0
    memory: 4096

ci: true

dockroute:
  provider: log
  owner_id: default
  policy: sync
  default_target: 192.0.2.10
  domain_filter: []
  resync_seconds: 60
  cloudflare_api_token: ""
  cloudflare_account_id: ""
  cloudflare_tunnel_id: ""
  additional_envs: []

network:
  host_network: false

run_as:
  user: 568
  group: 568

storage:
  additional_storage: []
