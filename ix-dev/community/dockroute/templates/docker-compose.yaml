{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.dockroute_container_name, "image") %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.disable() %}

{% do c1.environment.add_env("DOCKROUTE_PROVIDER", values.dockroute.provider) %}
{% do c1.environment.add_env("DOCKROUTE_OWNER_ID", values.dockroute.owner_id) %}
{% do c1.environment.add_env("DOCKROUTE_POLICY", values.dockroute.policy) %}
{% if values.dockroute.default_target %}
  {% do c1.environment.add_env("DOCKROUTE_DEFAULT_TARGET", values.dockroute.default_target) %}
{% endif %}
{% if values.dockroute.domain_filter %}
  {% do c1.environment.add_env("DOCKROUTE_DOMAIN_FILTER", values.dockroute.domain_filter) %}
{% endif %}
{% do c1.environment.add_env("DOCKROUTE_RESYNC_SECONDS", values.dockroute.resync_seconds) %}
{% if values.dockroute.provider == "cloudflare" %}
  {% do c1.environment.add_env("CLOUDFLARE_API_TOKEN", values.dockroute.cloudflare_api_token) %}
  {% if values.dockroute.cloudflare_account_id %}
    {% do c1.environment.add_env("CLOUDFLARE_ACCOUNT_ID", values.dockroute.cloudflare_account_id) %}
  {% endif %}
  {% if values.dockroute.cloudflare_tunnel_id %}
    {% do c1.environment.add_env("CLOUDFLARE_TUNNEL_ID", values.dockroute.cloudflare_tunnel_id) %}
  {% endif %}
{% endif %}
{% do c1.environment.add_user_envs(values.dockroute.additional_envs) %}

{# Github Actions Docker Group #}
{% if values.ci %}{% do c1.add_group(118) %}{% endif %}
{% do c1.add_docker_socket(read_only=True) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{{ tpl.render() | tojson }}
