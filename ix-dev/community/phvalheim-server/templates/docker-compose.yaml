{% set tpl = ix_lib.base.render.Render(values) %}
{% set game_start = values.network.game_port.port_number %}
{% set game_end = game_start + values.network.world_slots * 2 - 1 %}

{% if game_start % 2 != 0 %}
  {% do tpl.funcs.fail("Game UDP base port must be even. Each world reserves two consecutive ports.") %}
{% endif %}
{% if game_end > 65535 %}
  {% do tpl.funcs.fail("The game UDP range exceeds port 65535. Reduce the base port or world slots.") %}
{% endif %}
{% if not values.network.admin_port.host_ips %}
  {% do tpl.funcs.fail("Select at least one trusted host IP for the private admin interface.") %}
{% endif %}
{% for ip in values.network.admin_port.host_ips %}
  {% if ip in ["0.0.0.0", "::"] %}
    {% do tpl.funcs.fail("The private admin interface requires a specific trusted host IP, not a wildcard address.") %}
  {% endif %}
{% endfor %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID", "SYS_CHROOT"]) %}
{# The upstream PHP settings handler invokes its narrowly scoped sudo timezone helper. #}
{% do c1.remove_security_opt("no-new-privileges") %}
{% do c1.healthcheck.set_custom_test(["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ && curl -fsS -o /dev/null http://127.0.0.1:8081/"]) %}
{% do c1.healthcheck.set_start_period(300) %}
{% do c1.healthcheck.set_interval(30) %}
{% do c1.healthcheck.set_retries(10) %}
{% do c1.environment.add_user_envs(values.phvalheim.additional_envs) %}

{% do c1.add_port(values.network.public_port, {"container_port": 8080}) %}
{% do c1.add_port(values.network.admin_port, {"container_port": 8081}) %}
{% for port in range(game_start, game_end + 1) %}
  {% do c1.add_port(values.network.game_port, {"port_number": port, "container_port": port, "protocol": "udp"}) %}
{% endfor %}

{% do c1.add_storage("/opt/stateful", values.storage.data) %}
{% if values.storage.separate_backups %}
  {% do c1.add_storage("/opt/stateful/backups", values.storage.backups) %}
{% endif %}

{% do tpl.portals.add(values.network.admin_port, {"name": "Admin UI"}) %}
{% do tpl.portals.add(values.network.public_port, {"name": "Player Website"}) %}
{% do tpl.notes.add_info("Open the Admin UI to complete setup with your Steam Web API key, public website hostname and game DNS. Set the world Base Port to %d. The published UDP range is %d-%d, allowing %d world port pairs. Keep all world ports inside that range."|format(game_start, game_start, game_end, values.network.world_slots)) %}
{% do tpl.notes.add_info("Keep the Admin UI on a trusted network or tunnel. Forward only the player website and required game UDP ports to players. Preserve the data and backup storage through upgrades.") %}

{{ tpl.render() | tojson }}
