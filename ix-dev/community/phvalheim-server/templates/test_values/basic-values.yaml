resources:
  limits:
    cpus: 4
    memory: 8192
phvalheim:
  additional_envs: []
network:
  public_port:
    bind_mode: published
    port_number: 31539
    host_ips:
    - 127.0.0.1
  admin_port:
    bind_mode: published
    port_number: 31540
    host_ips:
    - 127.0.0.1
  game_port:
    bind_mode: published
    port_number: 31542
    host_ips:
    - 127.0.0.1
  world_slots: 2
ix_volumes:
  data: /opt/tests/phvalheim/data
  backups: /opt/tests/phvalheim/backups
storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  separate_backups: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
