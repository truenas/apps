resources:
  limits:
    cpus: 4
    memory: 8192
phvalheim:
  additional_envs: []
network:
  public_port:
    bind_mode: published
    port_number: 31549
    host_ips:
      - 127.0.0.1
  admin_port:
    bind_mode: published
    port_number: 31550
    host_ips:
      - 127.0.0.1
  game_port_range:
    bind_mode: published
    start: 31552
    end: 31555
    host_ips:
      - 127.0.0.1
storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/phvalheim-hostpath/data
      create_host_path: true
  additional_storage:
    - mount_path: /opt/stateful/backups
      type: host_path
      host_path_config:
        path: /opt/tests/phvalheim-hostpath/backups
        create_host_path: true
