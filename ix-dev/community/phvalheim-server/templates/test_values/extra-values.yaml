resources:
  limits:
    cpus: 2.0
    memory: 4096

phvalheim:
  additional_envs: []

network:
  public_port:
    bind_mode: exposed
    port_number: 8080
  admin_port:
    bind_mode: exposed
    port_number: 8081
  game_port_range:
    bind_mode: published
    start: 8082
    end: 8083
    host_ips: []

ix_volumes:
  data: /opt/tests/mnt/data
  backups: /opt/tests/mnt/backups

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /opt/stateful/backups
      ix_volume_config:
        dataset_name: backups
        create_host_path: true
    - type: anonymous
      mount_path: /scratchpad
      volume_config:
        nocopy: true
