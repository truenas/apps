resources:
  limits:
    cpus: 2
    memory: 4096
phvalheim:
  additional_envs: []
network:
  public_port:
    bind_mode: exposed
    port_number: 31559
  admin_port:
    bind_mode: published
    port_number: 31560
    host_ips:
    - 127.0.0.1
  game_port:
    bind_mode: published
    port_number: 31562
    host_ips:
    - 127.0.0.1
  world_slots: 1
ix_volumes:
  data: /opt/tests/phvalheim-single/data
  backups: /opt/tests/phvalheim-single/backups
storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  separate_backups: false
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
labels:
- key: org.phvalheim.test
  value: single-volume
  containers:
  - phvalheim
