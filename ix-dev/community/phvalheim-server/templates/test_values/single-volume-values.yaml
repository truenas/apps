resources:
  limits:
    cpus: 2
    memory: 4096
phvalheim:
  additional_envs: []
network:
  public_port:
    bind_mode: exposed
    port_number: 31559
  admin_port:
    bind_mode: exposed
    port_number: 31560
    host_ips: []
  game_port_range:
    bind_mode: published
    start: 31562
    end: 31563
    host_ips:
      - 127.0.0.1
ix_volumes:
  data: /opt/tests/phvalheim-single/data
storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
labels:
  - key: org.phvalheim.test
    value: single-volume
    containers:
      - phvalheim
