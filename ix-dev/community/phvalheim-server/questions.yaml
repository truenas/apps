groups:
- name: PhValheim Configuration
  description: Configure PhValheim
- name: Network Configuration
  description: Configure Network for PhValheim
- name: Storage Configuration
  description: Configure Storage for PhValheim
- name: Labels Configuration
  description: Configure Labels for PhValheim
- name: Resources Configuration
  description: Configure Resources for PhValheim
questions:
- variable: phvalheim
  label: ''
  group: PhValheim Configuration
  schema:
    type: dict
    attrs:
    - variable: additional_envs
      label: Additional Environment Variables
      schema:
        type: list
        default: []
        items:
        - variable: env
          label: Environment Variable
          schema:
            type: dict
            attrs:
            - variable: name
              label: Name
              schema:
                type: string
                required: true
            - variable: value
              label: Value
              schema:
                type: string
- variable: network
  label: ''
  group: Network Configuration
  schema:
    type: dict
    attrs:
    - variable: public_port
      label: Player Website Port
      description: Port for the player website. Internal HTTP port is 8080.
      schema:
        type: dict
        attrs:
        - variable: bind_mode
          label: Port Bind Mode
          description: 'The port bind mode.</br>

            - Publish: The port will be published on the host for external access.</br>

            - Expose: The port will be exposed for inter-container communication.</br>

            - None: The port will not be exposed or published.</br>

            Note: If the Dockerfile defines an EXPOSE directive,

            the port will still be exposed for inter-container communication regardless of this setting.

            '
          schema:
            type: string
            default: published
            enum:
            - value: published
              description: Publish port on the host for external access
            - value: exposed
              description: Expose port for inter-container communication
            - value: ''
              description: None
        - variable: port_number
          label: Port Number
          schema:
            type: int
            default: 30539
            min: 1
            max: 65535
            required: true
        - variable: host_ips
          label: Host IPs
          description: IPs on the host to bind this port
          schema:
            type: list
            show_if:
            - - bind_mode
              - '='
              - published
            default: []
            items:
            - variable: host_ip
              label: Host IP
              schema:
                type: string
                required: true
                $ref:
                - definitions/node_bind_ip
    - variable: admin_port
      label: Private Admin Port
      description: Choose a specific trusted host IP. Keep this interface private; internal HTTP port is 8081.
      schema:
        type: dict
        attrs:
        - variable: bind_mode
          label: Port Bind Mode
          description: Publish to the selected host IPs.
          schema:
            type: string
            default: published
            enum:
            - value: published
              description: Publish to selected trusted host IPs
        - variable: port_number
          label: Port Number
          schema:
            type: int
            default: 30540
            min: 1
            max: 65535
            required: true
        - variable: host_ips
          label: Host IPs
          description: IPs on the host to bind this port
          schema:
            type: list
            show_if:
            - - bind_mode
              - '='
              - published
            items:
            - variable: host_ip
              label: Host IP
              schema:
                type: string
                required: true
                $ref:
                - definitions/node_bind_ip
            min: 1
            required: true
    - variable: game_port
      label: Game UDP Base Port
      description: Use the same Base Port in the PhValheim setup wizard. It must be even. Host and container UDP
        ports match.
      schema:
        type: dict
        attrs:
        - variable: bind_mode
          label: Port Bind Mode
          description: Publish to the selected host IPs.
          schema:
            type: string
            default: published
            enum:
            - value: published
              description: Publish game UDP ports on the host
        - variable: port_number
          label: Port Number
          schema:
            type: int
            default: 25000
            min: 1
            max: 65535
            required: true
        - variable: host_ips
          label: Host IPs
          description: IPs on the host to bind this port
          schema:
            type: list
            show_if:
            - - bind_mode
              - '='
              - published
            default: []
            items:
            - variable: host_ip
              label: Host IP
              schema:
                type: string
                required: true
                $ref:
                - definitions/node_bind_ip
    - variable: world_slots
      label: World Port Slots
      description: 'Reserve two consecutive UDP ports per world. Default: 25000-25019 for ten worlds. Increase before
        allocating more worlds; compute and memory capacity still apply.'
      schema:
        type: int
        default: 10
        min: 1
        max: 100
        required: true
    - variable: dns_nameservers
      label: DNS Nameservers
      description: 'DNS nameservers for the container to use.</br>

        Example: 1.1.1.1

        '
      schema:
        type: list
        default: []
        items:
        - variable: option
          label: Option
          schema:
            type: string
            required: true
- variable: storage
  label: ''
  group: Storage Configuration
  schema:
    type: dict
    attrs:
    - variable: data
      label: PhValheim Data Storage
      description: Stores the database, worlds, game files, mods, configurations and Vibes projects. Preserve this
        entire dataset through upgrades.
      schema:
        type: dict
        attrs:
        - variable: type
          label: Type
          description: 'ixVolume: Is dataset created automatically by the system.</br>

            Host Path: Is a path that already exists on the system.

            '
          schema:
            type: string
            required: true
            default: ix_volume
            enum:
            - value: host_path
              description: Host Path (Path that already exists on the system)
            - value: ix_volume
              description: ixVolume (Dataset created automatically by the system)
        - variable: ix_volume_config
          label: ixVolume Configuration
          description: The configuration for the ixVolume dataset.
          schema:
            type: dict
            show_if:
            - - type
              - '='
              - ix_volume
            $ref:
            - normalize/ix_volume
            attrs:
            - variable: acl_enable
              label: Enable ACL
              description: Enable ACL for the storage.
              schema:
                type: boolean
                default: false
            - variable: dataset_name
              label: Dataset Name
              description: The name of the dataset to use for storage.
              schema:
                type: string
                required: true
                hidden: true
                default: data
            - variable: acl_entries
              label: ACL Configuration
              schema:
                type: dict
                show_if:
                - - acl_enable
                  - '='
                  - true
                attrs: []
        - variable: host_path_config
          label: Host Path Configuration
          schema:
            type: dict
            show_if:
            - - type
              - '='
              - host_path
            attrs:
            - variable: acl_enable
              label: Enable ACL
              description: Enable ACL for the storage.
              schema:
                type: boolean
                default: false
            - variable: acl
              label: ACL Configuration
              schema:
                type: dict
                show_if:
                - - acl_enable
                  - '='
                  - true
                attrs: []
                $ref:
                - normalize/acl
            - variable: path
              label: Host Path
              description: The host path to use for storage.
              schema:
                type: hostpath
                show_if:
                - - acl_enable
                  - '='
                  - false
                required: true
    - variable: separate_backups
      label: Use Separate Backup Storage
      description: Store world archives on a separate dataset. When disabled, backups remain inside the main data
        mount.
      schema:
        type: boolean
        default: true
    - variable: backups
      label: World Backups Storage
      description: Separate storage for world backup archives. These archives are not a full application dataset
        backup.
      schema:
        type: dict
        attrs:
        - variable: type
          label: Type
          description: 'ixVolume: Is dataset created automatically by the system.</br>

            Host Path: Is a path that already exists on the system.

            '
          schema:
            type: string
            required: true
            default: ix_volume
            enum:
            - value: host_path
              description: Host Path (Path that already exists on the system)
            - value: ix_volume
              description: ixVolume (Dataset created automatically by the system)
        - variable: ix_volume_config
          label: ixVolume Configuration
          description: The configuration for the ixVolume dataset.
          schema:
            type: dict
            show_if:
            - - type
              - '='
              - ix_volume
            $ref:
            - normalize/ix_volume
            attrs:
            - variable: acl_enable
              label: Enable ACL
              description: Enable ACL for the storage.
              schema:
                type: boolean
                default: false
            - variable: dataset_name
              label: Dataset Name
              description: The name of the dataset to use for storage.
              schema:
                type: string
                required: true
                hidden: true
                default: backups
            - variable: acl_entries
              label: ACL Configuration
              schema:
                type: dict
                show_if:
                - - acl_enable
                  - '='
                  - true
                attrs: []
        - variable: host_path_config
          label: Host Path Configuration
          schema:
            type: dict
            show_if:
            - - type
              - '='
              - host_path
            attrs:
            - variable: acl_enable
              label: Enable ACL
              description: Enable ACL for the storage.
              schema:
                type: boolean
                default: false
            - variable: acl
              label: ACL Configuration
              schema:
                type: dict
                show_if:
                - - acl_enable
                  - '='
                  - true
                attrs: []
                $ref:
                - normalize/acl
            - variable: path
              label: Host Path
              description: The host path to use for storage.
              schema:
                type: hostpath
                show_if:
                - - acl_enable
                  - '='
                  - false
                required: true
        show_if:
        - - separate_backups
          - '='
          - true
- variable: labels
  label: ''
  group: Labels Configuration
  schema:
    type: list
    default: []
    items:
    - variable: label
      label: Label
      schema:
        type: dict
        attrs:
        - variable: key
          label: Key
          schema:
            type: string
            required: true
        - variable: value
          label: Value
          schema:
            type: string
            required: true
        - variable: containers
          label: Containers
          description: Containers where the label should be applied
          schema:
            type: list
            items:
            - variable: container
              label: Container
              schema:
                type: string
                required: true
                enum:
                - value: phvalheim
                  description: phvalheim
- variable: resources
  label: ''
  group: Resources Configuration
  schema:
    type: dict
    attrs:
    - variable: limits
      label: Limits
      schema:
        type: dict
        attrs:
        - variable: cpus
          label: CPUs
          description: CPUs limit for PhValheim.
          schema:
            type: int
            default: 4
            required: true
        - variable: memory
          label: Memory (in MB)
          description: Memory limit for PhValheim.
          schema:
            type: int
            default: 8192
            required: true
