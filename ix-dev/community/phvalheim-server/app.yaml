- description: Phvalheim is able to change file ownership arbitrarily
  name: CHOWN
- description: Phvalheim is able to bypass file permission checks
  name: DAC_OVERRIDE
- description: Phvalheim is able to bypass permission checks for file operations
  name: FOWNER
- description: Phvalheim is able to send signals to any process
