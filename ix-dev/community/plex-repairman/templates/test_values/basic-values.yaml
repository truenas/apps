resources:
  limits:
    cpus: 2.0
    memory: 1024

repairman:
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30889

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/plex-repairman/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
