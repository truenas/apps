{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% set permissions = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_init(true) %}
{% do c1.set_read_only(true) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/health"}) %}

{% do c1.environment.add_env("CONFIG_DIR", values.consts.config_path) %}
{% do c1.environment.add_env("HOME", values.consts.config_path) %}
{% do c1.environment.add_env("HTTP_HOST", "0.0.0.0") %}
{% do c1.environment.add_env("HTTP_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_user_envs(values.repairman.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64, "mode": "0777"}}) %}
{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do permissions.add_or_skip_action("config", values.storage.config, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if permissions.has_actions() %}
  {% do permissions.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
