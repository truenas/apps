{% set tpl = ix_lib.base.render.Render(values) %}

{% set app = tpl.add_container(values.consts.app_container_name, "image") %}
{% set permissions = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do app.set_user(values.run_as.user, values.run_as.group) %}
{% do app.set_init(true) %}
{% do app.set_read_only(true) %}
{% do app.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/health"}) %}

{% do app.environment.add_env("CONFIG_DIR", "/config") %}
{% do app.environment.add_env("HOME", "/config") %}
{% do app.environment.add_env("HTTP_HOST", "0.0.0.0") %}
{% do app.environment.add_env("HTTP_PORT", values.network.web_port.port_number) %}
{% do app.environment.add_user_envs(values.repairman.additional_envs) %}

{% do app.add_port(values.network.web_port) %}

{% do app.add_storage("/config", values.storage.config) %}
{% do app.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64, "mode": "0777"}}) %}
{% do permissions.add_or_skip_action("config", values.storage.config, perms_config) %}

{% if permissions.has_actions() %}
  {% do permissions.activate() %}
  {% do app.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
