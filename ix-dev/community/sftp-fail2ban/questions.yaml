groups:
  - name: Application Configuration
    description: Configure application environment and network
  - name: Storage Configuration
    description: Choose an existing TrueNAS dataset
questions:
  - variable: app
    label: ""
    group: Application Configuration
    schema:
      type: dict
      attrs:
        - variable: host_port
          label: Host Port
          schema:
            type: int
            default: 2222
            min: 1
            max: 65535
            required: true
        - variable: admin_user
          label: Default Admin Username
          schema:
            type: string
            default: admin
            required: true
        - variable: admin_pass
          label: Default Admin Password
          description: Change the upstream default password before initial deployment. If an existing users.conf is present, edit that file to update credentials.
          schema:
            type: string
            private: true
            required: true
        - variable: password_auth
          label: Password Authentication
          schema:
            type: string
            default: "yes"
            enum:
              - value: "yes"
                description: Allow SSH password logins
              - value: "no"
                description: Require SSH keys
        - variable: auto_update
          label: Automatic Updates
          schema:
            type: string
            default: none
            enum:
              - value: none
                description: Disabled
              - value: suite
                description: Distribution updates
              - value: custom
                description: Run custom update script
        - variable: allow_users
          label: Allowed SSH Users
          description: Optional space-separated SSH username allowlist
          schema:
            type: string
            default: ""
        - variable: timezone
          label: Timezone
          schema:
            type: string
            default: America/Chicago
        - variable: f2b_config_mode
          label: Fail2ban configuration mode
          schema:
            type: string
            default: symlink
        - variable: log_streams
          label: Log streams
          schema:
            type: string
            default: auth,fail2ban
        - variable: tail_logs
          label: Tail logs
          schema:
            type: boolean
            default: true
        - variable: clear_logs
          label: Clear logs at startup
          schema:
            type: boolean
            default: false
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data_path
          label: Application Host Dataset Path
          description: Existing absolute path under /mnt/<pool> used for persistent configuration, SSH host keys, Fail2ban configuration, and logs.
          schema:
            type: hostpath
            required: true

        - variable: shared_path
          label: SFTP Shared Host Path
          description: Existing TrueNAS path exposed to the default SFTP user.
          schema:
            type: hostpath
            required: true
