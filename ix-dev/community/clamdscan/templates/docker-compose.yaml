{% set tpl = ix_lib.base.render.Render(values) %}
{% set c1 = tpl.add_container(values.consts.container_name, "image") %}
{% do c1.set_user(0, 0) %}
{% do c1.healthcheck.disable() %}
{% do c1.add_storage("/var/log/clamav", {"type": "host_path", "host_path_config": {"path": values.storage.log_path, "acl_enable": false}}) %}
{% do c1.add_storage("/scan", {"type":"host_path","host_path_config":{"path":values.storage.scan_path,"acl_enable":false,"read_only":true}}) %}
{% do c1.add_storage("/var/lib/clamav", {"type":"host_path","host_path_config":{"path":values.storage.db_path,"acl_enable":false}}) %}
{% do c1.add_storage("/etc/clamav", {"type":"host_path","host_path_config":{"path":values.storage.etc_path,"acl_enable":false}}) %}
{% do c1.environment.add_env("SCAN_FOLDERS", values.app.scan_folders) %}
{% do c1.environment.add_env("EXCLUDE_PATHS", values.app.exclude_paths) %}
{% do c1.environment.add_env("SKIP_FRESHCLAM", "true" if values.app.skip_freshclam else "false") %}
{% do c1.environment.add_env("LOG_HISTORY_LIMIT", values.app.log_history_limit) %}
{% do c1.environment.add_user_envs(values.app.additional_envs) %}
{{ tpl.render() | tojson }}
