groups:
  - name: Application Configuration
    description: Configure application environment and network
  - name: Storage Configuration
    description: Choose an existing TrueNAS dataset
questions:
  - variable: app
    label: ""
    group: Application Configuration
    schema:
      type: dict
      attrs:
        - variable: scan_folders
          label: Scan folders in container
          schema:
            type: string
            default: /scan
            required: true
        - variable: exclude_paths
          label: Exclude paths
          schema:
            type: string
            default: ""
        - variable: skip_freshclam
          label: Skip signature updates
          schema:
            type: boolean
            default: false
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: scan_path
          label: Host path to scan (read-only)
          schema:
            type: hostpath
            required: true
        - variable: db_path
          label: Signature database dataset
          schema:
            type: hostpath
            required: true
        - variable: etc_path
          label: ClamAV configuration dataset
          schema:
            type: hostpath
            required: true
        - variable: log_path
          label: Logs dataset
          schema:
            type: hostpath
            required: true
