{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.pingkit_agent_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{#
  Host networking is the one privilege and is not a choice here: the agent reads the host's
  neighbour (ARP) table and hears mDNS and SSDP from the devices on the network, which a
  bridge network hides. The library already drops every capability and sets
  no-new-privileges; nothing is added back.
#}
{% do c1.set_network_mode("host") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_read_only(true) %}
{% do c1.set_grace_period(20) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 16}}) %}
{# The image's own HEALTHCHECK: `pingkit-agent healthcheck`, which reads /livez. #}
{% do c1.healthcheck.use_built_in() %}

{# The template owns the two ports: the portal and the health check depend on them. #}
{% do c1.environment.add_env("PINGKIT_STATE_DIR", "/data") %}
{% do c1.environment.add_env("PINGKIT_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("PINGKIT_API_PORT", values.network.api_port.port_number) %}
{% if values.pingkit_agent.claim_code %}
  {% do c1.environment.add_env("PINGKIT_CLAIM_CODE", values.pingkit_agent.claim_code) %}
{% endif %}
{% do c1.environment.add_user_envs(values.pingkit_agent.additional_envs) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"path": "/"}) %}

{{ tpl.render() | tojson }}
