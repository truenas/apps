{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.scarletx_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% set health_script = "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:%s/api/health',timeout=3)); raise SystemExit(0 if d.get('app')=='ScarletX' else 1)" | format(values.network.web_port.port_number) %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_custom_test(["CMD", "python", "-c", health_script]) %}

{% do c1.environment.add_env("SCARLETX_HOST", "0.0.0.0") %}
{% do c1.environment.add_env("SCARLETX_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("SCARLETX_NO_BROWSER", "1") %}
{% do c1.environment.add_env("SCARLETX_DATABASE_URL", "sqlite:////config/scarletx.db") %}
{% do c1.environment.add_env("SCARLETX_USENET_INCOMPLETE_DIR", "/downloads/incomplete") %}
{% do c1.environment.add_env("SCARLETX_USENET_COMPLETE_DIR", "/downloads/complete") %}
{% do c1.environment.add_env("SCARLETX_GENERATED_DIR", "/config/generated") %}
{% do c1.environment.add_env("SCARLETX_CACHE_DIR", "/config/cache") %}
{% do c1.environment.add_env("SCARLETX_DEFAULT_MEDIA_ROOT", "/media") %}
{% do c1.environment.add_user_envs(values.scarletx.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do c1.add_storage(values.consts.downloads_path, values.storage.downloads) %}
{% do perm_container.add_or_skip_action("downloads", values.storage.downloads, perms_config) %}

{% do c1.add_storage(values.consts.media_path, values.storage.media) %}
{% do perm_container.add_or_skip_action("media", values.storage.media, perms_config) %}

{% do c1.add_storage(values.consts.backups_path, values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
