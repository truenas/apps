{% set tpl = ix_lib.base.render.Render(values) %}

{% set backend = tpl.add_container(values.consts.scarletx_backend_container_name, "backend_image") %}
{% set web = tpl.add_container(values.consts.scarletx_web_container_name, "web_image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% set backend_health_script = "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)); raise SystemExit(0 if d.get('app')=='ScarletX' else 1)" %}

{% do backend.set_user(values.run_as.user, values.run_as.group) %}
{% do backend.healthcheck.set_custom_test(["CMD", "python", "-c", backend_health_script]) %}

{% do backend.environment.add_env("SCARLETX_HOST", "0.0.0.0") %}
{% do backend.environment.add_env("SCARLETX_PORT", values.consts.backend_port) %}
{% do backend.environment.add_env("SCARLETX_TRUST_PROXY_HEADERS", "1") %}
{% do backend.environment.add_env("SCARLETX_NO_BROWSER", "1") %}
{% do backend.environment.add_env("SCARLETX_DATABASE_URL", "sqlite:////config/scarletx.db") %}
{% do backend.environment.add_env("SCARLETX_USENET_INCOMPLETE_DIR", "/downloads/incomplete") %}
{% do backend.environment.add_env("SCARLETX_USENET_COMPLETE_DIR", "/downloads/complete") %}
{% do backend.environment.add_env("SCARLETX_GENERATED_DIR", "/config/generated") %}
{% do backend.environment.add_env("SCARLETX_CACHE_DIR", "/config/cache") %}
{% do backend.environment.add_env("SCARLETX_DEFAULT_MEDIA_ROOT", "/media") %}
{% do backend.environment.add_user_envs(values.scarletx.additional_envs) %}

{% do web.set_user(values.run_as.user, values.run_as.group) %}
{% do web.environment.add_env("SCARLETX_WEB_PORT", values.network.web_port.port_number) %}
{% do web.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/api/health"}) %}
{% do web.depends.add_dependency(values.consts.scarletx_backend_container_name, "service_healthy") %}
{% do web.add_port(values.network.web_port) %}

{% do backend.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do backend.add_storage(values.consts.downloads_path, values.storage.downloads) %}
{% do perm_container.add_or_skip_action("downloads", values.storage.downloads, perms_config) %}

{% do backend.add_storage(values.consts.media_path, values.storage.media) %}
{% do perm_container.add_or_skip_action("media", values.storage.media, perms_config) %}

{% do backend.add_storage(values.consts.backups_path, values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do backend.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do backend.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
