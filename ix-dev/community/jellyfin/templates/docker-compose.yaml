{% from "macros/certificate_setup.py.jinja" import certificate_setup_script %}

{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.jellyfin_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set cert_container = tpl.add_container(values.consts.certs_container_name, "container_utils_image") %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/health"}) %}
{% do cert_container.setup_as_helper() %}
{% do cert_container.set_user(values.run_as.user, values.run_as.group) %}
{% do cert_container.set_entrypoint(["/usr/local/bin/python3", values.consts.certificate_setup_script_path]) %}
{% do cert_container.configs.add("certificate-setup", certificate_setup_script(values), values.consts.certificate_setup_script_path, "0755") %}

{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do cert_container.configs.add("certificate", cert.certificate, values.consts.cert_file_path) %}
  {% do cert_container.configs.add("private-key", cert.privatekey, values.consts.private_key_file_path) %}
{% endif %}

{% do cert_container.add_storage("/config", values.storage.config) %}
{% do c1.depends.add_dependency(values.consts.certs_container_name, "service_completed_successfully") %}

{% if values.jellyfin.publish_server_url %}
  {% do c1.environment.add_env("JELLYFIN_PublishedServerUrl", values.jellyfin.publish_server_url) %}
{% endif %}
{% do c1.environment.add_user_envs(values.jellyfin.additional_envs) %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
  {% do c1.add_port(values.network.https_port, {"container_port": values.consts.internal_https_port}) %}
  {% do c1.add_port(values.network.discovery_port, {"container_port": 7359, "protocol": "udp"}) %}
{% endif %}

{% do c1.add_storage("/config", values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perm_config) %}

{% do c1.environment.add_env("JELLYFIN_CACHE_DIR", "/cache") %}
{% do c1.add_storage("/cache", values.storage.cache) %}
{% do perm_container.add_or_skip_action("cache", values.storage.cache, perm_config) %}

{% set static_transcodes_options = {
  "tmpfs_config": {"mode": "0777"},
  "volume_config": {"volume_name": "jellyfin-transcodes"},
} %}
{% set transcodes_storage = dict(values.storage.transcodes, **static_transcodes_options) %}
{#
  Old installs use config and new uses cache.
  Even if we forced the cache dir above, old installs carry the setting via config file.
  So we mount the transcodes storage to both locations.
#}
{% do c1.add_storage("/config/transcodes", transcodes_storage) %}
{% do c1.add_storage("/cache/transcodes", transcodes_storage) %}
{% do perm_container.add_or_skip_action("transcodes", transcodes_storage, perm_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% for device in values.jellyfin.devices %}
  {% do c1.devices.add_device(device.host_device, device.container_device) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do cert_container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}
{% if values.network.host_network %}
  {% if values.network.certificate_id %}
    {% do tpl.portals.add(values.network.web_port, {"name": "Web UI HTTPS", "scheme": "https", "port": values.consts.internal_https_port}) %}
  {% endif %}
{% elif values.network.https_port.bind_mode %}
  {% do tpl.portals.add(values.network.https_port, {"name": "Web UI HTTPS", "scheme": "https"}) %}
{% endif %}

{{ tpl.render() | tojson }}
