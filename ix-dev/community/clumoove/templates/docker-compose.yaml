{% set tpl = ix_lib.base.render.Render(values) %}

{% set net = tpl.networks.create_internal("clumoove-net") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# ── PostgreSQL ───────────────────────────────────────────────────────────── #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.clumoove.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.clumoove.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(net) %}

{# ── Redis ────────────────────────────────────────────────────────────────── #}
{% set redis_config = {
  "password": values.clumoove.redis_password,
  "volume": tpl.funcs.temp_config("redis-data"),
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(net) %}

{# ── API Gateway ─────────────────────────────────────────────────────────── #}
{% set api = tpl.add_container(values.consts.api_container_name, "api_image") %}
{% do api.add_network(net) %}
{% do api.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do api.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% do api.set_user(values.run_as.user, values.run_as.group) %}
{% do api.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do api.environment.add_env("REDIS_URL", redis.get_url("redis")) %}
{% do api.environment.add_env("PORT", "8000") %}
{% do api.environment.add_env("ENCRYPTION_SECRET_KEY", values.clumoove.encryption_secret_key) %}
{% do api.environment.add_env("JWT_SECRET_KEY", values.clumoove.jwt_secret_key) %}
{% do api.environment.add_env("TRUSTED_PROXY", "1") %}
{% do api.environment.add_env("LOCAL_STORAGE_ROOT", "/clumoove") %}
{% do api.add_storage("/clumoove", values.storage.local_storage) %}
{% for store in values.storage.additional_storage %}
  {% do api.add_storage(store.mount_path, store) %}
{% endfor %}
{% do api.environment.add_user_envs(values.clumoove.additional_envs) %}
{% do api.healthcheck.set_test("wget", {"port": 8000, "path": "/api/health"}) %}

{# ── Migration Worker ────────────────────────────────────────────────────── #}
{% set worker = tpl.add_container(values.consts.worker_container_name, "worker_image") %}
{% do worker.add_network(net) %}
{% do worker.set_command(["/app/worker"]) %}
{% do worker.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do worker.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% do worker.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{% do worker.set_user(values.run_as.user, values.run_as.group) %}
{% do worker.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do worker.environment.add_env("REDIS_URL", redis.get_url("redis")) %}
{% do worker.environment.add_env("ENCRYPTION_SECRET_KEY", values.clumoove.encryption_secret_key) %}
{% do worker.environment.add_env("LOCAL_STORAGE_ROOT", "/clumoove") %}
{% do worker.add_storage("/clumoove", values.storage.local_storage) %}
{% for store in values.storage.additional_storage %}
  {% do worker.add_storage(store.mount_path, store) %}
{% endfor %}
{% do worker.environment.add_user_envs(values.clumoove.additional_envs) %}
{% do worker.healthcheck.disable() %}

{# ── Web Frontend & Portal ───────────────────────────────────────────────── #}
{% set frontend = tpl.add_container(values.consts.frontend_container_name, "frontend_image") %}
{% do frontend.add_network(net) %}
{% do frontend.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{% do frontend.environment.add_env("CLUMOOVE_API_URL", "") %}
{% do frontend.add_port(values.network.web_port, {"container_port": 3000}) %}
{% do frontend.healthcheck.set_test("wget", {"port": 3000, "path": "/"}) %}

{# ── Permissions & Dependencies ─────────────────────────────────────────── #}
{% do perm_container.add_or_skip_action("local_storage", values.storage.local_storage, perms_config) %}
{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do api.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do worker.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
