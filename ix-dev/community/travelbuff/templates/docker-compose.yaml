{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.app_container_name ~ "-perms") %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}

{# We don't have a specific custom healthcheck script, the port opening is generally enough or we could curl it #}
{% do c1.healthcheck.set_custom_test("wget --no-verbose --tries=1 --spider http://127.0.0.1:" ~ values.network.web_port.port_number ~ "/ || exit 1") %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("JWT_SECRET", values.travelbuff.jwt_secret) %}
{% do c1.environment.add_env("DATABASE_DIR", "/app/data") %}
{% do c1.environment.add_env("UPLOADS_DIR", "/app/data/uploads") %}
{% do c1.environment.add_env("DISABLE_TELEMETRY", values.travelbuff.disable_telemetry) %}

{# Map user-selected port #}
{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/app/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.app_container_name ~ "-perms", "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https" if values.network.certificate_id else "http"}) %}

{{ tpl.render() | tojson }}
