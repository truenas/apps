resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

ablago:
  postgres_image_selector: postgres_18_image
  db_password: password
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  files: /opt/tests/mnt/ablago/files
  keys: /opt/tests/mnt/ablago/keys
  backups: /opt/tests/mnt/ablago/backups
  postgres_data: /opt/tests/mnt/ablago/postgres_data

storage:
  files:
    type: ix_volume
    ix_volume_config:
      dataset_name: files
      create_host_path: true
  key_store:
    type: ix_volume
    ix_volume_config:
      dataset_name: keys
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
