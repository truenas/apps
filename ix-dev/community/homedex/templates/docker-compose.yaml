{% set tpl = ix_lib.base.render.Render(values) %}

{# Homedex reads Docker only through this proxy, which shares a private network with Homedex alone. #}
{% set proxy_net = tpl.networks.create_internal("socket-proxy") %}

{% set proxy = tpl.add_container(values.consts.socket_proxy_container_name, "socket_proxy_image") %}
{% do proxy.add_network(proxy_net) %}
{% do proxy.set_read_only(true) %}
{% do proxy.add_storage("/run", {"type": "tmpfs"}) %}
{% do proxy.add_storage("/tmp", {"type": "tmpfs"}) %}
{% do proxy.healthcheck.set_test("netcat", {"port": 2375}) %}
{# Read-only inventory endpoints only; POST=0 rejects every mutating Docker API call. #}
{% do proxy.environment.add_env("CONTAINERS", 1) %}
{% do proxy.environment.add_env("IMAGES", 1) %}
{% do proxy.environment.add_env("INFO", 1) %}
{% do proxy.environment.add_env("NETWORKS", 1) %}
{% do proxy.environment.add_env("VERSION", 1) %}
{% do proxy.environment.add_env("POST", 0) %}
{% do proxy.environment.add_env("ALLOW_START", 0) %}
{% do proxy.environment.add_env("ALLOW_STOP", 0) %}
{% do proxy.environment.add_env("ALLOW_RESTARTS", 0) %}
{% do proxy.add_docker_socket() %}

{% set c1 = tpl.add_container(values.consts.homedex_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.add_network(proxy_net) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_read_only(true) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs"}) %}
{# The image is distroless, so the binary probes its own /api/health on HOMEDEX_LISTEN. #}
{% do c1.healthcheck.set_custom_test(["CMD", "/homedex", "healthcheck"]) %}

{% do c1.environment.add_env("HOMEDEX_DATA_DIR", "/data") %}
{% do c1.environment.add_env("HOMEDEX_LISTEN", ":%d"|format(values.network.web_port.port_number)) %}
{% do c1.environment.add_env("HOMEDEX_ADMIN_PASSWORD", values.homedex.admin_password) %}
{% do c1.environment.add_user_envs(values.homedex.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}
{% do c1.depends.add_dependency(values.consts.socket_proxy_container_name, "service_healthy") %}

{% do tpl.notes.add_info("Sign in with the admin password you set here. For the first Docker source, keep the prefilled endpoint tcp://docker-socket-proxy:2375: it is this app's read-only socket proxy.") %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
