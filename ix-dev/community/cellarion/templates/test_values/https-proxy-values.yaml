resources:
  limits:
    cpus: 4.0
    memory: 2048

cellarion:
  frontend_url: https://wine.example.com/
  trust_proxy_hops: 2
  jwt_secret: secret
  meili_master_key: secret
  mongo_db_password: secret
  anthropic_api_key: sk-ant-test
  voyage_api_key: pa-test
  registry_bridge_key: cbr_test
  registry_bridge_url: https://cellarion.app
  registry_bridge_refresh: weekly
  additional_envs:
    - name: MAILGUN_DOMAIN
      value: mg.example.com
    - name: LOG_LEVEL
      value: info

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 30881
    host_ips:
      - 192.168.1.100

labels:
  - key: traefik.enable
    value: "true"
    containers:
      - frontend

storage:
  uploads:
    type: host_path
    host_path_config:
      path: /mnt/tank/apps/cellarion/uploads
      auto_permissions: true
  mongodb_data:
    type: host_path
    host_path_config:
      path: /mnt/tank/apps/cellarion/db
      auto_permissions: true
  meili_data:
    type: host_path
    host_path_config:
      path: /mnt/tank/apps/cellarion/search
      auto_permissions: true
  additional_storage: []
