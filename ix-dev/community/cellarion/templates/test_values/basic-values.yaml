resources:
  limits:
    cpus: 2.0
    memory: 4096

cellarion:
  frontend_url: http://192.168.1.100:30881
  trust_proxy_hops: 1
  jwt_secret: secret
  meili_master_key: secret
  mongo_db_password: secret
  anthropic_api_key: ""
  voyage_api_key: ""
  registry_bridge_key: ""
  registry_bridge_url: https://cellarion.app
  registry_bridge_refresh: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 30881

ix_volumes:
  uploads: /opt/tests/mnt/cellarion/uploads
  mongodb_data: /opt/tests/mnt/cellarion/mongodb_data
  meili_data: /opt/tests/mnt/cellarion/meili_data

storage:
  uploads:
    type: ix_volume
    ix_volume_config:
      dataset_name: uploads
      create_host_path: true
  mongodb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mongodb_data
      create_host_path: true
  meili_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: meili_data
      create_host_path: true
  additional_storage: []
