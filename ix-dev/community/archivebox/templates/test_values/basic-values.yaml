resources:
  limits:
    cpus: 2.0
    memory: 4096

archivebox:
  base_url: ""
  server_security_mode: auto
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 5797

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/archivebox/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
