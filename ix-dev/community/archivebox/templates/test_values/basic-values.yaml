resources:
  limits:
    cpus: 2.0
    memory: 4096

archivebox:
  base_url: http://localhost:5797
  server_security_mode: safe-onedomain-nojsreplay
  admin_username: admin
  admin_password: testpassword123
  timeout: 60
  save_archive_dot_org: false
  public_index: false
  permissions: private
  public_add_view: false
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 5797

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/archivebox/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
