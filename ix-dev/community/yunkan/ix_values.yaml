images:
  image:
    repository: ghcr.io/mrtian2016/yunkan-cpu
    tag: 0.9.38
  openvino_image:
    repository: ghcr.io/mrtian2016/yunkan-openvino
    tag: 0.9.38
  cuda_image:
    repository: ghcr.io/mrtian2016/yunkan-cuda
    tag: 0.9.38
  tensorrt_image:
    repository: ghcr.io/mrtian2016/yunkan-trt
    tag: 0.9.38
  mariadb_image:
    repository: mariadb
    tag: "12.3.2"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  yunkan_container_name: yunkan
  perms_container_name: permissions
  mariadb_container_name: mariadb
  db_user: skyview
  db_name: skyview
  # Uncommon high port on purpose: with host networking every container in this app
  # shares the host network namespace, so the bundled database must not claim 3306.
  db_port: 23336
  internal_web_port: 23406
  internal_webrtc_port: 23515
  machine_id_path: /etc/machine-id
  product_uuid_path: /sys/class/dmi/id/product_uuid
  notes_body: |
    Open the web UI and complete the first-run setup wizard to create the
    administrator account, then add cameras from the web interface.
