consts:
  yunkan_container_name: yunkan
  internal_web_port: 23406
  internal_webrtc_port: 23515
  machine_id_path: /etc/machine-id
  product_uuid_path: /sys/class/dmi/id/product_uuid
  notes_body: |
    ## First Start

    Open the Web UI and complete the setup wizard (pick SQLite or MySQL, then create
    the administrator account). Cameras are added from the web interface afterwards.

    ## Recording Storage

    Recordings can grow to terabytes. Point the [Recordings Storage] mount at a
    dataset on a pool with enough capacity - it is mounted over
    `/app/data/recordings`, so no in-app configuration change is needed.

    ## Ports

    Open the web interface on port 23406 of this server.

    With host networking (the default) the app also binds 23880 (RTSP) and 24214
    (streaming) locally. Those are internal endpoints: every stream requires a signed
    token issued after login, so they are not usable on their own. On a bridge network
    only the web interface and the WebRTC media port are published.

    ## WebRTC

    Sub-second live view uses WebRTC. If you switch to a bridge network, publish the
    WebRTC port using the same port number on the host as inside the container and
    fill in [WebRTC External IPs] with the address clients use to reach this server.
    Otherwise live view falls back to HLS with a few seconds of latency.

    ## Updates

    Update this app from the TrueNAS Apps page. The in-app one-click upgrade that
    other deployments offer is not available here, because the Docker socket is not
    mounted - TrueNAS owns the container lifecycle.
