{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.yunkan_container_name, values.yunkan.image_selector) %}

{# The image is supervised by s6-overlay and runs its media server, web server and
   worker processes as root inside the container. #}
{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETGID", "SETUID", "KILL"]) %}

{# ── Bundled MariaDB ──────────────────────────────────────────────────────────
   The app is multi-process (recorder, detection and automation workers share the
   database), so it ships its own MariaDB and locks the app to it via SKYVIEW_DB_*
   env vars: the first-run wizard skips the database step entirely. #}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set mariadb_config = {
  "user": values.consts.db_user,
  "password": values.yunkan.db_password,
  "database": values.consts.db_name,
  "port": values.consts.db_port,
  "volume": values.storage.mariadb_data,
} %}
{% set mariadb = tpl.deps.mariadb(values.consts.mariadb_container_name, "mariadb_image", mariadb_config, perm_container) %}
{# deps_mariadb sets its healthcheck without the custom port (probes 3306); override
   with the port the server actually listens on. Root password falls back to
   db_password inside the dep, so the healthcheck uses the same value. #}
{% do mariadb.container.healthcheck.set_test("mariadb", {"password": values.yunkan.db_password, "port": values.consts.db_port}) %}

{% if values.network.host_network %}
  {# Every container in this app shares the host network namespace, so the database
     must not be reachable from the LAN: bind it to localhost on an uncommon port. #}
  {% do mariadb.container.set_command(["--port", values.consts.db_port | string, "--bind-address=127.0.0.1"]) %}
{% else %}
  {% set yunkan_net = tpl.networks.create_internal("yunkan-net") %}
  {% do c1.add_network(yunkan_net) %}
  {% do mariadb.container.add_network(yunkan_net) %}
{% endif %}

{% do c1.environment.add_env("SKYVIEW_DB_TYPE", "mysql") %}
{% do c1.environment.add_env("SKYVIEW_DB_HOST", "127.0.0.1" if values.network.host_network else values.consts.mariadb_container_name) %}
{% do c1.environment.add_env("SKYVIEW_DB_PORT", values.consts.db_port) %}
{% do c1.environment.add_env("SKYVIEW_DB_USER", values.consts.db_user) %}
{% do c1.environment.add_env("SKYVIEW_DB_PASSWORD", values.yunkan.db_password) %}
{% do c1.environment.add_env("SKYVIEW_DB_NAME", values.consts.db_name) %}
{% do c1.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do mariadb.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% for device in values.yunkan.devices %}
  {% do c1.devices.add_device(device.host_device, device.container_device) %}
{% endfor %}

{% if values.yunkan.webrtc_extern_ips %}
  {% do c1.environment.add_env("SKYVIEW_WEBRTC_EXTERN_IPS", values.yunkan.webrtc_extern_ips) %}
{% endif %}
{% do c1.environment.add_user_envs(values.yunkan.additional_envs) %}

{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/healthz"}) %}

{% do c1.add_storage("/app/data", values.storage.data) %}
{% do c1.add_storage("/app/data/recordings", values.storage.recordings) %}

{# License binding reads stable host identifiers. Both are mounted read-only and are
   only used locally to compute a hardware fingerprint. #}
{% do c1.add_storage(values.consts.machine_id_path, {
  "type": "host_path",
  "read_only": true,
  "host_path_config": {"path": values.consts.machine_id_path, "create_host_path": false}
}) %}
{% if values.yunkan.mount_product_uuid %}
  {% do c1.add_storage(values.consts.product_uuid_path, {
    "type": "host_path",
    "read_only": true,
    "host_path_config": {"path": values.consts.product_uuid_path, "create_host_path": false}
  }) %}
{% endif %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{# Only the web interface and the WebRTC media port are published. The RTSP (23880) and
   streaming (24214) ports stay internal on purpose: every stream is gated by a signed
   token, and publishing them adds surface without adding a usable feature. #}
{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
  {% do c1.add_port(values.network.webrtc_port, {"container_port": values.consts.internal_webrtc_port}) %}
  {% do c1.add_port(values.network.webrtc_port, {"container_port": values.consts.internal_webrtc_port, "protocol": "udp"}) %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "http", "port": values.consts.internal_web_port if values.network.host_network else None}) %}

{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
