# Host-network path. Uses the CPU image on purpose: CI runners have no GPU, and
# resources.gpus.use_all_gpus would map /dev/dri which does not exist there.
resources:
  limits:
    cpus: 2.0
    memory: 4096

yunkan:
  image_selector: image
  webrtc_extern_ips: "192.0.2.10"
  mount_product_uuid: false
  devices: []
  additional_envs: []

network:
  host_network: true

ix_volumes:
  yunkan-data: /opt/tests/mnt/yunkan-hn/data
  yunkan-recordings: /opt/tests/mnt/yunkan-hn/recordings

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: yunkan-data
      create_host_path: true
  recordings:
    type: ix_volume
    ix_volume_config:
      dataset_name: yunkan-recordings
      create_host_path: true
  additional_storage: []
