{% import "macros/config.sh" as config_macro %}

{% set tpl = ix_lib.base.render.Render(values) %}

{% set db_net = tpl.networks.create_internal("litellm-net") %}

{% set c1 = tpl.add_container(values.consts.litellm_container_name, "image") %}
{% set config = tpl.add_container(values.consts.config_container_name, "container_utils_image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# Config file values win over env vars, so point them back to the env vars #}
{% set cfg = [
  {"general_settings.database_url": "os.environ/DATABASE_URL"},
  {"general_settings.master_key": "os.environ/LITELLM_MASTER_KEY"},

  {"environment_variables.DATABASE_URL": "os.environ/DATABASE_URL"},
  {"environment_variables.LITELLM_MASTER_KEY": "os.environ/LITELLM_MASTER_KEY"},
  {"environment_variables.LITELLM_SALT_KEY": "os.environ/LITELLM_SALT_KEY"},
  {"environment_variables.STORE_MODEL_IN_DB": "os.environ/STORE_MODEL_IN_DB"},
] %}

{% do config.set_user(values.run_as.user, values.run_as.group) %}
{% do config.setup_as_helper() %}
{% do config.configs.add("config.sh", config_macro.config(values=values, cfg=cfg), "/setup/config.sh", "0755") %}
{% do config.set_entrypoint(["/setup/config.sh"]) %}
{% do config.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perm_config) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.litellm.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.litellm.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(db_net) %}

{% do c1.add_network(db_net) %}
{% do c1.set_init(true) %}
{% do c1.set_read_only(true) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_command(["--port", values.network.web_port.port_number]) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do c1.depends.add_dependency(values.consts.config_container_name, "service_completed_successfully") %}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/health/liveliness"}) %}

{% do c1.environment.add_env("LITELLM_MASTER_KEY", values.litellm.master_key) %}
{% do c1.environment.add_env("LITELLM_SALT_KEY", values.litellm.salt_key) %}
{% do c1.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do c1.environment.add_env("STORE_MODEL_IN_DB", "True") %}
{% do c1.environment.add_env("CONFIG_FILE_PATH", "%s/config.yaml"|format(values.consts.config_path)) %}
{% do c1.environment.add_user_envs(values.litellm.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs"}) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do config.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"path": "/ui"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
