{% set tpl = ix_lib.base.render.Render(values) %}
{% set c1 = tpl.add_container(values.consts.litellm_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set db_net = tpl.networks.create_internal("litellm-net") %}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.litellm.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, "postgres_image", pg_config, perm_container) %}
{% do postgres.container.add_network(db_net) %}
{% do c1.add_network(db_net) %}
{% do c1.set_user(0, 0) %}
{% do c1.set_command(["--port", values.network.web_port.port_number | string]) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do c1.healthcheck.set_custom_test(["CMD", "python3", "-c",
  "import urllib.request; urllib.request.urlopen('http://127.0.0.1:" ~ values.network.web_port.port_number ~ "/health/liveliness', timeout=5)"]) %}
{% do c1.healthcheck.set_start_period(120) %}
{% do c1.environment.add_env("LITELLM_MASTER_KEY", values.litellm.master_key) %}
{% do c1.environment.add_env("LITELLM_SALT_KEY", values.litellm.salt_key) %}
{% do c1.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do c1.environment.add_env("STORE_MODEL_IN_DB", "True") %}
{% do c1.environment.add_user_envs(values.litellm.additional_envs) %}
{% do c1.add_port(values.network.web_port) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}
{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}
{% do tpl.portals.add(values.network.web_port, {"path": "/ui"}) %}
{% do tpl.notes.set_body(values.consts.notes) %}
{{ tpl.render() | tojson }}
