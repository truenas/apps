resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

litellm:
  postgres_image_selector: postgres_18_image
  db_password: testpassword
  master_key: sk-test-master-key-at-least-32-characters
  salt_key: sk-test-salt-key-at-least-32-characters
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/litellm/config
  postgres_data: /opt/tests/mnt/litellm/postgres-data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
