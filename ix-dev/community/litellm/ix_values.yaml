  notes: |
    Open the Web UI portal and sign in as `admin` with your master key.
    Add models and provider credentials in the UI, or set provider API keys
    using Additional Environment Variables.

    Keep your salt key unchanged and back it up with your PostgreSQL dataset.
    Replacing it makes stored provider credentials unreadable.
    Keep the database password unchanged after initialization.
