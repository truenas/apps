resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

crowdsec:
  additional_envs: []

network:
  lapi_port:
    bind_mode: published
    port_number: 8081
  metrics_port:
    bind_mode: published
    port_number: 8082
  acquisition_ports:
    - bind_mode: published
      port_number: 8083
      protocol: tcp

ix_volumes:
  config: /opt/tests/mnt/crowdsec/config
  data: /opt/tests/mnt/crowdsec/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
