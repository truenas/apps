resources:
  limits:
    cpus: 2.0
    memory: 4096

network:
  lapi_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  config: /opt/tests/mnt/config
  data: /opt/tests/mnt/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /var/log/host
      host_path_config:
        path: /opt/tests/mnt/logs
        create_host_path: true
