resources:
  limits:
    cpus: 2.0
    memory: 4096

ix_volumes:
  config: /opt/tests/mnt/config
  data: /opt/tests/mnt/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
