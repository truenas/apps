resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

crowdsec:
  db_path: /var/lib/crowdsec/data/crowdsec.db
  external_db: false
  additional_envs: []

network:
  disable_lapi: false
  enable_metrics: true
  lapi_port:
    bind_mode: published
    port_number: 8080
  metrics_port:
    bind_mode: published
    port_number: 6060
  acquisition_ports:
    - bind_mode: published
      port_number: 7422
      protocol: tcp

ix_volumes:
  config: /opt/tests/mnt/config
  data: /opt/tests/mnt/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /var/log/host
      host_path_config:
        path: /opt/tests/mnt/logs
        create_host_path: true
