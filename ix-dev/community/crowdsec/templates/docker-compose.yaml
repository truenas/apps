{% from "macros/entrypoint.sh" import entrypoint %}
{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.crowdsec_container_name, "image") %}
{% do c1.add_caps(["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]) %}

{% if values.network.disable_lapi %}
  {% if values.network.enable_metrics %}
    {% do c1.healthcheck.set_test("wget", {"port": values.consts.internal_metrics_port, "path": "/metrics", "busybox": true}) %}
  {% else %}
    {% do c1.healthcheck.disable() %}
  {% endif %}
{% else %}
  {% set health_path = "127.0.0.1:%d/health"|format(values.consts.internal_lapi_port) %}
  {% do c1.healthcheck.set_custom_test(
    "wget --quiet --spider http://%s || wget --quiet --spider --no-check-certificate https://%s"|format(health_path, health_path)
  ) %}
{% endif %}

{% do c1.configs.add("entrypoint.sh", entrypoint(values), "/entrypoint.sh", "0500") %}
{% do c1.set_entrypoint(["/entrypoint.sh"]) %}

{% do c1.environment.add_env("DISABLE_LOCAL_API", values.network.disable_lapi) %}
{% do c1.environment.add_env("METRICS_PORT", values.consts.internal_metrics_port) %}
{% do c1.environment.add_user_envs(values.crowdsec.additional_envs) %}

{% if not values.network.disable_lapi %}
  {% do c1.add_port(values.network.lapi_port, {"container_port": values.consts.internal_lapi_port}) %}
{% endif %}
{% if values.network.enable_metrics %}
  {% do c1.add_port(values.network.metrics_port, {"container_port": values.consts.internal_metrics_port}) %}
{% endif %}
{% for port in values.network.acquisition_ports %}
  {% do c1.add_port(port) %}
{% endfor %}

{% do c1.add_storage("/etc/crowdsec", values.storage.config) %}
{% do c1.add_storage("/var/lib/crowdsec/data", values.storage.data) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{{ tpl.render() | tojson }}
