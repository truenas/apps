{% from "macros/entrypoint.sh" import entrypoint %}
{% set tpl = ix_lib.base.render.Render(values) %}
{% set disable_lapi = values.network.lapi_port.bind_mode == "" %}
{% set envs = {} %}
{% for env in values.crowdsec.additional_envs if env.value %}
  {% do envs.update({env.name: env.value}) %}
{% endfor %}
{% set use_tls = envs.get("USE_TLS", "")|lower == "true" %}

{# ----- Without the Local API, the agent needs the URL and credentials of a remote one #}
{% if disable_lapi %}
  {% set password_auth = envs.get("AGENT_USERNAME") and envs.get("AGENT_PASSWORD") %}
  {% set tls_auth = use_tls and envs.get("CLIENT_CERT_FILE") and envs.get("CLIENT_KEY_FILE") %}
  {% if not envs.get("LOCAL_API_URL") or not (password_auth or tls_auth) %}
    {% do tpl.funcs.fail("Local API Port Bind Mode [None] disables the Local API and requires [LOCAL_API_URL] and either [AGENT_USERNAME] and [AGENT_PASSWORD], or [USE_TLS=true], [CLIENT_CERT_FILE] and [CLIENT_KEY_FILE] in Additional Environment Variables") %}
  {% endif %}
{% endif %}

{% set c1 = tpl.add_container(values.consts.crowdsec_container_name, "image") %}
{% do c1.add_caps(["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]) %}

{% if disable_lapi %}
  {% do c1.healthcheck.set_custom_test("cscli lapi status") %}
{% else %}
  {% set health_path = "127.0.0.1:%d/health"|format(values.network.lapi_port.port_number) %}
  {% do c1.healthcheck.set_custom_test(
    "wget --quiet --spider http://%s || wget --quiet --spider --no-check-certificate https://%s"|format(health_path, health_path)
  ) %}
{% endif %}

{% set cfg = {
  "api.server.enable": not disable_lapi,
  "api.server.listen_uri": "0.0.0.0:%d"|format(values.network.lapi_port.port_number),
  "prometheus.enabled": values.network.metrics_port.bind_mode != "",
  "prometheus.listen_addr": "0.0.0.0",
  "prometheus.listen_port": values.network.metrics_port.port_number,
  "db_config.type": "sqlite",
  "db_config.db_path": "/var/lib/crowdsec/data/crowdsec.db",
  "config_paths.data_dir": "/var/lib/crowdsec/data/",
} %}
{% do c1.configs.add("entrypoint.sh", entrypoint(cfg), "/entrypoint.sh", "0500") %}
{% do c1.set_entrypoint(["/entrypoint.sh"]) %}

{% do c1.environment.add_env("CONFIG_FILE", "/etc/crowdsec/config.yaml") %}
{% do c1.environment.add_env("DISABLE_LOCAL_API", disable_lapi) %}
{% do c1.environment.add_env("METRICS_PORT", values.network.metrics_port.port_number) %}
{% do c1.environment.add_user_envs(values.crowdsec.additional_envs) %}

{# CrowdSec writes LOCAL_API_URL into the agent's credentials on start #}
{% if not disable_lapi and not envs.get("LOCAL_API_URL") %}
  {% do c1.environment.add_env("LOCAL_API_URL", "http://127.0.0.1:%d"|format(values.network.lapi_port.port_number)) %}
{% endif %}

{% do c1.add_port(values.network.lapi_port) %}
{% do c1.add_port(values.network.metrics_port) %}
{% for port in values.network.acquisition_ports %}
  {% do c1.add_port(port) %}
{% endfor %}

{% do c1.add_storage("/etc/crowdsec", values.storage.config) %}
{% do c1.add_storage("/var/lib/crowdsec/data", values.storage.data) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{{ tpl.render() | tojson }}
