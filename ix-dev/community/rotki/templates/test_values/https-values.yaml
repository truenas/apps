resources:
  limits:
    cpus: 2.0
    memory: 4096

rotki:
  session_key: catalog-test-only-key-not-for-production-0123456789
  secure_cookie: "1"
  additional_envs:
    - name: LOGLEVEL
      value: info

network:
  web_port:
    bind_mode: published
    port_number: 8080
    host_ips:
      - 127.0.0.1

run_as:
  user: 10001
  group: 10001

ix_volumes:
  data: /opt/tests/mnt/rotki-https/data
  logs: /opt/tests/mnt/rotki-https/logs

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  logs:
    type: ix_volume
    ix_volume_config:
      dataset_name: logs
      create_host_path: true
  additional_storage: []
