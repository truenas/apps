resources:
  limits:
    cpus: 2
    memory: 4096
rotki:
  session_key: catalog-test-only-key-not-for-production-0123456789
  secure_cookie: '0'
  additional_envs: []
network:
  web_port:
    bind_mode: exposed
    port_number: 30920
run_as:
  user: 568
  group: 568
ix_volumes:
  data: /opt/tests/mnt/rotki/data
  logs: /opt/tests/mnt/rotki/logs
storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  logs:
    type: ix_volume
    ix_volume_config:
      dataset_name: logs
      create_host_path: true
  additional_storage: []
