resources:
  limits:
    cpus: 2.0
    memory: 4096
retriever:
  enable_pot: false
  enable_tg_api: false
  tg_api_id: ''
  tg_api_hash: ''
  additional_envs: []
network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080
run_as:
  user: 568
  group: 568
ix_volumes:
  data: /opt/tests/mnt/data
  downloads: /opt/tests/mnt/downloads
storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: downloads
      create_host_path: true
  additional_storage: []
  tg_api_data:
    type: temporary
