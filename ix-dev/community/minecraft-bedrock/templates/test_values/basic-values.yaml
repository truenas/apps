resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: America/New_York

minecraft_bedrock:
  eula: true
  # version: LATEST
  # LATEST version has a bug that makes the healthcheck fail
  # Keep it pinned for now.
  version: "1.21.132.3"
  game_mode: survival
  server_name: test_server
  level_type: DEFAULT
  emit_server_telemetry: false
  texture_pack_required: false
  enable_lan_visibility: false
  force_game_mode: false
  difficulty: easy
  max_players: 20
  view_distance: 32
  tick_distance: 4
  allow_cheats: false
  allow_list_users: []
  ops: []
  members: []
  visitors: []
  additional_envs: []

network:
  host_network: false
  server_port:
    port_number: 8080
    bind_mode: published
  udp_port_range:
    bind_mode: published
    start: 19140
    end: 19159
    advertise_mode: specific_ip
    advertised_ip: 127.0.0.1
    host_ips: []
  additional_ports: []

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
