resources:
  limits:
    cpus: 2.0
    memory: 1024

cinedock:
  tmdb_api_key: ""
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8945

ix_volumes:
  config: /opt/tests/mnt/cinedock/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
