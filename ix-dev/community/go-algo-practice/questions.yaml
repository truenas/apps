groups:
  - name: Go Algo Practice Configuration
    description: Configure application security and public URLs.
  - name: Network Configuration
    description: Configure the dashboard port.
  - name: Storage Configuration
    description: Configure persistent application storage.
  - name: Resources Configuration
    description: Configure control-plane resources.

questions:
  - variable: TZ
    group: Go Algo Practice Configuration
    label: Timezone
    schema:
      type: string
      default: Asia/Tokyo
      required: true
      $ref:
        - definitions/timezone

  - variable: go_algo
    group: Go Algo Practice Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: external_url
          label: Dashboard Base URL
          description: Absolute URL reachable by learners, for example http://192.168.1.20:9500.
          schema:
            type: string
            required: true
            default: http://192.168.1.20:9500
        - variable: api_jwt_secret
          label: API JWT Secret
          description: Random secret with at least 32 characters.
          schema:
            type: string
            required: true
            private: true
            min_length: 32
            default: ""
        - variable: smtp_settings_key
          label: SMTP Settings Encryption Key
          description: Base64-encoded 32-byte key, generated with openssl rand -base64 32.
          schema:
            type: string
            required: true
            private: true
            min_length: 43
            default: ""

  - variable: network
    group: Network Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web UI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  required: true
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the TrueNAS host
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  required: true
                  default: 9500
                  min: 1
                  max: 65535
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    group: Storage Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: existing_data_root
          label: Existing Data Root
          description: Optional existing Custom App root. Leave empty for TrueNAS-managed datasets.
          schema:
            type: hostpath
            required: false
            default: ""
        - variable: exercises
          label: Exercises Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  hidden: true
                  default: ix_volume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: exercises
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        hidden: true
                        default: false
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        hidden: true
                        attrs: []
        - variable: data
          label: Data Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Type
                schema: {type: string, required: true, hidden: true, default: ix_volume}
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref: [normalize/ix_volume]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema: {type: string, required: true, hidden: true, default: data}
                    - variable: acl_enable
                      label: Enable ACL
                      schema: {type: boolean, hidden: true, default: false}
                    - variable: acl_entries
                      label: ACL Configuration
                      schema: {type: dict, hidden: true, attrs: []}
        - variable: backups
          label: Backups Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Type
                schema: {type: string, required: true, hidden: true, default: ix_volume}
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref: [normalize/ix_volume]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema: {type: string, required: true, hidden: true, default: backups}
                    - variable: acl_enable
                      label: Enable ACL
                      schema: {type: boolean, hidden: true, default: false}
                    - variable: acl_entries
                      label: ACL Configuration
                      schema: {type: dict, hidden: true, attrs: []}
        - variable: releases
          label: Releases Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Type
                schema: {type: string, required: true, hidden: true, default: ix_volume}
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref: [normalize/ix_volume]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema: {type: string, required: true, hidden: true, default: releases}
                    - variable: acl_enable
                      label: Enable ACL
                      schema: {type: boolean, hidden: true, default: false}
                    - variable: acl_entries
                      label: ACL Configuration
                      schema: {type: dict, hidden: true, attrs: []}
        - variable: codex_home
          label: Codex Home Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Type
                schema: {type: string, required: true, hidden: true, default: ix_volume}
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref: [normalize/ix_volume]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema: {type: string, required: true, hidden: true, default: codex_home}
                    - variable: acl_enable
                      label: Enable ACL
                      schema: {type: boolean, hidden: true, default: false}
                    - variable: acl_entries
                      label: ACL Configuration
                      schema: {type: dict, hidden: true, attrs: []}
        - variable: validator_queue
          label: Validator Queue Storage
          schema:
            type: dict
            hidden: true
            attrs:
              - variable: type
                label: Type
                schema: {type: string, required: true, hidden: true, default: ix_volume}
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  $ref: [normalize/ix_volume]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema: {type: string, required: true, hidden: true, default: validator_queue}
                    - variable: acl_enable
                      label: Enable ACL
                      schema: {type: boolean, hidden: true, default: false}
                    - variable: acl_entries
                      label: ACL Configuration
                      schema: {type: dict, hidden: true, attrs: []}

  - variable: resources
    group: Resources Configuration
    label: ""
    schema:
      type: dict
      $ref:
        - normalize/resources
      attrs: []
