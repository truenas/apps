resources:
  limits:
    cpus: 4
    memory: 4096

TZ: Asia/Riyadh
abdm:
  api_key: ""
run_as:
  user: 568
  group: 568
network:
  web_port:
    bind_mode: published
    port_number: 15152
    host_ips: []
storage:
  config:
    type: host_path
    host_path_config:
      path: /mnt/tank/apps/abdm/config
      create_host_path: false
      auto_permissions: true
  downloads:
    type: host_path
    host_path_config:
      path: /mnt/tank/media/downloads
      create_host_path: false
      auto_permissions: true
  temp:
    type: host_path
    host_path_config:
      path: /mnt/tank/apps/abdm/temp
      create_host_path: false
      auto_permissions: true
labels: []
