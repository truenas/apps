{% set tpl = ix_lib.base.render.Render(values) %}

{% set app = tpl.add_container(values.consts.abdm_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do app.set_user(values.run_as.user, values.run_as.group) %}
{% do app.set_shm_size_mb(1024) %}
{% do app.environment.add_env("HOME", values.consts.config_path) %}
{% do app.environment.add_env("ABDM_API_HOST", "0.0.0.0") %}
{% do app.environment.add_env("ABDM_API_PORT", 15151) %}
{% do app.environment.add_env("ABDM_DOWNLOAD_FOLDER", values.consts.downloads_path) %}
{% do app.environment.add_env("TZ", values.TZ) %}
{% do app.add_port(values.network.web_port, {"container_port": 15151}) %}
{% do app.add_storage(values.consts.config_path, values.storage.config) %}
{% do app.add_storage(values.consts.downloads_path, values.storage.downloads) %}
{% do app.add_storage(values.consts.temp_path, values.storage.temp) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}
{% do perm_container.add_or_skip_action("downloads", values.storage.downloads, perms_config) %}
{% do perm_container.add_or_skip_action("temp", values.storage.temp, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do app.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body("Keep the web interface on a trusted network. Enable API-key authentication before exposing it outside your LAN. The built-in browser requires 1 GiB shared memory, configured automatically.") %}

{{ tpl.render() | tojson }}
