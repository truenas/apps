groups:
  - name: t3monitoring Configuration
    description: Configure t3monitoring
  - name: Network Configuration
    description: Configure Network for t3monitoring
  - name: Storage Configuration
    description: Configure Storage for t3monitoring
  - name: Labels Configuration
    description: Configure Labels for t3monitoring
  - name: Resources Configuration
    description: Configure Resources for t3monitoring

questions:
  - variable: TZ
    group: t3monitoring Configuration
    label: Timezone
    schema:
      type: string
      default: Europe/Berlin
      required: true
      $ref:
        - definitions/timezone

  - variable: t3monitoring
    label: ""
    group: t3monitoring Configuration
    schema:
      type: dict
      attrs:
        - variable: server_name
          label: Server Name
          description: |
            The public hostname this instance is served under, without scheme or
            trailing slash (e.g. t3monitoring.example.com). TYPO3's site
            configuration builds its base URL from this
            (base: 'https://%env(SERVER_NAME)%/'), so leaving it wrong makes the
            frontend fail to resolve a site and return a 500.
          schema:
            type: string
            default: ""
            required: true
        - variable: force_backend_https
          label: Force HTTPS for the TYPO3 backend
          description: |
            Makes TYPO3 refuse plain-HTTP access to /typo3/ and redirect to
            https://<host>/typo3/ — note it drops the port, so with this on the
            app is only reachable through a TLS-terminating reverse proxy and the
            WebUI button below will not work.

            Leave off if you reach this app directly at http://<node-ip>:<port>/.
            Turn on only if every route to it terminates TLS in front.
          schema:
            type: boolean
            default: false
        - variable: db_password
          label: Database Password
          description: The database password for t3monitoring.
          schema:
            type: string
            default: ""
            required: true
            private: true
        - variable: db_root_password
          label: Root Database Password
          description: The root database password for MariaDB.
          schema:
            type: string
            default: ""
            required: true
            private: true
        - variable: encryption_key
          label: TYPO3 Encryption Key
          description: |
            Must not be blank. Reuse the value already in
            project/config/system/settings.php ('encryptionKey') so
            existing sessions/hashes/links stay valid — a different value doesn't
            just start fresh, it makes TYPO3 refuse to boot until it's set.
          schema:
            type: string
            default: ""
            required: true
            private: true
        - variable: install_tool_password
          label: Install Tool Password (pre-hashed)
          description: |
            A pre-hashed argon2i value, not plain text. Generate one with:
            docker run --rm php:8.4-cli php -r "echo password_hash('yourpassword', PASSWORD_ARGON2I), PHP_EOL;"
          schema:
            type: string
            default: ""
            required: true
            private: true
        - variable: mail_transport
          label: Mail Transport
          schema:
            type: string
            default: smtp
            enum:
              - value: smtp
                description: SMTP
              - value: sendmail
                description: sendmail
        - variable: mail_smtp_server
          label: SMTP Server (host:port)
          schema:
            type: string
            default: ""
        - variable: mail_smtp_username
          label: SMTP Username
          schema:
            type: string
            default: ""
        - variable: mail_smtp_password
          label: SMTP Password
          schema:
            type: string
            default: ""
            private: true
        - variable: mail_smtp_encrypt
          label: SMTP Encryption
          schema:
            type: string
            default: tls
            enum:
              - value: tls
                description: TLS
              - value: ssl
                description: SSL
              - value: ""
                description: None
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          description: |
            Plain HTTP only — TYPO3 trusts X-Forwarded-Proto from whatever
            reverse proxy you put in front of this for TLS. See
            deploy/README-TrueNAS.md in the t3monitoring-dev repo.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  show_if: [["bind_mode", "=", "published"]]
                  default: 30461
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: fileadmin
          label: fileadmin Storage
          description: TYPO3's public/fileadmin — user-managed content and uploads.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "fileadmin"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: var_log
          label: TYPO3 Log Storage
          description: TYPO3's var/log directory.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "var_log"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: db_data
          label: MariaDB Data Storage
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "db_data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: additional_storage
          label: Additional Storage
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      schema:
                        type: string
                        required: true
                        default: "ix_volume"
                        enum:
                          - value: "host_path"
                            description: Host Path (Path that already exists on the system)
                          - value: "ix_volume"
                            description: ixVolume (Dataset created automatically by the system)
                    - variable: read_only
                      label: Read Only
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                          - variable: path
                            label: Host Path
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - "normalize/ix_volume"
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            schema:
                              type: string
                              required: true
                              default: "storage_entry"
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: t3monitoring
                            description: t3monitoring
                          - value: t3monitoring-scheduler
                            description: t3monitoring-scheduler
                          - value: mariadb
                            description: mariadb

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                schema:
                  type: int
                  default: 2048
                  required: true
