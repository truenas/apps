images:
  image:
    # Built from deploy/Dockerfile in the t3monitoring-dev repo and pushed here.
    # Update both this tag and app.yaml's `version` (and `app_version` if the
    # upstream TYPO3/t3monitoring version changed) whenever you push a new build.
    repository: ghcr.io/undkonsorten/t3monitoring
    tag: "13.4.34"
  mariadb_image:
    repository: mariadb
    tag: "12.3.2"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  t3monitoring_container_name: t3monitoring
  scheduler_container_name: scheduler
  mariadb_container_name: mariadb
  perms_container_name: permissions
  db_user: t3monitoring
  db_name: t3monitoring
  # Matches the www-data uid/gid baked into deploy/Dockerfile.
  run_user: 33
  run_group: 33
  internal_web_port: 80
  notes_body: |
    The database is set up automatically on first start, which takes a minute or
    two. Until it finishes, the Web UI does not respond. Sign in at the **Web UI**
    button above (it opens `/typo3/`) with the backend username and password you
    set during installation.

    Monitoring runs on a schedule: create the t3monitoring tasks under
    **Scheduler** in the backend to get started.
