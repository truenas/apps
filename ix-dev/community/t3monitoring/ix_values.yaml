images:
  image:
    repository: ghcr.io/undkonsorten/t3monitoring
    tag: "13.4.34"
  mariadb_image:
    repository: mariadb
    tag: "12.3.2"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  t3monitoring_container_name: t3monitoring
  scheduler_container_name: scheduler
  mariadb_container_name: mariadb
  perms_container_name: permissions
  db_user: t3monitoring
  db_name: t3monitoring
  # Matches the www-data uid/gid baked into deploy/Dockerfile.
  run_user: 33
  run_group: 33
  internal_web_port: 80
