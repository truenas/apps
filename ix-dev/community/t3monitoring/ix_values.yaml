images:
  image:
    # Built from deploy/Dockerfile in the t3monitoring-dev repo and pushed here.
    # Update both this tag and app.yaml's `version` (and `app_version` if the
    # upstream TYPO3/t3monitoring version changed) whenever you push a new build.
    repository: ghcr.io/undkonsorten/t3monitoring
    tag: "13.4.34"
  mariadb_image:
    repository: mariadb
    tag: "10.11"
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  web_container_name: t3monitoring
  scheduler_container_name: t3monitoring-scheduler
  mariadb_container_name: mariadb
  perms_container_name: permissions
  db_user: typo3
  db_name: t3monitoring
  # Matches the www-data uid/gid baked into deploy/Dockerfile.
  run_user: 33
  run_group: 33
  internal_web_port: 80
  notes_body: |
    ## First start

    The database is set up automatically the first time the app starts: TYPO3's
    schema is created, extensions are set up, and the backend user you configured
    is created. This takes a minute or two — until it finishes the Web UI will not
    respond yet.

    Sign in at the **Web UI** button above (it opens `/typo3/`) with the backend
    username and password you set during installation.

    ## The public site returns "No site configuration found"

    This is expected on a fresh install. The bundled site configuration points at a
    root page that only exists once you have content, so the public frontend stays
    empty until you create a page tree in the backend. t3monitoring itself is used
    entirely from the backend, so this does not affect monitoring.

    ## Monitoring runs on a schedule

    The `t3monitoring-scheduler` container runs TYPO3's scheduler once a minute.
    Create the t3monitoring tasks under **Scheduler** in the backend — until then
    the scheduler has nothing to do and nothing is monitored.

    ## Importing an existing database

    Restoring a dump from an existing t3monitoring instance overwrites the schema
    created above. Import it into the `mariadb` container, then run the upgrade
    wizards from `/typo3/install.php` if the dump came from an older TYPO3.
