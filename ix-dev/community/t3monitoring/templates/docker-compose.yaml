{% set tpl = ix_lib.base.render.Render(values) %}

{% set t3_net = tpl.networks.create_internal("t3monitoring-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_user, "gid": values.consts.run_group, "mode": "check"} %}

{% set mariadb_config = {
  "user": values.consts.db_user,
  "root_password": values.t3monitoring.db_root_password,
  "password": values.t3monitoring.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.db_data,
} %}
{% set mariadb_container = tpl.deps.mariadb(values.consts.mariadb_container_name, "mariadb_image", mariadb_config, perm_container) %}
{% do mariadb_container.container.add_network(t3_net) %}

{% set web = tpl.add_container(values.consts.t3monitoring_container_name, "image") %}
{% do web.environment.add_env("T3M_DB_AUTO_SETUP", "1") %}
{% do web.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/typo3/", "headers": [["Host", values.t3monitoring.server_name]]}) %}
{% do web.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% set scheduler = tpl.add_container(values.consts.scheduler_container_name, "image") %}
{% do scheduler.set_command(["sh", "-c", "while true; do vendor/bin/typo3 scheduler:run || echo \"scheduler:run failed with exit $?\" >&2; sleep 60; done"]) %}
{% do scheduler.healthcheck.disable() %}

{% set containers = [web, scheduler] %}
{% for c in containers %}
  {% do c.add_network(t3_net) %}
  {% do c.add_caps(["CHOWN", "SETUID", "SETGID"]) %}
  {% do c.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}

  {% do c.environment.add_env("TYPO3_CONTEXT", "Production") %}
  {% do c.environment.add_env("SERVER_NAME", values.t3monitoring.server_name) %}
  {% do c.environment.add_env("TYPO3_BE_LOCKSSL", "1" if values.t3monitoring.force_backend_https else "0") %}
  {% do c.environment.add_env("TYPO3_DB_HOST", values.consts.mariadb_container_name) %}
  {% do c.environment.add_env("TYPO3_DB_PORT", mariadb.get_port()) %}
  {% do c.environment.add_env("TYPO3_DB_USER", values.consts.db_user) %}
  {% do c.environment.add_env("TYPO3_DB_PASSWORD", values.t3monitoring.db_password) %}
  {% do c.environment.add_env("TYPO3_DB_DBNAME", values.consts.db_name) %}
  {% do c.environment.add_env("TYPO3_SYS_ENCRYPTIONKEY", values.t3monitoring.encryption_key) %}
  {% do c.environment.add_env("TYPO3_BE_INSTALLTOOLPASSWORD", values.t3monitoring.install_tool_password) %}
  {% do c.environment.add_env("TYPO3_BE_ADMIN_USER", values.t3monitoring.admin_user) %}
  {% do c.environment.add_env("TYPO3_BE_ADMIN_PASSWORD", values.t3monitoring.admin_password) %}
  {% do c.environment.add_user_envs(values.t3monitoring.additional_envs) %}

  {% do c.add_storage("/var/www/html/public/fileadmin", values.storage.fileadmin) %}
  {% do c.add_storage("/var/www/html/var/log", values.storage.var_log) %}
  {% for store in values.storage.additional_storage %}
    {% do c.add_storage(store.mount_path, store) %}
  {% endfor %}
{% endfor %}

{% do perm_container.add_or_skip_action("fileadmin", values.storage.fileadmin, perms_config) %}
{% do perm_container.add_or_skip_action("var-log", values.storage.var_log, perms_config) %}
{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do mariadb_container.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% for c in containers %}
    {% do c.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endfor %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"path": "/typo3/"}) %}

{{ tpl.render() | tojson }}
