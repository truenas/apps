resources:
  limits:
    cpus: 2.0
    memory: 4096

ovumcy:
  # test-only value, never use it outside CI
  secret_key: "000000000000000000000000000000000000000000000000000000000ci-test"
  cookie_secure: false
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080
  host_network: false

ix_volumes:
  data: /opt/tests/mnt/data
  fence: /opt/tests/mnt/fence

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  fence:
    type: ix_volume
    ix_volume_config:
      dataset_name: fence
      create_host_path: true
  additional_storage: []
