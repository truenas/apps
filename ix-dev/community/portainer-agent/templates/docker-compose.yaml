{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.portainer_agent_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.add_docker_socket() %}
{% do c1.healthcheck.disable() %}

{% do c1.environment.add_env("DATA_PATH", values.consts.data_path) %}
{% if values.portainer_agent.agent_secret %}
  {% do c1.environment.add_env("AGENT_SECRET", values.portainer_agent.agent_secret) %}
{% endif %}

{% if values.portainer_agent.mode == "agent" %}
  {% do c1.environment.add_env("AGENT_PORT", values.network.agent_port.port_number) %}
  {% do c1.add_port(values.network.agent_port) %}
{% else %}
  {% do c1.environment.add_env("EDGE", "1") %}
  {% do c1.environment.add_env("EDGE_ID", values.portainer_agent.edge.id) %}
  {% do c1.environment.add_env("EDGE_KEY", values.portainer_agent.edge.key) %}
  {% do c1.environment.add_env("EDGE_ASYNC", "1" if values.portainer_agent.mode == "edge_async" else "0") %}
  {% do c1.environment.add_env("EDGE_INSECURE_POLL", "1" if values.portainer_agent.edge.insecure_poll else "0") %}
{% endif %}

{% do c1.environment.add_user_envs(values.portainer_agent.additional_envs) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{{ tpl.render() | tojson }}
