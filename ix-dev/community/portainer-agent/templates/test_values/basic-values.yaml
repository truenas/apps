resources:
  limits:
    cpus: 2.0
    memory: 1024

ci: true

portainer_agent:
  mode: agent
  agent_secret: ""
  additional_envs: []

network:
  host_network: false
  agent_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/portainer-agent/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
