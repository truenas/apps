{% set tpl = ix_lib.base.render.Render(values) %}

{% set prowler_net = tpl.networks.create_internal("prowler-net") %}

{% set api = tpl.add_container(values.consts.api_container_name, "api_image") %}
{% do api.add_network(prowler_net) %}
{% set worker = tpl.add_container(values.consts.worker_container_name, "api_image") %}
{% do worker.add_network(prowler_net) %}
{% set worker_beat = tpl.add_container(values.consts.worker_beat_container_name, "api_image") %}
{% do worker_beat.add_network(prowler_net) %}
{% set ui = tpl.add_container(values.consts.ui_container_name, "ui_image") %}
{% do ui.add_network(prowler_net) %}
{% set mcp = tpl.add_container(values.consts.mcp_container_name, "mcp_image") %}
{% do mcp.add_network(prowler_net) %}
{% set neo4j = tpl.add_container(values.consts.neo4j_container_name, "neo4j_image") %}
{% do neo4j.add_network(prowler_net) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set api_perm_config = {"uid": 1000, "gid": 1000, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.prowler.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, "postgres_image", pg_config, perm_container) %}
{% do postgres.container.add_network(prowler_net) %}

{% set redis_config = {
  "password": values.prowler.valkey_password,
  "volume": values.storage.valkey_data,
} %}
{% set valkey = tpl.deps.redis(values.consts.valkey_container_name, "redis_image", redis_config, perm_container) %}
{% do valkey.container.add_network(prowler_net) %}

{# --- Neo4j (no prebuilt dependency helper upstream; configured manually) --- #}
{# The upstream image's own entrypoint runs as root and chowns its installed files
   before dropping privileges; it needs these caps back since the library drops
   ALL capabilities by default. #}
{% do neo4j.add_caps(["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]) %}
{% do neo4j.environment.add_env("NEO4J_AUTH", "neo4j/%s"|format(values.prowler.neo4j_password)) %}
{% do neo4j.environment.add_env("NEO4J_dbms_max__databases", 1000) %}
{% do neo4j.environment.add_env("NEO4J_server_memory_pagecache_size", "1G") %}
{% do neo4j.environment.add_env("NEO4J_server_memory_heap_initial__size", "1G") %}
{% do neo4j.environment.add_env("NEO4J_server_memory_heap_max__size", "1G") %}
{% do neo4j.environment.add_env("NEO4J_PLUGINS", '["apoc"]') %}
{% do neo4j.environment.add_env("NEO4J_dbms_security_procedures_allowlist", "apoc.*") %}
{% do neo4j.environment.add_env("NEO4J_dbms_security_procedures_unrestricted", "") %}
{% do neo4j.environment.add_env("apoc.export.file.enabled", "false") %}
{% do neo4j.environment.add_env("apoc.import.file.enabled", "false") %}
{% do neo4j.environment.add_env("apoc.import.file.use_neo4j_config", "true") %}
{% do neo4j.environment.add_env("apoc.trigger.enabled", "false") %}
{% do neo4j.environment.add_env("dbms.connector.bolt.listen_address", "0.0.0.0:7687") %}
{% do neo4j.healthcheck.set_test("wget", {"port": 7474, "path": "/"}) %}
{% do neo4j.add_storage("/data", values.storage.neo4j_data) %}

{# --- Shared env/deps for the three prowler-api-image containers --- #}
{% set api_family = [api, worker, worker_beat] %}
{% for c in api_family %}
  {% do c.set_user(1000, 1000) %}
  {% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
  {% do c.depends.add_dependency(values.consts.valkey_container_name, "service_healthy") %}
  {% do c.depends.add_dependency(values.consts.neo4j_container_name, "service_started") %}

  {% do c.environment.add_env("POSTGRES_HOST", values.consts.postgres_container_name) %}
  {% do c.environment.add_env("POSTGRES_PORT", postgres.get_port()) %}
  {% do c.environment.add_env("POSTGRES_ADMIN_USER", values.consts.db_user) %}
  {% do c.environment.add_env("POSTGRES_ADMIN_PASSWORD", values.prowler.db_password) %}
  {% do c.environment.add_env("POSTGRES_USER", values.consts.db_user) %}
  {% do c.environment.add_env("POSTGRES_PASSWORD", values.prowler.db_password) %}
  {% do c.environment.add_env("POSTGRES_DB", values.consts.db_name) %}

  {% do c.environment.add_env("NEO4J_HOST", values.consts.neo4j_container_name) %}
  {% do c.environment.add_env("NEO4J_PORT", 7687) %}
  {% do c.environment.add_env("NEO4J_USER", "neo4j") %}
  {% do c.environment.add_env("NEO4J_PASSWORD", values.prowler.neo4j_password) %}

  {% do c.environment.add_env("VALKEY_SCHEME", "redis") %}
  {% do c.environment.add_env("VALKEY_HOST", values.consts.valkey_container_name) %}
  {% do c.environment.add_env("VALKEY_PORT", valkey.get_port()) %}
  {% do c.environment.add_env("VALKEY_PASSWORD", values.prowler.valkey_password) %}
  {% do c.environment.add_env("VALKEY_DB", 0) %}

  {% do c.environment.add_env("DJANGO_TMP_OUTPUT_DIRECTORY", values.consts.api_output_path) %}
  {% do c.environment.add_env("DJANGO_SETTINGS_MODULE", "config.django.production") %}
  {% do c.environment.add_env("DJANGO_DEBUG", false) %}
  {% do c.environment.add_env("DJANGO_LOGGING_LEVEL", values.prowler.django_logging_level) %}
  {% do c.environment.add_env("DJANGO_SECRETS_ENCRYPTION_KEY", values.prowler.django_secrets_encryption_key) %}
  {% do c.environment.add_env("DJANGO_MANAGE_DB_PARTITIONS", true) %}

  {% do c.environment.add_user_envs(values.prowler.additional_envs) %}

  {% do c.add_storage(values.consts.api_output_path, values.storage.api_output) %}
  {% for store in values.storage.additional_storage %}
    {% do c.add_storage(store.mount_path, store) %}
  {% endfor %}
{% endfor %}

{# --- api (Django/Gunicorn) --- #}
{% do api.environment.add_env("DJANGO_ALLOWED_HOSTS", "localhost,127.0.0.1,%s"|format(values.consts.api_container_name)) %}
{% do api.environment.add_env("DJANGO_BIND_ADDRESS", "0.0.0.0") %}
{% do api.environment.add_env("DJANGO_PORT", values.network.api_port.port_number) %}
{% do api.set_entrypoint(["/home/prowler/docker-entrypoint.sh", "prod"]) %}
{% do api.add_storage(values.consts.api_config_path, values.storage.api_config) %}
{% do api.add_port(values.network.api_port) %}
{% do api.healthcheck.set_test("wget", {"port": values.network.api_port.port_number, "path": "/health/live"}) %}
{# Cold start (migrations + Gunicorn workers warming compliance caches for every provider)
   takes longer than the library's default healthcheck budget; match upstream's own allowance. #}
{% do api.healthcheck.set_start_period(60) %}
{% do api.healthcheck.set_interval(10) %}
{% do api.healthcheck.set_retries(12) %}

{# --- worker / worker-beat (Celery) --- #}
{% do worker.set_entrypoint(["/home/prowler/docker-entrypoint.sh", "worker"]) %}
{% do worker.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{% do worker.healthcheck.disable() %}

{% do worker_beat.set_entrypoint(["/home/prowler/docker-entrypoint.sh", "beat"]) %}
{% do worker_beat.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{% do worker_beat.healthcheck.disable() %}

{# --- mcp-server --- #}
{% do mcp.set_user(1001, 1001) %}
{% do mcp.environment.add_env("PROWLER_MCP_TRANSPORT_MODE", "http") %}
{% do mcp.environment.add_user_envs(values.prowler.additional_envs) %}
{% do mcp.set_command(["uvicorn", "--host", "0.0.0.0", "--port", values.network.mcp_port.port_number|string]) %}
{% do mcp.add_port(values.network.mcp_port) %}
{% do mcp.healthcheck.set_test("wget", {"port": values.network.mcp_port.port_number, "path": "/health"}) %}

{# --- ui (Next.js) --- #}
{% do ui.set_user(1001, 1001) %}
{% do ui.environment.add_env("AUTH_URL", "http://localhost:%d"|format(values.network.ui_port.port_number)) %}
{% do ui.environment.add_env("AUTH_TRUST_HOST", true) %}
{% do ui.environment.add_env("AUTH_SECRET", values.prowler.ui_auth_secret) %}
{% do ui.environment.add_env("API_BASE_URL", "http://%s:%d/api/v1"|format(values.consts.api_container_name, values.network.api_port.port_number)) %}
{% do ui.environment.add_env("UI_API_BASE_URL", "http://%s:%d/api/v1"|format(values.consts.api_container_name, values.network.api_port.port_number)) %}
{% do ui.environment.add_env("UI_API_DOCS_URL", "http://%s:%d/api/v1/docs"|format(values.consts.api_container_name, values.network.api_port.port_number)) %}
{% do ui.environment.add_env("PROWLER_MCP_SERVER_URL", "http://%s:%d/mcp"|format(values.consts.mcp_container_name, values.network.mcp_port.port_number)) %}
{% do ui.environment.add_user_envs(values.prowler.additional_envs) %}
{# The ui image hardcodes ENV PORT=3000 (Next.js standalone server); only the
   host-published side is user-configurable, the container always listens on 3000. #}
{% set ui_port_cfg = {
  "bind_mode": values.network.ui_port.bind_mode,
  "port_number": values.network.ui_port.port_number,
  "host_ips": values.network.ui_port.host_ips,
  "container_port": 3000,
} %}
{% do ui.add_port(ui_port_cfg) %}
{% do ui.depends.add_dependency(values.consts.mcp_container_name, "service_healthy") %}
{% do ui.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{% do ui.healthcheck.set_test("wget", {"port": 3000, "path": "/api/health"}) %}

{# --- Permissions (api config + api output only; postgres/valkey handled by their dep helpers) --- #}
{% do perm_container.add_or_skip_action("api_config", values.storage.api_config, api_perm_config) %}
{% do perm_container.add_or_skip_action("api_output", values.storage.api_output, api_perm_config) %}
{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, api_perm_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% for c in api_family %}
    {% do c.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endfor %}
{% endif %}

{% do tpl.portals.add(values.network.ui_port, {"name": "Prowler UI"}) %}

{{ tpl.render() | tojson }}
