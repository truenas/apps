images:
  api_image:
    repository: prowlercloud/prowler-api
    tag: "5.42.0"
  ui_image:
    repository: prowlercloud/prowler-ui
    tag: "5.42.0"
  mcp_image:
    repository: prowlercloud/prowler-mcp
    tag: "5.42.0"
  postgres_image:
    repository: postgres
    tag: 16.15-alpine
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: 1.2.16
  redis_image:
    repository: valkey/valkey
    tag: 8.1.10-alpine3.24
  neo4j_image:
    repository: graphstack/dozerdb
    tag: 5.26.27.0
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  api_container_name: prowler-api
  worker_container_name: prowler-worker
  worker_beat_container_name: prowler-worker-beat
  ui_container_name: prowler-ui
  mcp_container_name: prowler-mcp-server
  neo4j_container_name: neo4j
  postgres_container_name: postgres
  valkey_container_name: valkey
  perms_container_name: permissions
  db_user: prowler
  db_name: prowler_db
  api_config_path: /home/prowler/.config/prowler-api
  api_output_path: /tmp/prowler_api_output
