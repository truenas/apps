{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": 568, "gid": 568, "mode": "check"} %}

{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.set_test("tcp", {"port": values.consts.internal_web_port}) %}

{% do c1.environment.add_env("CRON", values.adguardhome_sync.cron) %}
{% do c1.environment.add_env("RUN_ON_START", values.adguardhome_sync.run_on_start) %}
{% do c1.environment.add_env("CONTINUE_ON_ERROR", values.adguardhome_sync.continue_on_error) %}
{% do c1.environment.add_env("PUID", 568) %}
{% do c1.environment.add_env("PGID", 568) %}
{% do c1.environment.add_env("ORIGIN_URL", values.adguardhome_sync.origin_url) %}
{% do c1.environment.add_env("ORIGIN_USERNAME", values.adguardhome_sync.origin_username) %}
{% do c1.environment.add_env("ORIGIN_PASSWORD", values.adguardhome_sync.origin_password) %}
{% do c1.environment.add_env("ORIGIN_API_PATH", values.adguardhome_sync.origin_api_path) %}
{% do c1.environment.add_env("ORIGIN_INSECURE_SKIP_VERIFY", values.adguardhome_sync.origin_insecure_skip_verify) %}
{% if values.adguardhome_sync.origin_cookie %}
  {% do c1.environment.add_env("ORIGIN_COOKIE", values.adguardhome_sync.origin_cookie) %}
{% endif %}
{% do c1.environment.add_env("REPLICA1_URL", values.adguardhome_sync.replica_url) %}
{% do c1.environment.add_env("REPLICA1_USERNAME", values.adguardhome_sync.replica_username) %}
{% do c1.environment.add_env("REPLICA1_PASSWORD", values.adguardhome_sync.replica_password) %}
{% do c1.environment.add_env("REPLICA1_API_PATH", values.adguardhome_sync.replica_api_path) %}
{% do c1.environment.add_env("REPLICA1_INSECURE_SKIP_VERIFY", values.adguardhome_sync.replica_insecure_skip_verify) %}
{% if values.adguardhome_sync.replica_cookie %}
  {% do c1.environment.add_env("REPLICA1_COOKIE", values.adguardhome_sync.replica_cookie) %}
{% endif %}
{% if values.adguardhome_sync.api_username %}
  {% do c1.environment.add_env("API_USERNAME", values.adguardhome_sync.api_username) %}
{% endif %}
{% if values.adguardhome_sync.api_password %}
  {% do c1.environment.add_env("API_PASSWORD", values.adguardhome_sync.api_password) %}
{% endif %}
{% do c1.environment.add_user_envs(values.adguardhome_sync.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perm_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
