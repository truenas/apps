resources:
  limits:
    cpus: 2.0
    memory: 4096

anilink:
  debrid_api_key: test-api-key
  debrid_request_delay: 500
  concurrent_downloads: 3
  archive_passwords: []
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  downloads: /opt/tests/mnt/anilink-downloader/downloads

storage:
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: downloads
      create_host_path: true
  additional_storage: []
