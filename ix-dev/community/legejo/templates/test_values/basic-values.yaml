resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
legejo:
  admin_user: admin
  admin_password: some-secret-password
  public_url: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/legejo/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
