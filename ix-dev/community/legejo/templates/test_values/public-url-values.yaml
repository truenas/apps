resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Europe/Stockholm
legejo:
  admin_user: librarian
  admin_password: some-other-secret-password
  public_url: https://books.example.com
  additional_envs:
    - name: LEGEJO_MAX_UPLOAD_MB
      value: "100"

network:
  web_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/legejo/data-host
      create_host_path: true
      auto_permissions: true
  additional_storage:
    - type: host_path
      mount_path: /import
      host_path_config:
        path: /opt/tests/mnt/legejo/import
        create_host_path: true
