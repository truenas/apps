{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.photostructure_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# Started as run_as, the image skips its root-only setup (account renumbering
   and chown) and runs PhotoStructure directly as that uid, which needs no
   passwd entry as of 2026.9.1-beta. The perms container owns the ix_volumes. #}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}

{# Matches the image's own HEALTHCHECK, which allows 60s for first-run setup. #}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/ping"}) %}
{% do c1.healthcheck.set_start_period(60) %}

{# PhotoStructure normally stops within a few seconds; 60s is the most TrueNAS
   honors on reboot, and the library flags anything longer as action-required. #}
{% do c1.set_grace_period(60) %}

{% do c1.environment.add_env("PS_HTTP_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_user_envs(values.photostructure.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.library_path, values.storage.library) %}
{% do perm_container.add_or_skip_action("library", values.storage.library, perm_config) %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perm_config) %}

{% do c1.add_storage(values.consts.cache_path, values.storage.cache) %}
{% do perm_container.add_or_skip_action("cache", values.storage.cache, perm_config) %}

{# A stable per-host identifier for licensing; declared in app.yaml host_mounts. #}
{% do c1.add_storage(values.consts.machine_id_path, {"type": "host_path", "read_only": true, "host_path_config": {"path": "/etc/machine-id"}}) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
