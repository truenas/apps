resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

photostructure:
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30492

run_as:
  user: 568
  group: 568

ix_volumes:
  library: /opt/tests/mnt/library
  config: /opt/tests/mnt/config
  cache: /opt/tests/mnt/cache

storage:
  library:
    type: ix_volume
    ix_volume_config:
      dataset_name: library
      create_host_path: true
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: cache
      create_host_path: true
  additional_storage: []
