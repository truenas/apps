images:
  image:
    repository: ghcr.io/photostructure/server
    tag: 2026.9.5
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  photostructure_container_name: photostructure
  perms_container_name: permissions
  library_path: /ps/library
  config_path: /ps/config
  cache_path: /ps/tmp
  machine_id_path: /ps/host/machine-id
  notes_body: |
    ## Getting started

    Open the web portal and follow the first-run steps. To import photos and
    videos, mount their folders under **Storage Configuration > Photo and Video
    Folders**. PhotoStructure scans every folder mounted there.

    ## No login

    PhotoStructure has no authentication. Anyone who can reach the web port can
    browse the library. Keep the port on your LAN, or put it behind a reverse
    proxy that handles authentication.

    ## Optional tools

    Video previews and some phone photo formats need external tools that are not
    part of the image. PhotoStructure asks before installing them. They download
    into the config storage (about 730 MB) and survive app updates.

    ## Permissions

    PhotoStructure runs as the configured User ID and Group ID. Datasets that
    TrueNAS creates for the app are owned by that user automatically. For host
    paths, that user needs read and write access to the library, config, and
    cache folders, and read access to the photo and video folders.
