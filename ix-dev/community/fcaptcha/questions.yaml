groups:
  - name: FCaptcha Configuration
    description: Configure FCaptcha secrets
  - name: Network Configuration
    description: Configure network access
  - name: Labels Configuration
    description: Configure container labels
  - name: Resources Configuration
    description: Configure resource limits

questions:
  - variable: fcaptcha
    label: ""
    group: FCaptcha Configuration
    schema:
      type: dict
      attrs:
        - variable: signing_secret
          label: Signing Secret
          description: Generate a random secret of at least 32 characters for signing tokens.
          schema:
            type: string
            min_length: 32
            private: true
            required: true
        - variable: verification_secret
          label: Verification Secret
          description: Generate a different random secret of at least 32 characters for backend token verification.
          schema:
            type: string
            min_length: 32
            private: true
            required: true
  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish the port on the host
                    - value: exposed
                      description: Expose the port only to containers
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30487
                  min: 1024
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: fcaptcha
                            description: fcaptcha

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for FCaptcha.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for FCaptcha.
                schema:
                  type: int
                  default: 512
                  required: true
