{% set tpl = ix_lib.base.render.Render(values) %}
{% if values.omnivoice.device == "cuda" and not tpl.funcs.has_nvidia_gpu() %}
  {% do tpl.funcs.fail("NVIDIA inference requires an NVIDIA GPU selected under Resources. Select a GPU or choose CPU inference.") %}
{% endif %}
{% if values.omnivoice.voice_source == "manual" and ((values.omnivoice.voice_ref and not values.omnivoice.ref_text) or (values.omnivoice.ref_text and not values.omnivoice.voice_ref)) %}
  {% do tpl.funcs.fail("Reference audio and its transcript must be supplied together, or both left empty.") %}
{% endif %}
{% if values.omnivoice.flashinfer == "true" and values.omnivoice.device != "cuda" %}
  {% do tpl.funcs.fail("FlashInfer requires NVIDIA GPU inference.") %}
{% endif %}
{% if values.omnivoice.cuda_graph == "true" and values.omnivoice.flashinfer != "true" %}
  {% do tpl.funcs.fail("CUDA graphs require FlashInfer.") %}
{% endif %}
{% if values.omnivoice.voice_source == "custom" and not values.omnivoice.voice_name | trim %}
  {% do tpl.funcs.fail("Enter a custom voice name, for example david.") %}
{% endif %}
{% set design_tags = values.omnivoice.instruct_custom if values.omnivoice.instruct == "custom" else values.omnivoice.instruct %}
{% if values.omnivoice.voice_source == "design" and not design_tags | trim %}
  {% do tpl.funcs.fail("Select voice-design tags when using voice design.") %}
{% endif %}
{% set packet_bytes = (values.omnivoice.audio_packet_bytes_custom if values.omnivoice.audio_packet_bytes == "custom" else values.omnivoice.audio_packet_bytes) | int %}
{% if packet_bytes % 2 %}
  {% do tpl.funcs.fail("Audio packet size must be an even number of bytes.") %}
{% endif %}
{% set c1 = tpl.add_container(values.consts.omnivoice_container_name, "image") %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_custom_test(["CMD", "python3", "/app/healthcheck.py"]) %}
{% do c1.healthcheck.set_start_period(1800) %}
{% do c1.healthcheck.set_timeout(10) %}
{% do c1.healthcheck.set_start_interval(30) %}
{% do c1.environment.add_env("OMP_NUM_THREADS", values.resources.limits.cpus) %}
{% do c1.environment.add_env("MKL_NUM_THREADS", values.resources.limits.cpus) %}
{% do c1.environment.add_env("OMNIVOICE_VOICE", "example" if values.omnivoice.voice_source == "example" else (values.omnivoice.voice_name if values.omnivoice.voice_source == "custom" else "")) %}
{% do c1.environment.add_env("OMNIVOICE_VOICES_DIR", values.omnivoice.voices_dir_custom if values.omnivoice.voices_dir == "custom" else values.omnivoice.voices_dir) %}
{% do c1.environment.add_env("OMNIVOICE_AUDIO_PACKET_BYTES", values.omnivoice.audio_packet_bytes_custom if values.omnivoice.audio_packet_bytes == "custom" else values.omnivoice.audio_packet_bytes) %}
{% do c1.environment.add_env("OMNIVOICE_FLASHINFER", values.omnivoice.flashinfer) %}
{% do c1.environment.add_env("OMNIVOICE_CUDA_GRAPH", values.omnivoice.cuda_graph) %}
{% do c1.environment.add_env("OMNIVOICE_CUDA_GRAPH_CACHE_SIZE", values.omnivoice.cuda_graph_cache_size) %}
{% do c1.environment.add_env("OMNIVOICE_DEVICE", values.omnivoice.device) %}
{% do c1.environment.add_env("OMNIVOICE_LOG_LEVEL", values.omnivoice.log_level) %}
{% do c1.environment.add_env("OMNIVOICE_MODEL", (values.omnivoice.model_custom if values.omnivoice.model == "custom" else values.omnivoice.model)) %}
{% do c1.environment.add_env("OMNIVOICE_LANGUAGE", (values.omnivoice.language_custom if values.omnivoice.language == "custom" else values.omnivoice.language)) %}
{% do c1.environment.add_env("OMNIVOICE_LANGUAGE_CODE", (values.omnivoice.language_code_custom if values.omnivoice.language_code == "custom" else values.omnivoice.language_code)) %}
{% do c1.environment.add_env("OMNIVOICE_REF_AUDIO", (values.omnivoice.voice_ref if values.omnivoice.voice_source == "manual" else "")) %}
{% do c1.environment.add_env("OMNIVOICE_REF_TEXT", (values.omnivoice.ref_text if values.omnivoice.voice_source == "manual" else "")) %}
{% do c1.environment.add_env("OMNIVOICE_INSTRUCT", (design_tags if values.omnivoice.voice_source == "design" else "")) %}
{% do c1.environment.add_env("OMNIVOICE_NUM_STEP", (values.omnivoice.num_step_custom if values.omnivoice.num_step == "custom" else values.omnivoice.num_step)) %}
{% do c1.environment.add_env("OMNIVOICE_GUIDANCE_SCALE", (values.omnivoice.guidance_scale_custom if values.omnivoice.guidance_scale == "custom" else values.omnivoice.guidance_scale)) %}
{% do c1.environment.add_env("OMNIVOICE_SPEED", (values.omnivoice.speed_custom if values.omnivoice.speed == "custom" else values.omnivoice.speed)) %}
{% do c1.environment.add_env("OMNIVOICE_T_SHIFT", (values.omnivoice.t_shift_custom if values.omnivoice.t_shift == "custom" else values.omnivoice.t_shift)) %}
{% do c1.environment.add_env("OMNIVOICE_FULL_TEXT_CHARS", (values.omnivoice.full_text_chars_custom if values.omnivoice.full_text_chars == "custom" else values.omnivoice.full_text_chars)) %}
{% do c1.environment.add_env("OMNIVOICE_FIRST_STREAM_CHARS", (values.omnivoice.first_stream_chars_custom if values.omnivoice.first_stream_chars == "custom" else values.omnivoice.first_stream_chars)) %}
{% do c1.environment.add_env("OMNIVOICE_STREAM_CHARS", (values.omnivoice.stream_chars_custom if values.omnivoice.stream_chars == "custom" else values.omnivoice.stream_chars)) %}
{% do c1.environment.add_env("OMNIVOICE_INTER_CHUNK_SILENCE", (values.omnivoice.silence_custom if values.omnivoice.silence == "custom" else values.omnivoice.silence)) %}

{% do c1.add_port(values.network.wyoming_port, {"container_port": 10200}) %}
{% do c1.add_storage("/data", values.storage.data) %}
{% do perms.add_or_skip_action("data", values.storage.data, {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"}) %}
{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}
{{ tpl.render() | tojson }}
