omnivoice:
  log_level: WARNING
  device: cpu
  model: k2-fsa/OmniVoice
  model_custom: k2-fsa/OmniVoice
  language: English
  language_custom: English
  language_code: en
  language_code_custom: en
  voice_source: custom
  voice_name: david
  voices_dir: /data/voices
  voices_dir_custom: /data/voices
  voice_ref: ''
  ref_text: ''
  instruct: ''
  instruct_custom: ''
  num_step: custom
  num_step_custom: 12
  guidance_scale: '2.0'
  guidance_scale_custom: '2.0'
  speed: custom
  speed_custom: '1.1'
  t_shift: '0.1'
  t_shift_custom: '0.1'
  full_text_chars: '100'
  full_text_chars_custom: 100
  first_stream_chars: '100'
  first_stream_chars_custom: 100
  stream_chars: '100'
  stream_chars_custom: 100
  silence: '0.15'
  silence_custom: '0.15'
  audio_packet_bytes: '4096'
  audio_packet_bytes_custom: 8192
  flashinfer: 'false'
  cuda_graph: 'false'
  cuda_graph_cache_size: '4'
run_as:
  user: 568
  group: 568
network:
  wyoming_port:
    bind_mode: published
    port_number: 10200
ix_volumes:
  data: /opt/tests/mnt/data
storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
labels: []
resources:
  limits:
    cpus: 4
    memory: 8192
  gpus: {}
