omnivoice:
  device: cpu
  language: English
  language_code: en
  num_step: 8
  voice_ref: ''
  ref_text: ''
  additional_envs: []
  model: k2-fsa/OmniVoice
  instruct: male, british accent, low pitch
  guidance_scale: '1.2'
  speed: '0.9'
  t_shift: '0.1'
  full_text_chars: 35
  first_stream_chars: 100
  stream_chars: 40
  silence: '0.1'
run_as:
  user: 568
  group: 568
network:
  wyoming_port:
    bind_mode: published
    port_number: 10200
ix_volumes:
  data: /opt/tests/mnt/data
storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/omnivoice
      create_host_path: true
      auto_permissions: true
labels: []
resources:
  limits:
    cpus: 4
    memory: 8192
  gpus: {}
