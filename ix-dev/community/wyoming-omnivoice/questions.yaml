groups:
- description: Configure OmniVoice
  name: OmniVoice Configuration
- description: Configure the user and group for OmniVoice
  name: User and Group Configuration
- description: Configure Network for OmniVoice
  name: Network Configuration
- description: Configure Storage for OmniVoice
  name: Storage Configuration
- description: Configure Labels for OmniVoice
  name: Labels Configuration
- description: Configure Resources for OmniVoice
  name: Resources Configuration
questions:
- group: OmniVoice Configuration
  label: ''
  schema:
    attrs:
    - variable: log_level
      label: Log Level
      description: 'Wrapper logging threshold. WARNING hides routine activity and
        keeps warnings and errors. INFO shows startup progress; DEBUG enables diagnostic
        logging. ERROR and CRITICAL show only more severe messages. Default: WARNING.
        Does not control direct output from third-party libraries.'
      schema:
        type: string
        default: WARNING
        required: true
        enum:
        - value: DEBUG
          description: Debug
        - value: INFO
          description: Information
        - value: WARNING
          description: Warning
        - value: ERROR
          description: Error
        - value: CRITICAL
          description: Critical
    - label: Inference Device
      schema:
        default: cpu
        enum:
        - description: CPU
          value: cpu
        - description: NVIDIA GPU (select a GPU below)
          value: cuda
        type: string
      variable: device
      description: CPU or NVIDIA GPU inference. GPU mode requires a supported NVIDIA
        GPU and driver compatible with CUDA 13.0 (R580 or newer). Select the GPU under
        Resources.
    - variable: model
      label: Model
      description: 'Default: the supported k2-fsa/OmniVoice model. Custom accepts
        a compatible Hugging Face model ID or a model directory inside /data.'
      schema:
        type: string
        required: true
        default: k2-fsa/OmniVoice
        enum:
        - value: k2-fsa/OmniVoice
          description: k2-fsa/OmniVoice
        - value: custom
          description: Custom value
    - variable: model_custom
      label: Custom Model
      description: 'Default: the supported k2-fsa/OmniVoice model. Custom accepts
        a compatible Hugging Face model ID or a model directory inside /data.'
      schema:
        type: string
        default: k2-fsa/OmniVoice
        required: true
        min_length: 1
        show_if:
        - - model
          - '='
          - custom
    - variable: language
      label: Synthesis Language
      description: Language used to generate speech. Custom accepts another language
        supported by the model. Choose the matching language code below.
      schema:
        type: string
        required: true
        default: English
        enum:
        - value: English
          description: English
        - value: French
          description: French
        - value: German
          description: German
        - value: Spanish
          description: Spanish
        - value: Italian
          description: Italian
        - value: Portuguese
          description: Portuguese
        - value: Chinese
          description: Chinese
        - value: Japanese
          description: Japanese
        - value: Korean
          description: Korean
        - value: custom
          description: Custom value
    - variable: language_custom
      label: Custom Synthesis Language
      description: Language used to generate speech. Custom accepts another language
        supported by the model. Choose the matching language code below.
      schema:
        default: English
        type: string
        show_if:
        - - language
          - '='
          - custom
    - variable: language_code
      label: Language Code
      description: BCP 47 language code advertised to Home Assistant. Match the synthesis
        language; this does not translate text.
      schema:
        type: string
        required: true
        default: en
        enum:
        - value: en
          description: en
        - value: fr
          description: fr
        - value: de
          description: de
        - value: es
          description: es
        - value: it
          description: it
        - value: pt
          description: pt
        - value: zh
          description: zh
        - value: ja
          description: ja
        - value: ko
          description: ko
        - value: custom
          description: Custom value
    - variable: language_code_custom
      label: Custom Language Code
      description: BCP 47 language code advertised to Home Assistant. Match the synthesis
        language; this does not translate text.
      schema:
        default: en
        type: string
        show_if:
        - - language_code
          - '='
          - custom
    - variable: voice_source
      label: Reference Voice
      description: Example works on a fresh installation. Custom reads a paired WAV
        and TXT from /data/voices. The TrueNAS form cannot scan that folder dynamically.
      schema:
        type: string
        required: true
        default: example
        enum:
        - value: example
          description: Example (bundled synthetic voice)
        - value: custom
          description: Custom voice name
        - value: manual
          description: 'Advanced: audio path and transcript'
        - value: design
          description: Generate a voice from design tags
    - variable: voice_name
      label: Voice Name
      description: For david_reference.wav and david_reference.txt enter david. For
        jess.wav and jess.txt enter jess. Names are case-sensitive. Restart the app
        after changing the voice or transcript.
      schema:
        type: string
        default: ''
        show_if:
        - - voice_source
          - '='
          - custom
    - variable: voices_dir
      label: Voices Folder
      description: 'Default: /data/voices. Place paired WAV and UTF-8 TXT files here.
        The TXT filename must match the WAV with its extension changed to .txt.'
      schema:
        type: string
        required: true
        default: /data/voices
        enum:
        - value: /data/voices
          description: voices folder within app storage
        - value: custom
          description: Custom folder inside /data
    - variable: voices_dir_custom
      label: Custom Voices Folder
      description: 'An existing directory inside the mounted /data storage. Default:
        /data/voices.'
      schema:
        type: string
        default: /data/voices
        show_if:
        - - voices_dir
          - '='
          - custom
        valid_chars: ^/data(?:/[^\x00]*)?$
    - description: 'Optional WAV file path inside the container, for example /data/voices/reference.wav.
        Default: empty (no reference voice). The file must be readable by the app
        user. Supply its exact transcript below; leave both fields empty to generate
        a voice without a reference.'
      label: Reference Audio Path Inside /data (Optional)
      schema:
        default: ''
        type: string
        show_if:
        - - voice_source
          - '='
          - manual
      variable: voice_ref
    - label: Reference Audio Transcript (Optional)
      schema:
        default: ''
        private: true
        type: string
        show_if:
        - - voice_source
          - '='
          - manual
      variable: ref_text
      description: 'The words spoken in the reference WAV, transcribed accurately.
        Default: empty. Required when reference audio is set. This is private voice
        configuration and is hidden in the UI; do not include it in public issue reports.'
    - variable: instruct
      label: Voice Design Tags
      description: Optional voice-design tags. Leave empty when using a reference
        voice. Custom accepts the supported tag syntax; see upstream OmniVoice documentation.
      schema:
        type: string
        required: true
        default: ''
        enum:
        - value: ''
          description: ''
        - value: female, british accent, moderate pitch
          description: female, british accent, moderate pitch
        - value: male, british accent, low pitch
          description: male, british accent, low pitch
        - value: female, american accent
          description: female, american accent
        - value: male, american accent
          description: male, american accent
        - value: custom
          description: Custom value
    - variable: instruct_custom
      label: Custom Voice Design Tags
      description: Optional voice-design tags. Leave empty when using a reference
        voice. Custom accepts the supported tag syntax; see upstream OmniVoice documentation.
      schema:
        type: string
        default: ''
        required: false
        valid_chars: ^(?:(?:american\ accent|australian\ accent|british\ accent|canadian\
          accent|child|chinese\ accent|elderly|female|high\ pitch|indian\ accent|japanese\
          accent|korean\ accent|low\ pitch|male|middle\-aged|moderate\ pitch|portuguese\
          accent|russian\ accent|teenager|very\ high\ pitch|very\ low\ pitch|whisper|young\
          adult)(?:, (?:american\ accent|australian\ accent|british\ accent|canadian\
          accent|child|chinese\ accent|elderly|female|high\ pitch|indian\ accent|japanese\
          accent|korean\ accent|low\ pitch|male|middle\-aged|moderate\ pitch|portuguese\
          accent|russian\ accent|teenager|very\ high\ pitch|very\ low\ pitch|whisper|young\
          adult))*|(?:东北话|中年|中音调|云南话|低音调|儿童|四川话|女|宁夏话|少年|极低音调|极高音调|桂林话|河南话|济南话|甘肃话|男|石家庄话|老年|耳语|贵州话|陕西话|青岛话|青年|高音调)(?:，(?:东北话|中年|中音调|云南话|低音调|儿童|四川话|女|宁夏话|少年|极低音调|极高音调|桂林话|河南话|济南话|甘肃话|男|石家庄话|老年|耳语|贵州话|陕西话|青岛话|青年|高音调))*)?$
        show_if:
        - - instruct
          - '='
          - custom
    - variable: num_step
      label: Generation Steps
      description: 'Generation steps: 1–100. More steps generally improve quality
        at the cost of latency. Default 32; 12 is a faster preset.'
      schema:
        type: string
        required: true
        default: '32'
        enum:
        - value: '8'
          description: '8'
        - value: '12'
          description: '12'
        - value: '16'
          description: '16'
        - value: '24'
          description: '24'
        - value: '32'
          description: '32'
        - value: '48'
          description: '48'
        - value: '64'
          description: '64'
        - value: custom
          description: Custom value
    - variable: num_step_custom
      label: Custom Generation Steps
      description: 'Generation steps: 1–100. More steps generally improve quality
        at the cost of latency. Default 32; 12 is a faster preset.'
      schema:
        default: 32
        max: 100
        min: 1
        type: int
        show_if:
        - - num_step
          - '='
          - custom
    - variable: guidance_scale
      label: Guidance Strength
      description: 'Guidance strength: 0–10. Default 2.0. Higher values are not always
        better and can affect naturalness.'
      schema:
        type: string
        required: true
        default: '2.0'
        enum:
        - value: '1.0'
          description: '1.0'
        - value: '1.2'
          description: '1.2'
        - value: '1.5'
          description: '1.5'
        - value: '2.0'
          description: '2.0'
        - value: '3.0'
          description: '3.0'
        - value: custom
          description: Custom value
    - variable: guidance_scale_custom
      label: Custom Guidance Strength
      description: 'Guidance strength: 0–10. Default 2.0. Higher values are not always
        better and can affect naturalness.'
      schema:
        type: string
        default: '2.0'
        required: true
        valid_chars: ^(?:[0-9](?:\.[0-9]+)?|10(?:\.0+)?)$
        show_if:
        - - guidance_scale
          - '='
          - custom
    - variable: speed
      label: Speech Speed
      description: 'Speech speed: 0.25–4. Default 1.0. Below 1 is slower; above 1
        is faster.'
      schema:
        type: string
        required: true
        default: '1.0'
        enum:
        - value: '0.75'
          description: '0.75'
        - value: '0.9'
          description: '0.9'
        - value: '1.0'
          description: '1.0'
        - value: '1.1'
          description: '1.1'
        - value: '1.25'
          description: '1.25'
        - value: custom
          description: Custom value
    - variable: speed_custom
      label: Custom Speech Speed
      description: 'Speech speed: 0.25–4. Default 1.0. Below 1 is slower; above 1
        is faster.'
      schema:
        type: string
        default: '1.0'
        required: true
        valid_chars: ^(?:0\.(?:2[5-9][0-9]*|[3-9][0-9]*)|[1-3](?:\.[0-9]+)?|4(?:\.0+)?)$
        show_if:
        - - speed
          - '='
          - custom
    - variable: t_shift
      label: Diffusion Time Shift
      description: 'Diffusion schedule parameter: 0–1. Default 0.1. Advanced quality
        tuning; leave unchanged unless comparing results.'
      schema:
        type: string
        required: true
        default: '0.1'
        enum:
        - value: '0.0'
          description: '0.0'
        - value: '0.1'
          description: '0.1'
        - value: '0.2'
          description: '0.2'
        - value: '0.3'
          description: '0.3'
        - value: custom
          description: Custom value
    - variable: t_shift_custom
      label: Custom Diffusion Time Shift
      description: 'Diffusion schedule parameter: 0–1. Default 0.1. Advanced quality
        tuning; leave unchanged unless comparing results.'
      schema:
        type: string
        default: '0.1'
        required: true
        valid_chars: ^(?:0(?:\.[0-9]+)?|1(?:\.0+)?)$
        show_if:
        - - t_shift
          - '='
          - custom
    - variable: full_text_chars
      label: Complete Request Chunk Size
      description: 'Character target for complete text requests: 20–500. Smaller chunks
        can start sooner but may reduce prosody.'
      schema:
        type: string
        required: true
        default: '100'
        enum:
        - value: '35'
          description: '35'
        - value: '60'
          description: '60'
        - value: '100'
          description: '100'
        - value: '150'
          description: '150'
        - value: '200'
          description: '200'
        - value: custom
          description: Custom value
    - variable: full_text_chars_custom
      label: Custom Complete Request Chunk Size
      description: 'Character target for complete text requests: 20–500. Smaller chunks
        can start sooner but may reduce prosody.'
      schema:
        type: int
        default: 100
        required: true
        min: 20
        max: 500
        show_if:
        - - full_text_chars
          - '='
          - custom
    - variable: first_stream_chars
      label: First Streamed Chunk Size
      description: 'Character target before the first streamed speech chunk: 20–500.
        Smaller values can reduce first-audio latency.'
      schema:
        type: string
        required: true
        default: '100'
        enum:
        - value: '35'
          description: '35'
        - value: '60'
          description: '60'
        - value: '100'
          description: '100'
        - value: '150'
          description: '150'
        - value: '200'
          description: '200'
        - value: custom
          description: Custom value
    - variable: first_stream_chars_custom
      label: Custom First Streamed Chunk Size
      description: 'Character target before the first streamed speech chunk: 20–500.
        Smaller values can reduce first-audio latency.'
      schema:
        type: int
        default: 100
        required: true
        min: 20
        max: 500
        show_if:
        - - first_stream_chars
          - '='
          - custom
    - variable: stream_chars
      label: Following Streamed Chunk Size
      description: 'Character target for subsequent streamed chunks: 20–500. Larger
        chunks may improve continuity at the cost of latency.'
      schema:
        type: string
        required: true
        default: '100'
        enum:
        - value: '35'
          description: '35'
        - value: '60'
          description: '60'
        - value: '100'
          description: '100'
        - value: '150'
          description: '150'
        - value: '200'
          description: '200'
        - value: custom
          description: Custom value
    - variable: stream_chars_custom
      label: Custom Following Streamed Chunk Size
      description: 'Character target for subsequent streamed chunks: 20–500. Larger
        chunks may improve continuity at the cost of latency.'
      schema:
        type: int
        default: 100
        required: true
        min: 20
        max: 500
        show_if:
        - - stream_chars
          - '='
          - custom
    - variable: silence
      label: Silence Between Chunks
      description: 'Silence inserted between generated pieces in seconds: 0–2. Default
        0.15.'
      schema:
        type: string
        required: true
        default: '0.15'
        enum:
        - value: '0.0'
          description: '0.0'
        - value: '0.05'
          description: '0.05'
        - value: '0.1'
          description: '0.1'
        - value: '0.15'
          description: '0.15'
        - value: '0.2'
          description: '0.2'
        - value: '0.3'
          description: '0.3'
        - value: custom
          description: Custom value
    - variable: silence_custom
      label: Custom Silence Between Chunks
      description: 'Silence inserted between generated pieces in seconds: 0–2. Default
        0.15.'
      schema:
        type: string
        default: '0.15'
        required: true
        valid_chars: ^(?:[01](?:\.[0-9]+)?|2(?:\.0+)?)$
        show_if:
        - - silence
          - '='
          - custom
    - variable: audio_packet_bytes
      label: Audio Packet Size
      description: 'Wyoming audio packet size in bytes: even integers 1024–65536.
        Default 8192. This controls network packets, not generation chunk length.'
      schema:
        type: string
        required: true
        default: '8192'
        enum:
        - value: '4096'
          description: '4096'
        - value: '8192'
          description: '8192'
        - value: '16384'
          description: '16384'
        - value: '32768'
          description: '32768'
        - value: custom
          description: Custom value
    - variable: audio_packet_bytes_custom
      label: Custom Audio Packet Size
      description: 'Wyoming audio packet size in bytes: even integers 1024–65536.
        Default 8192. This controls network packets, not generation chunk length.'
      schema:
        type: int
        default: 8192
        min: 1024
        max: 65536
        show_if:
        - - audio_packet_bytes
          - '='
          - custom
    - variable: flashinfer
      label: FlashInfer Acceleration
      description: Optional fused GPU operations and packed attention. Requires NVIDIA
        CUDA inference. Disable if testing reveals compatibility or quality issues.
      schema:
        type: string
        required: true
        default: 'false'
        enum:
        - value: 'false'
          description: Disabled
        - value: 'true'
          description: Enabled
    - variable: cuda_graph
      label: CUDA Graphs
      description: Requires FlashInfer. Reuses captured GPU work for matching text/audio
        shapes. Initial captures cost time and GPU memory; benchmark before enabling.
      schema:
        type: string
        required: true
        default: 'false'
        enum:
        - value: 'false'
          description: Disabled
        - value: 'true'
          description: Enabled
    - variable: cuda_graph_cache_size
      label: CUDA Graph Cache Size
      description: 'Maximum cached graph shapes: 1–16. Default 4 bounds memory growth;
        larger values trade more GPU memory for fewer repeat captures.'
      schema:
        type: string
        required: true
        default: '4'
        enum:
        - value: '1'
          description: '1'
        - value: '2'
          description: '2'
        - value: '4'
          description: '4'
        - value: '8'
          description: '8'
        - value: '16'
          description: '16'
    type: dict
  variable: omnivoice
- group: User and Group Configuration
  label: ''
  schema:
    attrs:
    - description: The user id that OmniVoice files will be owned by.
      label: User ID
      schema:
        default: 568
        min: 2
        required: true
        type: int
      variable: user
    - description: The group id that OmniVoice files will be owned by.
      label: Group ID
      schema:
        default: 568
        min: 2
        required: true
        type: int
      variable: group
    type: dict
  variable: run_as
- group: Network Configuration
  label: ''
  schema:
    attrs:
    - label: Wyoming TCP Port
      schema:
        attrs:
        - description: 'The port bind mode.</br>

            - Publish: The port will be published on the host for external access.</br>

            - Expose: The port will be exposed for inter-container communication.</br>

            - None: The port will not be exposed or published.</br>

            Note: If the Dockerfile defines an EXPOSE directive,

            the port will still be exposed for inter-container communication regardless
            of this setting.

            '
          label: Port Bind Mode
          schema:
            default: published
            enum:
            - description: Publish port on the host for external access
              value: published
            - description: Expose port for inter-container communication
              value: exposed
            - description: None
              value: ''
            type: string
          variable: bind_mode
        - label: Port Number
          schema:
            default: 30490
            max: 65535
            min: 1
            required: true
            type: int
          variable: port_number
        - description: IPs on the host to bind this port
          label: Host IPs
          schema:
            default: []
            items:
            - label: Host IP
              schema:
                $ref:
                - definitions/node_bind_ip
                required: true
                type: string
              variable: host_ip
            show_if:
            - - bind_mode
              - '='
              - published
            type: list
          variable: host_ips
        type: dict
      variable: wyoming_port
    type: dict
  variable: network
- group: Storage Configuration
  label: ''
  schema:
    attrs:
    - description: Persistent /data directory. Allow space for downloaded model weights.
        Must be writable by the configured user.
      label: Model Cache and Voice Storage
      schema:
        attrs:
        - description: 'ixVolume: Is dataset created automatically by the system.</br>

            Host Path: Is a path that already exists on the system.

            '
          label: Type
          schema:
            default: ix_volume
            enum:
            - description: Host Path (Path that already exists on the system)
              value: host_path
            - description: ixVolume (Dataset created automatically by the system)
              value: ix_volume
            required: true
            type: string
          variable: type
        - description: The configuration for the ixVolume dataset.
          label: ixVolume Configuration
          schema:
            $ref:
            - normalize/ix_volume
            attrs:
            - description: Enable ACL for the storage.
              label: Enable ACL
              schema:
                default: false
                type: boolean
              variable: acl_enable
            - description: The name of the dataset to use for storage.
              label: Dataset Name
              schema:
                default: data
                hidden: true
                required: true
                type: string
              variable: dataset_name
            - label: ACL Configuration
              schema:
                attrs: []
                show_if:
                - - acl_enable
                  - '='
                  - true
                type: dict
              variable: acl_entries
            show_if:
            - - type
              - '='
              - ix_volume
            type: dict
          variable: ix_volume_config
        - label: Host Path Configuration
          schema:
            attrs:
            - description: Enable ACL for the storage.
              label: Enable ACL
              schema:
                default: false
                type: boolean
              variable: acl_enable
            - label: ACL Configuration
              schema:
                $ref:
                - normalize/acl
                attrs: []
                show_if:
                - - acl_enable
                  - '='
                  - true
                type: dict
              variable: acl
            - description: The host path to use for storage.
              label: Host Path
              schema:
                required: true
                show_if:
                - - acl_enable
                  - '='
                  - false
                type: hostpath
              variable: path
            - label: Automatic Permissions
              schema:
                default: false
                type: boolean
              variable: auto_permissions
            show_if:
            - - type
              - '='
              - host_path
            type: dict
          variable: host_path_config
        type: dict
      variable: data
    type: dict
  variable: storage
- group: Labels Configuration
  label: ''
  schema:
    default: []
    items:
    - label: Label
      schema:
        attrs:
        - label: Key
          schema:
            required: true
            type: string
          variable: key
        - label: Value
          schema:
            required: true
            type: string
          variable: value
        - description: Containers where the label should be applied
          label: Containers
          schema:
            items:
            - label: Container
              schema:
                enum:
                - description: wyoming-omnivoice
                  value: wyoming-omnivoice
                required: true
                type: string
              variable: container
            type: list
          variable: containers
        type: dict
      variable: label
    type: list
  variable: labels
- group: Resources Configuration
  label: ''
  schema:
    attrs:
    - label: Limits
      schema:
        attrs:
        - description: 'CPU allocation and inference thread count. Integer minimum:
            1; default: 4. The app matches its CPU thread count to this limit to avoid
            oversubscription. Choose a value within the resources available on your
            host.'
          label: CPUs
          schema:
            default: 4
            required: true
            type: int
            min: 1
          variable: cpus
        - description: 'System memory limit in MB. Default: 8192 MB. The model, workload
            and device determine actual requirements; setting this too low can cause
            the app to be terminated for running out of memory.'
          label: Memory (in MB)
          schema:
            default: 8192
            required: true
            type: int
          variable: memory
        type: dict
      variable: limits
    - group: Resources Configuration
      label: GPU Configuration
      schema:
        $ref:
        - definitions/gpu_configuration
