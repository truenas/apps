  uploads_uid: 10001
  uploads_gid: 10001
  notes_body: |
    Configure an external HTTPS reverse proxy before signing in. Bootstrap credentials only create the first administrator.

    Back up MariaDB, uploads and keys before updating or rotating encryption keys.
    Keep the old encryption key in Previous Encryption Key while old encrypted values remain.
    If Backup Master Key was empty, set it to the old encryption key before rotating to preserve access to existing backups.

    Installation and key rotation: https://github.com/mrksrus/selfhost-unihub/blob/v0.23.0/docs/INSTALLATION.md
    Upgrade and rollback: https://github.com/mrksrus/selfhost-unihub/blob/v0.23.0/docs/UPGRADING.md#0230-hardening
  internal_web_port: 80
