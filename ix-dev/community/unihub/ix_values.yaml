images:
  image:
    repository: ghcr.io/mrksrus/selfhost-unihub
    tag: 0.10.7
  mysql_image:
    repository: mysql
    tag: 8.0.46
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2
consts:
  app_container_name: unihub
  mysql_container_name: mysql
  perms_container_name: permissions
  db_user: unihub
  db_name: unihub
  mysql_config: '[mysqld]

    character-set-server = utf8mb4

    collation-server = utf8mb4_unicode_ci

    innodb_buffer_pool_size = 192M

    innodb_log_file_size = 48M      # Balanced: smaller than 64M for faster startup, but not too small

    innodb_flush_log_at_trx_commit = 2

    innodb_flush_method = O_DIRECT

    innodb_buffer_pool_instances = 1  # Single instance for faster startup (fine for <1GB buffer pool)

    innodb_log_buffer_size = 16M     # Standard size - good for email syncs

    skip-name-resolve              # Skip DNS lookups (faster connections, no downside in Docker)

    host_cache_size = 0

    performance_schema = ON         # Keep ON for monitoring, but limit what''s tracked

    performance_schema_max_table_instances = 125  # Reduced from default 12500

    performance_schema_max_thread_instances = 50  # Reduced from default 402

    table_open_cache = 400          # Standard size - you have few tables, this is fine

    max_connections = 100

    wait_timeout = 28800

    interactive_timeout = 28800

    slow_query_log = 0             # Disabled by default, enable if debugging performance

    local_infile = 0

    skip-symbolic-links = 1

    [client]

    default-character-set = utf8mb4

    '
  notes_body: 'Use the configured external HTTPS address to sign in. This app does not terminate TLS.

    The bootstrap account is created only during initial setup; changing its installation fields does not reset
    an existing account.

    Keep both storage locations and all encryption/database keys across updates. This first catalog package targets
    fresh installations; it does not automatically adopt custom-app data.


    UniHub is free for private noncommercial self-hosting, including multi-user home labs. Company/business use,
    including internal business operations without resale, requires a paid licence from smrus@rus.family. PolyForm
    Noncommercial''s explicit nonprofit/public-institution permissions remain available. See https://github.com/mrksrus/selfhost-unihub/blob/main/LICENSING.md.


    Upstream maintainer mrksrus is not a developer and has no formal development qualifications, with only a tic-tac-toe
    game and webpage about 15 years ago as prior coding experience. Development, maintenance and security/function
    reviews currently rely solely on OpenAI/GPT models. Fable/Anthropic models are planned for future reviews and
    improvements but are not currently used. AI review is not an independent professional security audit.


    Installation and recovery: https://github.com/mrksrus/selfhost-unihub/blob/main/docs/INSTALLATION.md

    Account backup, import and restore are ALPHA. Keep independent backups of the database, uploads, configuration
    and secrets, especially before deleting messages from the email provider.

    Private security reports: smrus@rus.family

    '
