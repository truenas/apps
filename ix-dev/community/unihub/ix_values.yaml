  db_user: unihub
  db_name: unihub
  uploads_uid: 10001
  uploads_gid: 10001
  notes_body: 'Configure an external HTTPS reverse proxy before signing in. This app does not provide TLS.

    Bootstrap credentials create the first administrator only. Changing them does not reset an existing account.

    Before changing the stored-data encryption key, back up first. Set Previous Encryption Key to the old key.

    Keep it while old encrypted values remain; they are not rewritten automatically. If Separate Backup Master Key

    was empty, set it to the old encryption key before the change so existing backups remain unlockable.

    Key rotation: https://github.com/mrksrus/selfhost-unihub/blob/v0.23.0/docs/INSTALLATION.md#changing-the-encryption-key

    Version 0.23.0 upgrades the database and stored-secret format. Roll back by restoring a pre-update backup and keys.

    Upgrade notes: https://github.com/mrksrus/selfhost-unihub/blob/v0.23.0/docs/UPGRADING.md#0230-hardening

    Preserve MariaDB storage, uploads and all keys across updates. This package supports fresh installations;

    it does not automatically adopt data from an existing custom app or convert a MySQL data directory.


    For Host Path storage, grant MariaDB UID 999 and uploads UID 10001 write access to separate dedicated datasets.

    When using ACLs on nonempty datasets, review the selected paths and enable the TrueNAS Force Flag if required.


    The container supervisor and Nginx master start as root. The Node API runs as UID/GID 10001.

    UniHub is developed and maintained with AI assistance.

    Private noncommercial self-hosting is free. Business use requires a separate licence.

    See https://github.com/mrksrus/selfhost-unihub/blob/main/LICENSING.md.


    Account backup, import and restore are experimental. Keep an independent backup of MariaDB,

    uploads, deployment configuration and keys.

    Installation: https://github.com/mrksrus/selfhost-unihub/blob/main/docs/INSTALLATION.md

    Security reporting: https://github.com/mrksrus/selfhost-unihub/blob/main/SECURITY.md

    '
