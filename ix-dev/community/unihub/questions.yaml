groups:
  - name: UniHub Configuration
    description: Configure UniHub
  - name: Network Configuration
    description: Configure Network for UniHub
  - name: Storage Configuration
    description: Configure Storage for UniHub
  - name: Labels Configuration
    description: Configure Labels for UniHub
  - name: Resources Configuration
    description: Configure Resources for UniHub

questions:
  - variable: TZ
    group: UniHub Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      $ref:
        - definitions/timezone

  - variable: unihub
    label: ""
    description: |
      HTTPS must already be configured outside this app. This does not create DNS or a certificate.</br>
      A healthy container does not prove browser login works. Open your configured HTTPS address to sign in.</br>
      Preserve the passwords, keys and storage selections across updates.
    group: UniHub Configuration
    schema:
      type: dict
      attrs:
        - variable: admin_email
          label: Administrator Email
          description: Creates your first UniHub login. Does not connect a mailbox or change an existing login.
          schema:
            type: string
            required: true
            default: ""
            valid_chars: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
            valid_chars_error: Enter a valid email address.
        - variable: admin_password
          label: Administrator Password
          description: Initial web-login password. Changing this field later does not reset an existing account.
          schema:
            type: string
            required: true
            private: true
            min_length: 12
            default: ""
        - variable: db_password
          label: Database User Password
          description: Use a generated random password. Preserve this value. Editing it does not change the password inside an existing database.
          schema:
            type: string
            required: true
            private: true
            min_length: 1
            default: ""
        - variable: db_root_password
          label: Database Root Password
          description: Use a separate generated random password for database administration. Preserve it with the database.
          schema:
            type: string
            required: true
            private: true
            min_length: 1
            default: ""
        - variable: jwt_secret
          label: Session Signing Secret
          description: Generate a random secret once and preserve it. Use at least 32 characters. Changing it invalidates existing login tokens.
          schema:
            type: string
            required: true
            private: true
            min_length: 32
            default: ""
        - variable: encryption_key
          label: Stored-data Encryption Key
          description: Generate a random key once and preserve it. Use at least 32 characters. Losing or changing it makes saved credentials and 2FA secrets unreadable.
          schema:
            type: string
            required: true
            private: true
            min_length: 32
            default: ""
        - variable: backup_master_key
          label: Separate Backup Master Key (ALPHA)
          description: Account backup, import and restore are ALPHA. Optional separate server backup-unlock key. Empty uses the stored-data encryption key. Preserve this key once used.
          schema:
            type: string
            private: true
            default: ""
        - variable: browser_origin
          label: HTTPS Browser Address
          description: |
            The exact HTTPS address you open, including a nonstandard port if used. For example, https://hub.example.com.</br>
            Do not include a path, query, fragment or login details. This controls browser origins, not visitor IP access or firewall rules.
          schema:
            type: string
            required: true
            default: ""
            min_length: 1
        - variable: additional_origins
          label: Additional Browser Addresses
          description: Only extra HTTPS addresses you actually use. Enter origins without paths, queries, fragments or login details.
          schema:
            type: list
            default: []
            items:
              - variable: origin
                label: HTTPS Browser Address
                schema:
                  type: string
                  required: true
                  min_length: 1
        - variable: trusted_proxy_cidrs
          label: Outer HTTPS Proxy Addresses
          description: |
            Enter at least one proxy IP address or narrow CIDR network. Use the proxy's connecting address as seen by UniHub.</br>
            These are not your visitors' IPs. Never trust an all-address range. Bundled loopback proxy addresses are included automatically.
          schema:
            type: list
            required: true
            default: []
            items:
              - variable: proxy
                label: Proxy IP Address or CIDR
                schema:
                  type: string
                  required: true
                  min_length: 1
        - variable: trusted_mail_hosts
          label: Private Mail/CalDAV Hosts
          description: Only servers intentionally hosted at private addresses. Enter hostnames or literal IPs without schemes, ports or CIDRs. A hostname also covers its subdomains, so use a narrow hostname.
          schema:
            type: list
            default: []
            items:
              - variable: host
                label: Hostname or IP Address
                schema:
                  type: string
                  required: true
                  min_length: 1

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          description: Your externally configured HTTPS proxy forwards here. This port itself serves HTTP.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30492
                  show_if: [["bind_mode", "=", "published"]]
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          description: The docker networks to join
          schema:
            type: list
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      description: |
                        The name of the network to join.</br>
                        The network must already exist.
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      description: The containers to add to this network.
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: unihub
                                        description: unihub
                                      - value: mysql
                                        description: mysql
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases (Optional)
                                        description: The network aliases to use for this container on this network.
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string
                                      - variable: interface_name
                                        label: Interface Name (Optional)
                                        description: The network interface name to use for this network
                                        schema:
                                          type: string
                                      - variable: mac_address
                                        label: MAC Address (Optional)
                                        description: The MAC address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv4_address
                                        label: IPv4 Address (Optional)
                                        description: The IPv4 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: ipv6_address
                                        label: IPv6 Address (Optional)
                                        description: The IPv6 address to use for this network interface.
                                        schema:
                                          type: string
                                      - variable: gw_priority
                                        label: Gateway Priority (Optional)
                                        description: Indicates the priority of the gateway for this network interface.
                                        schema:
                                          type: int
                                          "null": true
                                      - variable: priority
                                        label: Priority (Optional)
                                        description: Indicates in which order Compose connects the service's containers to its networks.
                                        schema:
                                          type: int
                                          "null": true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: mysql_data
          label: Database Storage
          description: Contains your accounts and database. Do not replace with an empty location when updating.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "mysql_data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: uploads
          label: Uploaded-file Storage
          description: Stores mail originals and attachments, recordings, Notes attachments and account backups. Preserve this storage across updates.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "uploads"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: unihub
                            description: unihub
                          - value: mysql
                            description: mysql
  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for UniHub.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for UniHub.
                schema:
                  type: int
                  default: 4096
                  required: true
