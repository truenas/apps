{% set tpl = ix_lib.base.render.Render(values) %}

{% set unihub_net = tpl.networks.create_internal("unihub-net") %}

{% set c1 = tpl.add_container(values.consts.unihub_container_name, "image") %}
{% do c1.add_network(unihub_net) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set mariadb_config = {
  "user": values.consts.db_user,
  "root_password": values.unihub.db_root_password,
  "password": values.unihub.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.mariadb_data,
} %}
{% set mariadb = tpl.deps.mariadb(values.consts.mariadb_container_name, "mariadb_image", mariadb_config, perm_container) %}
{% do mariadb.container.add_network(unihub_net) %}

{% set origins = namespace(x=[]) %}
{% for origin in values.unihub.origins %}
  {% do origins.x.append(origin.rstrip("/")) %}
{% endfor %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/health", "spider": false}) %}

{% do c1.environment.add_env("UNIHUB_HTTP_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("MYSQL_HOST", values.consts.mariadb_container_name) %}
{% do c1.environment.add_env("MYSQL_PORT", mariadb.get_port()) %}
{% do c1.environment.add_env("MYSQL_DATABASE", values.consts.db_name) %}
{% do c1.environment.add_env("MYSQL_USER", values.consts.db_user) %}
{% do c1.environment.add_env("MYSQL_PASSWORD", values.unihub.db_password) %}
{% do c1.environment.add_env("BOOTSTRAP_ADMIN_EMAIL", values.unihub.admin_email) %}
{% do c1.environment.add_env("BOOTSTRAP_ADMIN_PASSWORD", values.unihub.admin_password) %}
{% do c1.environment.add_env("JWT_SECRET", values.unihub.jwt_secret) %}
{% do c1.environment.add_env("ENCRYPTION_KEY", values.unihub.encryption_key) %}
{% do c1.environment.add_env("ALLOWED_ORIGINS", origins.x|join(",")) %}
{% do c1.environment.add_user_envs(values.unihub.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/app/uploads", values.storage.uploads) %}
{% do perm_container.add_or_skip_action("uploads", values.storage.uploads, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do mariadb.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# Sign-in needs HTTPS, the web port serves HTTP for the reverse proxy in front #}
{% set url = tpl.funcs.url_to_dict(origins.x[0], true) %}
{% do tpl.portals.add(values.network.web_port, {"scheme": "https", "host": url.host, "port": url.port or 443}) %}

{{ tpl.render() | tojson }}
