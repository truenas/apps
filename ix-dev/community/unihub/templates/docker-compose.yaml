{% set tpl = ix_lib.base.render.Render(values) %}

{% set unihub_net = tpl.networks.create_internal("unihub-net") %}
{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% do c1.add_network(unihub_net) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set mariadb_config = {
  "user": values.consts.db_user,
  "password": values.unihub.db_password,
  "root_password": values.unihub.db_root_password,
  "database": values.consts.db_name,
  "volume": values.storage.mariadb_data,
} %}
{% set mariadb_container = tpl.deps.mariadb(values.consts.mariadb_container_name, "mariadb_image", mariadb_config, perm_container) %}
{% do mariadb_container.container.add_network(unihub_net) %}
{% do mariadb_container.container.healthcheck.set_start_period(300) %}

{# The supervisor and Nginx master start as root; the API drops to UID/GID 10001. #}
{% do c1.set_user(0, 0) %}
{% do c1.set_init(true) %}
{% do c1.set_grace_period(15) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "NET_BIND_SERVICE", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.set_test("wget", {"port": values.consts.internal_web_port, "path": "/health", "spider": false, "busybox": true}) %}
{% do c1.healthcheck.set_start_period(360) %}
{% do c1.healthcheck.set_start_interval(5) %}
{% do c1.healthcheck.set_retries(3) %}
{% do c1.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}

{% do c1.environment.add_env("NODE_ENV", "production") %}
{% do c1.environment.add_env("PORT", 4000) %}
{% do c1.environment.add_env("UNIHUB_API_UID", values.consts.uploads_uid) %}
{% do c1.environment.add_env("UNIHUB_API_GID", values.consts.uploads_gid) %}
{% do c1.environment.add_env("DATABASE_URL", "") %}
{% do c1.environment.add_env("MYSQL_HOST", values.consts.mariadb_container_name) %}
{% do c1.environment.add_env("MYSQL_PORT", mariadb_container.get_port()) %}
{% do c1.environment.add_env("MYSQL_DATABASE", values.consts.db_name) %}
{% do c1.environment.add_env("MYSQL_USER", values.consts.db_user) %}
{% do c1.environment.add_env("MYSQL_PASSWORD", values.unihub.db_password) %}
{# Keep the database wait within the healthcheck startup allowance. #}
{% do c1.environment.add_env("MYSQL_STARTUP_MAX_WAIT_SECONDS", 300) %}
{% do c1.environment.add_env("BOOTSTRAP_ADMIN_EMAIL", values.unihub.admin_email) %}
{% do c1.environment.add_env("BOOTSTRAP_ADMIN_PASSWORD", values.unihub.admin_password) %}
{% do c1.environment.add_env("JWT_SECRET", values.unihub.jwt_secret) %}
{% do c1.environment.add_env("ENCRYPTION_KEY", values.unihub.encryption_key) %}
{% do c1.environment.add_env("ENCRYPTION_KEY_PREVIOUS", values.unihub.get("encryption_key_previous", "")) %}
{% do c1.environment.add_env("BACKUP_MASTER_KEY", values.unihub.backup_master_key) %}
{% do c1.environment.add_env("ALLOWED_ORIGINS", ([values.unihub.browser_origin] + values.unihub.additional_origins) | unique | join(",")) %}
{% do c1.environment.add_env("TRUST_PROXY_HEADERS", true) %}
{% do c1.environment.add_env("TRUSTED_PROXY_CIDRS", (["127.0.0.1/32", "::1/128"] + values.unihub.trusted_proxy_cidrs) | unique | join(",")) %}
{% do c1.environment.add_user_envs(values.unihub.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
{% do c1.add_storage("/app/uploads", values.storage.uploads) %}
{% do perm_container.add_or_skip_action("uploads", values.storage.uploads, {
  "uid": values.consts.uploads_uid, "gid": values.consts.uploads_gid, "mode": "check"
}) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do mariadb_container.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% set portal = tpl.funcs.url_to_dict(values.unihub.browser_origin, true) %}
{% do tpl.portals.add(values.network.web_port, {"host": portal.host, "port": portal.port or 443, "scheme": "https"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
