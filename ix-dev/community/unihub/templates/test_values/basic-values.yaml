resources:
  limits:
    cpus: 2.0
    memory: 4096

unihub:
  admin_email: admin@example.com
  admin_password: some-admin-password
  db_password: some-db-password
  db_root_password: some-root-password
  jwt_secret: at-least-32-characters-jwt-secret
  encryption_key: at-least-32-characters-encryption-key
  origins:
    - https://unihub.example.com
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  uploads: /opt/tests/mnt/unihub/uploads
  mariadb_data: /opt/tests/mnt/unihub/mariadb_data

storage:
  uploads:
    type: ix_volume
    ix_volume_config:
      dataset_name: uploads
      create_host_path: true
  mariadb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mariadb_data
      create_host_path: true
  additional_storage: []
