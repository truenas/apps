# Synthetic credentials for catalog rendering tests only.
resources:
  limits:
    cpus: 2
    memory: 4096
TZ: Etc/UTC
unihub:
  admin_email: admin@example.com
  admin_password: Fixture-Admin-Password-9385
  db_password: Fixture-Database-Password-a1839e75
  db_root_password: Fixture-Root-Password-b215da42
  jwt_secret: Fixture-Signing-Secret-83164c097aba421f
  encryption_key: Fixture-Encryption-Key-73be54b99fe01a0c
  backup_master_key: Fixture-Backup-Key-982be31084af359d
