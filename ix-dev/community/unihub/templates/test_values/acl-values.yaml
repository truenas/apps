# Mixed storage: the database is prepared by the standard helper.
# The uploads path exercises the ACL branch; managed ACL application is tested separately.
resources:
  limits:
    cpus: 2
    memory: 4096
TZ: Etc/UTC
unihub:
  admin_email: admin@example.com
  admin_password: Fixture-Admin-Password-9385
  db_password: Fixture-Database-Password-a1839e75
  db_root_password: Fixture-Root-Password-b215da42
  jwt_secret: Fixture-Signing-Secret-83164c097aba421f
  encryption_key: Fixture-Encryption-Key-73be54b99fe01a0c
  backup_master_key: Fixture-Backup-Key-982be31084af359d
  browser_origin: https://[2001:db8::1]:8443
  additional_origins: []
  trusted_proxy_cidrs:
  - 192.0.2.10/32
  - 2001:db8::10/128
  trusted_mail_hosts:
  - mail.internal.example.com
  - 192.0.2.20
  additional_envs:
  - name: CALENDAR_MULTI_ENABLED
    value: 'true'
network:
  web_port:
    bind_mode: exposed
    port_number: 8081
    host_ips:
    - 127.0.0.1
  networks: []
storage:
  mariadb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mariadb_data
      create_host_path: true
  uploads:
    type: host_path
    host_path_config:
      create_host_path: true
      acl_enable: true
      acl:
        path: /opt/tests/mnt/unihub-host/uploads
labels:
- key: org.example.test
  value: unihub
  containers:
  - unihub
  - mariadb
ix_volumes:
  mariadb_data: /opt/tests/mnt/unihub-acl/mariadb_data
