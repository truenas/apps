{% set tpl = ix_lib.base.render.Render(values) %}

{% set backend = tpl.add_container(values.consts.backend_container_name, "image") %}
{% set web = tpl.add_container(values.consts.web_container_name, "web_image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# -- Backend: Go API, SQLite database in the data storage -- #}
{% do backend.set_user(values.run_as.user, values.run_as.group) %}
{# Not --spider: GNU wget sends HEAD, which the API answers with 404 on its GET-only routes #}
{% do backend.healthcheck.set_test("wget", {"port": values.consts.backend_port, "path": "/health", "spider": False}) %}
{% do backend.environment.add_env("ENV", "production") %}
{% do backend.environment.add_env("PORT", values.consts.backend_port) %}
{% do backend.environment.add_env("DB_TYPE", "sqlite") %}
{% do backend.environment.add_env("DB_PATH", "%s/lyftr.db" | format(values.consts.data_path)) %}
{% do backend.environment.add_env("JWT_SECRET", values.lyftr.jwt_secret) %}
{% do backend.environment.add_env("REGISTRATION", values.lyftr.registration) %}
{% do backend.environment.add_env("DEMO_MODE", "false") %}
{% do backend.environment.add_user_envs(values.lyftr.additional_envs) %}

{% do backend.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do backend.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do backend.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# -- Web: nginx serving the web app and passing /api to the backend -- #}
{# The image is nginx:alpine: the master starts as root and drops its workers to the nginx user #}
{% do web.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "NET_BIND_SERVICE", "SETGID", "SETUID"]) %}
{% do web.healthcheck.set_test("wget", {"port": values.consts.web_port, "spider": False}) %}
{% do web.environment.add_env("BACKEND_ORIGIN", "%s:%s" | format(values.consts.backend_container_name, values.consts.backend_port)) %}
{% do web.depends.add_dependency(values.consts.backend_container_name, "service_healthy") %}
{% do web.add_port(values.network.web_port, {"container_port": values.consts.web_port}) %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
