resources:
  limits:
    cpus: 2.0
    memory: 4096

lyftr:
  jwt_secret: test-secret-test-secret-test-secret-1
  registration: open
  additional_envs:
    - name: JWT_EXPIRY
      value: "3600"

network:
  web_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 1000
  group: 1000

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/lyftr-data
  additional_storage:
    - type: anonymous
      mount_path: /scratchpad
      volume_config:
        nocopy: true
