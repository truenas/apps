resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
paperclip:
  postgres_image_selector: postgres_17_image
  db_password: some-secret-password
  better_auth_secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  tool_action_signing_secret: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
  public_url: http://localhost:8081
  deployment_exposure: private
  allowed_hostnames: ""
  anthropic_api_key: ""
  openai_api_key: ""
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/paperclip-defaults/data
  postgres_data: /opt/tests/mnt/paperclip-defaults/postgres-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
