{% set tpl = ix_lib.base.render.Render(values) %}

{% set paperclip_net = tpl.networks.create_internal("paperclip-net") %}

{% set c1 = tpl.add_container(values.consts.paperclip_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.paperclip.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.paperclip.postgres_image_selector, pg_config, perm_container) %}

{% do c1.add_network(paperclip_net) %}
{% do postgres.container.add_network(paperclip_net) %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# Upstream allows 90s for agent runs to settle; TrueNAS waits at most 60s on shutdown #}
{% do c1.set_grace_period(60) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/api/health"}) %}
{% do c1.healthcheck.set_start_period(60) %}

{% do c1.environment.add_env("HOST", "0.0.0.0") %}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("SERVE_UI", "true") %}
{% do c1.environment.add_env("PAPERCLIP_HOME", values.consts.data_path) %}
{# Agent CLIs keep their logins under $HOME, keep it on the data volume #}
{% do c1.environment.add_env("HOME", values.consts.data_path) %}
{# The image defaults these to 1000; match the run_as user so the entrypoint does not warn about a mismatch #}
{% do c1.environment.add_env("USER_UID", values.run_as.user) %}
{% do c1.environment.add_env("USER_GID", values.run_as.group) %}
{% do c1.environment.add_env("DATABASE_URL", postgres.get_url("postgres")) %}
{% do c1.environment.add_env("PAPERCLIP_DEPLOYMENT_MODE", "authenticated") %}
{% do c1.environment.add_env("PAPERCLIP_DEPLOYMENT_EXPOSURE", values.paperclip.deployment_exposure) %}
{% do c1.environment.add_env("PAPERCLIP_PUBLIC_URL", values.paperclip.public_url) %}
{% do c1.environment.add_env("BETTER_AUTH_SECRET", values.paperclip.better_auth_secret) %}
{% do c1.environment.add_env("PAPERCLIP_TOOL_ACTION_SIGNING_SECRET", values.paperclip.tool_action_signing_secret) %}
{% if values.paperclip.allowed_hostnames %}
  {% do c1.environment.add_env("PAPERCLIP_ALLOWED_HOSTNAMES", values.paperclip.allowed_hostnames) %}
{% endif %}
{% if values.paperclip.anthropic_api_key %}
  {% do c1.environment.add_env("ANTHROPIC_API_KEY", values.paperclip.anthropic_api_key) %}
{% endif %}
{% if values.paperclip.openai_api_key %}
  {% do c1.environment.add_env("OPENAI_API_KEY", values.paperclip.openai_api_key) %}
{% endif %}

{% do c1.environment.add_user_envs(values.paperclip.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
