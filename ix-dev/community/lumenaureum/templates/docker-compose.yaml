{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.lumenaureum_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_read_only(true) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"uid": values.run_as.user, "gid": values.run_as.group}}) %}
{# The app serves HTTPS only; /healthz answers loopback requests regardless of the access filter #}
{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/healthz", "scheme": "https"}) %}

{% do c1.environment.add_env("CRM_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("CRM_DB", "%s/crm.db"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("CRM_STORAGE_CFG", "%s/storage.json"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("CRM_GALLERY_ROOT", "%s/galleries"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("CRM_PHOTOS_ROOT", values.consts.photos_path) %}
{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do c1.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
  {% do c1.environment.add_env("CRM_TLS_KEY", values.consts.ssl_key_path) %}
  {% do c1.environment.add_env("CRM_TLS_CERT", values.consts.ssl_cert_path) %}
{% endif %}
{% do c1.environment.add_user_envs(values.lumenaureum.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage("/vault", values.storage.vault) %}
{% do perm_container.add_or_skip_action("vault", values.storage.vault, perms_config) %}
{% do c1.add_storage(values.consts.photos_path, values.storage.photos) %}
{% do perm_container.add_or_skip_action("photos", values.storage.photos, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https"}) %}

{{ tpl.render() | tojson }}
