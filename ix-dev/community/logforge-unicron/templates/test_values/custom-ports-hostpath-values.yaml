resources:
  limits:
    cpus: 2
    memory: 4096

logforge:
  central_fqdn: logforge.test
  admin_username: admin
  admin_password: TrueNASCatalog2026!
  admin_recovery_override: false
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 38461
  agent_port:
    bind_mode: published
    port_number: 38462

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/logforge-host-data
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /extra
      host_path_config:
        path: /opt/tests/mnt/logforge-extra
        create_host_path: true
