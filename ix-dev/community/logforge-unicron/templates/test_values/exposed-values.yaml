resources:
  limits:
    cpus: 2
    memory: 4096

logforge:
  central_fqdn: logforge.test
  admin_username: admin
  admin_password: TrueNASCatalog2026!
  admin_recovery_override: false
  additional_envs: []

network:
  web_port:
    bind_mode: exposed
    port_number: 38463
  agent_port:
    bind_mode: exposed
    port_number: 38464

ix_volumes:
  data: /opt/tests/mnt/logforge-exposed-data
  extra: /opt/tests/mnt/logforge-exposed-extra

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /extra
      ix_volume_config:
        dataset_name: extra
        create_host_path: true
