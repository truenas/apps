consts:
  server_container_name: server
  worker_container_name: worker
  beat_container_name: beat
  nginx_container_name: nginx
  postgres_container_name: postgres
  redis_container_name: redis
  perms_container_name: permissions
  db_user: wger
  db_name: wger

  run_as_user: 1000
  run_as_group: 1000
  internal_server_port: 8000

  notes_body: |
    In order to sync exercises, you need to shell into the `server` container
    and run the following commands (This process can take a while):

    ```sh
    python3 manage.py sync-exercises
    python3 manage.py download-exercise-images
    python3 manage.py download-exercise-videos
    ```
