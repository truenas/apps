images:
  image:
    repository: wger/server
    tag: 2.6.0
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2
  nginx_image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.2
  postgres_17_image:
    repository: postgres
    tag: 17.10-bookworm
  postgres_18_image:
    repository: postgres
    tag: 18.4-trixie
  redis_image:
    repository: valkey/valkey
    tag: 9.1.0
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: 1.2.11
  powersync_image:
    repository: journeyapps/powersync-service
    tag: "1.23.2"

consts:
  server_container_name: server
  worker_container_name: worker
  beat_container_name: beat
  nginx_container_name: nginx
  postgres_container_name: postgres
  redis_container_name: redis
  perms_container_name: permissions
  powersync_container_name: powersync
  db_user: wger
  db_name: wger

  run_as_user: 1000
  run_as_group: 1000
  internal_server_port: 8000

  notes_body: |
    In order to sync exercises, you need to shell into the `server` container
    and run the following commands (This process can take a while):

    ```sh
    python3 manage.py sync-exercises
    python3 manage.py download-exercise-images
    python3 manage.py download-exercise-videos
    ```

    ## PowerSync (mobile app sync)

    Run the following one-time setup command after the first start to create
    the required Postgres schema and replication slot:

    ```sh
    python3 manage.py setup-powersync-storage
    ```

    This command is idempotent and safe to re-run if needed.
