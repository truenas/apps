{% macro powersync_yaml(values, postgres) -%}
telemetry:
  disable_telemetry_sharing: true
  prometheus_port: 9090

replication:
  connections:
    - type: postgresql
      uri: "postgres://{{ values.consts.db_user }}:{{ values.wger.db_password }}@{{ values.consts.postgres_container_name }}:{{ postgres.get_port() }}/{{ values.consts.db_name }}"
      sslmode: disable

storage:
  type: postgresql
  uri: "postgres://powersync_storage:{{ values.wger.powersync_storage_password }}@{{ values.consts.postgres_container_name }}:{{ postgres.get_port() }}/{{ values.consts.db_name }}"
  sslmode: disable

port: {{ values.consts.powersync_port }}

api:
  parameters:
    max_parameter_query_results: 2000

sync_rules:
  path: sync_rules.yaml

client_auth:
  allow_local_jwks: true
  jwks_uri: "http://{{ values.consts.server_container_name }}:{{ values.consts.internal_server_port }}/api/v2/powersync-keys"
  audience:
    - "powersync"
{%- endmacro %}
