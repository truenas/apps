images:
  image:
    repository: ghcr.io/endless1233214/plainnvr
    tag: 0.1.0
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.0

consts:
  plainnvr_container_name: plainnvr
  permissions_container_name: permissions
  internal_web_port: 8787
  internal_rtsp_port: 8554
  internal_webrtc_port: 8555
  data_path: /data
  recordings_path: /recordings
  notes_body: |
    Open the PlainNVR web portal after the app starts. The first visit creates the local administrator account.
    Camera streams should be reachable from this TrueNAS system by LAN route or VPN.
