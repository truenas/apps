{% set tpl = ix_lib.base.render.Render(values) %}

{% set perms = tpl.deps.perms(values.consts.permissions_container_name) %}
{% do perms.add_or_skip_action("data", values.storage.data, {"uid": 568, "gid": 568, "chmod": "0775", "recursive": true}) %}
{% do perms.add_or_skip_action("recordings", values.storage.recordings, {"uid": 568, "gid": 568, "chmod": "0775", "recursive": true}) %}

{% set c1 = tpl.add_container(values.consts.plainnvr_container_name, "image") %}
{% do c1.set_user(568, 568) %}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/api/health"}) %}

{% do c1.environment.add_env("NVR_HOST", "0.0.0.0") %}
{% do c1.environment.add_env("NVR_PORT", values.consts.internal_web_port) %}
{% do c1.environment.add_env("NVR_DATA_DIR", values.consts.data_path) %}
{% do c1.environment.add_env("NVR_RECORDINGS_DIR", values.consts.recordings_path) %}
{% do c1.environment.add_env("NVR_DEFAULT_SEGMENT_SECONDS", values.plainnvr.default_segment_seconds) %}
{% if values.plainnvr.webrtc_candidates %}
  {% do c1.environment.add_env("NVR_GO2RTC_WEBRTC_CANDIDATES", values.plainnvr.webrtc_candidates) %}
{% endif %}
{% do c1.environment.add_user_envs(values.plainnvr.additional_envs) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do c1.add_storage(values.consts.recordings_path, values.storage.recordings) %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do c1.depends.add_dependency(values.consts.permissions_container_name, "service_completed_successfully") %}
{% endif %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% if values.network.host_network %}
  {% do c1.set_network_mode("host") %}
{% else %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
  {% do c1.add_port(values.network.rtsp_port, {"container_port": values.consts.internal_rtsp_port}) %}
  {% do c1.add_port(values.network.webrtc_port, {"container_port": values.consts.internal_webrtc_port}) %}
  {% do c1.add_port(values.network.webrtc_port, {"container_port": values.consts.internal_webrtc_port, "protocol": "udp"}) %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
