resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

plainnvr:
  default_segment_seconds: 60
  webrtc_candidates: ""
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8787
  rtsp_port:
    bind_mode: exposed
  webrtc_port:
    bind_mode: exposed

ix_volumes:
  data: /opt/tests/mnt/data
  recordings: /opt/tests/mnt/recordings

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  recordings:
    type: ix_volume
    ix_volume_config:
      dataset_name: recordings
      create_host_path: true
  additional_storage: []
