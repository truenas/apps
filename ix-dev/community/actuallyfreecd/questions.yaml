groups:
  - name: ActuallyFreeCD Configuration
    description: Configure ActuallyFreeCD Server
  - name: Optical Drive Configuration
    description: Select the optical drive devices exposed to ActuallyFreeCD
  - name: Network Configuration
    description: Configure network access
  - name: Storage Configuration
    description: Configure the music library destination
  - name: Output Permissions
    description: Configure ownership and modes for files created by ActuallyFreeCD
  - name: Resources Configuration
    description: Configure resource limits

questions:
  - variable: TZ
    label: Timezone
    group: ActuallyFreeCD Configuration
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: optical
    label: ""
    group: Optical Drive Configuration
    schema:
      type: dict
      attrs:
        - variable: block_device
          label: Optical Block Device
          description: Host optical block device, normally /dev/sr0.
          schema:
            type: string
            default: /dev/sr0
            required: true
        - variable: sg_device
          label: SCSI Generic Device
          description: Matching host SCSI generic device, for example /dev/sg8. Use lsscsi -g on the TrueNAS host to identify the matching device.
          schema:
            type: string
            default: /dev/sg0
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          description: Port used to access the ActuallyFreeCD web interface.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host
                    - value: exposed
                      description: Expose only to other containers
                    - value: ""
                      description: Do not publish or expose
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30475
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: Host IP addresses to bind the WebUI port to.
                schema:
                  type: list
                  show_if:
                    - [bind_mode, "=", published]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: music
          label: Music Library
          description: Storage mounted inside ActuallyFreeCD as /music. A Host Path is recommended so ripped music is directly available to SMB/Plex/etc.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: host_path
                  enum:
                    - value: host_path
                      description: Host Path
                    - value: ix_volume
                      description: ixVolume
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - [type, "=", host_path]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - [acl_enable, "=", true]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: Existing TrueNAS path where music should be written.
                      schema:
                        type: hostpath
                        show_if:
                          - [acl_enable, "=", false]
                        required: true
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if:
                    - [type, "=", ix_volume]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: music
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - [acl_enable, "=", true]
                        attrs: []

  - variable: output
    label: ""
    group: Output Permissions
    schema:
      type: dict
      attrs:
        - variable: uid
          label: Output User ID
          description: Optional owner UID for created files. Set to -1 to leave owner unchanged.
          schema:
            type: int
            default: -1
            min: -1
            max: 2147483647
            required: true
        - variable: gid
          label: Output Group ID
          description: Optional group GID for created files. Set this to a shared media group GID, or -1 to leave group unchanged.
          schema:
            type: int
            default: -1
            min: -1
            max: 2147483647
            required: true
        - variable: directory_mode
          label: Directory Mode
          description: Octal directory permissions. When a GID is configured, ActuallyFreeCD also applies the setgid bit.
          schema:
            type: string
            default: "0775"
            required: true
        - variable: file_mode
          label: File Mode
          description: Octal file permissions.
          schema:
            type: string
            default: "0664"
            required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPU limit for ActuallyFreeCD.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for ActuallyFreeCD.
                schema:
                  type: int
                  default: 2048
                  required: true
