{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.actuallyfreecd_container_name, "image") %}

{% do c1.set_user(0, 0) %}
{% do c1.healthcheck.set_test("http", {"port": values.consts.internal_web_port, "path": "/api/status"}) %}

{% for device in values.actuallyfreecd.devices %}
  {% do c1.devices.add_device(device.host_device, device.container_device) %}
{% endfor %}

{% do c1.environment.add_env("DEVICE_ROOT", "/hostdev") %}
{% do c1.environment.add_env("MUSIC_ROOT", "/music") %}
{% do c1.environment.add_env("AFCD_DIR_MODE", values.actuallyfreecd.directory_mode) %}
{% do c1.environment.add_env("AFCD_FILE_MODE", values.actuallyfreecd.file_mode) %}

{% if values.actuallyfreecd.output_uid >= 0 %}
  {% do c1.environment.add_env("AFCD_OUTPUT_UID", values.actuallyfreecd.output_uid) %}
{% endif %}

{% if values.actuallyfreecd.output_gid >= 0 %}
  {% do c1.environment.add_env("AFCD_OUTPUT_GID", values.actuallyfreecd.output_gid) %}
{% endif %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c1.add_storage("/music", values.storage.music) %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}

{{ tpl.render() | tojson }}
