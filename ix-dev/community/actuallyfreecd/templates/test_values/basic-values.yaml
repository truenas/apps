resources:
  limits:
    cpus: 2
    memory: 2048

TZ: Etc/UTC

actuallyfreecd:
  devices: []
  output_uid: -1
  output_gid: -1
  directory_mode: "0775"
  file_mode: "0664"

network:
  web_port:
    bind_mode: published
    port_number: 8080
  networks: []

ix_volumes:
  music: /opt/tests/mnt/actuallyfreecd/music

storage:
  music:
    type: ix_volume
    ix_volume_config:
      dataset_name: music
      create_host_path: true

labels: []
