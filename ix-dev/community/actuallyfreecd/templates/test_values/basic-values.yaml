resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

actuallyfreecd:
  devices: []

output_permissions:
  uid: 0
  gid: 3001
  directory_mode: "2775"
  file_mode: "0664"

network:
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  music: /opt/tests/mnt/actuallyfreecd/music

storage:
  music:
    type: ix_volume
    ix_volume_config:
      dataset_name: music
      create_host_path: true
