{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.mediaman_container_name, "image") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# app.healthcheck tries https and then http, so it works with and without a certificate #}
{% do c1.healthcheck.set_custom_test(["CMD", "python", "-m", "app.healthcheck"]) %}
{% do c1.environment.add_env("MEDIAMAN_PORT", values.consts.internal_web_port) %}
{% do c1.environment.add_user_envs(values.mediaman.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do c1.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
  {% do c1.environment.add_env("MEDIAMAN_TLS_CERT", values.consts.ssl_cert_path) %}
  {% do c1.environment.add_env("MEDIAMAN_TLS_KEY", values.consts.ssl_key_path) %}
{% endif %}

{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.add_storage("/config", values.storage.config) %}
{% do perms.add_or_skip_action("config", values.storage.config, perms_config) %}

{# the media folder is the user's existing library: never change its ownership or permissions #}
{% do c1.add_storage("/media", values.storage.media) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https" if values.network.certificate_id else "http"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
