resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

mediaman:
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080
  certificate_id: null

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/mediaman/config
  media: /opt/tests/mnt/mediaman/media

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  media:
    type: ix_volume
    ix_volume_config:
      dataset_name: media
      create_host_path: true
  additional_storage: []
