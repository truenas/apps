groups:
  - name: DBRepairs Configuration
    description: Configure DBRepairs
  - name: Network Configuration
    description: Configure network settings
  - name: Storage Configuration
    description: Configure persistent storage
  - name: Resources Configuration
    description: Configure resource limits

questions:
  - variable: TZ
    group: DBRepairs Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: dbrepairs
    label: ""
    group: DBRepairs Configuration
    schema:
      type: dict
      attrs:
        - variable: db_password
          label: Database Password
          description: Password used internally by DBRepairs PostgreSQL database.
          schema:
            type: string
            default: ""
            required: true
            private: true

        - variable: backup_interval
          label: Backup Interval
          description: Number of seconds between automatic PostgreSQL backups.
          schema:
            type: int
            default: 86400
            min: 3600
            required: true

        - variable: backup_retention_days
          label: Backup Retention
          description: Number of days automatic PostgreSQL backups are retained.
          schema:
            type: int
            default: 14
            min: 1
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          description: Port used to access DBRepairs.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host
                    - value: exposed
                      description: Expose only to containers
                    - value: ""
                      description: None

              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 31500
                  min: 1
                  max: 65535
                  required: true

              - variable: container_port
                label: Container Port
                schema:
                  type: int
                  default: 80
                  hidden: true
                  required: true

              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: postgres_data
          label: PostgreSQL Data Storage
          description: Persistent storage for the DBRepairs database.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path
                    - value: ix_volume
                      description: ixVolume

              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false

                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: postgres_data

                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []

              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false

                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true

        - variable: backups
          label: Backup Storage
          description: Persistent storage for PostgreSQL backups.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path
                    - value: ix_volume
                      description: ixVolume

              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false

                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: backups

                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []

              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false

                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  default: 2
                  required: true

              - variable: memory
                label: Memory (in MB)
                schema:
                  type: int
                  default: 2048
                  required: true
