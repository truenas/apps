{% set tpl = ix_lib.base.render.Render(values) %}

{% set dbrepairs_net = tpl.networks.create_internal("dbrepairs-net") %}

{% set perm_container = tpl.deps.perms("permissions") %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.dbrepairs.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}

{% set postgres = tpl.deps.postgres(
  values.consts.postgres_container_name,
  "postgres_image",
  pg_config,
  perm_container
) %}

{% do postgres.container.add_network(dbrepairs_net) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency("permissions", "service_completed_successfully") %}
{% endif %}

{% set api = tpl.add_container(values.consts.api_container_name, "api_image") %}
{% do api.add_network(dbrepairs_net) %}
{% do api.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do api.environment.add_env("PGHOST", values.consts.postgres_container_name) %}
{% do api.environment.add_env("PGPORT", "5432") %}
{% do api.environment.add_env("PGDATABASE", values.consts.db_name) %}
{% do api.environment.add_env("PGUSER", values.consts.db_user) %}
{% do api.environment.add_env("PGPASSWORD", values.dbrepairs.db_password) %}
{% do api.environment.add_env("DATABASE_POOL_SIZE", "10") %}
{% do api.environment.add_env("TRUST_PROXY", "true") %}

{% do api.healthcheck.set_custom_test(
  ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
) %}

{% set web = tpl.add_container(values.consts.web_container_name, "image") %}
{% do web.add_caps(["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]) %}
{% do web.add_network(dbrepairs_net) %}
{% do web.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{% do web.add_port(values.network.web_port) %}
{% do web.healthcheck.set_custom_test(
  ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
) %}

{% set backup = tpl.add_container(values.consts.backup_container_name, "postgres_image") %}
{% do backup.add_network(dbrepairs_net) %}
{% do backup.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do backup.healthcheck.disable() %}

{% do backup.environment.add_env("PGHOST", values.consts.postgres_container_name) %}
{% do backup.environment.add_env("PGPORT", "5432") %}
{% do backup.environment.add_env("PGDATABASE", values.consts.db_name) %}
{% do backup.environment.add_env("PGUSER", values.consts.db_user) %}
{% do backup.environment.add_env("PGPASSWORD", values.dbrepairs.db_password) %}
{% do backup.environment.add_env("BACKUP_INTERVAL_SECONDS", values.dbrepairs.backup_interval|string) %}
{% do backup.environment.add_env("BACKUP_RETENTION_DAYS", values.dbrepairs.backup_retention_days|string) %}

{% do backup.add_storage("/backups", values.storage.backups) %}

{% do backup.set_command([
  "/bin/sh",
  "-c",
  "set -eu; while true; do "
  ~ "stamp=$(date +%Y%m%d-%H%M%S); "
  ~ "temporary=/backups/DBRepairs-${stamp}.dump.tmp; "
  ~ "destination=/backups/DBRepairs-${stamp}.dump; "
  ~ "if pg_dump --format=custom --no-owner --no-privileges --file=${temporary}; then "
  ~ "mv ${temporary} ${destination}; "
  ~ "find /backups -type f -name 'DBRepairs-*.dump' -mtime +${BACKUP_RETENTION_DAYS} -delete; "
  ~ "else rm -f ${temporary}; fi; "
  ~ "sleep ${BACKUP_INTERVAL_SECONDS}; "
  ~ "done"
]) %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
