TZ: Etc/UTC

dbrepairs:
  db_password: test-password
  backup_interval: 86400
  backup_retention_days: 14

network:
  web_port:
    bind_mode: published
    port_number: 31500
    container_port: 80
    host_ips: []

ix_volumes:
  postgres_data: /opt/tests/mnt/dbrepairs/postgres_data
  backups: /opt/tests/mnt/dbrepairs/backups

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
      acl_enable: false

  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
      acl_enable: false

resources:
  limits:
    cpus: 2
    memory: 2048
