images:
  image:
    repository: ghcr.io/claudiodb007/dbrepairs-web
    tag: 0.2.1
  api_image:
    repository: ghcr.io/claudiodb007/dbrepairs-api
    tag: 0.2.1
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2
  postgres_18_image:
    repository: postgres
    tag: 18.6-trixie
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: 1.2.16

consts:
  dbrepairs_container_name: dbrepairs
  api_container_name: api
  postgres_container_name: postgres
  perms_container_name: permissions

  web_internal_port: 8080
  api_internal_port: 3000

  web_run_as_user: 101
  web_run_as_group: 101
  api_run_as_user: 1000
  api_run_as_group: 1000

  db_user: dbrepairs
  db_name: dbrepairs
