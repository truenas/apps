images:
  image:
    repository: ghcr.io/vtnerd/monero-lws
    tag: "1.0@sha256:1f9a7eceb84b8a681a58378800e251a2356f9fb7947632bf0e7f0a2fa2e3348b"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.1@sha256:d1bdb3a3ed7fc158eca53cd78486c388345c603fe2bf42fb24a1e03e1068ff38"

consts:
  lws_container_name: monero-lws
  perms_container_name: permissions
  run_as_user: 1000
  run_as_group: 1000
  monero_lws_path: /home/monero-lws/.bitmonero
  reserved_wallet_flags:
    - --db-path
    - --daemon
    - --sub
    - --rest-server
    - --admin-rest-server
    - --untrusted-daemon
    - --confirm-external-bind
    - --max-subaddresses
    - --auto-accept-creation
    - --auto-accept-import
