images:
  image:
    repository: ghcr.io/vtnerd/monero-lws
    tag: "v1.0.5@sha256:d90cb7c26d7c1df683fe3681400078a0049d9399b54eafe00b1699f389b74b33"
  container_utils_image:
    repository: ghcr.io/truenas/containers/container-utils
    tag: "1.1.2@sha256:6ddfdc314af9d18cfacb836ad266ef0ed91fecaa3686b20be72e464972860c08"

consts:
  lws_container_name: monero-lws
  perms_container_name: permissions
  run_as_user: 1000
  run_as_group: 1000
  monero_lws_path: /home/monero-lws/.bitmonero
  reserved_wallet_flags:
    - --db-path
    - --daemon
    - --sub
    - --rest-server
    - --admin-rest-server
    - --untrusted-daemon
    - --confirm-external-bind
    - --max-subaddresses
    - --auto-accept-creation
    - --auto-accept-import
