{% set tpl = ix_lib.base.render.Render(values) %}
{% set c1 = tpl.add_container(values.consts.container_name, "image") %}
{% do c1.set_user(0, 0) %}
{% do c1.healthcheck.disable() %}
{% do c1.add_storage("/opt/timemachine", {"type": "host_path", "host_path_config": {"path": values.storage.data_path, "acl_enable": false}}) %}
{% do c1.add_port({"bind_mode": "published", "port_number": values.app.host_port, "host_ips": [], "container_port": 445, "protocol": "tcp"}) %}
{% do c1.environment.add_user_envs(values.app.additional_envs) %}
{{ tpl.render() | tojson }}
