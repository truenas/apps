{% set tpl = ix_lib.base.render.Render(values) %}
{% set c1 = tpl.add_container(values.consts.container_name, "image") %}

{% do c1.set_user(0, 0) %}
{% do c1.healthcheck.disable() %}

{% do c1.add_storage("/opt/timemachine", {"type": "host_path", "host_path_config": {"path": values.storage.data_path, "acl_enable": false}}) %}

{% do c1.add_port({"bind_mode": "published", "port_number": values.app.host_port, "host_ips": [], "container_port": values.app.host_port, "protocol": "tcp"}) %}

{% do c1.environment.add_env("TM_USERNAME", values.app.username) %}
{% do c1.environment.add_env("TM_GROUPNAME", values.app.username) %}
{% do c1.environment.add_env("PASSWORD", values.app.password) %}
{% do c1.environment.add_env("TM_UID", values.app.uid) %}
{% do c1.environment.add_env("TM_GID", values.app.gid) %}
{% do c1.environment.add_env("SHARE_NAME", values.app.share_name) %}
{% do c1.environment.add_env("VOLUME_SIZE_LIMIT", values.app.volume_size_limit) %}
{% do c1.environment.add_env("SET_PERMISSIONS", "true" if values.app.set_permissions else "false") %}
{% do c1.environment.add_env("WORKGROUP", values.app.workgroup) %}
{% do c1.environment.add_env("SMB_PORT", values.app.host_port) %}

{% do c1.environment.add_user_envs(values.app.additional_envs) %}

{{ tpl.render() | tojson }}
