groups:
  - name: Application Configuration
    description: Configure application environment and network
  - name: Storage Configuration
    description: Choose an existing TrueNAS dataset
questions:
  - variable: app
    label: ""
    group: Application Configuration
    schema:
      type: dict
      attrs:
        - variable: host_port
          label: Host Port
          schema:
            type: int
            default: 445
            min: 1
            max: 65535
            required: true
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data_path
          label: Application Host Dataset Path
          description: Existing absolute path under /mnt/<pool> to store application data
          schema:
            type: hostpath
            required: true
