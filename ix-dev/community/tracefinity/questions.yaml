groups:
  - name: Tracefinity Configuration
    description: Configure Tracefinity Settings
  - name: User and Group Configuration
    description: Configure User and Group for Tracefinity
  - name: Network Configuration
    description: Configure Network for Tracefinity
  - name: Storage Configuration
    description: Configure Storage for Tracefinity
  - name: Labels Configuration
    description: Configure Labels for Tracefinity
  - name: Resources Configuration
    description: Configure Resources for Tracefinity

questions:
  - variable: tracefinity
    label: ""
    group: Tracefinity Configuration
    schema:
      type: dict
      attrs:
        - variable: google_api_key
          label: Google API Key
          description: >-
            Optional. Enables cloud-based tracing with Gemini for better
            detection results (e.g. reflective/chrome tools). Leave blank
            to use the local IS-Net model instead.
          schema:
            type: string
            required: false
            private: true
            default: ""

        - variable: fal_key
          label: fal.ai API Key
          description: >-
            Optional. Use fal.ai as a remote saliency/tracing provider
            instead of the local model.
          schema:
            type: string
            required: false
            private: true
            default: ""

        - variable: replicate_api_token
          label: Replicate API Token
          description: >-
            Optional. Use Replicate as a remote saliency/tracing provider
            instead of the local model.
          schema:
            type: string
            required: false
            private: true
            default: ""

        - variable: auth_secret
          label: Shared Auth Secret
          description: >-
            Optional. Shared secret for a trusted multi-user reverse proxy
            setup. Leave blank for normal standalone use.
          schema:
            type: string
            required: false
            private: true
            default: ""

        - variable: auto_naming
          label: Automatic Tool Naming
          description: >-
            Optional automatic tool naming using a vision model. Set to
            "ollama" to use a local Ollama instance for naming, or leave
            blank to disable.
          schema:
            type: string
            required: false
            default: ""
            enum:
              - value: ""
                description: "Disabled"
              - value: "ollama"
                description: "Ollama (local vision naming)"

        - variable: show_version
          label: Show Version in Settings
          description: Show the running version in the settings popover.
          schema:
            type: boolean
            default: true
  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          description: The user id that Tracefinity files will be owned by.
          schema:
            type: int
            min: 568
            default: 568
            required: true
        - variable: group
          label: Group ID
          description: The group id that Tracefinity files will be owned by.
          schema:
            type: int
            min: 568
            default: 568
            required: true
  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web Port
          description: Port for the Tracefinity web interface
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: "Publish port on the host"
                    - value: "exposed"
                      description: "Expose port only to other containers"
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30000
                  min: 1024
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
        - variable: host_network
          label: Host Network
          description: |
            Bind to the host network. It's recommended to keep this disabled.
          schema:
            type: boolean
            default: false
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Tracefinity Storage
          description: The path to store Tracefinity data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: tracefinity
                            description: tracefinity
  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for Tracefinity.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for Tracefinity.
                schema:
                  type: int
                  default: 12288
                  required: true
