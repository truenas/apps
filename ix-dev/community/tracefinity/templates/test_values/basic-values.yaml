resources:
  limits:
    cpus: 2
    memory: 12288

tracefinity:
  google_api_key: ""
  fal_key: ""
  replicate_api_token: ""
  auth_secret: ""
  auto_naming: ""
  show_version: true

network:
  web_port:
    bind_mode: published
    port_number: 30000
  host_network: false

ix_volumes:
  test_tracefinity_data: /opt/tests/mnt/tracefinity-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: test_tracefinity_data
      create_host_path: true
run_as:
  user: 568
  group: 568
