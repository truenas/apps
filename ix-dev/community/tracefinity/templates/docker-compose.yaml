{# Initialize the rendering system #}
{% set tpl = ix_lib.base.render.Render(values) %}

{# Main Tracefinity container #}
{% set app = tpl.add_container(values.consts.tracefinity_container_name, "image") %}
{% do app.set_user(values.run_as.user, values.run_as.group) %}

{# Web port #}
{% do app.add_port(values.network.web_port, {"container_port": 3000}) %}

{# Storage #}
{% do app.add_storage("/app/storage", values.storage.data) %}

{# Optional environment variables #}
{% if values.tracefinity.google_api_key %}
  {% do app.environment.add_env("GOOGLE_API_KEY", values.tracefinity.google_api_key) %}
{% endif %}
{% if values.tracefinity.fal_key %}
  {% do app.environment.add_env("FAL_KEY", values.tracefinity.fal_key) %}
{% endif %}
{% if values.tracefinity.replicate_api_token %}
  {% do app.environment.add_env("REPLICATE_API_TOKEN", values.tracefinity.replicate_api_token) %}
{% endif %}
{% if values.tracefinity.auth_secret %}
  {% do app.environment.add_env("AUTH_SECRET", values.tracefinity.auth_secret) %}
{% endif %}
{% if values.tracefinity.auto_naming %}
  {% do app.environment.add_env("AUTO_NAMING", values.tracefinity.auto_naming) %}
{% endif %}
{% do app.environment.add_env("SHOW_VERSION", values.tracefinity.show_version) %}

{# Health check against the web UI #}
{% do app.healthcheck.set_custom_test(["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/version', timeout=2)"]) %}

{# Permissions container for storage init #}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% do perms.add_or_skip_action("data", values.storage.data, perms_config) %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do app.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# Web UI portal #}
{% do tpl.portals.add(values.network.web_port, {"scheme": "http", "path": "/"}) %}

{# Notes for users #}
{% do tpl.notes.add_info("No account or signup required. Without an API key, tracing uses the local IS-Net model.") %}

{{ tpl.render() | tojson }}
