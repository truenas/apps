resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

airwave:
  postgres_image_selector: postgres_18_image
  db_password: secret
  better_auth_secret: supersecretkeysupersecretkeysupersecretkey
  admin_email: admin@example.com
  admin_password: admin
  server_public_url: http://localhost:36020
  web_public_url: http://localhost:36021
  tvweb_public_url: http://localhost:36022
  tv_server_url: ""
  enable_workflow: false
  additional_envs:
    - name: PLEX_CLIENT_IDENTIFIER
      value: "airwave-truenas"
    - name: EXTRA_CORS_ORIGINS
      value: "http://192.168.1.10:36021"

run_as:
  user: 568
  group: 568

network:
  server_port:
    bind_mode: published
    port_number: 8080
  web_port:
    bind_mode: published
    port_number: 8081
  tvweb_port:
    bind_mode: published
    port_number: 8082

ix_volumes:
  postgres_data: /opt/tests/mnt/airwave/postgres_data
  bumper_music: /opt/tests/mnt/airwave/bumper_music

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  bumper_music:
    type: ix_volume
    ix_volume_config:
      dataset_name: bumper_music
      create_host_path: true
  additional_storage: []
