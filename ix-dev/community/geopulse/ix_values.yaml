images:
  backend_image:
    repository: tess1o/geopulse-backend
    tag: 1.36.2-native-compat
  frontend_image:
    repository: tess1o/geopulse-ui
    tag: 1.36.2
  keygen_image:
    repository: alpine
    tag: latest
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2
  postgis_17_image:
    repository: postgis/postgis
    tag: "17-3.5"
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: 1.2.13
  mosquitto_image:
    repository: iegomez/mosquitto-go-auth
    tag: 3.0.0-mosquitto_2.0.18

consts:
  backend_container_name: backend
  frontend_container_name: frontend
  keygen_container_name: keygen
  postgis_container_name: postgis
  mosquitto_container_name: mosquitto
  perms_container_name: permissions
  db_user: geopulse
  db_name: geopulse
  backend_port: 8080
  frontend_port: 80
  mqtt_port: 1883
  notes_body: |
    Open GeoPulse and create the first account. The first registered user is promoted to admin by default.
