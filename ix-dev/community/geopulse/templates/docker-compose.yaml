{% set tpl = ix_lib.base.render.Render(values) %}

{% set geopulse_net = tpl.networks.create_internal("geopulse-net") %}

{% set keygen = tpl.add_container(values.consts.keygen_container_name, "keygen_image") %}
{% do keygen.add_network(geopulse_net) %}
{% do keygen.setup_as_helper(disable_network=false) %}
{% do keygen.set_entrypoint(["sh", "-ec"]) %}
{% do keygen.set_command([
  "set -e\n"
  "mkdir -p /keys\n"
  "if [ ! -f /keys/jwt-private-key.pem ] || [ ! -f /keys/jwt-public-key.pem ]; then\n"
  "  command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl\n"
  "  openssl genpkey -algorithm RSA -out /keys/jwt-private-key.pem\n"
  "  openssl rsa -pubout -in /keys/jwt-private-key.pem -out /keys/jwt-public-key.pem\n"
  "  chmod 644 /keys/jwt-private-key.pem /keys/jwt-public-key.pem\n"
  "fi\n"
  "if [ ! -f /keys/ai-encryption-key.txt ]; then\n"
  "  command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl\n"
  "  openssl rand -base64 32 > /keys/ai-encryption-key.txt\n"
  "  chmod 644 /keys/ai-encryption-key.txt\n"
  "fi"
]) %}
{% do keygen.add_storage("/keys", values.storage["keys"]) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.geopulse.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
  "additional_options": {
    "timezone": "UTC",
    "shared_buffers": "256MB",
    "work_mem": "8MB",
    "maintenance_work_mem": "64MB",
    "effective_cache_size": "1GB",
    "max_wal_size": "512MB",
    "checkpoint_completion_target": "0.9",
    "wal_buffers": "16MB",
    "random_page_cost": "1.1",
    "effective_io_concurrency": "100",
    "autovacuum_naptime": "60s",
    "autovacuum_vacuum_scale_factor": "0.2",
    "log_min_duration_statement": "5000",
    "track_io_timing": "on",
  },
} %}
{% set postgis = tpl.deps.postgres(values.consts.postgis_container_name, "postgis_17_image", pg_config, perm_container) %}
{% do postgis.container.add_network(geopulse_net) %}

{% set backend = tpl.add_container(values.consts.backend_container_name, "backend_image") %}
{% do backend.add_network(geopulse_net) %}
{% do backend.depends.add_dependency(values.consts.keygen_container_name, "service_completed_successfully") %}
{% do backend.depends.add_dependency(values.consts.postgis_container_name, "service_healthy") %}
{% do backend.healthcheck.set_test("curl", {"port": values.consts.backend_port, "path": "/api/health"}) %}
{% do backend.healthcheck.set_interval(3) %}
{% do backend.healthcheck.set_timeout(2) %}
{% do backend.healthcheck.set_retries(20) %}
{% do backend.healthcheck.set_start_period(5) %}

{% do backend.environment.add_env("GEOPULSE_POSTGRES_HOST", values.consts.postgis_container_name) %}
{% do backend.environment.add_env("GEOPULSE_POSTGRES_PORT", 5432) %}
{% do backend.environment.add_env("GEOPULSE_POSTGRES_DB", values.consts.db_name) %}
{% do backend.environment.add_env("GEOPULSE_POSTGRES_USERNAME", values.consts.db_user) %}
{% do backend.environment.add_env("GEOPULSE_POSTGRES_PASSWORD", values.geopulse.db_password) %}
{% do backend.environment.add_env("GEOPULSE_POSTGRES_URL", "jdbc:postgresql://%s:5432/%s"|format(values.consts.postgis_container_name, values.consts.db_name)) %}
{% do backend.environment.add_env("GEOPULSE_BACKEND_URL", "http://%s:%d"|format(values.consts.backend_container_name, values.consts.backend_port)) %}
{% do backend.environment.add_env("GEOPULSE_UI_URL", values.geopulse.public_base_url) %}
{% do backend.environment.add_env("GEOPULSE_PUBLIC_BASE_URL", values.geopulse.public_base_url) %}
{% do backend.environment.add_env("GEOPULSE_AUTH_SECURE_COOKIES", values.geopulse.auth_secure_cookies) %}
{% do backend.environment.add_env("GEOPULSE_CORS_ENABLED", false) %}
{% do backend.environment.add_env("GEOPULSE_ADMIN_EMAIL", values.geopulse.admin_email) %}
{% do backend.environment.add_env("GEOPULSE_FIRST_USER_ADMIN", true) %}
{% do backend.environment.add_env("GEOPULSE_USER_DEFAULT_MEASURE_UNIT", values.geopulse.default_measure_unit) %}
{% do backend.environment.add_env("GEOPULSE_JWT_PRIVATE_KEY_LOCATION", "file:/app/keys/jwt-private-key.pem") %}
{% do backend.environment.add_env("GEOPULSE_JWT_PUBLIC_KEY_LOCATION", "file:/app/keys/jwt-public-key.pem") %}
{% do backend.environment.add_env("GEOPULSE_AI_ENCRYPTION_KEY_LOCATION", "file:/app/keys/ai-encryption-key.txt") %}
{% do backend.environment.add_env("GEOPULSE_IMPORT_DROP_FOLDER_PATH", "/data/geopulse-import") %}
{% do backend.environment.add_env("GEOPULSE_MQTT_ENABLED", values.mqtt.enabled) %}
{% do backend.environment.add_env("GEOPULSE_MQTT_BROKER_HOST", values.consts.mosquitto_container_name) %}
{% do backend.environment.add_env("GEOPULSE_MQTT_BROKER_PORT", values.consts.mqtt_port) %}
{% do backend.environment.add_env("GEOPULSE_MQTT_USERNAME", values.mqtt.username) %}
{% do backend.environment.add_env("GEOPULSE_MQTT_PASSWORD", values.mqtt.password) %}
{% do backend.environment.add_user_envs(values.geopulse.additional_backend_envs) %}
{% do backend.add_storage("/app/keys", values.storage["keys"]) %}
{% do backend.add_storage("/data/geopulse-import", values.storage.import_drop) %}
{% for store in values.storage.additional_storage %}
  {% do backend.add_storage(store.mount_path, store) %}
{% endfor %}

{% set frontend = tpl.add_container(values.consts.frontend_container_name, "frontend_image") %}
{% do frontend.add_network(geopulse_net) %}
{% do frontend.add_caps(["CHOWN", "SETUID", "SETGID"]) %}
{% do frontend.depends.add_dependency(values.consts.backend_container_name, "service_healthy") %}
{% do frontend.healthcheck.set_test("wget", {"port": values.consts.frontend_port, "path": "/", "busybox": true}) %}
{% do frontend.environment.add_env("GEOPULSE_BACKEND_URL", "http://%s:%d"|format(values.consts.backend_container_name, values.consts.backend_port)) %}
{% do frontend.environment.add_user_envs(values.geopulse.additional_frontend_envs) %}
{% do frontend.add_port(values.network.web_port, {"container_port": values.consts.frontend_port}) %}

{% if values.mqtt.enabled %}
  {% set mosquitto = tpl.add_container(values.consts.mosquitto_container_name, "mosquitto_image") %}
  {% do mosquitto.add_network(geopulse_net) %}
  {% do mosquitto.depends.add_dependency(values.consts.postgis_container_name, "service_healthy") %}
  {% do mosquitto.healthcheck.disable() %}
  {% do backend.depends.add_dependency(values.consts.mosquitto_container_name, "service_started") %}
  {% do mosquitto.environment.add_env("GEOPULSE_MQTT_USERNAME", values.mqtt.username) %}
  {% do mosquitto.environment.add_env("GEOPULSE_MQTT_PASSWORD", values.mqtt.password) %}
  {% do mosquitto.environment.add_env("GEOPULSE_POSTGRES_HOST", values.consts.postgis_container_name) %}
  {% do mosquitto.environment.add_env("GEOPULSE_POSTGRES_PORT", 5432) %}
  {% do mosquitto.environment.add_env("GEOPULSE_POSTGRES_DB", values.consts.db_name) %}
  {% do mosquitto.environment.add_env("GEOPULSE_POSTGRES_USERNAME", values.consts.db_user) %}
  {% do mosquitto.environment.add_env("GEOPULSE_POSTGRES_PASSWORD", values.geopulse.db_password) %}
  {% do mosquitto.set_entrypoint(["/bin/sh", "-ec"]) %}
  {% do mosquitto.set_command([
    "set -e\n"
    "CONF_FILE=/mosquitto/config/mosquitto.conf\n"
    "ADMIN_USER_FILE=/mosquitto/config/admin_user\n"
    "ADMIN_ACL_FILE=/mosquitto/config/admin_acl\n"
    "if [ ! -f \"$CONF_FILE\" ]; then\n"
    "  cat > \"$CONF_FILE\" <<EOF\n"
    "listener 1883\n"
    "allow_anonymous false\n"
    "persistence true\n"
    "persistence_location /mosquitto/data/\n"
    "log_dest file /mosquitto/log/mosquitto.log\n"
    "log_type all\n"
    "connection_messages true\n"
    "log_timestamp true\n"
    "auth_plugin /mosquitto/go-auth.so\n"
    "auth_opt_log_dest stdout\n"
    "auth_opt_log_level debug\n"
    "auth_opt_backends files,postgres\n"
    "auth_opt_files_acl_path ${ADMIN_ACL_FILE}\n"
    "auth_opt_check_prefix false\n"
    "auth_opt_files_password_path ${ADMIN_USER_FILE}\n"
    "auth_opt_files_hasher bcrypt\n"
    "auth_opt_pg_host ${GEOPULSE_POSTGRES_HOST}\n"
    "auth_opt_pg_port ${GEOPULSE_POSTGRES_PORT}\n"
    "auth_opt_pg_dbname ${GEOPULSE_POSTGRES_DB}\n"
    "auth_opt_pg_user ${GEOPULSE_POSTGRES_USERNAME}\n"
    "auth_opt_pg_password ${GEOPULSE_POSTGRES_PASSWORD}\n"
    "auth_opt_pg_sslmode disable\n"
    "auth_opt_pg_connect_tries 10\n"
    "auth_opt_pg_userquery SELECT password_hash FROM gps_source_config WHERE username = \\$1 AND connection_type = 'MQTT' AND source_type = 'OWNTRACKS' AND active = true LIMIT 1\n"
    "auth_opt_pg_aclquery SELECT CONCAT('owntracks/', username, '/+') as topic FROM gps_source_config WHERE username = \\$1 AND active = true AND connection_type = 'MQTT' and \\$2 = \\$2 LIMIT 1\n"
    "auth_opt_pg_hasher bcrypt\n"
    "auth_opt_pg_hasher_cost 12\n"
    "EOF\n"
    "  ADMIN_PASSWORD_HASH=$(perl -e 'my $password = $ARGV[0]; my $cost = \"12\"; my @chars = (\".\", \"/\", 0..9, \"A\"..\"Z\", \"a\"..\"z\"); my $salt_chars = join(\"\", map { $chars[rand @chars] } 1..22); my $bcrypt_salt = \"\\$2b\\$\" . $cost . \"\\$\" . $salt_chars; my $hash = crypt($password, $bcrypt_salt); print $hash;' \"$GEOPULSE_MQTT_PASSWORD\")\n"
    "  echo \"$GEOPULSE_MQTT_USERNAME:$ADMIN_PASSWORD_HASH\" > \"$ADMIN_USER_FILE\"\n"
    "  printf 'user %s\\ntopic readwrite #\\n' \"$GEOPULSE_MQTT_USERNAME\" > \"$ADMIN_ACL_FILE\"\n"
    "fi\n"
    "exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -v"
  ]) %}
  {% do mosquitto.add_port(values.network.mqtt_port, {"container_port": values.consts.mqtt_port}) %}
  {% do mosquitto.add_storage("/mosquitto/config", values.storage.mosquitto_config) %}
  {% do mosquitto.add_storage("/mosquitto/data", values.storage.mosquitto_data) %}
  {% do mosquitto.add_storage("/mosquitto/log", values.storage.mosquitto_logs) %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgis.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
