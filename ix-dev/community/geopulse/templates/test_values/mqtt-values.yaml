resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

geopulse:
  db_password: secret
  public_base_url: http://localhost:30078
  auth_secure_cookies: false
  admin_email: ""
  default_measure_unit: METRIC
  additional_backend_envs: []
  additional_frontend_envs: []

mqtt:
  enabled: true
  username: geopulse_mqtt_admin
  password: secret

network:
  web_port:
    bind_mode: published
    port_number: 30078
  mqtt_port:
    bind_mode: published
    port_number: 1883

ix_volumes:
  postgres_data: /opt/tests/mnt/geopulse/postgres_data
  keys: /opt/tests/mnt/geopulse/keys
  import_drop: /opt/tests/mnt/geopulse/import_drop
  mosquitto_config: /opt/tests/mnt/geopulse/mosquitto_config
  mosquitto_data: /opt/tests/mnt/geopulse/mosquitto_data
  mosquitto_logs: /opt/tests/mnt/geopulse/mosquitto_logs

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  keys:
    type: ix_volume
    ix_volume_config:
      dataset_name: keys
      create_host_path: true
  import_drop:
    type: ix_volume
    ix_volume_config:
      dataset_name: import_drop
      create_host_path: true
  mosquitto_config:
    type: ix_volume
    ix_volume_config:
      dataset_name: mosquitto_config
      create_host_path: true
  mosquitto_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mosquitto_data
      create_host_path: true
  mosquitto_logs:
    type: ix_volume
    ix_volume_config:
      dataset_name: mosquitto_logs
      create_host_path: true
  additional_storage: []
