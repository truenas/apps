groups:
  - name: GeoPulse Configuration
    description: Configure GeoPulse
  - name: OwnTracks MQTT Configuration
    description: Configure the optional bundled MQTT broker for OwnTracks only
  - name: Network Configuration
    description: Configure network access for GeoPulse
  - name: Storage Configuration
    description: Configure GeoPulse storage
  - name: Labels Configuration
    description: Configure labels for GeoPulse
  - name: Resources Configuration
    description: Configure resources for GeoPulse

questions:
  - variable: TZ
    group: GeoPulse Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone
  - variable: geopulse
    label: ""
    group: GeoPulse Configuration
    schema:
      type: dict
      attrs:
        - variable: db_password
          label: Database Password
          description: Password for the internal GeoPulse Postgres database.
          schema:
            type: string
            default: geopulse-db-password
            required: true
            private: true
        - variable: public_base_url
          label: Public Base URL
          description: Public URL used for callback and share link generation.
          schema:
            type: uri
            default: ""
        - variable: auth_secure_cookies
          label: Secure Auth Cookies
          description: Enable when GeoPulse is accessed through HTTPS.
          schema:
            type: boolean
            default: false
        - variable: admin_email
          label: Admin Email
          description: Optional email address to promote to admin. If empty, the first registered user becomes admin.
          schema:
            type: string
            default: ""
        - variable: default_measure_unit
          label: Default Measurement Unit
          schema:
            type: string
            default: METRIC
            required: true
            enum:
              - value: METRIC
                description: Metric
              - value: IMPERIAL
                description: Imperial
        - variable: additional_backend_envs
          label: Additional Backend Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
        - variable: additional_frontend_envs
          label: Additional Frontend Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: mqtt
    label: ""
    group: OwnTracks MQTT Configuration
    schema:
      type: dict
      attrs:
        - variable: enabled
          label: Enable OwnTracks MQTT Broker
          description: |
            Enable only if you use OwnTracks with the MQTT protocol.</br>
            GeoPulse does not need this broker for OwnTracks HTTP, Overland, GPSLogger, Home Assistant, Traccar, Dawarich, Colota, or file imports.
          schema:
            type: boolean
            default: false
        - variable: username
          label: OwnTracks MQTT Admin Username
          schema:
            type: string
            default: geopulse_mqtt_admin
            required: true
            show_if: [["enabled", "=", true]]
        - variable: password
          label: OwnTracks MQTT Admin Password
          schema:
            type: string
            default: ""
            required: true
            private: true
            show_if: [["enabled", "=", true]]

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30078
                  show_if: [["bind_mode", "=", "published"]]
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: mqtt_port
          label: MQTT Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  show_if: [["mqtt.enabled", "=", true]]
                  enum:
                    - value: published
                      description: Publish port on the host
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 1883
                  show_if: [["bind_mode", "=", "published"]]
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          description: The docker networks to join
          schema:
            type: list
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: backend
                                        description: backend
                                      - value: frontend
                                        description: frontend
                                      - value: keygen
                                        description: keygen
                                      - value: postgis
                                        description: postgis
                                      - value: mosquitto
                                        description: mosquitto
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: postgres_data
          label: Postgres Data Storage
          schema: &storage_schema
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: postgres_data
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: keys
          label: Keys Storage
          schema:
            <<: *storage_schema
        - variable: import_drop
          label: Import Drop Folder Storage
          schema:
            <<: *storage_schema
        - variable: mosquitto_config
          label: Mosquitto Config Storage
          schema:
            <<: *storage_schema
        - variable: mosquitto_data
          label: Mosquitto Data Storage
          schema:
            <<: *storage_schema
        - variable: mosquitto_logs
          label: Mosquitto Logs Storage
          schema:
            <<: *storage_schema
        - variable: additional_storage
          label: Additional Backend Storage
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      schema:
                        type: string
                        required: true
                        default: ix_volume
                        enum:
                          - value: host_path
                            description: Host Path
                          - value: ix_volume
                            description: ixVolume
                    - variable: read_only
                      label: Read Only
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      schema:
                        type: path
                        required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - normalize/ix_volume
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            schema:
                              type: string
                              required: true
                              default: additional_storage
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - normalize/acl
                          - variable: path
                            label: Host Path
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: backend
                            description: backend
                          - value: frontend
                            description: frontend
                          - value: keygen
                            description: keygen
                          - value: postgis
                            description: postgis
                          - value: mosquitto
                            description: mosquitto
  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  default: 1
                  required: true
              - variable: memory
                label: Memory (in MB)
                schema:
                  type: int
                  default: 1024
                  required: true
