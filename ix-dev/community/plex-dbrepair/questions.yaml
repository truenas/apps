groups:
  - name: Application Configuration
    description: Configure application ports
  - name: Storage Configuration
    description: Select existing TrueNAS host paths
questions:
  - variable: app
    label: ""
    group: Application Configuration
    schema:
      type: dict
      attrs:
        - variable: description
          label: Job description
          schema:
            type: string
            default: Plex database repair
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: logs_path
          label: logs path
          schema:
            type: hostpath
            required: true
