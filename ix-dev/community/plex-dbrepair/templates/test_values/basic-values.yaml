# Developer render fixture only.
app:
  mode: automatic
  plex_container_name: auto
  enable_backups: true
  restart_plex: true
  prune_days: 30
  plex_container_match: plex
  plex_mount: /config
  plex_relative_path: Library/Application Support/Plex Media Server
  allow_plex_kill: true
  dbrepair_timeout: 7200
  stop_timeout: 90
  additional_envs: []

storage:
  logs_path: /opt/tests/mnt/plex-dbrepair/logs

resources:
  limits:
    cpus: 2
    memory: 4096
