{% set tpl = ix_lib.base.render.Render(values) %}
{% set app = tpl.add_container(values.consts.container_name, "image") %}

{% do tpl.notes.add_warning("Plex DB Repair is a one-shot maintenance job with host Docker socket access. Verify Plex backups before running it. The container intentionally exits after maintenance and must not use an automatic restart policy.") %}

{% do app.set_user(0, 0) %}
{% do app.healthcheck.disable() %}
{% do app.restart.set_policy("no") %}

{% do app.add_storage("/var/run/docker.sock", {"type": "host_path", "host_path_config": {"path": "/var/run/docker.sock", "acl_enable": false, "read_only": false}}) %}
{% do app.add_storage("/logs", {"type": "host_path", "host_path_config": {"path": values.storage.logs_path, "acl_enable": false}}) %}

{% do app.environment.add_env("DBREPAIR_MODE", values.app.mode) %}
{% do app.environment.add_env("PLEX_CONTAINER_NAME", values.app.plex_container_name) %}
{% do app.environment.add_env("ENABLE_BACKUPS", "true" if values.app.enable_backups else "false") %}
{% do app.environment.add_env("RESTART_PLEX", "true" if values.app.restart_plex else "false") %}
{% do app.environment.add_env("PRUNE_DAYS", values.app.prune_days) %}
{% do app.environment.add_env("PLEX_CONTAINER_MATCH", values.app.plex_container_match) %}
{% do app.environment.add_env("PLEX_MOUNT", values.app.plex_mount) %}
{% do app.environment.add_env("PLEX_REL", values.app.plex_relative_path) %}
{% do app.environment.add_env("ALLOW_PLEX_KILL", "true" if values.app.allow_plex_kill else "false") %}
{% do app.environment.add_env("DBREPAIR_TIMEOUT", values.app.dbrepair_timeout) %}
{% do app.environment.add_env("STOP_TIMEOUT", values.app.stop_timeout) %}

{% do app.environment.add_user_envs(values.app.additional_envs) %}

{{ tpl.render() | tojson }}
