{% set tpl = ix_lib.base.render.Render(values) %}
{% set app = tpl.add_container(values.consts.app_name, "image") %}
{% do app.set_user(0, 0) %}
{% do app.healthcheck.disable() %}
{% do app.add_storage("/var/run/docker.sock", {"type":"host_path","host_path_config":{"path":"/var/run/docker.sock","acl_enable":false,"read_only":false}}) %}
{% do app.add_storage("/logs", {"type":"host_path","host_path_config":{"path":values.storage.logs_path,"acl_enable":false}}) %}
{% do app.environment.add_env("DBREPAIR_MODE", "automatic") %}
{% do app.environment.add_env("PLEX_CONTAINER_NAME", "auto") %}
{% do app.environment.add_env("ENABLE_BACKUPS", "true") %}
{% do app.environment.add_env("RESTART_PLEX", "true") %}
{{ tpl.render() | tojson }}
