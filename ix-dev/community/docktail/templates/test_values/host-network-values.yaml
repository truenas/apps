ci: true

resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Etc/UTC

docktail:
  credentials_type: api_key
  api_key: tskey-api-test
  cloud_key: test-cloud-key
  additional_envs: []

network:
  host_network: true

storage:
  tailscale_socket:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/docktail/tailscale-socket
      create_host_path: true
  additional_storage: []
