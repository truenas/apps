ci: true

resources:
  limits:
    cpus: 2
    memory: 1024

TZ: Etc/UTC

docktail:
  credentials_type: oauth
  oauth_client_id: test-client-id
  oauth_client_secret: test-client-secret
  cloud_key: ""
  additional_envs: []

tailscale:
  mode: app
  socket_path: /opt/tests/mnt/docktail/tailscale-socket

labels:
  - key: org.example.render-test
    value: docktail
    containers:
      - docktail
