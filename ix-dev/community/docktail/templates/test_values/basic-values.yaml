ci: true

resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Etc/UTC

docktail:
  credentials_type: oauth
  oauth_client_id: test-client-id
  oauth_client_secret: test-client-secret
  cloud_key: ""
  additional_envs: []

network:
  host_network: false

storage:
  tailscale_socket:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/docktail/tailscale-socket
      create_host_path: true
  additional_storage: []
