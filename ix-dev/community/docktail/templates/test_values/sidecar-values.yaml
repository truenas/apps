ci: true

resources:
  limits:
    cpus: 2
    memory: 1024

TZ: Etc/UTC

docktail:
  credentials_type: none
  cloud_key: ""
  additional_envs: []

tailscale:
  mode: sidecar
  sidecar:
    auth_key: tskey-auth-render-test-not-a-real-key
    hostname: docktail-host
    advertise_tags:
      - tag:server
    host_network: true
    networks: []
    state:
      type: ix_volume
      ix_volume_config:
        dataset_name: state
        create_host_path: true

ix_volumes:
  state: /opt/tests/mnt/docktail/state

labels: []
