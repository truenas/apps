ci: true

resources:
  limits:
    cpus: 2
    memory: 1024

TZ: Etc/UTC

docktail:
  credentials_type: api_key
  api_key: tskey-api-render-test-not-a-real-key
  cloud_key: dtc_render_test_not_a_real_key
  additional_envs:
    - name: LOG_LEVEL
      value: debug
    - name: RECONCILE_INTERVAL
      value: 30s

tailscale:
  auth_key: tskey-auth-render-test-not-a-real-key
  hostname: docktail-api
  advertise_tags:
    - tag:server
    - tag:homelab

storage:
  state:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/docktail/host-state
      create_host_path: true

labels:
  - key: org.example.render-test
    value: docktail
    containers:
      - docktail
      - tailscale
