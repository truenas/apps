resources:
  limits:
    cpus: 2.0
    memory: 2048

nexus:
  java_heap: 1024
  additional_java_opts:
    - "-Djava.net.preferIPv4Stack=true"
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30452
  docker_ports:
    - bind_mode: published
      port_number: 30453
      container_port: 8082
  networks: []

ix_volumes:
  nexus-data: /opt/tests/mnt/nexus-data

storage:
  nexus_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: nexus-data
      create_host_path: true
  additional_storage: []