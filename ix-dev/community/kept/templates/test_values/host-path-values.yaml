TZ: America/New_York
resources:
  limits:
    cpus: 2
    memory: 1024
kept:
  additional_envs:
  - name: BASE_URL
    value: http://localhost:30898
  - name: KEPT_CORS_ORIGINS
    value: https://notes.example.test
network:
  host_network: false
  networks: []
  web_port:
    bind_mode: published
    port_number: 30898
    host_ips: []
run_as:
  user: 1000
  group: 1000
ix_volumes: {}
storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/kept-truenas/custom-data
      create_host_path: true
      auto_permissions: true
  additional_storage: []
labels:
- key: org.example.application
  value: kept
  containers:
  - kept
