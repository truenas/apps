{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.kept_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# TrueNAS initializes storage ownership; bypass the image's root-only ownership helper. #}
{% do c1.set_entrypoint(["node"]) %}
{% do c1.set_command(["server/server.js"]) %}
{% do c1.set_read_only(true) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64, "mode": "0700", "uid": values.run_as.user, "gid": values.run_as.group}}) %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/api/health", "busybox": true}) %}

{% do c1.environment.add_env("NODE_ENV", "production") %}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("DATA_DIR", values.consts.data_path) %}
{% do c1.environment.add_env("SQLITE_PATH", "%s/kept.sqlite"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("UPLOAD_DIR", "%s/uploads"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("ATTACHMENT_DIR", "%s/attachments"|format(values.consts.data_path)) %}
{% do c1.environment.add_env("TAKEOUT_TMP_DIR", "%s/imports/tmp"|format(values.consts.data_path)) %}
{% do c1.environment.add_user_envs(values.kept.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.add_info("Open the Web UI to create the first administrator account before exposing Kept to the internet.") %}

{{ tpl.render() | tojson }}
