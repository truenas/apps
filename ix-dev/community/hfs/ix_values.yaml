images:
  image:
    repository: rejetto/hfs
    tag: v3.3.1
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2
consts:
  hfs_container_name: hfs
  perms_container_name: permissions
basic_settings:
  run_as:
    user: 568
    group: 568
  hfs:
    additional_envs: []
  network:
    host_network: false
    web_port:
      bind_mode: published
      host_ips: []
    networks: []
  labels: []
  resources:
    limits:
      cpus: 2
      memory: 1024
  storage:
    shares:
      host_path_config:
        acl_enable: false
      type: host_path
