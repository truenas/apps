{# TrueNAS omits conditional fields, so basic mode supplies their defaults explicitly #}
{% if not values.advanced | default(false) %}
  {% do values.update(values.basic_settings) %}
  {% do values.storage.update({"config": values.basic_config_storage}) %}
{% endif %}
{# basic form fields share the same storage and network implementation as advanced settings #}
{% do values.network.web_port.update({"port_number": values.web_port}) %}
{% if values.storage.shares.type == "host_path" %}
  {% do values.storage.shares.host_path_config.update({"path": values.shared_folder}) %}
{% endif %}
{% set tpl = ix_lib.base.render.Render(values) %}
{% set c1 = tpl.add_container(values.consts.hfs_container_name, "image") %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.environment.add_env("HFS_CWD", "/data") %}
{% do c1.environment.add_env("HFS_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("HFS_INITIAL_ADMIN_PASSWORD", values.admin_password) %}
{% do c1.environment.add_user_envs(values.hfs.additional_envs) %}
{# file permissions and login requirements must not mark a running server unhealthy #}
{% do c1.healthcheck.set_test("tcp", {"port": values.network.web_port.port_number}) %}
{% do c1.add_port(values.network.web_port) %}
{% do c1.add_storage("/data", values.storage.config) %}
{% do c1.add_storage("/shares", values.storage.shares) %}
{% do perms.add_or_skip_action("config", values.storage.config, perms_config) %}
{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}
{% do tpl.portals.add(values.network.web_port, {"name": "Admin", "path": "/~/admin/"}) %}
{{ tpl.render() | tojson }}
