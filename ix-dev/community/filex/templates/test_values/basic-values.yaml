resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

filex:
  admin_email: admin@local
  admin_password: password
  secret_key: 0123456789abcdef0123456789abcdef
  public_url: http://localhost:8082
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8082

ix_volumes:
  data: /opt/tests/mnt/filex/data
  files: /opt/tests/mnt/filex/files

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  files:
    type: ix_volume
    ix_volume_config:
      dataset_name: files
      create_host_path: true
  additional_storage: []
