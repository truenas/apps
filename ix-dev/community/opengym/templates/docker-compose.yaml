{% set tpl = ix_lib.base.render.Render(values) %}

{% set app_url = values.opengym.app_url %}
{% set url = tpl.funcs.url_to_dict(app_url) %}
{% if url.path.rstrip("/") %}{% do tpl.funcs.fail("Public URL must not contain a path") %}{% endif %}

{% set opengym_net = tpl.networks.create_internal("opengym-net") %}

{% set api = tpl.add_container(values.consts.api_container_name, "image") %}
{% set web = tpl.add_container(values.consts.web_container_name, "web_image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do api.add_network(opengym_net) %}
{% do api.set_user(values.run_as.user, values.run_as.group) %}
{% do api.set_read_only(true) %}
{% do api.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64}}) %}
{% do api.healthcheck.set_test("wget", {"port": values.consts.api_port, "path": "/api/health", "busybox": true}) %}

{% do api.environment.add_env("NODE_ENV", "production") %}
{% do api.environment.add_env("PORT", values.consts.api_port) %}
{% do api.environment.add_env("DATA_DIR", values.consts.data_path) %}
{% do api.environment.add_env("ORIGIN", "%s://%s" | format(url.scheme, url.netloc)) %}
{% do api.environment.add_env("RP_ID", url.host) %}
{% do api.environment.add_env("RP_NAME", values.opengym.rp_name) %}
{# The API is only reachable through the web container, which overwrites the forwarding headers #}
{% do api.environment.add_env("TRUST_PROXY", "1") %}
{% do api.environment.add_env("FIRST_USER_ADMIN", "1" if values.opengym.first_user_admin else "0") %}
{% do api.environment.add_env("INVITE_ONLY", "1" if values.opengym.invite_only else "0") %}
{% do api.environment.add_env("ALLOW_GUEST", "1" if values.opengym.allow_guest else "0") %}
{% do api.environment.add_env("PASSWORD_LOGIN", "1" if values.opengym.password_login else "0") %}
{% do api.environment.add_user_envs(values.opengym.additional_envs) %}

{% do web.add_network(opengym_net) %}
{% do web.set_user(values.run_as.user, values.run_as.group) %}
{# nginx's entrypoint renders the template into conf.d; these are the only paths it writes #}
{% set web_tmpfs = {"type": "tmpfs", "tmpfs_config": {"size": 25, "uid": values.run_as.user, "gid": values.run_as.group}} %}
{% do web.add_storage("/tmp", web_tmpfs) %}
{% do web.add_storage("/var/cache/nginx", web_tmpfs) %}
{% do web.add_storage("/etc/nginx/conf.d", web_tmpfs) %}
{% do web.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{# Through the /api proxy, so a broken upstream (resolver, network, backend) shows up here too #}
{% do web.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/api/health", "busybox": true}) %}

{% do web.environment.add_env("NGINX_PORT", values.network.web_port.port_number) %}
{% do web.environment.add_env("BACKEND", values.consts.api_container_name) %}
{% do web.environment.add_env("PORT", values.consts.api_port) %}

{% do web.add_port(values.network.web_port) %}

{% do api.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do api.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do api.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
