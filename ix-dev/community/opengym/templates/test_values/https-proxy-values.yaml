resources:
  limits:
    cpus: 2.0
    memory: 4096

opengym:
  app_url: https://gym.example.com/
  rp_name: My Gym
  first_user_admin: true
  invite_only: true
  allow_guest: false
  password_login: true
  additional_envs:
    - name: SESSION_DAYS
      value: "30"

network:
  web_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: anonymous
      mount_path: /scratchpad
      volume_config:
        nocopy: true
