{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.printstash_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/api/v1/health"}) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_grace_period(60) %}

{% do c1.environment.add_env("VAULT_SETUP_MODE", values.printstash.setup_mode) %}
{% if values.printstash.setup_mode == "environment" %}
  {% do c1.environment.add_env("VAULT_SETUP_ADMIN_USERNAME", values.printstash.admin_username) %}
  {% do c1.environment.add_env("VAULT_SETUP_ADMIN_PASSWORD", values.printstash.admin_password) %}
  {% if values.printstash.admin_email %}
    {% do c1.environment.add_env("VAULT_SETUP_ADMIN_EMAIL", values.printstash.admin_email) %}
  {% endif %}
{% endif %}
{% do c1.environment.add_env("VAULT_RESTART_ENABLED", true) %}
{% do c1.environment.add_user_envs(values.printstash.additional_envs) %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
{% endif %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}

{{ tpl.render() | tojson }}
