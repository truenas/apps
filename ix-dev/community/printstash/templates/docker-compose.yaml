{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.printstash_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# PrintStash listens on 3000 inside the container and the port is fixed by its
   nginx config, so the published port is mapped onto it. #}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.add_port(values.network.web_port, {"container_port": 3000}) %}
{% do c1.healthcheck.set_test("curl", {"port": 3000, "path": "/api/v1/health"}) %}

{# The library passes TZ and PUID/PGID itself, from the Timezone answer and from
   set_user(). PUID/PGID are the identity the image's entrypoint checks before it
   migrates the database. #}
{# First administrator is created in the browser from a private address. #}
{% do c1.environment.add_env("VAULT_SETUP_MODE", "trusted_network") %}
{% do c1.environment.add_env("VAULT_RESTART_ENABLED", "true") %}
{% do c1.environment.add_user_envs(values.printstash.additional_envs) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
