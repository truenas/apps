resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

printstash:
  setup_mode: environment
  admin_username: admin
  admin_password: password1234
  admin_email: admin@example.com
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30880

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/printstash/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
