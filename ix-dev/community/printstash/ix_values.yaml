consts:
  printstash_container_name: printstash
  perms_container_name: permissions
  notes_body: |
    PrintStash asks you to create the first administrator account in the browser
    the first time you open it. Registration is only accepted from private
    addresses, so open the Web UI from your own network.

    Running behind a reverse proxy with TLS? Set `VAULT_SESSION_COOKIE_SECURE`
    and `FORWARDED_ALLOW_IPS` under Additional Environment Variables, and see
    https://printstash.org/docs/deployment

    Use a new, empty dataset for Data Storage. To reuse an existing PrintStash
    folder, set User ID and Group ID to the user and group that already own it.
