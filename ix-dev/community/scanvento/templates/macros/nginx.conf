{% macro nginx_conf(values) -%}
{%- set tls = values.network.certificate_id -%}
# Scanvento: reverse proxy in front of the API ({{ "HTTPS" if tls else "HTTP" }} on port {{ values.network.web_port.port_number }})
worker_processes 2;
# /tmp: runs as non-root on a read-only root file system
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile on;
    keepalive_timeout 65s;
    # imports (CSV/Excel, vulnerability feeds) can be large
    client_max_body_size 512m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml
               application/graphql-response+json application/problem+json image/svg+xml font/woff2;

    # Docker's embedded DNS: re-resolves the API after it was recreated
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

{%- if not tls %}
    # Plain HTTP: usually behind a TLS reverse proxy, keep the scheme it reports
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
{%- endif %}

    upstream scanvento_api {
        zone scanvento_api 64k;
        server {{ "%s:%d" | format(values.consts.scanvento_container_name, values.consts.internal_api_port) }} resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

    server {
{%- if tls %}
        listen {{ values.network.web_port.port_number }} ssl default_server;
        http2 on;
        ssl_certificate     {{ values.consts.ssl_cert_path }};
        ssl_certificate_key {{ values.consts.ssl_key_path }};
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # plain HTTP sent to the TLS port: redirect instead of "400 The plain HTTP request was sent to HTTPS port"
        error_page 497 =301 https://$http_host$request_uri;
{%- else %}
        listen {{ values.network.web_port.port_number }} default_server;
{%- endif %}
        server_name _;

{%- if tls %}
        add_header Strict-Transport-Security "max-age=31536000" always;
{%- endif %}
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Request-Id $request_id always;

        proxy_http_version 1.1;
        # $http_host keeps a non-standard port in redirects and generated links
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto {{ "$scheme" if tls else "$forwarded_proto" }};
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;

        # SignalR (live updates)
        location /hubs/ {
            proxy_pass http://scanvento_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://scanvento_api;
        }

        location ~ ^/api/(import|vulnerabilities/feeds/import|warranty/import) {
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_pass http://scanvento_api;
        }

        # Prometheus metrics stay inside the app network
        location = /metrics {
            return 404;
        }

        location /assets/ {
            proxy_pass http://scanvento_api;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
{%- if tls %}
            add_header Strict-Transport-Security "max-age=31536000" always;
{%- endif %}
        }

        location / {
            proxy_pass http://scanvento_api;
        }
    }
}
{%- endmacro %}
