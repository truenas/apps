{% from "macros/nginx.conf" import nginx_conf %}
{% set tpl = ix_lib.base.render.Render(values) %}

{% set sv_net = tpl.networks.create_internal("scanvento-net") %}
{% set url = tpl.funcs.url_to_dict(values.scanvento.public_url) %}
{% set public_url = "%s://%s" | format(url.scheme, url.netloc) %}
{% set api_image = "%s:%s" | format(values.images.image.repository, values.images.image.tag) %}
{% set backups_enabled = values.scanvento.backup.enabled or values.scanvento.backup.pre_upgrade %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{# -- Postgres (library helper, incl. the major version upgrade one-shot) -- #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.scanvento.db_password,
  "database": values.consts.db_name,
  "port": values.consts.db_port,
  "volume": values.storage.postgres_data,
  "additional_options": {
    "shared_preload_libraries": "pg_stat_statements",
    "shared_buffers": "256MB",
    "effective_cache_size": "768MB",
    "work_mem": "8MB",
    "maintenance_work_mem": "128MB",
    "wal_compression": "on",
    "log_min_duration_statement": "1000",
  },
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.scanvento.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(sv_net) %}

{# -- Valkey: cache and SignalR backplane, not persisted -- #}
{% set redis_config = {
  "password": values.scanvento.redis_password,
  "volume": {"type": "temporary", "volume_config": {"volume_name": "valkey-data"}},
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(sv_net) %}

{# -- Scanvento API and its migrate one-shot (same image) -- #}
{% set api = tpl.add_container(values.consts.scanvento_container_name, "image") %}
{% set migrate = tpl.add_container(values.consts.migrate_container_name, "image") %}

{% set db_conn = "Host=%s;Port=%d;Database=%s;Username=%s;Password=%s;Maximum Pool Size=50" | format(
  values.consts.postgres_container_name, values.consts.db_port, values.consts.db_name, values.consts.db_user, values.scanvento.db_password
) %}
{% set redis_conn = "%s:%d,password=%s,abortConnect=false" | format(
  values.consts.redis_container_name, redis.get_port(), values.scanvento.redis_password
) %}

{% for c in [api, migrate] %}
  {% do c.add_network(sv_net) %}
  {% do c.set_user(values.consts.api_user, values.consts.api_user) %}
  {% do c.set_read_only(true) %}
  {% do c.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 256}}) %}
  {% do c.remove_devices() %}

  {% do c.environment.add_env("ASPNETCORE_HTTP_PORTS", values.consts.internal_api_port) %}
  {% do c.environment.add_env("SV_ConnectionStrings__Default", db_conn) %}
  {% do c.environment.add_env("SV_ConnectionStrings__Redis", redis_conn) %}
  {% do c.environment.add_env("SV_Jwt__SigningKey", values.scanvento.jwt_signing_key) %}
  {% do c.environment.add_env("SV_Encryption__MasterKey", values.scanvento.encryption_master_key) %}
  {% do c.environment.add_env("SV_Authentication__Passkeys__ServerDomain", url.host) %}
  {% do c.environment.add_env("SV_Cors__Origins__0", public_url) %}
  {% do c.environment.add_env("SV_Monitoring__PublicBaseUrl", public_url) %}
  {% do c.environment.add_env("SV_Labels__BaseUrl", public_url) %}
  {% do c.environment.add_env("SV_Logging__Console__FormatterName", "json") %}
  {# X-Forwarded-* only from the app network (nginx) #}
  {% do c.environment.add_env("SV_ForwardedHeaders__KnownNetworks__0", "172.16.0.0/12") %}
  {% do c.environment.add_env("SV_ForwardedHeaders__KnownNetworks__1", "192.168.0.0/16") %}
  {# Small host: workstation GC keeps the API around 300-600 MB instead of one heap per CPU core #}
  {% do c.environment.add_env("DOTNET_gcServer", "0") %}
  {% do c.environment.add_user_envs(values.scanvento.additional_envs | selectattr("container", "equalto", "scanvento") | list) %}

  {% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% endfor %}

{# Migrations and seed data (incl. the first administrator), before the API starts #}
{% do migrate.setup_as_helper(profile="medium", disable_network=false) %}
{% do migrate.set_command(["--migrate-only"]) %}
{% do migrate.environment.add_env("SV_Bootstrap__AdminUser", values.scanvento.admin_user) %}
{% do migrate.environment.add_env("SV_Bootstrap__AdminPassword", values.scanvento.admin_password) %}
{% if values.scanvento.admin_email %}
  {% do migrate.environment.add_env("SV_Bootstrap__AdminEmail", values.scanvento.admin_email) %}
{% endif %}
{% if values.scanvento.reset_admin_password %}
  {% do migrate.environment.add_env("SV_Bootstrap__ResetAdminPassword", "true") %}
{% endif %}

{% do api.environment.add_env("SV_Database__SkipInitialization", "true") %}
{% do api.environment.add_env("HEALTHCHECK_URL", "http://127.0.0.1:%d/health/live" | format(values.consts.internal_api_port)) %}
{% do api.healthcheck.set_custom_test(["CMD", "/usr/local/bin/healthcheck"]) %}
{% do api.healthcheck.set_start_period(90) %}
{% do api.depends.add_dependency(values.consts.migrate_container_name, "service_completed_successfully") %}
{% do api.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% do api.expose.add_port(values.consts.internal_api_port) %}

{% for store in values.storage.additional_storage %}
  {% do api.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, {"uid": values.consts.api_user, "gid": values.consts.api_user, "mode": "check"}) %}
{% endfor %}

{# -- Database dumps: before the migrations of an update, and daily -- #}
{% if backups_enabled %}
  {% set backup_perms = {"uid": values.consts.postgres_user, "gid": values.consts.postgres_user, "mode": "check"} %}
  {% do perm_container.add_or_skip_action("backups", values.storage.backups, backup_perms) %}
  {% set backup_containers = [] %}

  {% if values.scanvento.backup.pre_upgrade %}
    {% set pre = tpl.add_container(values.consts.pre_upgrade_backup_container_name, values.scanvento.postgres_image_selector) %}
    {% do pre.setup_as_helper(profile="low", disable_network=false) %}
    {% do pre.environment.add_env("TARGET", api_image) %}
    {% do pre.environment.add_env("KEEP", values.scanvento.backup.pre_upgrade_keep) %}
    {% do pre.set_entrypoint(["/bin/sh", "-c"]) %}
    {% do pre.set_command(["
set -eu
fresh=$(psql -tAc \"select to_regclass('public.\\\"__EFMigrationsHistory\\\"') is null\")
if [ \"$fresh\" = t ]; then echo \"$TARGET\" > /backups/.pre-upgrade-image; echo 'new database: no pre-update backup needed'; exit 0; fi
last=$(cat /backups/.pre-upgrade-image 2>/dev/null || true)
if [ \"$last\" = \"$TARGET\" ]; then echo \"image unchanged ($TARGET): no pre-update backup\"; exit 0; fi
f=/backups/pre-upgrade-$(date +%Y%m%d-%H%M%S).dump
if ! pg_dump --format=custom --compress=6 -f \"$f.part\"; then
  rm -f \"$f.part\"
  echo 'pre-update backup FAILED - migrations are not applied, the database is unchanged' >&2
  exit 1
fi
mv \"$f.part\" \"$f\" && echo \"$TARGET\" > /backups/.pre-upgrade-image && echo \"pre-update backup $f\"
ls -1t /backups/pre-upgrade-*.dump | tail -n +$((KEEP + 1)) | xargs -r rm -f
"]) %}
    {% do migrate.depends.add_dependency(values.consts.pre_upgrade_backup_container_name, "service_completed_successfully") %}
    {% do backup_containers.append(pre) %}
  {% endif %}

  {% if values.scanvento.backup.enabled %}
    {% set daily = tpl.add_container(values.consts.backup_container_name, values.scanvento.postgres_image_selector) %}
    {% do daily.deploy.resources.set_profile("low") %}
    {% do daily.environment.add_env("RETENTION_DAYS", values.scanvento.backup.retention_days) %}
    {% do daily.healthcheck.set_test("postgres", {
      "host": values.consts.postgres_container_name, "port": values.consts.db_port,
      "user": values.consts.db_user, "db": values.consts.db_name,
    }) %}
    {% do daily.set_entrypoint(["/bin/sh", "-c"]) %}
    {% do daily.set_command(["
while :; do
  f=/backups/$PGDATABASE-$(date +%Y%m%d-%H%M%S).dump
  if pg_dump --format=custom --compress=6 -f \"$f.part\"; then
    mv \"$f.part\" \"$f\" && echo \"backup $f\"
  else
    rm -f \"$f.part\"; echo 'backup FAILED' >&2
  fi
  find /backups -maxdepth 1 -name \"$PGDATABASE-*.dump\" -mtime +$RETENTION_DAYS -delete
  sleep 86400
done
"]) %}
    {% do daily.depends.add_dependency(values.consts.migrate_container_name, "service_completed_successfully") %}
    {% do backup_containers.append(daily) %}
  {% endif %}

  {% for c in backup_containers %}
    {% do c.add_network(sv_net) %}
    {% do c.set_user(values.consts.postgres_user, values.consts.postgres_user) %}
    {% do c.set_read_only(true) %}
    {% do c.add_storage("/tmp", {"type": "tmpfs"}) %}
    {% do c.remove_devices() %}
    {% do c.environment.add_env("PGHOST", values.consts.postgres_container_name) %}
    {% do c.environment.add_env("PGPORT", values.consts.db_port) %}
    {% do c.environment.add_env("PGUSER", values.consts.db_user) %}
    {% do c.environment.add_env("PGDATABASE", values.consts.db_name) %}
    {% do c.environment.add_env("PGPASSWORD", values.scanvento.db_password) %}
    {% do c.add_storage(values.consts.backups_path, values.storage.backups) %}
    {% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
  {% endfor %}
{% endif %}

{# -- nginx: the WebUI port, HTTPS with the selected TrueNAS certificate, else plain HTTP -- #}
{% set nginx = tpl.add_container(values.consts.nginx_container_name, "nginx_image") %}
{% do nginx.add_network(sv_net) %}
{% do nginx.set_user(values.consts.nginx_user, values.consts.nginx_user) %}
{% do nginx.remove_devices() %}
{% do nginx.set_read_only(true) %}
{% do nginx.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"uid": values.consts.nginx_user, "gid": values.consts.nginx_user}}) %}
{% do nginx.add_storage("/var/cache/nginx", {"type": "tmpfs", "tmpfs_config": {"uid": values.consts.nginx_user, "gid": values.consts.nginx_user}}) %}
{% do nginx.configs.add("nginx.conf", nginx_conf(values), "/etc/nginx/nginx.conf") %}
{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do nginx.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do nginx.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
{% endif %}
{% do nginx.healthcheck.set_test("curl", {
  "port": values.network.web_port.port_number, "path": "/health/live",
  "scheme": "https" if values.network.certificate_id else "http",
}) %}
{% do nginx.add_port(values.network.web_port) %}
{% do nginx.depends.add_dependency(values.consts.scanvento_container_name, "service_healthy") %}

{# -- Optional discovery collector -- #}
{% if values.scanvento.collector.enabled %}
  {% set col_cfg = values.scanvento.collector %}
  {% if not col_cfg.key %}
    {% do tpl.funcs.fail("Expected [Collector Key] to be set when the collector is enabled") %}
  {% endif %}
  {% set col = tpl.add_container(values.consts.collector_container_name, "collector_image") %}
  {% do col.remove_devices() %}
  {% do col.set_read_only(true) %}
  {% do col.add_storage("/tmp", {"type": "tmpfs"}) %}
  {% do col.environment.add_env("SV_Collector__ApiKey", col_cfg.key) %}
  {% do col.environment.add_env("SV_Collector__Name", col_cfg.name or "truenas") %}
  {# App network only, as a non-root user: scans by routing (TCP/UDP probes, SNMP, WMI/SSH …). ARP tables, ICMP sweeps of the
     NAS's own segments and passive listening need a collector on the host network – install it separately (see README). #}
  {% do col.add_network(sv_net) %}
  {% do col.set_user(values.consts.api_user, values.consts.api_user) %}
  {% do col.environment.add_env("SV_Collector__ServerUrl", "http://%s:%d" | format(values.consts.scanvento_container_name, values.consts.internal_api_port)) %}
  {% do col.environment.add_env("SV_Collector__AllowHttp", "true") %}
  {% do col.depends.add_dependency(values.consts.scanvento_container_name, "service_healthy") %}
  {# The image has no HTTP endpoint; liveness is the running process #}
  {% do col.healthcheck.disable() %}
  {% do col.environment.add_user_envs(values.scanvento.additional_envs | selectattr("container", "equalto", "collector") | list) %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do api.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https" if values.network.certificate_id else "http"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
