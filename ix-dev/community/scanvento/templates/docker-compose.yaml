{% set tpl = ix_lib.base.render.Render(values) %}

{% set sv_net = tpl.networks.create_internal("scanvento-net") %}
{% set url = tpl.funcs.url_to_dict(values.scanvento.public_url) %}
{% set public_url = "%s://%s" | format(url.scheme, url.netloc) %}
{% set web_port = values.network.web_port.port_number %}
{% set https = values.network.certificate_id != None %}

{% if https and web_port == values.consts.internal_http_port %}
  {% do tpl.funcs.fail("Expected [WebUI Port] to not be [%d] when a certificate is selected" | format(values.consts.internal_http_port)) %}
{% endif %}

{# Plain HTTP port the API listens on inside the app network (healthcheck, collector) #}
{% set http_port = values.consts.internal_http_port if https else web_port %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.scanvento.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.scanvento.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(sv_net) %}

{% set redis_config = {
  "password": values.scanvento.redis_password,
  "volume": {"type": "temporary", "volume_config": {"volume_name": "valkey-data"}},
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(sv_net) %}

{% set api = tpl.add_container(values.consts.scanvento_container_name, "image") %}
{% set migrate = tpl.add_container(values.consts.migrate_container_name, "image") %}

{% for c in [api, migrate] %}
  {% do c.add_network(sv_net) %}
  {% do c.set_user(values.consts.app_user, values.consts.app_user) %}
  {% do c.environment.add_env("SV_ConnectionStrings__Default", postgres.get_url("dotnet_pgsql")) %}
  {% do c.environment.add_env("SV_ConnectionStrings__Redis", "%s:%d,password=%s,abortConnect=false" | format(values.consts.redis_container_name, redis.get_port(), values.scanvento.redis_password)) %}
  {% do c.environment.add_env("SV_Jwt__SigningKey", values.scanvento.jwt_signing_key) %}
  {% do c.environment.add_env("SV_Encryption__MasterKey", values.scanvento.encryption_master_key) %}
  {% do c.environment.add_env("SV_Authentication__Passkeys__ServerDomain", url.host) %}
  {% do c.environment.add_env("SV_Cors__Origins__0", public_url) %}
  {% do c.environment.add_env("SV_Monitoring__PublicBaseUrl", public_url) %}
  {% do c.environment.add_env("SV_Labels__BaseUrl", public_url) %}
  {% do c.environment.add_user_envs(values.scanvento.additional_envs) %}
  {% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
  {% do c.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% endfor %}

{# Migrations and the first administrator, before the API starts #}
{% do migrate.setup_as_helper(profile="medium", disable_network=false) %}
{% do migrate.set_command(["--migrate-only"]) %}
{% do migrate.environment.add_env("SV_Bootstrap__AdminUser", values.scanvento.admin_user) %}
{% do migrate.environment.add_env("SV_Bootstrap__AdminPassword", values.scanvento.admin_password) %}
{% if values.scanvento.admin_email %}
  {% do migrate.environment.add_env("SV_Bootstrap__AdminEmail", values.scanvento.admin_email) %}
{% endif %}
{% if values.scanvento.reset_admin_password %}
  {% do migrate.environment.add_env("SV_Bootstrap__ResetAdminPassword", true) %}
{% endif %}

{% do api.environment.add_env("SV_Database__SkipInitialization", true) %}
{% do api.environment.add_env("ASPNETCORE_HTTP_PORTS", http_port) %}
{% if https %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do api.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do api.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
  {% do api.environment.add_env("ASPNETCORE_HTTPS_PORTS", web_port) %}
  {% do api.environment.add_env("Kestrel__Certificates__Default__Path", values.consts.ssl_cert_path) %}
  {% do api.environment.add_env("Kestrel__Certificates__Default__KeyPath", values.consts.ssl_key_path) %}
{% endif %}
{% do api.healthcheck.set_custom_test(["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:%d/health/live" | format(http_port)]) %}
{% do api.depends.add_dependency(values.consts.migrate_container_name, "service_completed_successfully") %}
{% do api.add_port(values.network.web_port) %}

{% for store in values.storage.additional_storage %}
  {% do api.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, {"uid": values.consts.app_user, "gid": values.consts.app_user, "mode": "check"}) %}
{% endfor %}

{% if values.scanvento.collector.enabled %}
  {% set col = tpl.add_container(values.consts.collector_container_name, "collector_image") %}
  {% do col.add_network(sv_net) %}
  {% do col.set_user(values.consts.app_user, values.consts.app_user) %}
  {% do col.environment.add_env("SV_Collector__ServerUrl", "http://%s:%d" | format(values.consts.scanvento_container_name, http_port)) %}
  {% do col.environment.add_env("SV_Collector__AllowHttp", "true") %}
  {% do col.environment.add_env("SV_Collector__ApiKey", values.scanvento.collector.key) %}
  {% do col.environment.add_env("SV_Collector__Name", values.scanvento.collector.name) %}
  {% do col.environment.add_user_envs(values.scanvento.collector.additional_envs) %}
  {# The collector has no listening port to probe #}
  {% do col.healthcheck.disable() %}
  {% do col.depends.add_dependency(values.consts.scanvento_container_name, "service_healthy") %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do api.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "https" if https else "http"}) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
