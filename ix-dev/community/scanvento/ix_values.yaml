consts:
  scanvento_container_name: scanvento
  migrate_container_name: migrate
  collector_container_name: collector
  postgres_container_name: postgres
  redis_container_name: valkey
  perms_container_name: permissions

  db_user: scanvento
  db_name: scanvento
  # Fixed non-root user of the Scanvento images ("app" of the .NET base images)
  app_user: 1654
  # Plain HTTP port inside the app network (collector, healthcheck) when the WebUI port uses HTTPS
  internal_http_port: 8080
  ssl_cert_path: /etc/scanvento/certs/tls.crt
  ssl_key_path: /etc/scanvento/certs/tls.key

  notes_body: |
    Sign in with the administrator user name and password entered during the installation.

    Keep a copy of the **Encryption Master Key** outside the NAS (e.g. in a password manager):
    stored credentials cannot be decrypted without it, and it must not be changed after the first start.
