{% from "macros/config.hcl.jinja" import config_hcl %}
{% from "macros/fluent-bit.yaml.jinja" import fluent_bit_yaml %}
{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.vault_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set cluster = values.vault.cluster %}
{% set scheme = "https" if values.network.certificate_id else "http" %}
{% set local_addr = "%s://127.0.0.1:%d" | format(scheme, values.network.web_port.port_number) %}

{% if cluster.enabled %}
  {% if values.network.web_port.bind_mode != "published" or values.network.cluster_port.bind_mode != "published" %}
    {% do tpl.funcs.fail("Raft clustering requires both the API and Cluster ports to be published.") %}
  {% endif %}
  {% set api_addr = values.vault.api_addr or "%s://%s:%d" | format(scheme, cluster.advertise_host, values.network.web_port.port_number) %}
  {% set cluster_addr = "https://%s:%d" | format(cluster.advertise_host, values.network.cluster_port.port_number) %}
{% else %}
  {% set api_addr = values.vault.api_addr or local_addr %}
  {% set cluster_addr = "https://127.0.0.1:%d" | format(values.network.cluster_port.port_number) %}
{% endif %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# Bypass the image entrypoint, it passes its own -config dir and tries to setcap/chown as root #}
{% do c1.set_entrypoint(["vault"]) %}
{% do c1.set_command(["server", "-config=%s" | format(values.consts.config_path)]) %}
{# Report healthy while uninitialized or sealed, so the user can reach the UI to init/unseal #}
{% do c1.healthcheck.set_test("wget", {
  "port": values.network.web_port.port_number,
  "path": "/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true",
  "scheme": scheme,
  "busybox": true,
}) %}

{% do c1.configs.add("config", config_hcl(values, scheme, api_addr, cluster_addr), values.consts.config_path) %}
{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("private", cert.privatekey, values.consts.ssl_key_path) %}
  {% do c1.configs.add("public", cert.certificate, values.consts.ssl_cert_path) %}
  {# Only affects the vault CLI inside the container, the certificate will not be issued for 127.0.0.1 #}
  {% do c1.environment.add_env("VAULT_SKIP_VERIFY", "true") %}
{% endif %}
{% if cluster.enabled and cluster.leader_ca_cert %}
  {% do c1.configs.add("peer_ca", cluster.leader_ca_cert, values.consts.peer_ca_cert_path) %}
{% endif %}

{# So that `vault` CLI commands run in the container reach the local server #}
{% do c1.environment.add_env("VAULT_ADDR", local_addr) %}
{# The run_as user has no home in the image, `vault login` would fail to store its token in / #}
{% do c1.environment.add_env("HOME", "/tmp") %}
{% do c1.environment.add_user_envs(values.vault.additional_envs) %}
{% do c1.add_port(values.network.web_port) %}
{% if cluster.enabled %}
  {% do c1.add_port(values.network.cluster_port) %}
{% endif %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_storage(values.consts.audit_path, values.storage.audit) %}
{% do perm_container.add_or_skip_action("audit", values.storage.audit, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if values.vault.audit_forwarding.enabled %}
  {% set fwd = tpl.add_container(values.consts.audit_forwarder_container_name, "fluent_bit_image") %}
  {% do fwd.set_user(values.run_as.user, values.run_as.group) %}
  {# The image is distroless, there is no shell or http client to probe it with #}
  {% do fwd.healthcheck.disable() %}
  {% do fwd.set_entrypoint(["/fluent-bit/bin/fluent-bit"]) %}
  {% do fwd.set_command(["--config", values.consts.fluent_bit_config_path]) %}
  {% do fwd.configs.add("fluent_bit_config", fluent_bit_yaml(values, cluster.node_id if cluster.enabled else "vault"), values.consts.fluent_bit_config_path) %}
  {% do fwd.add_storage(values.consts.audit_path, values.storage.audit) %}
  {% do fwd.depends.add_dependency(values.consts.vault_container_name, "service_started") %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.add_info("Vault starts uninitialized and sealed. Initialize it once from the Web UI or with `vault operator init`, and store the unseal keys and root token somewhere safe. Vault must be unsealed again after every restart.") %}
{% if cluster.enabled %}
  {% do tpl.notes.add_info("Raft clustering is enabled. Initialize only one node, the others join it automatically once it is unsealed. Unseal every node with the same unseal keys, and check membership with `vault operator raft list-peers`.") %}
{% endif %}
{% do tpl.notes.add_info("To record audit logs, enable the file audit device once (it applies to every node in a cluster): `vault audit enable file file_path=%s/%s`. Vault refuses requests it cannot audit, so keep the audit storage available." | format(values.consts.audit_path, values.consts.audit_file)) %}

{% if values.vault.ui %}
  {% do tpl.portals.add(values.network.web_port, {"scheme": scheme, "path": "/ui/"}) %}
{% endif %}

{{ tpl.render() | tojson }}
