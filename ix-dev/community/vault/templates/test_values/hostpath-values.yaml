resources:
  limits:
    cpus: 2.0
    memory: 4096

vault:
  ui: false
  log_level: debug
  api_addr: https://vault.example.com
  cluster:
    enabled: false
    node_id: ""
    advertise_host: ""
    retry_join: []
    leader_ca_cert: ""
    leader_tls_servername: ""
  audit_forwarding:
    enabled: false
    host: ""
    port: 514
    mode: udp
    tls_verify: true
    format: rfc5424
  additional_envs: []
network:
  certificate_id: null
  web_port:
    bind_mode: published
    port_number: 8300
  cluster_port:
    bind_mode: published
    port_number: 8301

run_as:
  user: 568
  group: 568

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/vault-data
      create_host_path: true
      auto_permissions: true
  audit:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/vault-audit
      create_host_path: true
      auto_permissions: true
  additional_storage:
    - type: host_path
      mount_path: /vault/plugins
      read_only: true
      host_path_config:
        path: /opt/tests/mnt/vault-plugins
        create_host_path: true
        auto_permissions: true
