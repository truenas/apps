resources:
  limits:
    cpus: 2.0
    memory: 4096

vault:
  ui: false
  log_level: debug
  api_addr: https://vault.example.com
  additional_envs: []
network:
  certificate_id: null
  web_port:
    bind_mode: published
    port_number: 8200

run_as:
  user: 568
  group: 568

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/vault-data
      create_host_path: true
      auto_permissions: true
  additional_storage:
    - type: anonymous
      mount_path: /scratchpad
      volume_config:
        nocopy: true
