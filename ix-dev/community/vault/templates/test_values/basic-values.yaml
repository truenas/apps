resources:
  limits:
    cpus: 2.0
    memory: 4096

vault:
  ui: true
  log_level: info
  api_addr: ""
  cluster:
    enabled: false
    node_id: ""
    advertise_host: ""
    retry_join: []
    leader_ca_cert: ""
    leader_tls_servername: ""
  audit_forwarding:
    enabled: false
    host: ""
    port: 514
    mode: udp
    tls_verify: true
    format: rfc5424
  additional_envs: []
network:
  certificate_id: null
  web_port:
    bind_mode: published
    port_number: 8300
  cluster_port:
    bind_mode: published
    port_number: 8301

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data
  audit: /opt/tests/mnt/audit

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  audit:
    type: ix_volume
    ix_volume_config:
      dataset_name: audit
      create_host_path: true
  additional_storage: []
