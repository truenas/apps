{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.comfyui_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% do c1.set_user(0, 0) %}

{% do c1.environment.add_env("CLI_ARGS", values.comfyui.cli_args) %}
{% do c1.environment.add_user_envs(values.comfyui.additional_envs) %}

{% do c1.add_storage("/app/ComfyUI/models", values.storage.models) %}
{% do c1.add_storage("/app/ComfyUI/input", values.storage.input) %}
{% do c1.add_storage("/app/ComfyUI/output", values.storage.output) %}
{% do c1.add_storage("/app/ComfyUI/user/default/workflows", values.storage.workflows) %}
{% do c1.add_storage("/app/ComfyUI/custom_nodes", values.storage.custom_nodes) %}
{% do c1.add_storage("/app/ComfyUI/user", values.storage.user) %}
{% do c1.add_storage("/root/.cache/huggingface/hub", values.storage.hf_cache) %}
{% do c1.add_storage("/root/.cache/torch/hub", values.storage.torch_cache) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do c1.add_port(values.network.webui_port) %}
{% do tpl.portals.add(values.network.webui_port) %}

{% do c1.healthcheck.set_test("tcp", {"port": values.network.webui_port.port_number}) %}

{{ tpl.render() | tojson }}
