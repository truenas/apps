consts:
  scryer_container_name: scryer
  perms_container_name: permissions
  internal_web_port: 8080
  password_path: /run/secrets/scryer_admin_password
  notes_body: |
    Sign in with the configured administrator username and the password from your
    bootstrap file. Scryer requires changing this temporary password at first login.
    Keep the file readable by the configured UID/GID on subsequent starts; it does
    not reset an existing password.

    Use /data/downloads and /data/movies, /data/series, or /data/anime inside Scryer.
    Mount the same dataset at /data in your download client. Hardlinks require
    ordinary subdirectories on the same filesystem, not separate child datasets.
    This app does not change permissions on your media or password file.

    Back up the entire /config directory, including scryer.db and encryption.key.
    Stop Scryer before a filesystem copy, or use its built-in backup facility.
    Restore logical backups to the same Scryer version before upgrading.
    Upgrade through TrueNAS, not inside the container.

    For permanent installations, prefer a dedicated host-path configuration dataset.
    Selecting Remove iXVolumes during app deletion destroys ixVolume configuration
    data. Host-path data is not removed or rolled back by TrueNAS app operations.
