ci: true
resources:
  limits:
    cpus: 2
    memory: 2048
scryer:
  admin_username: admin
  admin_password_file: /opt/tests/scryer/basic/bootstrap-password
  public_url: ""
run_as:
  user: 568
  group: 568
network:
  web_port:
    bind_mode: published
    port_number: 30543
    host_ips: []
ix_volumes:
  config: /opt/tests/scryer/basic/config
storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/scryer/basic/data
      create_host_path: true
