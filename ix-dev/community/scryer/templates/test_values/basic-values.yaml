resources:
  limits:
    cpus: 2.0
    memory: 4096

scryer:
  admin_username: admin
  admin_password: Scryer-CI-only-not-a-secret-42
  public_url: ""
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage:
    - type: host_path
      mount_path: /data
      host_path_config:
        path: /opt/tests/mnt/data
        create_host_path: true
        auto_permissions: true
