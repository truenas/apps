ci: true
resources:
  limits:
    cpus: 2
    memory: 2048
scryer:
  admin_username: scryer-admin
  admin_password_file: /opt/tests/scryer/host-path/bootstrap-password
  public_url: https://scryer.example.com
run_as:
  user: 1000
  group: 1000
network:
  web_port:
    bind_mode: published
    port_number: 30543
    host_ips:
      - 127.0.0.1
storage:
  config:
    type: host_path
    host_path_config:
      path: /opt/tests/scryer/host-path/config
      create_host_path: true
      auto_permissions: true
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/scryer/host-path/data
      create_host_path: true
