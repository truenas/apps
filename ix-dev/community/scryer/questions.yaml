groups:
  - name: Scryer Configuration
    description: Configure Scryer
  - name: User and Group Configuration
    description: Configure the identity used to access configuration and shared media
  - name: Network Configuration
    description: Configure network access to Scryer
  - name: Storage Configuration
    description: Configure persistent storage for Scryer
  - name: Resources Configuration
    description: Configure resources for Scryer

questions:
  - variable: TZ
    label: Timezone
    group: Scryer Configuration
    schema:
      type: string
      default: Etc/UTC
      $ref:
        - definitions/timezone
  - variable: scryer
    label: ""
    group: Scryer Configuration
    schema:
      type: dict
      attrs:
        - variable: admin_username
          label: Bootstrap Administrator Username
          description: Used to create the administrator on a fresh installation.
          schema:
            type: string
            required: true
            default: admin
        - variable: admin_password_file
          label: Bootstrap Password File
          description: |
            Absolute host path to an existing plain-text file containing a strong,
            unique temporary password. This is a file, not a directory.
            Grant the configured UID/GID read access and directory traversal;
            restrict access by other users. It is mounted read-only and must remain
            available on every start. Its contents are not stored in app settings.
            The password must be changed at first login. Changing this file does
            not reset the password of an existing administrator.
          schema:
            type: path
            required: true
        - variable: public_url
          label: Public URL (Optional)
          description: |
            Browser-facing origin, for example https://scryer.example.com when using
            a reverse proxy. This does not enable HTTPS inside Scryer.
          schema:
            type: string
            default: ""

  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          description: Must have access to configuration, media, and the password file.
          schema:
            type: int
            min: 568
            default: 568
            required: true
        - variable: group
          label: Group ID
          description: Use a shared media group when working with a download client.
          schema:
            type: int
            min: 568
            default: 568
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  Publish allows host access. Expose allows container-network access.
                  None disables explicit port mappings; the image still exposes port 8080.
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30543
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: |
                  Restrict access to selected host addresses. Empty binds on all
                  host addresses. Use a trusted network or an HTTPS reverse proxy.
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          description: Existing Docker networks to join, for example a reverse proxy network.
          schema:
            type: list
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      description: The Docker network must already exist.
                      schema:
                        type: string
                        required: true
                    - variable: containers
                      label: Containers
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: scryer
                                        description: Scryer
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases (Optional)
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: config
          label: Configuration Storage
          description: |
            Mounted at /config. Contains SQLite, encryption.key, backups and runtime
            data. Use local storage, not SMB/NFS. For permanent installations prefer
            a dedicated host-path dataset and back up the entire directory.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: ix_volume
                      description: ixVolume (automatically created dataset)
                    - value: host_path
                      description: Host Path (existing dataset)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: config
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
                    - variable: auto_permissions
                      label: Automatic Permissions
                      description: |
                        Initialize ownership of an empty configuration directory.
                        Does not recursively change existing files. Otherwise grant
                        the configured UID/GID access before starting the app.
                      schema:
                        type: boolean
                        show_if: [["acl_enable", "=", false]]
                        default: false
        - variable: data
          label: Media and Downloads Storage
          description: |
            One existing parent dataset mounted at /data. Use ordinary subdirectories
            such as downloads, movies and series; separate child datasets prevent
            hardlinks. Use the same /data mapping in the download client. Grant the
            configured UID/GID appropriate read/write and traversal permissions.
            Scryer packaging never automatically changes ownership of this storage.
            New files use umask 002 for group sharing.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: host_path
                  hidden: true
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  min: 1
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                schema:
                  type: int
                  min: 512
                  default: 2048
                  required: true
