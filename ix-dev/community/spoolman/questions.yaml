groups:
  - name: Spoolman Configuration
    description: Configure Spoolman.
  - name: Network Configuration
    description: Configure the web interface.
  - name: Storage Configuration
    description: Configure persistent Spoolman storage.
  - name: Resources Configuration
    description: Configure compute resources.

questions:
  - variable: TZ
    label: Timezone
    group: Spoolman Configuration
    schema:
      type: string
      default: Europe/Vienna
      required: true
      $ref:
        - definitions/timezone

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web UI Port
          description: Port used to access Spoolman.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Published Port
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 7912
                  min: 1024
                  max: 65535
                  required: true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Spoolman Data
          description: Persistent storage for the SQLite database and Spoolman data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  enum:
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if:
                    - ["type", "=", "ix_volume"]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        default: spoolman
                        hidden: true
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - ["acl_enable", "=", true]
                        attrs: []
                      $ref:
                        - normalize/acl
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if:
                    - ["type", "=", "host_path"]
                  attrs:
                    - variable: path
                      label: Host Path
                      description: Select the existing spoolman directory, for example /mnt/POOL/spoolman.
                      schema:
                        type: hostpath
                        required: true
                    - variable: acl_enable
                      label: Enable ACL
                      description: Configure access permissions.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if:
                          - ["acl_enable", "=", true]
                        attrs: []
                      $ref:
                        - normalize/acl

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: float
                  default: 2.0
                  required: true
              - variable: memory
                label: Memory (in MB)
                schema:
                  type: int
                  default: 4096
                  required: true