{% set tpl = ix_lib.base.render.Render(values) %}

{% set app = tpl.add_container(values.consts.app_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{% do app.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do app.healthcheck.set_test("http", {"port": values.consts.internal_web_port, "path": "/api/v1/health"}) %}

{% do app.add_storage("/home/app/.local/share/spoolman", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perm_config) %}

{% do app.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do app.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "http", "path": "/"}) %}

{% do tpl.notes.add_warning("Spoolman has no built-in authentication. Do not expose it directly to the internet.") %}

{{ tpl.render() | tojson }}
