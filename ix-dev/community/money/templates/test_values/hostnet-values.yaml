resources:
  limits:
    cpus: 1.0
    memory: 256

money:
  firefly_url: http://192.0.2.10:8080
  firefly_token: another-test-token
  dash_password: another-test-password
  additional_envs:
    - name: MONEY_TEST_ENV
      value: "1"

run_as:
  user: 1000
  group: 1000

network:
  host_network: true
  web_port:
    bind_mode: published
    port_number: 8081

storage:
  additional_storage:
    - type: host_path
      mount_path: /extra
      host_path_config:
        path: /opt/tests/mnt/money/extra
