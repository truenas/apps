{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.byb_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/api/users"}) %}

{% do c1.environment.add_env("BYB_DATA_DIR", values.consts.data_path) %}
{% do c1.environment.add_env("BYB_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("BYB_SESSION_TTL_HOURS", values.byb.session_ttl_hours) %}
{% if values.byb.api_key %}
  {% do c1.environment.add_env("BYB_API_KEY", values.byb.api_key) %}
{% endif %}
{% if values.byb.webhook_url %}
  {% do c1.environment.add_env("BYB_WEBHOOK_URL", values.byb.webhook_url) %}
{% endif %}
{% do c1.environment.add_user_envs(values.byb.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
