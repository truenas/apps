groups:
  - name: BYB! Budget Configuration
    description: Configure BYB! Budget
  - name: User and Group Configuration
    description: Configure the account that owns BYB! Budget data
  - name: Network Configuration
    description: Configure the web interface
  - name: Storage Configuration
    description: Configure persistent household data
  - name: Labels Configuration
    description: Configure container labels
  - name: Resources Configuration
    description: Configure resource limits

questions:
  - variable: byb
    label: ""
    group: BYB! Budget Configuration
    schema:
      type: dict
      attrs:
        - variable: session_ttl_hours
          label: Login Session Length (hours)
          schema:
            type: int
            default: 72
            min: 1
            max: 8760
            required: true
        - variable: api_key
          label: Integrations API Key
          description: Optional key for the read-only integrations summary endpoint.
          schema:
            type: string
            default: ""
            private: true
        - variable: webhook_url
          label: Reconcile Webhook URL
          description: Optional URL that receives reconcile events.
          schema:
            type: string
            default: ""
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          schema:
            type: int
            min: 568
            default: 568
            required: true
        - variable: group
          label: Group ID
          schema:
            type: int
            min: 568
            default: 568
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host
                    - value: exposed
                      description: Expose only to other containers
                    - value: ""
                      description: Do not publish or expose
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 3001
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          schema:
            type: list
            show_if: [["host_network", "=", false]]
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: containers
                      label: Containers
                      schema:
                        type: list
                        default: []
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: byb-budget
                                        description: BYB! Budget
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string
                                      - variable: interface_name
                                        label: Interface Name
                                        schema:
                                          type: string
                                      - variable: mac_address
                                        label: MAC Address
                                        schema:
                                          type: string
                                      - variable: ipv4_address
                                        label: IPv4 Address
                                        schema:
                                          type: string
                                      - variable: ipv6_address
                                        label: IPv6 Address
                                        schema:
                                          type: string
                                      - variable: gw_priority
                                        label: Gateway Priority
                                        schema:
                                          type: int
                                          "null": true
                                      - variable: priority
                                        label: Connection Priority
                                        schema:
                                          type: int
                                          "null": true
        - variable: host_network
          label: Host Network
          schema:
            type: boolean
            default: false

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: BYB! Budget Data Storage
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Existing host path
                    - value: ix_volume
                      description: Dataset managed by TrueNAS
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: data
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Name
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                schema:
                  type: list
                  default: []
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: byb-budget
                            description: BYB! Budget

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                schema:
                  type: int
                  default: 1024
                  required: true
