groups:
  - name: HAMAL Configuration
    description: Configure HAMAL room lifespan, storage limits, and general options
  - name: User and Group Configuration
    description: Configure User and Group permissions for HAMAL
  - name: Network Configuration
    description: Configure Network and WebUI Port for HAMAL
  - name: Storage Configuration
    description: Configure Persistent Data Storage for HAMAL
  - name: Resources Configuration
    description: Configure Resource Limits for HAMAL

questions:
  - variable: TZ
    group: HAMAL Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: hamal
    label: ""
    group: HAMAL Configuration
    schema:
      type: dict
      attrs:
        - variable: base_url
          label: Explicit Base URL (Optional)
          description: |
            Explicit URL embedded in QR codes and share links (e.g. http://192.168.1.100:7700).</br>
            Leave empty to automatically use the browser address.
          schema:
            type: string
            default: ""
        - variable: default_ttl
          label: Default Room Lifespan
          description: Default room lifespan (e.g. 1h, 30m, 6h).
          schema:
            type: string
            default: "1h"
        - variable: max_ttl
          label: Maximum Room Lifespan
          description: Maximum allowable lifespan for rooms (e.g. 24h, 12h).
          schema:
            type: string
            default: "24h"
        - variable: max_file_size
          label: Maximum File Size
          description: Maximum individual file size permitted for upload (e.g. 10GiB, 500MiB).
          schema:
            type: string
            default: "10GiB"
        - variable: max_room_size
          label: Maximum Room Size
          description: Maximum aggregate storage quota per room (e.g. 10GiB, 50GiB).
          schema:
            type: string
            default: "10GiB"
        - variable: max_total_storage
          label: Global Storage Quota
          description: Maximum global storage quota across all active rooms (e.g. 100GiB).
          schema:
            type: string
            default: "100GiB"
        - variable: min_free_space
          label: Minimum Free Space
          description: Minimum free space required on the storage dataset (e.g. 5GiB).
          schema:
            type: string
            default: "5GiB"
        - variable: log_level
          label: Log Level
          schema:
            type: string
            default: "info"
            enum:
              - value: "info"
                description: Info (Default)
              - value: "debug"
                description: Debug (Detailed)
              - value: "warn"
                description: Warning
              - value: "error"
                description: Error
        - variable: log_format
          label: Log Format
          schema:
            type: string
            default: "json"
            enum:
              - value: "json"
                description: JSON (Structured)
              - value: "text"
                description: Plain Text
        - variable: additional_envs
          label: Additional Environment Variables
          description: Configure additional environment variables for HAMAL.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          description: The user ID that HAMAL runs as and files are owned by.
          schema:
            type: int
            min: 568
            default: 10001
            required: true
        - variable: group
          label: Group ID
          description: The group ID that HAMAL runs as and files are owned by.
          schema:
            type: int
            min: 568
            default: 10001
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 7700
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: networks
          label: Networks
          description: The docker networks to join
          schema:
            type: list
            show_if: [["host_network", "=", false]]
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      description: |
                        The name of the network to join.</br>
                        The network must already exist.
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      description: The containers to add to this network.
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: hamal
                                        description: hamal
        - variable: host_network
          label: Host Network
          description: Bind to the host network. It is recommended to keep this disabled.
          schema:
            type: boolean
            default: false

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: HAMAL Persistent Data Storage
          description: The dataset or volume to store HAMAL SQLite database and room files.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Dataset created automatically by TrueNAS.</br>
                  Host Path: Path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        default: "data"
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: path
                      label: Host Path
                      description: Path on TrueNAS host storage.
                      schema:
                        type: hostpath
                        required: true
        - variable: additional_storage
          label: Additional Storage
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      schema:
                        type: string
                        required: true
                        default: "ix_volume"
                        enum:
                          - value: "host_path"
                            description: Host Path
                          - value: "ix_volume"
                            description: ixVolume
                    - variable: read_only
                      label: Read Only
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: path
                            label: Host Path
                            schema:
                              type: hostpath
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - "normalize/ix_volume"

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Resource Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPU Limit
                schema:
                  type: string
                  default: "2.0"
              - variable: memory
                label: Memory Limit (MiB)
                schema:
                  type: int
                  default: 2048
