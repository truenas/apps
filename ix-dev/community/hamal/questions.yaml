groups:
  - name: HAMAL Configuration
    description: Configure HAMAL timezone, explicit URL, and environment variables
  - name: User and Group Configuration
    description: Configure User and Group permissions for HAMAL
  - name: Network Configuration
    description: Configure Network and WebUI Port for HAMAL
  - name: Storage Configuration
    description: Configure Persistent Data Storage for HAMAL
  - name: Resources Configuration
    description: Configure Resource Limits for HAMAL

questions:
  - variable: TZ
    group: HAMAL Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: hamal
    label: ""
    group: HAMAL Configuration
    schema:
      type: dict
      attrs:
        - variable: base_url
          label: Explicit Base URL (Optional)
          description: |
            Explicit URL embedded in QR codes and share links (e.g. http://192.168.1.100:7700).</br>
            Leave empty to automatically use the browser address.
          schema:
            type: string
            default: ""
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env_item
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
                        required: true

  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          description: The user id that HAMAL files will be owned by.
          schema:
            type: int
            min: 568
            default: 568
            required: true
        - variable: group
          label: Group ID
          description: The group id that HAMAL files will be owned by.
          schema:
            type: int
            min: 568
            default: 568
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: "Publish (Default)"
                    - value: "exposed"
                      description: "Expose"
                    - value: "none"
                      description: "None"
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  min: 1
                  max: 65535
                  default: 7700
                  required: true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Data Storage
          description: |
            Persistent storage for HAMAL rooms, uploaded files, and SQLite database.</br>
            Must be owned/writable by the configured User ID and Group ID.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: "ix_volume"
                  enum:
                    - value: "ix_volume"
                      description: "ixVolume (Dataset created automatically by TrueNAS)"
                    - value: "host_path"
                      description: "Host Path (Existing dataset / directory)"
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["storage.data.type", "=", "ix_volume"]]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        default: "data"
                        required: true
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["storage.data.type", "=", "host_path"]]
                  attrs:
                    - variable: host_path
                      label: Host Path
                      schema:
                        type: host_path
                        required: true
        - variable: additional_storage
          label: Additional Storage Mounts
          schema:
            type: list
            default: []
            items:
              - variable: storage_entry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: mount_path
                      label: Mount Path in Container
                      schema:
                        type: string
                        required: true
                    - variable: type
                      label: Storage Type
                      schema:
                        type: string
                        default: "ix_volume"
                        enum:
                          - value: "ix_volume"
                            description: "ixVolume (Dataset created automatically by TrueNAS)"
                          - value: "host_path"
                            description: "Host Path (Existing dataset / directory)"
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        attrs:
                          - variable: dataset_name
                            label: Dataset Name
                            schema:
                              type: string
                              required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: host_path
                            label: Host Path
                            schema:
                              type: host_path
                              required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for HAMAL.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for HAMAL.
                schema:
                  type: int
                  default: 2048
                  required: true