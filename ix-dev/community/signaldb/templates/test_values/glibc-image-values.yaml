resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
signaldb:
  tenant_name: Test Tenant
  tenant_slug: test
  dataset_slug: default
  api_key: some-secret-test-api-key
  admin_api_key: ""
  database:
    postgres_image_selector: postgres_18_image
    password: some-secret-postgres-password
  image_selector: custom_image
  custom_image:
    repository: ghcr.io/cedricziel/signaldb
    tag: main-glibc-profiling
  public:
    api_url: https://signaldb.example.com
    otlp_grpc_url: ""
    otlp_http_url: ""
  mcp:
    enabled: true
    public_url: https://mcp.example.com/mcp
    allowed_hosts:
      - 192.168.1.10:30083
  additional_toml: ""
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 30080
  otlp_grpc_port:
    bind_mode: published
    port_number: 30081
  otlp_http_port:
    bind_mode: published
    port_number: 30082
  mcp_port:
    bind_mode: published
    port_number: 30083

scaling:
  extra_queriers: 0
  extra_writers: 0
  extra_compactors: 0

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/signaldb/data
  wal: /opt/tests/mnt/signaldb/wal
  signal_data: /opt/tests/mnt/signaldb/signal-data
  postgres_data: /opt/tests/mnt/signaldb/postgres-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  wal:
    type: ix_volume
    ix_volume_config:
      dataset_name: wal
      create_host_path: true
  signal_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: signal_data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
