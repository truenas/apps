resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
signaldb:
  tenant_name: Test Tenant
  tenant_slug: test
  dataset_slug: default
  api_key: some-secret-test-api-key
  admin_api_key: ""
  database:
    postgres_image_selector: postgres_18_image
    password: some-secret-postgres-password
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 30080
  otlp_grpc_port:
    bind_mode: published
    port_number: 30081
  otlp_http_port:
    bind_mode: published
    port_number: 30082

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/signaldb/data
  postgres_data: /opt/tests/mnt/signaldb/postgres-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
