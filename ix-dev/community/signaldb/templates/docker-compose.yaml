{% if values.signaldb.image_selector == "custom_image" %}
  {% do values.images.update({"custom_image": {
    "repository": values.signaldb.custom_image.repository,
    "tag": values.signaldb.custom_image.tag,
  }}) %}
{% endif %}
{% set tpl = ix_lib.base.render.Render(values) %}

{% set signaldb_net = tpl.networks.create_internal("signaldb-net") %}

{% set c1 = tpl.add_container(values.consts.signaldb_container_name, values.signaldb.image_selector) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.add_network(signaldb_net) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The stable image is Alpine (busybox wget, no bash); the glibc image is
   Debian slim (bash, no wget). The checks work on either. #}
{% macro http_health(port, path) -%}
if command -v wget >/dev/null; then wget -q --spider http://127.0.0.1:{{ port }}{{ path }}; else bash -c 'exec 3<>/dev/tcp/127.0.0.1/{{ port }} && printf "GET {{ path }} HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'; fi
{%- endmacro %}
{% macro listening_health(port) -%}
if command -v wget >/dev/null; then ! wget -q -O /dev/null http://127.0.0.1:{{ port }}/ 2>&1 | grep -q "can.t connect"; else bash -c 'exec 3<>/dev/tcp/127.0.0.1/{{ port }}'; fi
{%- endmacro %}
{% do c1.healthcheck.set_custom_test(http_health(values.consts.internal_web_port, "/health")) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.signaldb.database.password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.signaldb.database.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(signaldb_net) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% set pg_url = postgres.get_url("postgres") %}
{% set shared_env = {
  "SIGNALDB_DATABASE_DSN": pg_url,
  "SIGNALDB_DISCOVERY_DSN": pg_url,
  "SIGNALDB__SCHEMA__CATALOG_TYPE": "sql",
  "SIGNALDB__SCHEMA__CATALOG_URI": pg_url,
  "SIGNALDB__WAL__WAL_DIR": values.consts.wal_path,
  "SIGNALDB__STORAGE__DSN": "file://%s" | format(values.consts.signal_data_path),
} %}
{% for key, value in shared_env.items() %}
  {% do c1.environment.add_env(key, value) %}
{% endfor %}

{% set memory_mb = values.resources.limits.memory %}
{% do c1.environment.add_env("SIGNALDB__QUERIER__MEMORY_LIMIT_MB", memory_mb // 2) %}
{% do c1.environment.add_env("SIGNALDB__COMPACTOR__MEMORY_LIMIT_MB", [512, memory_mb // 8] | min) %}

{% for key in ["api_url", "otlp_grpc_url", "otlp_http_url"] %}
  {% if values.signaldb.public[key] %}
    {% do c1.environment.add_env("SIGNALDB__PUBLIC__%s" | format(key | upper), values.signaldb.public[key]) %}
  {% endif %}
{% endfor %}
{% if values.signaldb.mcp.enabled and values.signaldb.mcp.public_url %}
  {% do c1.environment.add_env("SIGNALDB__PUBLIC__MCP_URL", values.signaldb.mcp.public_url) %}
{% endif %}

{# The first tenant, its dataset and its ingest/query API key can only be
   expressed as a [[auth.tenants]] array-of-tables, which SignalDB's config
   loader only reads from a TOML file (no env var covers array-of-tables).
   Rendering it into a mounted config keeps the bundled Explore UI/OTLP
   ingest usable immediately after install. #}
{% macro toml_str(value) -%}
{{ value | replace("\\", "\\\\") | replace('"', '\\"') | replace("\n", "\\n") }}
{%- endmacro %}
{% set tenant_toml -%}
[auth]
{% if values.signaldb.admin_api_key %}admin_api_key = "{{ toml_str(values.signaldb.admin_api_key) }}"
{% endif %}
[[auth.tenants]]
id = "{{ toml_str(values.signaldb.tenant_slug) }}"
slug = "{{ toml_str(values.signaldb.tenant_slug) }}"
name = "{{ toml_str(values.signaldb.tenant_name) }}"
default_dataset = "{{ toml_str(values.signaldb.dataset_slug) }}"

[[auth.tenants.api_keys]]
key = "{{ toml_str(values.signaldb.api_key) }}"
name = "Default Key"

[[auth.tenants.datasets]]
id = "{{ toml_str(values.signaldb.dataset_slug) }}"
slug = "{{ toml_str(values.signaldb.dataset_slug) }}"
is_default = true
{% if values.signaldb.additional_toml %}

{{ values.signaldb.additional_toml }}
{% endif %}
{%- endset %}
{% do c1.configs.add("signaldb-config", tenant_toml, "/data/signaldb.toml", "0644") %}

{% do c1.environment.add_user_envs(values.signaldb.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
{% do c1.add_port(values.network.otlp_grpc_port, {"container_port": values.consts.internal_otlp_grpc_port}) %}
{% do c1.add_port(values.network.otlp_http_port, {"container_port": values.consts.internal_otlp_http_port}) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage(values.consts.wal_path, values.storage.wal) %}
{% do perm_container.add_or_skip_action("wal", values.storage.wal, perms_config) %}
{% do c1.add_storage(values.consts.signal_data_path, values.storage.signal_data) %}
{% do perm_container.add_or_skip_action("signal_data", values.storage.signal_data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# Extra instances register in the shared discovery database, where the
   main container's router and acceptor find them. Only those two dial
   other services, and both run in the main container. #}
{% set extra_services = [
  {"kind": "querier", "count": values.scaling.extra_queriers, "port": values.consts.internal_querier_flight_port},
  {"kind": "writer", "count": values.scaling.extra_writers, "port": values.consts.internal_writer_flight_port},
  {"kind": "compactor", "count": values.scaling.extra_compactors, "port": values.consts.internal_compactor_metrics_port},
] %}
{% for svc in extra_services %}
  {% for i in range(1, svc.count + 1) %}
    {% set name = "%s-%d" | format(svc.kind, i) %}
    {% set extra = tpl.add_container(name, values.signaldb.image_selector) %}
    {% do extra.set_user(values.run_as.user, values.run_as.group) %}
    {% do extra.add_network(signaldb_net) %}
    {% do extra.depends.add_dependency(values.consts.signaldb_container_name, "service_healthy") %}
    {% for key, value in shared_env.items() %}
      {% do extra.environment.add_env(key, value) %}
    {% endfor %}
    {% do extra.configs.add("signaldb-config", tenant_toml, "/data/signaldb.toml", "0644") %}
    {% do extra.add_storage("/data", values.storage.data) %}
    {% do extra.add_storage(values.consts.signal_data_path, values.storage.signal_data) %}
    {% if svc.kind == "querier" %}
      {% do extra.set_command(["querier", "--flight-port", svc.port | string]) %}
      {% do extra.environment.add_env("QUERIER_ADVERTISE_ADDR", "%s:%d" | format(name, svc.port)) %}
      {% do extra.environment.add_env("SIGNALDB__QUERIER__MEMORY_LIMIT_MB", memory_mb * 3 // 4) %}
      {% do extra.healthcheck.set_custom_test(listening_health(svc.port)) %}
    {% elif svc.kind == "writer" %}
      {% do extra.set_command(["writer", "--flight-port", svc.port | string]) %}
      {% do extra.environment.add_env("WRITER_ADVERTISE_ADDR", "%s:%d" | format(name, svc.port)) %}
      {% do extra.environment.add_env("WRITER_WAL_DIR", "%s/%s" | format(values.consts.wal_path, name)) %}
      {% do extra.add_storage(values.consts.wal_path, values.storage.wal) %}
      {% do extra.healthcheck.set_custom_test(listening_health(svc.port)) %}
    {% else %}
      {% do extra.set_command(["compactor"]) %}
      {% do extra.environment.add_env("SIGNALDB__COMPACTOR__MEMORY_LIMIT_MB", memory_mb // 2) %}
      {% do extra.healthcheck.set_custom_test(http_health(svc.port, "/health")) %}
    {% endif %}
    {% do extra.environment.add_user_envs(values.signaldb.additional_envs) %}
  {% endfor %}
{% endfor %}

{% if values.signaldb.mcp.enabled %}
  {% set mcp = tpl.add_container(values.consts.mcp_container_name, values.signaldb.image_selector) %}
  {% do mcp.set_user(values.run_as.user, values.run_as.group) %}
  {% do mcp.set_command(["mcp"]) %}
  {% do mcp.add_network(signaldb_net) %}
  {% do mcp.depends.add_dependency(values.consts.signaldb_container_name, "service_healthy") %}
  {% do mcp.healthcheck.set_custom_test(listening_health(values.consts.internal_mcp_port)) %}
  {% set allowed_hosts = values.signaldb.mcp.allowed_hosts | list %}
  {% if values.signaldb.mcp.public_url %}
    {% do allowed_hosts.append(values.signaldb.mcp.public_url.split("://")[-1].split("/")[0]) %}
  {% endif %}
  {% do mcp.environment.add_env("SIGNALDB__MCP__BIND_ADDRESS", "0.0.0.0:%d" | format(values.consts.internal_mcp_port)) %}
  {% do mcp.environment.add_env("SIGNALDB__MCP__ROUTER_URL", "http://%s:%d" | format(values.consts.signaldb_container_name, values.consts.internal_web_port)) %}
  {% if allowed_hosts %}
    {% do mcp.environment.add_env("SIGNALDB__MCP__ALLOWED_HOSTS", allowed_hosts | join(",")) %}
  {% endif %}
  {% if values.signaldb.public.api_url %}
    {% do mcp.environment.add_env("SIGNALDB__MCP__UI_BASE_URL", values.signaldb.public.api_url) %}
  {% endif %}
  {% do mcp.add_port(values.network.mcp_port, {"container_port": values.consts.internal_mcp_port}) %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
