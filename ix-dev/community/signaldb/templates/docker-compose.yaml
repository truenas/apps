{% if values.signaldb.image_selector == "custom_image" %}
  {% do values.images.update({"custom_image": {
    "repository": values.signaldb.custom_image.repository,
    "tag": values.signaldb.custom_image.tag,
  }}) %}
{% endif %}
{% set tpl = ix_lib.base.render.Render(values) %}

{% set signaldb_net = tpl.networks.create_internal("signaldb-net") %}

{% set c1 = tpl.add_container(values.consts.signaldb_container_name, values.signaldb.image_selector) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.add_network(signaldb_net) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The stable image is Alpine (busybox wget, no bash); the glibc image is
   Debian slim (bash, no wget). The checks work on either. #}
{% macro http_health(port, path) -%}
if command -v wget >/dev/null; then wget -q --spider http://127.0.0.1:{{ port }}{{ path }}; else bash -c 'exec 3<>/dev/tcp/127.0.0.1/{{ port }} && printf "GET {{ path }} HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'; fi
{%- endmacro %}
{% do c1.healthcheck.set_custom_test(http_health(values.consts.internal_web_port, "/health")) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.signaldb.database.password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.signaldb.database.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(signaldb_net) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% set pg_url = postgres.get_url("postgres") %}
{% do c1.environment.add_env("SIGNALDB_DATABASE_DSN", pg_url) %}
{% do c1.environment.add_env("SIGNALDB_DISCOVERY_DSN", pg_url) %}
{% do c1.environment.add_env("SIGNALDB__SCHEMA__CATALOG_TYPE", "sql") %}
{% do c1.environment.add_env("SIGNALDB__SCHEMA__CATALOG_URI", pg_url) %}
{% do c1.environment.add_env("SIGNALDB__WAL__WAL_DIR", values.consts.wal_path) %}
{% do c1.environment.add_env("SIGNALDB__STORAGE__DSN", "file://%s" | format(values.consts.signal_data_path)) %}

{% set memory_mb = values.resources.limits.memory %}
{% do c1.environment.add_env("SIGNALDB__QUERIER__MEMORY_LIMIT_MB", memory_mb // 2) %}
{% do c1.environment.add_env("SIGNALDB__COMPACTOR__MEMORY_LIMIT_MB", [512, memory_mb // 8] | min) %}

{% for key in ["api_url", "otlp_grpc_url", "otlp_http_url"] %}
  {% if values.signaldb.public[key] %}
    {% do c1.environment.add_env("SIGNALDB__PUBLIC__%s" | format(key | upper), values.signaldb.public[key]) %}
  {% endif %}
{% endfor %}

{# The first tenant, its dataset and its ingest/query API key can only be
   expressed as a [[auth.tenants]] array-of-tables, which SignalDB's config
   loader only reads from a TOML file (no env var covers array-of-tables).
   Rendering it into a mounted config keeps the bundled Explore UI/OTLP
   ingest usable immediately after install. #}
{% macro toml_str(value) -%}
{{ value | replace("\\", "\\\\") | replace('"', '\\"') | replace("\n", "\\n") }}
{%- endmacro %}
{% set tenant_toml -%}
[auth]
{% if values.signaldb.admin_api_key %}admin_api_key = "{{ toml_str(values.signaldb.admin_api_key) }}"
{% endif %}
[[auth.tenants]]
id = "{{ toml_str(values.signaldb.tenant_slug) }}"
slug = "{{ toml_str(values.signaldb.tenant_slug) }}"
name = "{{ toml_str(values.signaldb.tenant_name) }}"
default_dataset = "{{ toml_str(values.signaldb.dataset_slug) }}"

[[auth.tenants.api_keys]]
key = "{{ toml_str(values.signaldb.api_key) }}"
name = "Default Key"

[[auth.tenants.datasets]]
id = "{{ toml_str(values.signaldb.dataset_slug) }}"
slug = "{{ toml_str(values.signaldb.dataset_slug) }}"
is_default = true
{%- endset %}
{% do c1.configs.add("signaldb-config", tenant_toml, "/data/signaldb.toml", "0644") %}

{% do c1.environment.add_user_envs(values.signaldb.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
{% do c1.add_port(values.network.otlp_grpc_port, {"container_port": values.consts.internal_otlp_grpc_port}) %}
{% do c1.add_port(values.network.otlp_http_port, {"container_port": values.consts.internal_otlp_http_port}) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do c1.add_storage(values.consts.wal_path, values.storage.wal) %}
{% do perm_container.add_or_skip_action("wal", values.storage.wal, perms_config) %}
{% do c1.add_storage(values.consts.signal_data_path, values.storage.signal_data) %}
{% do perm_container.add_or_skip_action("signal_data", values.storage.signal_data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
