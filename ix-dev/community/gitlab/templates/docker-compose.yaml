{% if not values.gitlab.host %}
  {% do ix_lib.base.utils.throw_error("Expected [gitlab.host] to be set (external URL hostname, e.g. git.example.com)") %}
{% endif %}

{# Upgrade-path protection: jinja cannot read the on-disk installed GitLab version,
   so the hard guarantee is provided by to_keep_versions.yaml (kept milestones) plus
   the README upgrade-path table. Full schema-migration reading VERSION is a follow-up. #}

{% set tpl = ix_lib.base.render.Render(values) %}

{% set gitlab_net = tpl.networks.create_internal("gitlab-net") %}

{% set c1 = tpl.add_container(values.consts.gitlab_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.gitlab.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.gitlab.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(gitlab_net) %}

{# Redis: sameersbn's resque.yml template connects WITHOUT a password
   (redis://host:port/db, no auth field), so the framework's tpl.deps.redis
   (which forces --requirepass) would cause NOAUTH errors. Run a plain
   redis container without auth — it's on the internal network, only
   reachable by gitlab, which is sameersbn's assumed deployment model. #}
{% set redis_container = tpl.add_container(values.consts.redis_container_name, "redis_image") %}
{% do redis_container.add_network(gitlab_net) %}
{% do redis_container.set_user(values.run_as.user, values.run_as.group) %}
{% do redis_container.set_command(["redis-server", "--port", "6379", "--save", "", "--appendonly", "no"]) %}
{% do redis_container.healthcheck.set_test("redis", {"password": ""}) %}
{% do redis_container.add_storage("/data", {"type": "temporary", "volume_config": {"volume_name": "redis-data"}}) %}

{% do c1.add_network(gitlab_net) %}
{# sameersbn image starts as root to remap git:git -> USERMAP_UID/GID via usermod/groupmod,
   then runs GitLab processes as the remapped user. Do NOT set_user here — that would make
   the entrypoint run as non-root and groupmod fails with "cannot lock /etc/group".
   Framework drops ALL caps by default; sameersbn needs these for the entrypoint remap
   (chown/chmod/usermod/su) and to bind nginx:80 + sshd:22. #}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "KILL", "NET_BIND_SERVICE", "AUDIT_WRITE"]) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do c1.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.gitlab_internal_http_port, "path": "/-/health"}) %}
{% do c1.healthcheck.set_start_period(600) %}

{# Remap git user/group to run_as (568) — image runs as root to perform the remap #}
{% do c1.environment.add_env("USERMAP_UID", values.run_as.user) %}
{% do c1.environment.add_env("USERMAP_GID", values.run_as.group) %}

{# Rails secrets (required, stable — do not change after first boot) #}
{% do c1.environment.add_env("GITLAB_SECRETS_DB_KEY_BASE", values.gitlab.secrets_db_key_base) %}
{% do c1.environment.add_env("GITLAB_SECRETS_SECRET_KEY_BASE", values.gitlab.secrets_secret_key_base) %}
{% do c1.environment.add_env("GITLAB_SECRETS_OTP_KEY_BASE", values.gitlab.secrets_otp_key_base) %}

{# DB #}
{% do c1.environment.add_env("DB_ADAPTER", "postgresql") %}
{% do c1.environment.add_env("DB_HOST", values.consts.postgres_container_name) %}
{% do c1.environment.add_env("DB_NAME", values.consts.db_name) %}
{% do c1.environment.add_env("DB_USER", values.consts.db_user) %}
{% do c1.environment.add_env("DB_PASS", values.gitlab.db_password) %}

{# Redis (no auth — see redis container note above) #}
{% do c1.environment.add_env("REDIS_HOST", values.consts.redis_container_name) %}
{% do c1.environment.add_env("REDIS_PORT", 6379) %}

{# External URL (HTTP internal; proxy terminates TLS) #}
{% do c1.environment.add_env("GITLAB_HOST", values.gitlab.host) %}
{% do c1.environment.add_env("GITLAB_PORT", 80) %}
{% do c1.environment.add_env("GITLAB_HTTPS", "false") %}

{# Initial root password — only effective on first boot; empty = random generated #}
{% if values.gitlab.root_password %}
  {% do c1.environment.add_env("GITLAB_ROOT_PASSWORD", values.gitlab.root_password) %}
{% endif %}

{# SSH #}
{% do c1.environment.add_env("GITLAB_SSH_PORT", values.network.ssh_port.port_number) %}
{% do c1.environment.add_env("GITLAB_SSH_HOST", values.gitlab.host) %}

{# Timezone (TZ is auto-added by the library) #}
{% do c1.environment.add_env("GITLAB_TIMEZONE", values.TZ) %}

{% if values.gitlab.registry_enabled %}
  {% if not values.gitlab.registry_host %}
    {% do ix_lib.base.utils.throw_error("Expected [gitlab.registry_host] to be set when registry is enabled (e.g. registry.example.com)") %}
  {% endif %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_ENABLED", "true") %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_HOST", values.gitlab.registry_host) %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_PORT", "443") %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_API_URL", "http://%s:%d"|format(values.consts.registry_container_name, values.consts.registry_internal_port)) %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_KEY_PATH", values.consts.registry_key_path) %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_ISSUER", values.consts.registry_issuer) %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_GENERATE_INTERNAL_CERTIFICATES", "true") %}
  {% do c1.environment.add_env("GITLAB_REGISTRY_DIR", values.consts.registry_storage_dir) %}
{% endif %}

{% if values.gitlab.pages_enabled %}
  {% if not values.gitlab.pages_host %}
    {% do ix_lib.base.utils.throw_error("Expected [gitlab.pages_host] to be set when pages are enabled (e.g. pages.example.com)") %}
  {% endif %}
  {% do c1.environment.add_env("GITLAB_PAGES_ENABLED", "true") %}
  {% do c1.environment.add_env("GITLAB_PAGES_DOMAIN", values.gitlab.pages_host) %}
  {% do c1.environment.add_env("GITLAB_PAGES_PORT", "80") %}
  {% do c1.environment.add_env("GITLAB_PAGES_HTTPS", "true" if values.gitlab.pages_https else "false") %}
  {% do c1.environment.add_env("GITLAB_PAGES_NGINX_PROXY", "true") %}
  {% do c1.environment.add_env("GITLAB_PAGES_DIR", "/home/git/data/shared/pages") %}
{% endif %}

{% do c1.environment.add_user_envs(values.gitlab.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_port(values.network.ssh_port) %}

{% do c1.add_storage("/home/git/data", values.storage.gitlab_data) %}
{% do perm_container.add_or_skip_action("/home/git/data", values.storage.gitlab_data, perms_config) %}

{% do c1.add_storage("/etc/gitlab", values.storage.gitlab_config) %}
{% do perm_container.add_or_skip_action("/etc/gitlab", values.storage.gitlab_config, perms_config) %}

{% if values.gitlab.registry_enabled %}
  {% do c1.add_storage(values.consts.registry_certs_dir, values.storage.certs) %}
  {% do perm_container.add_or_skip_action(values.consts.registry_certs_dir, values.storage.certs, perms_config) %}
{% endif %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if values.gitlab.registry_enabled %}
  {% set reg = tpl.add_container(values.consts.registry_container_name, "registry_image") %}
  {% do reg.add_network(gitlab_net) %}
  {% do reg.set_user(values.run_as.user, values.run_as.group) %}
  {% do reg.depends.add_dependency(values.consts.gitlab_container_name, "service_healthy") %}

  {% do reg.environment.add_env("REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY", values.consts.registry_storage_dir) %}
  {% do reg.environment.add_env("REGISTRY_AUTH_TOKEN_REALM", "https://%s/jwt/auth"|format(values.gitlab.host)) %}
  {% do reg.environment.add_env("REGISTRY_AUTH_TOKEN_SERVICE", "container_registry") %}
  {% do reg.environment.add_env("REGISTRY_AUTH_TOKEN_ISSUER", values.consts.registry_issuer) %}
  {% do reg.environment.add_env("REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE", values.consts.registry_cert_path) %}
  {% do reg.environment.add_env("REGISTRY_STORAGE_DELETE_ENABLED", "true") %}

  {# registry:2.8.3 is a scratch-based image (only /bin/registry, no shell/wget),
     so a CMD-SHELL healthcheck cannot run. Disable the healthcheck; gitlab does not
     depend on registry being healthy, and registry:2 ships no native healthcheck. #}
  {% do reg.healthcheck.disable() %}

  {% do reg.add_port(values.network.registry_port) %}

  {% do reg.add_storage(values.consts.registry_certs_dir, values.storage.certs) %}
  {% do reg.add_storage("/home/git/data", values.storage.gitlab_data) %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}