images:
  image:
    repository: sameersbn/gitlab
    tag: 19.1.2
  postgres_17_image:
    repository: postgres
    tag: 17.10-bookworm
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: 1.2.12
  redis_image:
    repository: valkey/valkey
    tag: 9.1.0
  registry_image:
    repository: registry
    tag: 2.8.3
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  gitlab_container_name: gitlab
  postgres_container_name: postgres
  redis_container_name: redis
  registry_container_name: registry
  perms_container_name: permissions
  db_name: gitlabhq_production
  db_user: gitlab
  gitlab_internal_http_port: 80
  gitlab_internal_ssh_port: 22
  registry_internal_port: 5000
  registry_issuer: gitlab-issuer
  registry_certs_dir: /certs
  registry_key_path: /certs/registry.key
  registry_cert_path: /certs/registry.crt
  registry_storage_dir: /home/git/data/shared/registry