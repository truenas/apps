consts:
  solidping_container_name: solidping
  perms_container_name: permissions
  data_path: /data

  notes_body: |
    Default credentials:
    - Username: `admin@solidping.io`
    - Password: `solidpass`

    You will be asked to change the password on first login.</br>

    Set `SP_BASE_URL` in the additional environment variables to the URL
    you use to reach SolidPing, so links in notifications point to it.</br>

    Additional documentation can be found at:</br>
    - https://docs.solidping.io
