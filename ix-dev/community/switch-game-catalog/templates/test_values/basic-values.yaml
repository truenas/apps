resources:
  limits:
    cpus: 2.0
    memory: 4096

switch_game_catalog:
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 3000
  host_network: false

run_as:
  user: 568
  group: 568

ix_volumes:
  games: /opt/tests/mnt/switch-game-catalog/games
  config: /opt/tests/mnt/switch-game-catalog/config
  cache: /opt/tests/mnt/switch-game-catalog/cache

storage:
  games:
    type: ix_volume
    ix_volume_config:
      dataset_name: games
      create_host_path: true
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: cache
      create_host_path: true
  additional_storage: []
