{% set tpl = ix_lib.base.render.Render(values) %}

{% if not values.isponsorblocktv.devices %}
  {% do tpl.funcs.fail("At least one device is required to start iSponsorBlockTV.") %}
{% endif %}

{% set initial_config = {
  "devices": values.isponsorblocktv.devices,
  "skip_categories": values.isponsorblocktv.skip_categories,
  "skip_count_tracking": values.isponsorblocktv.skip_count_tracking,
  "mute_ads": values.isponsorblocktv.mute_ads,
  "skip_ads": values.isponsorblocktv.skip_ads,
  "minimum_skip_length": values.isponsorblocktv.minimum_skip_length,
  "auto_play": values.isponsorblocktv.auto_play,
  "join_name": values.isponsorblocktv.join_name,
  "apikey": values.isponsorblocktv.api_key,
  "channel_whitelist": [],
  "use_proxy": values.isponsorblocktv.use_proxy,
} %}

{% set init_script %}
import json
from pathlib import Path

cfg_path = Path("/app/data/config.json")
if cfg_path.exists() and cfg_path.stat().st_size > 0:
    raise SystemExit(0)

cfg_path.parent.mkdir(parents=True, exist_ok=True)
cfg = json.loads({{ initial_config | tojson | tojson }})
cfg_path.write_text(json.dumps(cfg, indent=4) + "\n")
{% endset %}

{% set init = tpl.add_container(values.consts.init_container_name, "image") %}
{% do init.setup_as_helper() %}
{% do init.healthcheck.disable() %}
{% do init.configs.add("config_init.py", init_script, "/setup.py", "0755") %}
{% do init.set_entrypoint(["python3", "/setup.py"]) %}
{% do init.add_storage(values.consts.config_path, values.storage.config) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% do c1.set_user(0, 0) %}
{% do c1.healthcheck.disable() %}
{% do c1.environment.add_user_envs(values.isponsorblocktv.additional_envs) %}
{% do c1.add_storage(values.consts.config_path, values.storage.config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do c1.depends.add_dependency(values.consts.init_container_name, "service_completed_successfully") %}

{% do tpl.notes.add_info("This app has no WebUI. The first-run configuration is written to /app/data/config.json and preserved on upgrades. Later changes should be made by editing that file directly.") %}

{{ tpl.render() | tojson }}
