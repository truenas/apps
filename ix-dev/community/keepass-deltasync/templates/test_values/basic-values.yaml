resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

deltasync:
  postgres_image_selector: postgres_18_image
  admin_username: admin
  admin_password: test-admin-password
  db_password: deltasync-db-pass
  base_path: ""
  log_level: INFO
  audit_retention_days: 30
  enrollment_token_ttl_hours: 24
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  postgres-data: /opt/tests/keepass-deltasync/postgres-data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres-data
      create_host_path: true
