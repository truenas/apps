TZ: Etc/UTC
parson:
  library_name: Parson
  additional_envs: []
network:
  host_network: true
  web_port:
    bind_mode: published
    port_number: 30461
    host_ips: []
  networks: []
ix_volumes:
  data: /opt/tests/mnt/parson-host-network/data
storage:
  data:
    type: ix_volume
    ix_volume_config:
      acl_enable: false
      create_host_path: true
      dataset_name: data
  music:
    type: host_path
    host_path_config:
      acl_enable: false
      create_host_path: true
      path: /opt/tests/mnt/parson-host-network/music
  additional_storage: []
labels: []
resources:
  limits:
    cpus: 2
    memory: 4096
