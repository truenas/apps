TZ: Etc/UTC
parson:
  library_name: Parson
  additional_envs: []
network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30461
    host_ips: []
  networks: []
ix_volumes:
  data: /opt/tests/mnt/parson/data
storage:
  data:
    type: ix_volume
    ix_volume_config:
      acl_enable: false
      create_host_path: true
      dataset_name: data
  music:
    type: host_path
    host_path_config:
      acl_enable: false
      create_host_path: true
      path: /opt/tests/mnt/parson/music
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /music-2
      host_path_config:
        acl_enable: false
        create_host_path: true
        path: /opt/tests/mnt/parson/music-2
labels: []
resources:
  limits:
    cpus: 2
    memory: 4096
