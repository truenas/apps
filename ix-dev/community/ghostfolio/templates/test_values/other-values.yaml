resources:
  limits:
    cpus: 1.0
    memory: 512

TZ: Etc/UTC

ghostfolio:
  postgres_image_selector: postgres_17_image
  db_password: supersecret
  redis_password: supersecret

network:
  web_port:
    bind_mode: published
    port_number: 3333

ix_volumes:
  postgres_data: /opt/tests/mnt/ghostfolio/postgres_data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
