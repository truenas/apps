{% set tpl = ix_lib.base.render.Render(values) %}

{% set ghostfolio_net = tpl.networks.create_internal("ghostfolio-net") %}

{% set ghostfolio = tpl.add_container(values.consts.app_container_name, "image") %}
{% do ghostfolio.add_network(ghostfolio_net) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.consts.run_as_user, "gid": values.consts.run_as_group, "mode": "check"} %}

{# Postgres #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.ghostfolio.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.ghostfolio.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(ghostfolio_net) %}

{# Redis #}
{% set redis_config = {
  "password": values.ghostfolio.redis_password,
  "volume": tpl.funcs.temp_config("redis_data"),
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(ghostfolio_net) %}

{% do ghostfolio.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do ghostfolio.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/api/v1/health"}) %}

{# Ghostfolio #}
{% do ghostfolio.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do ghostfolio.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do ghostfolio.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}

{% do ghostfolio.environment.add_env("ACCESS_TOKEN_SALT", values.ghostfolio.access_token_salt) %}
{% do ghostfolio.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do ghostfolio.environment.add_env("JWT_SECRET_KEY", values.ghostfolio.jwt_secret_key) %}
{% do ghostfolio.environment.add_env("POSTGRES_DB", values.consts.db_name) %}
{% do ghostfolio.environment.add_env("POSTGRES_PASSWORD", values.ghostfolio.db_password) %}
{% do ghostfolio.environment.add_env("POSTGRES_USER", values.consts.db_user) %}
{% do ghostfolio.environment.add_env("REDIS_HOST", redis.get_url("redis")) %}
{% do ghostfolio.environment.add_env("REDIS_PASSWORD", values.ghostfolio.redis_password) %}
{% do ghostfolio.environment.add_env("REDIS_PORT", redis.get_port()) %}

{% do ghostfolio.environment.add_user_envs(values.ghostfolio.additional_envs) %}

{% for store in values.storage.additional_storage %}
  {% do ghostfolio.add_storage(store.mount_path, store) %}
{% endfor %}

{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% do ghostfolio.add_port(values.network.web_port) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do ghostfolio.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
