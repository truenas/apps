{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.wondarr_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The image starts as root under s6-overlay, applies PUID/PGID (set from run_as) to its own account, re-owns /config and drops to that account. #}
{# KILL lets s6, running as root, send the app (running as PUID) its shutdown signal, so a stop is graceful. #}
{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]) %}

{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/ping"}) %}
{% do c1.environment.add_env("APP__SERVER__PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("APP__SOULSEEK__LISTEN_PORT", values.network.soulseek_port.port_number) %}
{% if values.wondarr.soulseek_username %}
  {% do c1.environment.add_env("APP__SOULSEEK__USERNAME", values.wondarr.soulseek_username) %}
{% endif %}
{% if values.wondarr.soulseek_password %}
  {% do c1.environment.add_env("APP__SOULSEEK__PASSWORD", values.wondarr.soulseek_password) %}
{% endif %}
{% do c1.environment.add_user_envs(values.wondarr.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_port(values.network.soulseek_port) %}

{% do c1.add_storage("/config", values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
