resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

wondarr:
  soulseek_username: ""
  soulseek_password: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8077
  soulseek_port:
    bind_mode: published
    port_number: 8078
  host_network: false

ix_volumes:
  config: /opt/tests/mnt/wondarr/config
  data: /opt/tests/mnt/wondarr/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
