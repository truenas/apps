{% set tpl = ix_lib.base.render.Render(values) %}

{% set overleaf_net = tpl.networks.create_internal("overleaf-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{# MongoDB — no auth needed, isolated on internal network (matches official Overleaf setup) #}
{% set mongo = tpl.add_container(values.consts.mongo_container_name, "mongo_image") %}
{% do mongo.set_user(568, 568) %}
{% do mongo.healthcheck.set_test("mongodb", {"db": values.consts.mongo_db}) %}
{% do mongo.remove_devices() %}
{% do mongo.set_grace_period(60) %}
{% do mongo.add_storage("/data/db", values.storage.mongo_data) %}
{% do mongo.add_network(overleaf_net) %}
{% do mongo.set_command(["--replSet", "overleaf"]) %}
{% do perm_container.add_or_skip_action("mongo_data", values.storage.mongo_data, {"uid": 568, "gid": 568, "mode": "check"}) %}

{# One-shot container that initializes the single-node replica set after MongoDB is healthy #}
{% set rs_eval = 'try { rs.status() } catch(e) { rs.initiate({ _id: "overleaf", members: [{ _id: 0, host: "%s:27017" }] }) }' | format(values.consts.mongo_container_name) %}
{% set rs_init = tpl.add_container(values.consts.mongo_init_container_name, "mongo_image") %}
{% do rs_init.set_user(568, 568) %}
{% do rs_init.healthcheck.disable() %}
{% do rs_init.restart.set_policy("no") %}
{% do rs_init.add_network(overleaf_net) %}
{% do rs_init.depends.add_dependency(values.consts.mongo_container_name, "service_healthy") %}
{% do rs_init.set_entrypoint(["mongosh"]) %}
{% do rs_init.set_command([
  "--host", values.consts.mongo_container_name,
  "--eval", rs_eval
]) %}

{# Redis — no auth needed, isolated on internal network #}
{% set redis_config = {
  "password": "",
  "volume": {"type": "temporary", "volume_config": {"volume_name": "redis-data"}},
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(overleaf_net) %}

{# Overleaf — runs as root (Phusion baseimage requirement) #}
{% set c1 = tpl.add_container(values.consts.overleaf_container_name, "image") %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID", "FOWNER"]) %}
{% do c1.add_network(overleaf_net) %}
{% do c1.set_grace_period(60) %}
{% do c1.depends.add_dependency(values.consts.mongo_container_name, "service_healthy") %}
{% do c1.depends.add_dependency(values.consts.mongo_init_container_name, "service_completed_successfully") %}
{% do c1.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% do c1.healthcheck.set_test("curl", {"port": 80, "path": "/"}) %}

{% do c1.environment.add_env("OVERLEAF_APP_NAME", values.overleaf.app_name) %}
{% do c1.environment.add_env("OVERLEAF_MONGO_URL", "mongodb://%s:27017/%s?replicaSet=overleaf" | format(values.consts.mongo_container_name, values.consts.mongo_db)) %}
{% do c1.environment.add_env("OVERLEAF_REDIS_HOST", values.consts.redis_container_name) %}
{% do c1.environment.add_env("REDIS_HOST", values.consts.redis_container_name) %}
{% do c1.environment.add_env("OVERLEAF_INVITE_TOKEN_SECRET", values.overleaf.invite_token_secret) %}
{% do c1.environment.add_env("ENABLED_LINKED_FILE_TYPES", "project_file,project_output_file") %}
{% do c1.environment.add_env("ENABLE_CONVERSIONS", "true") %}
{% do c1.environment.add_env("EMAIL_CONFIRMATION_DISABLED", "true") %}
{% if values.overleaf.site_url %}
  {% do c1.environment.add_env("OVERLEAF_SITE_URL", values.overleaf.site_url) %}
{% endif %}
{% if values.overleaf.admin_email %}
  {% do c1.environment.add_env("OVERLEAF_ADMIN_EMAIL", values.overleaf.admin_email) %}
{% endif %}
{% do c1.environment.add_user_envs(values.overleaf.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/var/lib/overleaf", values.storage.overleaf_data) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do mongo.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{% do tpl.notes.add_warning("Overleaf Community Edition runs as root and is intended for environments where all users are trusted.") %}

{{ tpl.render() | tojson }}
