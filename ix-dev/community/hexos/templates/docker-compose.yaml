{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.hexos_container_name, "image") %}
{% do c1.set_user(0, 0) %}
{% do c1.set_network_mode("host") %}
{% do c1.healthcheck.disable() %}

{% do c1.environment.add_env("SERVER_MODE", "local") %}
{% do c1.environment.add_env("HEXOS_INSTALL", "catalog") %}
{% do c1.environment.add_env("HEXOS_IMAGE_TAG", values.images.image.tag) %}
{% do c1.environment.add_env("LOG_LEVEL", "info") %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do c1.add_docker_socket() %}

{% do tpl.portals.add({"bind_mode": "published", "port_number": values.consts.portal_port}, {"name": "HexOS"}) %}
{% do tpl.notes.declare_risk("docker_access") %}
{% do tpl.notes.declare_risk("host_network") %}

{{ tpl.render() | tojson }}
