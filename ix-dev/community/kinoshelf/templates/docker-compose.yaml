{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.kinoshelf_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# A copy can last minutes and a stop waits for it; a task cut short is resumed at the next start #}
{% do c1.set_grace_period(300) %}
{# The image ships busybox's wget only, and /health is public #}
{% do c1.healthcheck.set_test("wget", {
  "port": values.network.web_port.port_number,
  "path": "/health",
  "spider": false,
  "busybox": true,
}) %}

{% do c1.environment.add_env("KINOSHELF_PORT", values.network.web_port.port_number) %}
{# A variable set here wins over the Settings page and locks the field there: add it only when filled #}
{% if values.kinoshelf.tmdb_api_key %}
  {% do c1.environment.add_env("TMDB_API_KEY", values.kinoshelf.tmdb_api_key) %}
{% endif %}
{% if values.kinoshelf.api_key %}
  {% do c1.environment.add_env("KINOSHELF_API_KEY", values.kinoshelf.api_key) %}
{% endif %}
{% if values.kinoshelf.trust_proxy %}
  {% do c1.environment.add_env("KINOSHELF_TRUST_PROXY", values.kinoshelf.trust_proxy) %}
{% endif %}
{% if values.kinoshelf.allowed_hosts %}
  {% do c1.environment.add_env("KINOSHELF_ALLOWED_HOSTS", values.kinoshelf.allowed_hosts) %}
{% endif %}
{% do c1.environment.add_user_envs(values.kinoshelf.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/config", values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
