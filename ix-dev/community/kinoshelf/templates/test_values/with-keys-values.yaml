resources:
  limits:
    cpus: 2.0
    memory: 4096

kinoshelf:
  tmdb_api_key: "0123456789abcdef0123456789abcdef"
  api_key: "0123456789abcdef0123456789abcdef-test"
  trust_proxy: "172.16.0.1"
  allowed_hosts: "nas.example.com"
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 38485

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/kinoshelf/config
  media: /opt/tests/mnt/kinoshelf/media

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /media
      ix_volume_config:
        dataset_name: media
        create_host_path: true
