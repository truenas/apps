{% set tpl = ix_lib.base.render.Render(values) %}

{% do tpl.funcs.require_no_reserved(values.piper.additional_args, "Additional Args", values.consts.reserved_flags, "=", false) %}

{% set c1 = tpl.add_container(values.consts.piper_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("tcp", {"port": values.network.wyoming_port.port_number}) %}
{# Voice downloads on first start can take a while #}
{% do c1.healthcheck.set_start_period(300) %}

{# Bypass the image's docker_run.sh, so --uri and --data-dir are not passed twice #}
{% do c1.set_entrypoint(["/usr/src/.venv/bin/python3", "-m", "wyoming_piper"]) %}
{% set cmd = namespace(x=[
  "--uri", "tcp://0.0.0.0:%d" | format(values.network.wyoming_port.port_number),
  "--data-dir", values.consts.data_path,
  "--voice", values.piper.voice,
]) %}
{% if values.piper.speaker %}
  {% do cmd.x.extend(["--speaker", values.piper.speaker]) %}
{% endif %}
{% if values.piper.length_scale %}
  {% do cmd.x.extend(["--length-scale", values.piper.length_scale]) %}
{% endif %}
{% if values.piper.noise_scale %}
  {% do cmd.x.extend(["--noise-scale", values.piper.noise_scale]) %}
{% endif %}
{% if values.piper.noise_w_scale %}
  {% do cmd.x.extend(["--noise-w-scale", values.piper.noise_w_scale]) %}
{% endif %}

{% if values.network.web_port.bind_mode %}
  {% do cmd.x.append("--web-server") %}
  {% do cmd.x.extend(["--web-server-host", "0.0.0.0"]) %}
  {% do cmd.x.extend(["--web-server-port", values.network.web_port.port_number]) %}
{% endif %}

{% for arg in values.piper.additional_args %}
  {% do cmd.x.append(arg) %}
{% endfor %}

{% do c1.set_command(cmd.x) %}

{# Args are passed via additional_args, set it so users can't bypass the reserved flags #}
{% do c1.environment.add_env("WYOMING_PIPER_ARGS", "") %}
{% do c1.environment.add_user_envs(values.piper.additional_envs) %}

{% do c1.add_port(values.network.wyoming_port) %}
{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
