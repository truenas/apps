resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

bananana_brain:
  setup_token: bst_test-token
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  host_network: false

ix_volumes:
  data: /opt/tests/mnt/banana-brain/data
  backups: /opt/tests/mnt/banana-brain/backups

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
  additional_storage: []
