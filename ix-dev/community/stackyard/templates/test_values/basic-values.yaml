resources:
  limits:
    cpus: 2.0
    memory: 4096

stackyard:
  allow_private_ips: true
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/stackyard/data
  icons: /opt/tests/mnt/stackyard/icons

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  icons:
    type: ix_volume
    ix_volume_config:
      dataset_name: icons
      create_host_path: true
  additional_storage: []
