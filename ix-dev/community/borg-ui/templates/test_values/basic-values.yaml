resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

borgui:
  initial_admin_password: ""
  enable_fuse: true
  mount_docker_socket: true
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30081

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/borg-ui/data
  cache: /opt/tests/mnt/borg-ui/cache
  sources: /opt/tests/mnt/borg-ui/sources

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: cache
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /local
      is_local_mount_point: true
      ix_volume_config:
        dataset_name: sources
        create_host_path: true
