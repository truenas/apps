{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.borgui_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The entrypoint starts as root, aligns the borg user to PUID/PGID, chowns /data and the cache, then drops to that user with gosu. #}
{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/"}) %}

{# PUID, PGID and TZ come from the library automatically (run_as and TZ values). #}
{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("ENVIRONMENT", "production") %}
{% do c1.environment.add_env("DATA_DIR", values.consts.data_path) %}
{% do c1.environment.add_env("BORG_CACHE_DIR", values.consts.cache_path) %}

{% if values.borgui.initial_admin_password %}
  {% do c1.environment.add_env("INITIAL_ADMIN_PASSWORD", values.borgui.initial_admin_password) %}
{% endif %}
{% if values.borgui.base_path %}
  {% do c1.environment.add_env("BASE_PATH", values.borgui.base_path) %}
{% endif %}
{% if values.borgui.public_base_url %}
  {% do c1.environment.add_env("PUBLIC_BASE_URL", values.borgui.public_base_url) %}
{% endif %}

{# Optional Redis archive-browsing cache. Off by default: Borg UI falls back to an in-memory cache when REDIS_HOST=disabled. #}
{% if values.borgui.enable_redis %}
  {% set redis_config = {
    "password": values.borgui.redis_password,
    "volume": {"type": "temporary", "volume_config": {"volume_name": "redis-data"}},
  } %}
  {% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
  {% do c1.environment.add_env("REDIS_URL", redis.get_url("redis")) %}
  {% do c1.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}
{% else %}
  {% do c1.environment.add_env("REDIS_HOST", "disabled") %}
{% endif %}

{# Optional FUSE access: only for archive mounting (borg mount), SSHFS pull-mode source backups and SSH restore destinations. #}
{% if values.borgui.enable_fuse %}
  {% do c1.add_caps(["SYS_ADMIN"]) %}
  {% do c1.devices.add_device("/dev/fuse", "/dev/fuse", allow_disallowed=True) %}
  {% do c1.add_security_opt("apparmor", "unconfined") %}
  {% do c1.environment.add_env("BORG_FUSE_IMPL", "pyfuse3") %}
{% endif %}

{# Optional Docker socket for pre/post backup hook scripts that stop/start other containers. #}
{% if values.borgui.mount_docker_socket %}
  {% do c1.add_docker_socket(read_only=False) %}
{% endif %}

{% do c1.environment.add_user_envs(values.borgui.additional_envs) %}
{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% do c1.add_storage(values.consts.cache_path, values.storage.cache) %}
{% do perm_container.add_or_skip_action("cache", values.storage.cache, perms_config) %}

{# Backup sources / restore targets. Each entry becomes a mount that the file browser can see via LOCAL_MOUNT_POINTS. #}
{% set mount_points = namespace(paths=[]) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
  {% do mount_points.paths.append(store.mount_path) %}
{% endfor %}
{% if mount_points.paths %}
  {% do c1.environment.add_env("LOCAL_MOUNT_POINTS", mount_points.paths | join(",")) %}
{% else %}
  {% do c1.environment.add_env("LOCAL_MOUNT_POINTS", values.consts.default_local_mount_path) %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% if values.borgui.enable_redis %}
    {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endif %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
