app_version: 2.2.6
capabilities:
- description: Borg UI is able to chown files (entrypoint aligns the borg user to the configured PUID/PGID).
  name: CHOWN
- description: Borg UI is able to bypass permission checks for the initial ownership fixups.
  name: DAC_OVERRIDE
- description: Borg UI is able to set arbitrary ownership on files.
  name: FOWNER
- description: Borg UI is able to switch to the borg group (gosu privilege drop).
  name: SETGID
- description: Borg UI is able to switch to the borg user (gosu privilege drop).
  name: SETUID
