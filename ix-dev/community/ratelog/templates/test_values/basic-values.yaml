resources:
  limits:
    cpus: 2.0
    memory: 4096

ratelog:
  postgres_image_selector: postgres_18_image
  tmdb_api_key: test-api-key
  db_password: password
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080
  host_network: false

ix_volumes:
  postgres_data: /opt/tests/mnt/postgres_data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []