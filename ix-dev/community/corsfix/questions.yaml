groups:
  - name: Corsfix Configuration
    description: Public URLs, signup settings, and application secrets
  - name: Network Configuration
    description: Host ports for the dashboard and proxy
  - name: Storage Configuration
    description: Persistent MongoDB and Redis data
  - name: Resources Configuration
    description: CPU and memory limits

questions:
  - variable: corsfix
    label: ''
    group: Corsfix Configuration
    schema:
      type: dict
      attrs:
        - variable: dashboard_url
          label: Dashboard URL
          description: The public HTTPS origin after your reverse proxy, such as https://app.example.com. Localhost HTTP is accepted for testing only.
          schema:
            type: string
            default: ''
            required: true
        - variable: proxy_url
          label: Proxy URL
          description: The public HTTPS origin for CORS requests after your reverse proxy, such as https://proxy.example.com. It must differ from the dashboard URL.
          schema:
            type: string
            default: ''
            required: true
        - variable: mongodb_password
          label: MongoDB Password
          description: Preserve this password with your database backups.
          schema:
            type: string
            default: ''
            required: true
            private: true
        - variable: redis_password
          label: Redis Password
          description: Use a long random value without spaces, apostrophes, or #, as required by the TrueNAS Redis helper.
          schema:
            type: string
            default: ''
            required: true
            private: true
        - variable: auth_secret
          label: Authentication Secret
          description: A long, random value used to sign dashboard sessions.
          schema:
            type: string
            default: ''
            required: true
            private: true
        - variable: kek_version_1
          label: Encryption Key (Base64)
          description: A persistent 32-byte key encoded as Base64. Generate with openssl rand -base64 32 and back it up. Losing this key makes saved encrypted secrets unreadable.
          schema:
            type: string
            default: ''
            required: true
            private: true
        - variable: disable_signup
          label: Disable Signup
          description: Leave off until you create the first account, then enable it.
          schema:
            type: boolean
            default: false
        - variable: rpm
          label: Proxy Requests Per Minute
          description: Request limit per client IP for self-hosted traffic.
          schema:
            type: int
            default: 180
            min: 1
            required: true
        - variable: allowed_origins
          label: Allowed Origins
          description: Optional comma-separated hostnames allowed without dashboard registration, with no scheme or path.
          schema:
            type: string
            default: ''
        - variable: allowed_targets
          label: Allowed Targets
          description: Optional comma-separated target hostnames for the allowed origins. Empty permits public targets for those origins.
          schema:
            type: string
            default: ''

  - variable: network
    label: ''
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: dashboard_port
          label: Dashboard Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish on the TrueNAS host
                    - value: exposed
                      description: Expose only to other containers
                    - value: ''
                      description: Do not publish or expose
              - variable: port_number
                label: Host Port
                schema:
                  type: int
                  default: 30120
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: Optional IPs on the TrueNAS host to bind this port. Empty binds all addresses.
                schema:
                  type: list
                  show_if: [[bind_mode, '=', published]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: proxy_port
          label: Proxy Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish on the TrueNAS host
                    - value: exposed
                      description: Expose only to other containers
                    - value: ''
                      description: Do not publish or expose
              - variable: port_number
                label: Host Port
                schema:
                  type: int
                  default: 30121
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: Optional IPs on the TrueNAS host to bind this port. Empty binds all addresses.
                schema:
                  type: list
                  show_if: [[bind_mode, '=', published]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ''
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: mongodb_data
          label: MongoDB Data
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: ix_volume
                      description: TrueNAS-managed dataset
                    - value: host_path
                      description: Existing host path
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', ix_volume]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: mongodb_data
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', host_path]]
                  attrs:
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true
                    - variable: auto_permissions
                      label: Automatic Permissions
                      schema:
                        type: boolean
                        default: false
        - variable: redis_data
          label: Redis Data
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: ix_volume
                      description: TrueNAS-managed dataset
                    - value: host_path
                      description: Existing host path
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', ix_volume]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: redis_data
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [[acl_enable, '=', true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [[type, '=', host_path]]
                  attrs:
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true
                    - variable: auto_permissions
                      label: Automatic Permissions
                      schema:
                        type: boolean
                        default: false

  - variable: resources
    label: ''
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (MiB)
                schema:
                  type: int
                  default: 4096
                  required: true
