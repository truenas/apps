resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

corsfix:
  dashboard_url: http://localhost:30120
  proxy_url: http://localhost:30121
  mongodb_password: test-mongo-password
  redis_password: test-redis-password
  auth_secret: test-auth-secret-please-change-in-production
  kek_version_1: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  disable_signup: false
  rpm: 180
  allowed_origins: ''
  allowed_targets: ''

network:
  dashboard_port:
    bind_mode: published
    port_number: 30120
    host_ips:
      - 127.0.0.1
  proxy_port:
    bind_mode: published
    port_number: 30121
    host_ips:
      - 127.0.0.1

storage:
  mongodb_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/corsfix/mongodb-host-data
      create_host_path: true
      auto_permissions: true
  redis_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/corsfix/redis-host-data
      create_host_path: true
      auto_permissions: true
