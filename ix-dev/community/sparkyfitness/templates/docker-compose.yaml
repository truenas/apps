{% set tpl = ix_lib.base.render.Render(values) %}

{% set sparky_net = tpl.networks.create_internal("sparky-net") %}

{# --- Permissions container --- #}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": 568, "gid": 568, "mode": "check"} %}

{# --- PostgreSQL dependency --- #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.sparkyfitness.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.db_container_name, "postgres_image", pg_config, perm_container) %}
{% do postgres.container.add_network(sparky_net) %}

{# --- Backend server --- #}
{% set server = tpl.add_container(values.consts.server_container_name, "server_image") %}
{% do server.add_network(sparky_net) %}
{% do server.set_user(568, 568) %}
{% do server.healthcheck.set_test("curl", {"port": values.consts.server_port, "path": "/api/health"}) %}
{% do server.depends.add_dependency(values.consts.db_container_name, "service_healthy") %}

{% do server.environment.add_env("NODE_ENV", "production") %}
{% do server.environment.add_env("TZ", values.sparkyfitness.timezone) %}
{% do server.environment.add_env("SPARKY_FITNESS_LOG_LEVEL", values.sparkyfitness.log_level) %}
{% do server.environment.add_env("SPARKY_FITNESS_DB_HOST", values.consts.db_container_name) %}
{% do server.environment.add_env("SPARKY_FITNESS_DB_PORT", 5432) %}
{% do server.environment.add_env("SPARKY_FITNESS_DB_NAME", values.consts.db_name) %}
{% do server.environment.add_env("SPARKY_FITNESS_DB_USER", values.consts.db_user) %}
{% do server.environment.add_env("SPARKY_FITNESS_DB_PASSWORD", values.sparkyfitness.db_password) %}
{% do server.environment.add_env("SPARKY_FITNESS_APP_DB_USER", values.consts.app_db_user) %}
{% do server.environment.add_env("SPARKY_FITNESS_APP_DB_PASSWORD", values.sparkyfitness.app_db_password) %}
{% do server.environment.add_env("SPARKY_FITNESS_API_ENCRYPTION_KEY", values.sparkyfitness.api_encryption_key) %}
{% do server.environment.add_env("BETTER_AUTH_SECRET", values.sparkyfitness.better_auth_secret) %}
{% do server.environment.add_env("SPARKY_FITNESS_FRONTEND_URL", values.sparkyfitness.frontend_url) %}
{% do server.environment.add_env("SPARKY_FITNESS_DISABLE_SIGNUP", values.sparkyfitness.disable_signup | string | lower) %}
{% do server.environment.add_env("SPARKY_FITNESS_FORCE_EMAIL_LOGIN", values.sparkyfitness.force_email_login | string | lower) %}
{% do server.environment.add_env("SPARKY_FITNESS_SERVER_PORT", values.consts.server_port) %}

{% if values.sparkyfitness.admin_email %}
  {% do server.environment.add_env("SPARKY_FITNESS_ADMIN_EMAIL", values.sparkyfitness.admin_email) %}
{% endif %}

{% do server.environment.add_user_envs(values.sparkyfitness.additional_envs) %}

{% do server.add_storage("/app/SparkyFitnessServer/backup", values.storage.server_backup) %}
{% do server.add_storage("/app/SparkyFitnessServer/uploads", values.storage.server_uploads) %}

{% do perm_container.add_or_skip_action("server_backup", values.storage.server_backup, perms_config) %}
{% do perm_container.add_or_skip_action("server_uploads", values.storage.server_uploads, perms_config) %}

{# --- Frontend (nginx + React SPA) --- #}
{% set frontend = tpl.add_container(values.consts.frontend_container_name, "image") %}
{% do frontend.add_network(sparky_net) %}
{% do frontend.set_user(568, 568) %}
{% do frontend.healthcheck.set_test("curl", {"port": values.consts.frontend_port, "path": "/"}) %}
{% do frontend.depends.add_dependency(values.consts.server_container_name, "service_healthy") %}

{% do frontend.environment.add_env("SPARKY_FITNESS_SERVER_HOST", values.consts.server_container_name) %}
{% do frontend.environment.add_env("SPARKY_FITNESS_SERVER_PORT", values.consts.server_port) %}
{% do frontend.environment.add_env("SPARKY_FITNESS_FRONTEND_URL", values.sparkyfitness.frontend_url) %}

{% do frontend.add_port(values.network.web_port, {"container_port": values.consts.frontend_port}) %}

{# --- Activate permissions container if any actions were registered --- #}
{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do server.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do frontend.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{# --- Portal for the web UI --- #}
{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
