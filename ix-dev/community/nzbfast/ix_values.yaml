images:
  image:
    repository: ghcr.io/nzbfast/nzbfast
    tag: 1.1.2
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  nzbfast_container_name: nzbfast
  perms_container_name: permissions
  # The image publishes the dashboard and the SABnzbd-compatible API on this
  # port and locks it there, so the host port maps onto it rather than moving
  # the listener. See NZBFAST_PORT_LOCKED in the image's entrypoint.
  internal_web_port: 6789
  notes_body: |
    Open nzbfast and add your Usenet provider in the Welcome panel.

    An API key is generated on first run and printed in the container log.
    Copy it from Settings > Security into Sonarr, Radarr or anything else
    that connects to SABnzbd. To pin a key of your own instead, so that it
    survives a redeploy, add NZBFAST_APIKEY under Additional Environment
    Variables before the first start.
