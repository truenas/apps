{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.cloudgate_container_name, "image") %}
{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "NET_BIND_SERVICE", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.web_port, "path": "/api/health"}) %}

{% do c1.environment.add_env("CLOUDGATE_DISABLE_UPDATES", "true") %}
{% do c1.environment.add_user_envs(values.cloudgate.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.web_port}) %}
{% for port in values.network.additional_ports %}
  {% do c1.add_port(port) %}
{% endfor %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
