{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.cloudgate_container_name, "image") %}
{# CloudGate starts as root (s6-overlay drops the Recovery UI to an
   unprivileged user; nginx binds 80/443 for local reverse-proxy mode).
   Minimum capability set, verified by starting the image with
   --cap-drop ALL plus exactly these: CHOWN/DAC_OVERRIDE/FOWNER for /data and
   nginx temp dirs, SETUID/SETGID for s6-applyuidgid, NET_BIND_SERVICE for
   80/443, KILL so s6 can signal the unprivileged service. #}
{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "NET_BIND_SERVICE", "KILL"]) %}
{% do c1.environment.add_env("CLOUDGATE_DISABLE_UPDATES", "true") %}
{# TZ is added by the library from values.TZ automatically. #}
{% do c1.environment.add_user_envs(values.cloudgate.additional_envs) %}

{% do c1.healthcheck.set_test("curl", {
  "port": values.consts.web_port,
  "scheme": "http",
  "path": "/api/health",
}) %}

{# CloudGate's web UI always listens on values.consts.web_port (8080) inside
   the container, regardless of the host port the user picks below. #}
{% do c1.add_port(values.network.web_port, {"container_port": values.consts.web_port}) %}
{% for port in values.network.additional_ports %}
  {% do c1.add_port(port) %}
{% endfor %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
