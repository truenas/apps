resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

cloudgate:
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8081

ix_volumes:
  data: /opt/tests/mnt/cloudgate/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
