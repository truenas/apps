images:
  image:
    repository: ghcr.io/elias02345/cloudgate
    tag: v0.6.0

consts:
  cloudgate_container_name: cloudgate
  data_path: /data
  # Fixed container-internal listen port (not configurable via env/flags,
  # unlike e.g. AdGuard Home). The host-side port users pick in
  # questions.yaml network.web_port.port_number maps to this.
  web_port: 8080
