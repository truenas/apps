images:
  image:
    repository: ghcr.io/metatana/metatana-app
    # Published immutable multi-arch (amd64/arm64) release tag. Includes the
    # arbitrary-uid entrypoint required for TrueNAS run-as support.
    tag: 1.1.1
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  metatana_container_name: metatana
  perms_container_name: permissions
  data_path: /app/data
  media_path: /media
