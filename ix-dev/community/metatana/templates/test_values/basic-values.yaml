TZ: Etc/UTC

metatana:
  additional_envs:
    - name: TMDB_API_KEY
      value: test-key

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 30015

ix_volumes:
  data: /opt/tests/mnt/data
  media: /opt/tests/mnt/media

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  media:
    type: ix_volume
    ix_volume_config:
      dataset_name: media
      create_host_path: true
  additional_storage: []

labels: []

resources:
  limits:
    cpus: 2
    memory: 4096
