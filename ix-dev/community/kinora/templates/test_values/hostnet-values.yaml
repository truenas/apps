resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
kinora:
  public_url: ""
  additional_envs:
    - name: KINORA_LOG_LEVEL
      value: debug
network:
  host_network: true
  web_port:
    bind_mode: published
    port_number: 8096

run_as:
  user: 568
  group: 568

ix_volumes:
  kinora-config: /opt/tests/mnt/kinora-config
  kinora-cache: /opt/tests/mnt/kinora-cache

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: kinora-config
      create_host_path: true
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: kinora-cache
      create_host_path: true
  additional_storage: []
