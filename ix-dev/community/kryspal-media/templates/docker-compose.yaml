{% set tpl = ix_lib.base.render.Render(values) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{#
  Kryspal Media needs PostgreSQL 16 with the pg_bigm extension, which its own image provides.
  tpl.deps.postgres only accepts a fixed list of repositories, so the database container is defined here.
  No POSTGRES_PASSWORD is set: on its first start the image generates a password, keeps it in /var/lib/kryspal-db/password (a small
  storage shared with the server, which reads it) and creates the application role "kryspal" without superuser rights, as in the public
  compose file. The server connects to the container named "postgres".
#}
{% set postgres = tpl.add_container(values.consts.postgres_container_name, "postgres_image") %}
{% do postgres.set_user(999, 999) %}
{% do postgres.remove_devices() %}
{% do postgres.set_grace_period(60) %}
{% do postgres.healthcheck.set_test("postgres", {
  "user": values.consts.db_user,
  "db": values.consts.db_name,
  "binary": "/usr/lib/postgresql/%d/bin/pg_isready"|format(values.consts.pg_major_version),
}) %}
{# The image's PGDATA is /var/lib/postgresql/data, the path it declares as a volume: mounting the storage there avoids an anonymous volume. #}
{% do postgres.add_storage("/var/lib/postgresql/data", values.storage.postgres_data) %}
{% do perm_container.add_or_skip_action("postgres_data", values.storage.postgres_data, {"uid": 999, "gid": 999, "mode": "check"}) %}
{% do postgres.add_storage("/var/lib/kryspal-db", values.storage.db) %}
{% do perm_container.add_or_skip_action("db", values.storage.db, {"uid": 999, "gid": 999, "mode": "check"}) %}

{% set server = tpl.add_container(values.consts.server_container_name, "image") %}
{% do server.set_user(values.run_as.user, values.run_as.group) %}
{% do server.set_grace_period(60) %}
{# The image ships busybox wget, not curl. Database migrations run before the listener starts, so allow a long start period. #}
{% do server.healthcheck.set_custom_test(["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:%d/healthz"|format(values.network.web_port.port_number)]) %}
{% do server.healthcheck.set_start_period(300) %}
{% do server.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do server.environment.add_env("HTTP_ADDR", ":%d"|format(values.network.web_port.port_number)) %}
{% if values.network.wan_port.bind_mode %}
  {% do server.environment.add_env("EXTERNAL_HTTP_ADDR", ":%d"|format(values.network.wan_port.port_number)) %}
{% endif %}
{% do server.environment.add_env("DATA_DIR", values.consts.data_path) %}
{% do server.environment.add_env("CACHE_DIR", "%s/cache"|format(values.consts.data_path)) %}
{# List the mounted media folders explicitly instead of relying on automatic detection, which ignores folders on an overlay file system. #}
{% set media_roots = [values.consts.media_path] %}
{% for store in values.storage.additional_storage %}
  {% do media_roots.append(store.mount_path) %}
{% endfor %}
{% do server.environment.add_env("MEDIA_ROOT", media_roots|join(":")) %}
{% do server.environment.add_user_envs(values.kryspal.additional_envs) %}

{% do server.add_port(values.network.web_port) %}
{% do server.add_port(values.network.wan_port) %}

{# The server only reads the generated database password. #}
{% set db_read_only = dict(values.storage.db) %}
{% do db_read_only.update({"read_only": true}) %}
{% do server.add_storage("/var/lib/kryspal-db", db_read_only) %}

{% do server.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{# At least one media folder is required: the server does not start without one. #}
{% do server.add_storage(values.consts.media_path, values.storage.media) %}
{% do perm_container.add_or_skip_action("media", values.storage.media, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do server.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do server.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.add_info("Open the Web UI and create the first administrator in the setup wizard. Libraries are added from folders under %s (and any additional storage you mounted)."|format(values.consts.media_path)) %}
{% do tpl.notes.add_info("In Emby or Jellyfin players (Infuse, SenPlayer, VidHub), add the server by its address and Web UI port. Automatic discovery on the local network is not set up by this app.") %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
