resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

kryspal:
  additional_envs:
    - name: GOMEMLIMIT
      value: 512MiB

network:
  web_port:
    bind_mode: published
    port_number: 8080
  wan_port:
    bind_mode: ""
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/kryspal-media/data
  postgres_data: /opt/tests/mnt/kryspal-media/postgres_data
  db: /opt/tests/mnt/kryspal-media/db

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  db:
    type: ix_volume
    ix_volume_config:
      dataset_name: db
      create_host_path: true
  media:
    type: host_path
    read_only: true
    host_path_config:
      path: /opt/tests/mnt/kryspal-media/media
      create_host_path: true
  additional_storage: []
