resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

kryspal:
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080
  wan_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/kryspal-media/data
  postgres_data: /opt/tests/mnt/kryspal-media/postgres_data
  db: /opt/tests/mnt/kryspal-media/db
  media: /opt/tests/mnt/kryspal-media/media
  movies: /opt/tests/mnt/kryspal-media/movies

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  db:
    type: ix_volume
    ix_volume_config:
      dataset_name: db
      create_host_path: true
  media:
    type: ix_volume
    read_only: false
    ix_volume_config:
      dataset_name: media
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /movies
      read_only: true
      ix_volume_config:
        dataset_name: movies
        create_host_path: true
