consts:
  keibidrop_container_name: keibidrop
  perms_container_name: permissions
  config_path: /config
  shares_path: /shares

  notes_body: |
    The app logs print this box's code.
    On your computer, open KEIBIDROP, turn on **Teleport**, paste the box's code and press **Connect**.
    Then press **Save contact** and turn on **Auto**, so that both sides reconnect after a drop.

    If **Peer Code** is empty, open the app's shell and run `kd add-contact laptop <your computer's code>`.

    The config storage holds this box's private identity. Anyone who can read it can act as this box.

    Guide: https://keibidrop.com/docs/how-to/run-on-a-nas.html
