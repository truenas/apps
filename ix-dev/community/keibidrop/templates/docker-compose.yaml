{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.keibidrop_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_custom_test(["CMD", "/usr/local/bin/kd", "status"]) %}

{% do c1.environment.add_env("KEIBIDROP_CONFIG_DIR", values.consts.config_path) %}
{% do c1.environment.add_env("KD_SAVE_PATH", values.consts.shares_path) %}
{% do c1.environment.add_env("KD_PEER", values.keibidrop.peer_code) %}
{# Refuse changes from the peer when the shared folder is mounted read only #}
{% do c1.environment.add_env("KD_SHARE_READ_ONLY", values.storage.shares.read_only) %}
{% do c1.environment.add_env("KD_INBOUND_PORT", values.network.inbound_port.port_number) %}
{% do c1.environment.add_env("KD_OUTBOUND_PORT", values.keibidrop.outbound_port) %}
{% do c1.environment.add_user_envs(values.keibidrop.additional_envs) %}

{% do c1.add_port(values.network.inbound_port) %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do c1.add_storage(values.consts.shares_path, values.storage.shares) %}
{% do perm_container.add_or_skip_action("shares", values.storage.shares, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
