resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

pellu_home:
  advertise_address: ""
  additional_envs:
    - name: PELLU_NAME
      value: TrueNAS test

run_as:
  user: 568
  group: 568

network:
  host_network: true
  web_port:
    bind_mode: published
    port_number: 30591

ix_volumes:
  config: /opt/tests/mnt/pellu-home/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /media/Videos
      host_path_config:
        path: /opt/tests/mnt/pellu-home/videos
        create_host_path: true
