resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

romarr:
  additional_envs: []
network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/config
  roms: /opt/tests/mnt/roms
  downloads: /opt/tests/mnt/downloads

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  library:
    type: ix_volume
    ix_volume_config:
      dataset_name: roms
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /downloads
      ix_volume_config:
        dataset_name: downloads
        create_host_path: true
