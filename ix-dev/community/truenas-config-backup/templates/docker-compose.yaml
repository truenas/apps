{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": 568, "gid": 568, "mode": "check"} %}

{% do c1.set_user(568, 568) %}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/healthz"}) %}

{% do c1.environment.add_env("TRUENAS_URL", values.connection_config.truenas_url) %}
{% do c1.environment.add_env("TRUENAS_API_KEY", values.connection_config.api_key) %}
{% do c1.environment.add_env("TRUENAS_VERIFY_SSL", values.connection_config.verify_ssl) %}
{% set schedule_mode = values.backup_config.schedule_mode | default("manual") %}
{% if schedule_mode != "manual" %}
{% set schedule_time = values.backup_config.schedule_time | default("03:00") | string %}
{% set time_parts = schedule_time.split(":") %}
{% set cron_hour = time_parts[0] | int %}
{% set cron_min = time_parts[1] | int if time_parts | length > 1 else 0 %}
{% if schedule_mode == "every_minute" %}
{% do c1.environment.add_env("CRON_SCHEDULE", "* * * * *") %}
{% elif schedule_mode == "every_hour" %}
{% do c1.environment.add_env("CRON_SCHEDULE", "0 * * * *") %}
{% elif schedule_mode == "daily" %}
{% do c1.environment.add_env("CRON_SCHEDULE", cron_min ~ " " ~ cron_hour ~ " * * *") %}
{% elif schedule_mode == "weekly" %}
{% do c1.environment.add_env("CRON_SCHEDULE", cron_min ~ " " ~ cron_hour ~ " * * " ~ values.backup_config.schedule_dow) %}
{% elif schedule_mode == "monthly" %}
{% do c1.environment.add_env("CRON_SCHEDULE", cron_min ~ " " ~ cron_hour ~ " " ~ values.backup_config.schedule_dom ~ " * *") %}
{% elif schedule_mode == "custom" and values.backup_config.cron_schedule %}
{% do c1.environment.add_env("CRON_SCHEDULE", values.backup_config.cron_schedule) %}
{% endif %}
{% endif %}
{% do c1.environment.add_env("RETENTION_COUNT", values.backup_config.retention_count) %}
{% do c1.environment.add_env("INCLUDE_SECRET_SEED", values.backup_config.include_secret_seed) %}
{% do c1.environment.add_env("INCLUDE_POOL_KEYS", values.advanced_config.include_pool_keys) %}
{% do c1.environment.add_env("INCLUDE_ROOT_AUTHORIZED_KEYS", values.advanced_config.include_root_authorized_keys) %}
{% do c1.environment.add_env("DASHBOARD_PASSWORD", values.dashboard_config.dashboard_password) %}
{% if values.notification_config.notify_webhook_url %}
{% do c1.environment.add_env("NOTIFY_WEBHOOK_URL", values.notification_config.notify_webhook_url) %}
{% endif %}
{% do c1.environment.add_env("NOTIFY_ON_SUCCESS", values.advanced_config.notify_on_success) %}
{% do c1.environment.add_env("BACKUP_DIR", values.consts.backups_dir_path) %}
{% do c1.environment.add_env("CONFIG_DIR", values.consts.config_dir_path) %}
{% do c1.environment.add_env("WEB_PORT", values.network.web_port.port_number) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.backups_dir_path, values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}

{% do c1.add_storage(values.consts.config_dir_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
