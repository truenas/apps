resources:
  limits:
    cpus: 1.0
    memory: 512

connection_config:
  truenas_url: "https://127.0.0.1"
  api_key: "test-api-key"
  verify_ssl: false

backup_config:
  schedule_mode: custom
  schedule_time: "03:00"
  schedule_dow: 0
  schedule_dom: 1
  cron_schedule: "0 3 * * 0"
  retention_count: 8
  include_secret_seed: true

dashboard_config:
  dashboard_password: "test-dashboard-password"

notification_config:
  notify_webhook_url: ""

advanced_config:
  include_pool_keys: false
  include_root_authorized_keys: false
  notify_on_success: false

network:
  web_port:
    bind_mode: published
    port_number: 30461

ix_volumes:
  backups: /opt/tests/mnt/truenas-config-backup/backups
  config: /opt/tests/mnt/truenas-config-backup/config

storage:
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
