resources:
  limits:
    cpus: 1.0
    memory: 512

connection_config:
  truenas_url: "https://192.168.1.50"
  api_key: "test-api-key"
  verify_ssl: false

backup_config:
  schedule_mode: daily
  schedule_time: "04:30"
  schedule_dow: 0
  schedule_dom: 1
  cron_schedule: ""
  retention_count: 5
  include_secret_seed: true

dashboard_config:
  dashboard_password: "test-dashboard-password"

notification_config:
  notify_webhook_url: "https://discord.com/api/webhooks/test/test"

advanced_config:
  include_pool_keys: false
  include_root_authorized_keys: false
  notify_on_success: true

network:
  web_port:
    bind_mode: published
    port_number: 30461

storage:
  backups:
    type: host_path
    host_path_config:
      acl_enable: false
      path: /opt/tests/mnt/truenas-config-backup/backups
  config:
    type: host_path
    host_path_config:
      acl_enable: false
      path: /opt/tests/mnt/truenas-config-backup/config
