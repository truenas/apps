groups:
  - name: Connection
    description: TrueNAS connection settings
  - name: Backups
    description: Backup schedule and retention
  - name: Dashboard
    description: Web dashboard access
  - name: Notifications
    description: Optional backup event notifications
  - name: Advanced
    description: Advanced backup and notification options
  - name: Network Configuration
    description: Configure Network for TrueNAS Config Backup
  - name: Storage Configuration
    description: Configure Storage for TrueNAS Config Backup
  - name: Resources Configuration
    description: Configure Resources for TrueNAS Config Backup

questions:
  - variable: connection_config
    label: ""
    group: Connection
    schema:
      type: dict
      attrs:
        - variable: truenas_url
          label: TrueNAS URL
          description: |
            The base URL of the TrueNAS system to back up. Must use https:// (even on
            a local network) — http:// causes TrueNAS to revoke the API key. Examples:
            https://127.0.0.1 for the same box, or https://192.168.1.50 for the host
            LAN IP if the container cannot reach loopback.
          schema:
            type: string
            required: true
            default: "https://127.0.0.1"
        - variable: api_key
          label: API Key
          description: |
            A TrueNAS API key for the target system (My API Keys in the TrueNAS UI).
            Recommended to scope it to config.save only (least privilege). If a key
            was revoked after an http:// connection attempt, create a new key here.
          schema:
            type: string
            required: true
            private: true
        - variable: verify_ssl
          label: Verify SSL Certificate
          description: |
            Disable this if the target TrueNAS uses a self-signed certificate (common
            for home-lab setups). The connection is still encrypted; only certificate
            verification is skipped.
          schema:
            type: boolean
            default: false

  - variable: backup_config
    label: ""
    group: Backups
    schema:
      type: dict
      attrs:
        - variable: schedule_mode
          label: Backup Schedule
          description: |
            How often to run scheduled backups. Choose Manual for on-demand backups
            only (use Run backup now on the dashboard).
          schema:
            type: string
            default: manual
            enum:
              - value: manual
                description: Manual only (no schedule)
              - value: every_minute
                description: Every minute
              - value: every_hour
                description: Every hour
              - value: daily
                description: Daily at the configured time
              - value: weekly
                description: Weekly on the configured day and time
              - value: monthly
                description: Monthly on the configured day of month and time
              - value: custom
                description: Custom 5-field cron expression
        - variable: schedule_time
          label: Schedule Time
          description: |
            Time of day for daily, weekly, or monthly schedules (24-hour HH:MM).
            Ignored when schedule mode is Manual, Every minute, Every hour, or Custom.
          schema:
            type: string
            default: "03:00"
            show_if:
              - ["schedule_mode", "!=", "manual"]
              - ["schedule_mode", "!=", "every_minute"]
              - ["schedule_mode", "!=", "every_hour"]
              - ["schedule_mode", "!=", "custom"]
        - variable: schedule_dow
          label: Schedule Day of Week
          description: |
            Day of week for weekly schedules (0 = Sunday through 6 = Saturday).
            Ignored unless schedule mode is Weekly.
          schema:
            type: int
            default: 0
            min: 0
            max: 6
            show_if: [["schedule_mode", "=", "weekly"]]
        - variable: schedule_dom
          label: Schedule Day of Month
          description: |
            Day of month for monthly schedules (1-28). Ignored unless schedule mode
            is Monthly.
          schema:
            type: int
            default: 1
            min: 1
            max: 28
            show_if: [["schedule_mode", "=", "monthly"]]
        - variable: cron_schedule
          label: Custom Cron Expression
          description: |
            Standard 5-field cron syntax, e.g. "0 3 * * 0" for weekly at 3am Sunday.
            Only used when schedule mode is Custom. See crontab.guru for help.
          schema:
            type: string
            required: false
            default: ""
            show_if: [["schedule_mode", "=", "custom"]]
        - variable: retention_count
          label: Retention Count
          description: Number of past backups to keep before pruning the oldest.
          schema:
            type: int
            default: 8
            min: 1
            required: true
        - variable: include_secret_seed
          label: Include Secret Seed
          description: |
            Include the password secret seed in the backup. Required to restore
            encrypted passwords from this backup onto a new system.
          schema:
            type: boolean
            default: true

  - variable: dashboard_config
    label: ""
    group: Dashboard
    schema:
      type: dict
      attrs:
        - variable: dashboard_password
          label: Dashboard Password
          description: |
            Password for the web dashboard login page. Required for all installs.
          schema:
            type: string
            required: true
            private: true

  - variable: notification_config
    label: ""
    group: Notifications
    schema:
      type: dict
      attrs:
        - variable: notify_webhook_url
          label: Notification Webhook URL
          description: |
            Optional URL to POST backup event notifications (failures by default).
            Discord webhooks are detected automatically; use Generic JSON for Slack,
            ntfy, Home Assistant, and other receivers.
          schema:
            type: string
            required: false
            default: ""
            private: true

  - variable: advanced_config
    label: ""
    group: Advanced
    schema:
      type: dict
      attrs:
        - variable: include_pool_keys
          label: Include Pool Keys
          description: |
            Include pool encryption keys in the backup. Enable when you may restore
            onto new hardware with encrypted pools. Increases backup sensitivity.
          schema:
            type: boolean
            default: false
        - variable: include_root_authorized_keys
          label: Include Root Authorized Keys
          description: |
            Include the root user's SSH authorized keys in the backup.
          schema:
            type: boolean
            default: false
        - variable: notify_on_success
          label: Notify on Success
          description: |
            Also POST to the notification webhook when a backup succeeds. Off by default
            (failures only).
          schema:
            type: boolean
            default: false

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30461
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: backups
          label: Backups Storage
          description: Where downloaded config backup tar files are stored.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "backups"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: config
          label: Config/State Storage
          description: Where the app stores its run history log.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "config"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for TrueNAS Config Backup.
                schema:
                  type: int
                  default: 1
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for TrueNAS Config Backup.
                schema:
                  type: int
                  default: 512
                  required: true
