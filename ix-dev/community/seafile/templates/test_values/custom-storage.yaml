resources:
  limits:
    cpus: 2
    memory: 4096

TZ: America/New_York

seafile:
  db_root_password: RootPassword123!
  db_password: SeafilePassword123!
  redis_password: RedisPassword123!
  server_hostname: seafile.example.com
  admin_email: admin@example.com
  admin_password: SecurePassword123!
  jwt_private_key: changethisplaceholderkeythatisatleast32chars
  enable_seadoc: true
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/seafile/data
  mariadb_data: /opt/tests/mnt/seafile/mariadb_data
  seadoc_data: /opt/tests/mnt/seafile/seadoc_data
  backup: /opt/tests/mnt/seafile/backup

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  mariadb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mariadb_data
      create_host_path: true
  seadoc_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: seadoc_data
      create_host_path: true
  additional_storage: []
