description: OpenScrub is a local video-redaction tool. It detects and blurs
  faces, whole people (silhouette body masking), license plates, and on-screen
  PII (names, SSNs, addresses, card numbers, custom regex) in videos and
  screen recordings, with a human review step before anything is trusted.
  Everything runs on this server — no footage leaves your network.
