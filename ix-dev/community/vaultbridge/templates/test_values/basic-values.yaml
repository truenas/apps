# The production image map is inherited from ix_values.yaml. All configurable
# values below remain synthetic and disposable.

vaultbridge:
  api_key: vb081-development-placeholder-not-a-secret
  api_key_previous: ""
  watch_enabled: false
  watch_debounce_seconds: 1

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 30488
    host_ips: []
  networks: []

ix_volumes:
  data: /opt/tests/mnt/vaultbridge/data

storage:
  vault:
    type: host_path
    read_only: false
    host_path_config:
      acl_enable: false
      auto_permissions: false
      path: /opt/tests/mnt/vaultbridge/vault
  data:
    type: ix_volume
    ix_volume_config:
      acl_enable: false
      dataset_name: data
      create_host_path: true

labels: []

resources:
  limits:
    cpus: 2
    memory: 4096
