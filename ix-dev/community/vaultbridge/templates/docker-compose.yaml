{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.vaultbridge_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test(
  "http",
  {"port": values.consts.internal_port, "path": "/health/live"}
) %}

{% do c1.environment.add_env("API_KEY", values.vaultbridge.api_key) %}
{% do c1.environment.add_env("API_KEY_PREVIOUS", values.vaultbridge.api_key_previous) %}
{% do c1.environment.add_env("VAULT_PATH", values.consts.vault_path) %}
{% do c1.environment.add_env("SEMANTIC_DATA_PATH", values.consts.data_path) %}
{% do c1.environment.add_env("HF_HOME", values.consts.data_path ~ "/huggingface") %}
{% do c1.environment.add_env("SEMANTIC_WATCH_ENABLED", values.vaultbridge.watch_enabled) %}
{% do c1.environment.add_env("SEMANTIC_WATCH_DEBOUNCE_SECONDS", values.vaultbridge.watch_debounce_seconds) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_port}) %}

{# /vault is authoritative operator data. Never add it to the permissions helper. #}
{% do c1.add_storage(values.consts.vault_path, values.storage.vault) %}

{# /data is app-owned, rebuildable persistent state and may use the standard helper. #}
{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": "http", "path": "/ui/"}) %}

{{ tpl.render() | tojson }}
