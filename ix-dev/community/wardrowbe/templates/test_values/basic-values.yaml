resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

wardrowbe:
  postgres_image_selector: postgres_18_image
  db_password: secret-with.special_chars~
  redis_password: secret
  secret_key: secret-longer-than-32-chars-a-zA-Z0-9symbols
  nextauth_secret: another-secret-longer-than-32-chars-xyz
  app_url: http://localhost:8080
  oidc_issuer_url: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  oidc_mobile_client_id: ""
  forward_auth_secret: forward-auth-secret-longer-than-32-chars
  ai_base_url: ""
  ai_api_key: ""
  ai_vision_model: gpt-4o
  ai_text_model: gpt-4o
  additional_envs: []
  frontend_additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  postgres_data: /opt/tests/mnt/wardrowbe/postgres_data
  data: /opt/tests/mnt/wardrowbe/data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
