resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

wardrowbe:
  postgres_image_selector: postgres_18_image
  db_password: secret
  redis_password: secret
  secret_key: secret-longer-than-32-chars-a-zA-Z0-9symbols
  nextauth_secret: another-secret-longer-than-32-chars-xyz
  app_url: https://wardrowbe.example.com
  oidc_issuer_url: https://accounts.google.com
  oidc_client_id: test-client-id
  oidc_client_secret: test-client-secret
  oidc_mobile_client_id: test-mobile-client-id
  ai_base_url: http://ollama.example.com:11434/v1
  ai_api_key: test-api-key
  ai_vision_model: gemma3:latest
  ai_text_model: gemma3:latest
  additional_envs:
    - name: AI_TAGGING_CONCURRENCY
      value: "2"
    - name: LOG_LEVEL
      value: DEBUG

run_as:
  user: 1000
  group: 1000

network:
  web_port:
    bind_mode: published
    port_number: 8081

storage:
  postgres_data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/wardrowbe/postgres_data_hostpath
      auto_permissions: true
      create_host_path: true
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/wardrowbe/data_hostpath
      auto_permissions: true
      create_host_path: true
  additional_storage:
    - type: host_path
      mount_path: /mnt/extra
      host_path_config:
        path: /opt/tests/mnt/wardrowbe/extra
        create_host_path: true
