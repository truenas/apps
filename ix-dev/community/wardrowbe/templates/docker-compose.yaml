{% set tpl = ix_lib.base.render.Render(values) %}

{% set wb_net = tpl.networks.create_internal("wardrowbe-net") %}

{% set frontend = tpl.add_container(values.consts.frontend_container_name, "frontend_image") %}
{% do frontend.add_network(wb_net) %}
{% set backend = tpl.add_container(values.consts.backend_container_name, "image") %}
{% do backend.add_network(wb_net) %}
{% set worker = tpl.add_container(values.consts.worker_container_name, "image") %}
{% do worker.add_network(wb_net) %}
{% set image_worker = tpl.add_container(values.consts.image_worker_container_name, "image") %}
{% do image_worker.add_network(wb_net) %}
{% set migrations = tpl.add_container(values.consts.migrations_container_name, "image") %}
{% do migrations.add_network(wb_net) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# Postgres #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.wardrowbe.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.wardrowbe.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(wb_net) %}

{# Redis #}
{% set redis_config = {
  "password": values.wardrowbe.redis_password,
  "volume": tpl.funcs.temp_config("redis_data"),
} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perm_container) %}
{% do redis.container.add_network(wb_net) %}

{# The backend uses asyncpg, so the library's postgresql:// URL (with sslmode) cannot be used as is.
   The password is not percent-encoded: alembic reads the URL through configparser, which rejects "%",
   so questions.yaml limits it to characters that need no encoding. #}
{% set db_url = "postgresql+asyncpg://%s:%s@%s:%s/%s" | format(
  values.consts.db_user,
  values.wardrowbe.db_password,
  values.consts.postgres_container_name,
  postgres.get_port(),
  values.consts.db_name,
) %}

{# Backend, workers and migrations share one image and one configuration #}
{% for c in [backend, worker, image_worker, migrations] %}
  {% do c.set_user(values.run_as.user, values.run_as.group) %}
  {% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
  {% do c.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}

  {% do c.environment.add_env("DEBUG", false) %}
  {% do c.environment.add_env("DATABASE_URL", db_url) %}
  {% do c.environment.add_env("REDIS_URL", redis.get_url("redis") ~ "/0") %}
  {% do c.environment.add_env("SECRET_KEY", values.wardrowbe.secret_key) %}
  {% do c.environment.add_env("STORAGE_PATH", values.consts.storage_path) %}
  {% do c.environment.add_env("APP_URL", values.wardrowbe.app_url) %}
  {% do c.environment.add_env("AI_BASE_URL", values.wardrowbe.ai_base_url) %}
  {% do c.environment.add_env("AI_API_KEY", values.wardrowbe.ai_api_key) %}
  {% do c.environment.add_env("AI_VISION_MODEL", values.wardrowbe.ai_vision_model) %}
  {% do c.environment.add_env("AI_TEXT_MODEL", values.wardrowbe.ai_text_model) %}
  {% do c.environment.add_env("OIDC_ISSUER_URL", values.wardrowbe.oidc_issuer_url) %}
  {% do c.environment.add_env("OIDC_CLIENT_ID", values.wardrowbe.oidc_client_id) %}
  {% do c.environment.add_env("OIDC_CLIENT_SECRET", values.wardrowbe.oidc_client_secret) %}
  {% do c.environment.add_env("OIDC_MOBILE_CLIENT_ID", values.wardrowbe.oidc_mobile_client_id) %}
  {% do c.environment.add_user_envs(values.wardrowbe.additional_envs) %}

  {% do c.add_storage(values.consts.storage_path, values.storage.data) %}
  {% for store in values.storage.additional_storage %}
    {% do c.add_storage(store.mount_path, store) %}
  {% endfor %}
{% endfor %}

{# Upstream does not migrate on start, so run the migrations before anything uses the database #}
{% do migrations.setup_as_helper(disable_network=false) %}
{% do migrations.set_command(["alembic", "upgrade", "head"]) %}
{% for c in [backend, worker, image_worker] %}
  {% do c.depends.add_dependency(values.consts.migrations_container_name, "service_completed_successfully") %}
{% endfor %}

{% do backend.set_command(["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", values.consts.backend_port | string]) %}
{% do backend.healthcheck.set_test("curl", {"port": values.consts.backend_port, "path": "/api/v1/health"}) %}

{# arq --check reads the heartbeat the worker writes to redis #}
{% do worker.set_command(["arq", "app.workers.worker.WorkerSettings"]) %}
{% do worker.healthcheck.set_custom_test(["CMD", "arq", "--check", "app.workers.worker.WorkerSettings"]) %}
{% do worker.depends.add_dependency(values.consts.backend_container_name, "service_healthy") %}

{% do image_worker.set_command(["arq", "app.workers.image_worker.ImageWorkerSettings"]) %}
{% do image_worker.healthcheck.set_custom_test(["CMD", "arq", "--check", "app.workers.image_worker.ImageWorkerSettings"]) %}
{% do image_worker.depends.add_dependency(values.consts.backend_container_name, "service_healthy") %}

{# Frontend: serves the UI and proxies /api/v1 to the backend #}
{% do frontend.set_user(values.run_as.user, values.run_as.group) %}
{% do frontend.depends.add_dependency(values.consts.backend_container_name, "service_healthy") %}
{% do frontend.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do frontend.environment.add_env("HOSTNAME", "0.0.0.0") %}
{% do frontend.environment.add_env("BACKEND_URL", "http://%s:%s" | format(values.consts.backend_container_name, values.consts.backend_port)) %}
{% do frontend.environment.add_env("NEXTAUTH_URL", values.wardrowbe.app_url) %}
{% do frontend.environment.add_env("NEXTAUTH_SECRET", values.wardrowbe.nextauth_secret) %}
{% do frontend.environment.add_env("DEV_MODE", false) %}
{% do frontend.environment.add_env("OIDC_ISSUER_URL", values.wardrowbe.oidc_issuer_url) %}
{% do frontend.environment.add_env("OIDC_CLIENT_ID", values.wardrowbe.oidc_client_id) %}
{% do frontend.environment.add_env("OIDC_CLIENT_SECRET", values.wardrowbe.oidc_client_secret) %}
{% do frontend.environment.add_user_envs(values.wardrowbe.additional_envs) %}
{% do frontend.healthcheck.set_test("node", {"port": values.network.web_port.port_number, "path": "/api/auth/providers"}) %}
{% do frontend.add_port(values.network.web_port) %}

{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}
{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% for c in [backend, worker, image_worker, migrations] %}
    {% do c.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endfor %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
