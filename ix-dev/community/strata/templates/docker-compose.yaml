{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.strata_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# Strata serves plain HTTP only behind a trusted proxy without a certificate #}
{% set tls_on = values.network.certificate_id or not values.strata.trusted_proxies %}
{% set scheme = "https" if tls_on else "http" %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64}}) %}
{% do c1.healthcheck.set_custom_test(["CMD", "/usr/local/bin/strata", "healthcheck"]) %}

{% do c1.environment.add_env("STRATA_ADDR", ":%d" | format(values.network.web_port.port_number)) %}
{% do c1.environment.add_env("STRATA_ROOT", values.consts.data_path) %}
{% do c1.environment.add_env("STRATA_CONFIG", values.consts.config_path) %}
{% do c1.environment.add_env("STRATA_TRASH_DAYS", values.strata.trash_days) %}
{% do c1.environment.add_env("STRATA_TLS", "on" if tls_on else "off") %}
{% if values.strata.allowed_hosts %}
  {% do c1.environment.add_env("STRATA_ALLOWED_HOSTS", values.strata.allowed_hosts | join(",")) %}
{% endif %}
{% if values.strata.trusted_proxies %}
  {% do c1.environment.add_env("STRATA_TRUSTED_PROXIES", values.strata.trusted_proxies | join(",")) %}
{% endif %}

{% if values.network.certificate_id %}
  {% set cert = values.ix_certificates[values.network.certificate_id] %}
  {% do c1.configs.add("cert", cert.certificate, values.consts.cert_path) %}
  {% do c1.configs.add("key", cert.privatekey, values.consts.key_path) %}
  {% do c1.environment.add_env("STRATA_TLS_CERT", values.consts.cert_path) %}
  {% do c1.environment.add_env("STRATA_TLS_KEY", values.consts.key_path) %}
{% endif %}

{% do c1.environment.add_user_envs(values.strata.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"scheme": scheme}) %}

{{ tpl.render() | tojson }}
