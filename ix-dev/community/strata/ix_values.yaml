consts:
  strata_container_name: strata
  perms_container_name: permissions
  cert_path: /ix-certs/cert.pem
  key_path: /ix-certs/key.pem
  notes_body: |
    ## First sign-in

    Open the app's logs and copy the line that says `FIRST-RUN SETUP CODE`.
    Then open the Web UI, enter the code, and choose a passphrase.
    To reset a forgotten passphrase, delete `auth.hash` from the config storage and restart the app.

    ## Permissions

    Strata reads and writes your files as the app's user (568 by default).
    Give that user a Modify entry in the dataset's ACL, rather than changing ownership of your files.

    ## Without a certificate

    Strata serves HTTPS with a self-signed certificate, so the browser warns the first time.
    The app's logs print the certificate's fingerprint to compare.
