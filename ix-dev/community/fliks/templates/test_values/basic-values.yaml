resources:
  limits:
    cpus: 2.0
    memory: 4096

fliks:
  db_password: test_password
  external_url: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080
  host_network: false

ix_volumes:
  config: /opt/tests/mnt/fliks/config
  data: /opt/tests/mnt/fliks/data
  postgres_data: /opt/tests/mnt/fliks/postgres_data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  transcode:
    type: temporary
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage:
    - type: host_path
      mount_path: /medias
      host_path_config:
        path: /opt/tests/mnt/fliks/medias
        create_host_path: true
