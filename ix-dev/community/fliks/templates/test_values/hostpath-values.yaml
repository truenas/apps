resources:
  limits:
    cpus: 2.0
    memory: 4096

fliks:
  db_password: test_password
  external_url: https://fliks.example.com
  disable_update_check: false
  devices: []
  additional_envs:
    - name: STREAM_MAX_SESSIONS_PER_USER
      value: "5"

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 30485
    host_ips: []
  host_network: false

ix_volumes:
  conf: /opt/tests/mnt/fliks/hp/conf
  data: /opt/tests/mnt/fliks/hp/data
  postgres_data: /opt/tests/mnt/fliks/hp/postgres_data

storage:
  conf:
    type: ix_volume
    ix_volume_config:
      dataset_name: conf
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  transcode:
    type: tmpfs
    tmpfs_config:
      size: 500
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage:
    - type: host_path
      mount_path: /medias
      host_path_config:
        path: /opt/tests/mnt/fliks/hp/medias
        create_host_path: true
    - type: host_path
      mount_path: /downloads
      host_path_config:
        path: /opt/tests/mnt/fliks/hp/downloads
        create_host_path: true
