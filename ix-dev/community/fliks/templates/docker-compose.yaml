{% set tpl = ix_lib.base.render.Render(values) %}

{% set fliks_net = tpl.networks.create_internal("fliks-net") %}

{% set c1 = tpl.add_container(values.consts.fliks_container_name, "image") %}
{% do c1.add_network(fliks_net) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.fliks.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.fliks.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(fliks_net) %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/api/system/liveness"}) %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("DB_HOST", values.consts.postgres_container_name) %}
{% do c1.environment.add_env("DB_PORT", postgres.get_port()) %}
{% do c1.environment.add_env("DB_USERNAME", values.consts.db_user) %}
{% do c1.environment.add_env("DB_PASSWORD", values.fliks.db_password) %}
{% do c1.environment.add_env("DB_NAME", values.consts.db_name) %}
{% do c1.environment.add_env("FLIKS_CONF_DIR", values.consts.config_dir) %}
{% do c1.environment.add_env("FLIKS_DATA_DIR", values.consts.data_dir) %}
{% do c1.environment.add_env("FLIKS_TRANSCODE_DIR", values.consts.transcode_dir) %}
{% do c1.environment.add_env("FLIKS_DISABLE_UPDATE_CHECK", "1") %}
{% do c1.environment.add_user_envs(values.fliks.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.config_dir, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perm_config) %}

{% do c1.add_storage(values.consts.data_dir, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perm_config) %}

{% set static_transcodes_options = {
  "tmpfs_config": {"mode": "0777"},
  "volume_config": {"volume_name": "fliks-transcode"},
} %}
{% set transcode_storage = dict(values.storage.transcode, **static_transcodes_options) %}
{% do c1.add_storage(values.consts.transcode_dir, transcode_storage) %}
{% do perm_container.add_or_skip_action("transcode", transcode_storage, perm_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
