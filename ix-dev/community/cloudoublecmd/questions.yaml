groups:
  - name: ClouDouble Commander Configuration
    description: Configure the service credentials for ClouDouble Commander.
  - name: Network Configuration
    description: Configure the web interface port.
  - name: Storage Configuration
    description: Select the pool or dataset root ClouDouble Commander can access.
  - name: Resources Configuration
    description: Configure CPU and memory limits for ClouDouble Commander.

questions:
  - variable: cloudoublecmd
    label: ""
    group: ClouDouble Commander Configuration
    schema:
      type: dict
      attrs:
        - variable: access_token
          label: Service Access Token
          description: A unique service token of at least 32 bytes. Keep it private.
          schema:
            type: string
            required: true
            private: true
            default: ""
            min_length: 32
        - variable: ui_password
          label: Web UI Password
          description: Password for browser sign-in. Use at least 12 characters.
          schema:
            type: string
            required: true
            private: true
            default: ""
            min_length: 12
  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web UI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: Publish this port for host access, expose it to other containers, or do not publish it.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: Do not publish or expose
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 7080
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port.
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: pool
          label: Pool or Dataset Root
          schema:
            type: dict
            attrs:
              - variable: type
                label: Storage Type
                schema:
                  type: string
                  default: host_path
                  required: true
                  enum:
                    - value: host_path
                      description: Host Path
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the selected storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: Select the pool root for the requested whole-pool access model. The mount is read-write; ensure the existing ACL allows UID 1000 to access the path.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPU limit for ClouDouble Commander.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for ClouDouble Commander.
                schema:
                  type: int
                  default: 2048
                  required: true
