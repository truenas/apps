resources:
  limits:
    cpus: 2.0
    memory: 2048

cloudoublecmd:
  access_token: test-token-at-least-32-characters-long
  ui_password: test-only-password-123
network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 7080
    host_ips: []
storage:
  pool:
    type: host_path
    host_path_config:
      acl_enable: false
      path: /opt/tests/mnt/pool
