resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
kinopeer:
  password: test-password
  qbittorrent_url: http://qbittorrent.test:30024
  prowlarr_url: http://prowlarr.test:30050
  additional_envs:
    - name: KINOPEER_ALLOWED_HOSTS
      value: kinopeer.example.com

network:
  web_port:
    bind_mode: published
    port_number: 8081

run_as:
  user: 568
  group: 568

storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/kinopeer/data-host-path
      create_host_path: true
  additional_storage: []
